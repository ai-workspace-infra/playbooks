---
- name: Load manually created ULightHost nodes from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ulighthost_vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default('https://vault.svc.plus', true) }}"
    ulighthost_vault_token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true) }}"
    ulighthost_vault_path: "{{ lookup('ansible.builtin.env', 'ULIGHTHOST_VAULT_PATH') | default('prod/ulighthost-xconnect', true) }}"
    ulighthost_gitops_config: "{{ lookup('ansible.builtin.env', 'ULIGHTHOST_GITOPS_CONFIG') | default(playbook_dir ~ '/../gitops/topology/prod/selfhost/ulighthost-xconnect.yaml', true) }}"
  pre_tasks:
    - name: Require a Vault token
      ansible.builtin.assert:
        that:
          - ulighthost_vault_token | length > 0
        fail_msg: "Export VAULT_TOKEN before running this playbook."

    - name: Load non-sensitive node mapping from GitOps
      ansible.builtin.include_vars:
        file: "{{ ulighthost_gitops_config }}"
        name: ulighthost_policy

    - name: Read ULightHost connection records from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ ulighthost_vault_addr }}"
        auth_method: token
        token: "{{ ulighthost_vault_token }}"
        path: "{{ ulighthost_vault_path | regex_replace('^kv/data/', '') }}"
        engine_mount_point: kv
      register: ulighthost_secret
      no_log: true

    - name: Validate Vault record shape
      ansible.builtin.assert:
        that:
          - ulighthost_secret.secret.nodes is defined
          - ulighthost_policy.spec.pools is defined
          - ulighthost_policy.spec.pools | length == 4
          - item.1.vault_key in ulighthost_secret.secret.nodes
          - ulighthost_secret.secret.nodes[item.1.vault_key].public_ipv4 is defined
          - ulighthost_secret.secret.nodes[item.1.vault_key].ansible_user is defined
          - ulighthost_secret.secret.nodes[item.1.vault_key].ansible_password is defined
        fail_msg: "Each enabled GitOps pool node must have a matching Vault record with public_ipv4, ansible_user and ansible_password."
      loop: "{{ query('ansible.builtin.subelements', ulighthost_policy.spec.pools, 'nodes', {'skip_missing': True}) }}"
      when: item.1.enabled | default(true) | bool
      no_log: true

    - name: Validate pool entrypoint topology
      ansible.builtin.assert:
        that:
          - item.entrypoint.fqdn is defined
          - item.entrypoint.scheduler_node is defined
          - item.entrypoint.single_node_binding == 'direct'
          - item.entrypoint.multi_node_binding == 'scheduler'
          - item.entrypoint.scheduler_node in (item.nodes | map(attribute='id') | list)
          - (item.nodes | selectattr('enabled', 'defined') | selectattr('enabled', 'equalto', true) | list | length) > 0
          - item.nodes | length == 1 or (item.nodes | selectattr('role', 'equalto', 'scheduler') | list | length) == 1
        fail_msg: "Each pool needs an entrypoint, a scheduler_node, and exactly one scheduler role when it has multiple nodes."
      loop: "{{ ulighthost_policy.spec.pools }}"

    - name: Build an in-memory Ansible inventory
      ansible.builtin.add_host:
        name: "{{ item.1.id }}"
        groups:
          - ulighthost_xconnect
          - "ulighthost_pool_{{ item.0.name }}"
          - "ulighthost_{{ item.1.role | default('pool_worker') }}"
        ansible_host: "{{ ulighthost_secret.secret.nodes[item.1.vault_key].public_ipv4 }}"
        ansible_user: "{{ ulighthost_secret.secret.nodes[item.1.vault_key].ansible_user }}"
        ansible_password: "{{ ulighthost_secret.secret.nodes[item.1.vault_key].ansible_password }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        ucloud_region: "{{ item.0.region }}"
        xconnect_pool: "{{ item.0.name }}"
        xconnect_provider: "{{ item.1.provider | default(item.0.provider | default(''), true) }}"
        xconnect_product: "{{ item.1.product | default(item.0.product | default(''), true) }}"
        xconnect_node_role: "{{ item.1.role | default('pool_worker') }}"
        xconnect_fqdn: "{{ item.0.entrypoint.fqdn }}"
        xconnect_entrypoint_mode: "{{ 'direct' if (item.0.nodes | length == 1) else 'scheduler' }}"
        xconnect_entrypoint_target: "{{ item.1.id if (item.0.nodes | length == 1) else item.0.entrypoint.scheduler_node }}"
        xconnect_weight: "{{ item.1.weight | default(100) }}"
      loop: "{{ query('ansible.builtin.subelements', ulighthost_policy.spec.pools, 'nodes', {'skip_missing': True}) }}"
      when: item.1.enabled | default(true) | bool
      no_log: true

- name: Verify ULightHost fixed egress nodes
  hosts: ulighthost_xconnect
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 30
      no_log: true

    - name: Report node mapping
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ ucloud_region }} / {{ xconnect_pool }} / {{ xconnect_node_role | default('node') }} -> {{ xconnect_fqdn }} via {{ xconnect_entrypoint_target }} ({{ ansible_host }})"
