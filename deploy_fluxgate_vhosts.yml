---
- name: Deploy Fluxgate (Pingora) reverse proxy vhosts with Vector metrics
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  vars:
    fluxgate_enabled: true
    fluxgate_replace_caddy: true
    vector_fluxgate_metrics_enabled: true
    vector_caddy_metrics_enabled: false
  roles:
    - roles/vhosts/fluxgate
    - roles/vhosts/vector-agent
