---
# Passwordless sudo for `operator` on k3s/ctr/kubectl/flux, OPS host only.
# Prefer common_os_identities.yml + host_vars (common_operator_k3s_sudo_enabled);
# this standalone entrypoint is kept for one-off use only.
# Default target is the SIT OPS host; override deliberately with
#   -e common_operator_k3s_sudo_target=<host or group>
# Example:
#   ansible-playbook common_operator_k3s_sudo.yml --limit sit-k3s-v6
- name: Grant operator bounded K3s client sudo on the OPS host
  hosts: "{{ common_operator_k3s_sudo_target | default('sit-k3s-v6') }}"
  become: true
  gather_facts: true
  tags: [operator_k3s_sudo]
  tasks:
    - name: Apply vhosts/common operator K3s sudo profile
      ansible.builtin.include_role:
        name: vhosts/common
        tasks_from: operator_k3s_sudo.yml
      vars:
        common_operator_k3s_sudo_enabled: true
