---
- import_playbook: ulighthost_xconnect.yml

- name: Apply GitOps log and disk retention to XConnect regional nodes
  hosts: xconnect_regional_nodes
  gather_facts: true
  tasks:
    - name: Apply log and disk retention policy
      ansible.builtin.include_role:
        name: host/xconnect_node_log_policy
      when: xconnect_node_maintenance | default({}) | length > 0
