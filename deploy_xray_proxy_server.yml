- name: Deploy managed agent.svc.plus service
  hosts: "{{ agent_service_hosts | default('agent_svc_plus') }}"
  gather_facts: true
  become: true
  vars:

    vault_env_path: "{{ lookup('env', 'VAULT_ENV_PATH') | default('uat', true) }}"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('https://vault.svc.plus', true) }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('', true) }}"
    agent_svc_plus_repo_url: >-
      {{ lookup('ansible.builtin.env', 'AGENT_REPO_URL')
         | default('https://github.com/x-evor/agent.svc.plus.git', true) }}
    agent_svc_plus_repo_version: >-
      {{ lookup('ansible.builtin.env', 'AGENT_REPO_VERSION')
         | default('main', true) }}
    agent_svc_plus_release_tag: >-
      {{ lookup('ansible.builtin.env', 'AGENT_RELEASE_TAG')
         | default(
             (lookup('ansible.builtin.env', 'AGENT_REPO_VERSION')
             | default('main', true))
             if ((lookup('ansible.builtin.env', 'AGENT_REPO_VERSION')
             | default('main', true)) is match('^v.+'))
             else '',
             true
           ) }}
    agent_svc_plus_binary_src: >-
      {{ lookup('ansible.builtin.env', 'AGENT_BINARY_SRC')
         | default('', true) }}
    agent_svc_plus_app_dir: >-
      {{ lookup('ansible.builtin.env', 'AGENT_APP_DIR')
         | default('/opt/agent.svc.plus', true) }}
    agent_svc_plus_go_version: >-
      {{ lookup('ansible.builtin.env', 'AGENT_GO_VERSION')
         | default('1.25.1', true) }}
    agent_id: >-
      {{ lookup('ansible.builtin.env', 'AGENT_ID')
         | default('node-xhttp.svc.plus', true) }}
    agent_tls_cert_name: >-
      {{ lookup('ansible.builtin.env', 'AGENT_TLS_CERT_NAME')
         | default(agent_id, true) }}
    agent_domain_tls_dir: >-
      {{ lookup('ansible.builtin.env', 'AGENT_DOMAIN_TLS_DIR')
         | default('/etc/xcontrol/tls/svc.plus', true) }}
    agent_tls_source_cert_path: "{{ agent_domain_tls_dir }}/current/fullchain.pem"
    agent_tls_source_key_path: "{{ agent_domain_tls_dir }}/current/key.pem"
    agent_controller_url: >-
      {{ lookup('ansible.builtin.env', 'AGENT_CONTROLLER_URL')
         | default('https://accounts.svc.plus', true) }}
    # A newly provisioned replica is bootstrapped before public DNS is cut over.
    # The controller URL must keep its real hostname for TLS/SNI, while the
    # temporary address below lets the agent reach this run's web-saas host.
    agent_controller_ip: >-
      {{ lookup('ansible.builtin.env', 'AGENT_CONTROLLER_IP')
         | default('', true) }}
    agent_controller_host: >-
      {{ agent_controller_url
         | regex_replace('^https?://', '')
         | regex_replace('/.*$', '')
         | regex_replace(':.*$', '') }}
    tky_proxy_domains:
      - >-
        {{ lookup('ansible.builtin.env', 'AGENT_PROXY_DOMAIN')
           | default(agent_id, true) }}
    agent_api_token: >-
      {{ lookup('ansible.builtin.vars', 'INTERNAL_SERVICE_TOKEN', default=lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') | default('', true)) }}
    agent_billing_enabled: >-
      {{ lookup('ansible.builtin.env', 'AGENT_BILLING_ENABLED')
         | default(true, true) | bool }}
    agent_billing_base_url: >-
      {{ lookup('ansible.builtin.env', 'BILLING_SERVICE_BASE_URL')
         | default('http://127.0.0.1:8081', true) }}
    agent_billing_http_timeout: >-
      {{ lookup('ansible.builtin.env', 'AGENT_BILLING_HTTP_TIMEOUT')
         | default('15s', true) }}
    agent_billing_collect_interval: >-
      {{ lookup('ansible.builtin.env', 'AGENT_BILLING_COLLECT_INTERVAL')
         | default('1m', true) }}
    agent_billing_reconcile_interval: >-
      {{ lookup('ansible.builtin.env', 'AGENT_BILLING_RECONCILE_INTERVAL')
         | default('5m', true) }}
    xray_enabled: >-
      {{ lookup('ansible.builtin.env', 'AGENT_XRAY_ENABLED')
         | default(true, true) | bool }}
  pre_tasks:

    - name: Try to read agent-proxy secrets from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        auth_method: token
        token: "{{ vault_token }}"
        path: "kv/data/{{ vault_env_path }}/agent-proxy"
        engine_mount_point: "kv"
      register: existing_agent_proxy_secrets
      failed_when: false
      when: vault_token | length > 0
      delegate_to: localhost
      run_once: true

    - name: Resolve XRAY_UUID
      ansible.builtin.set_fact:
        xray_uuid: >-
          {%- set env_uuid = lookup('env', 'XRAY_UUID') -%}
          {%- set vault_uuid = (existing_agent_proxy_secrets.secret | default({})).get('xray_uuid', '') -%}
          {%- if env_uuid -%}
            {{ env_uuid }}
          {%- elif vault_uuid -%}
            {{ vault_uuid }}
          {%- else -%}
            {{ 9999999999999999999999999 | random | to_uuid }}
          {%- endif -%}
      run_once: true

    - name: Securely write XRAY_UUID to Vault KV if generated
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        auth_method: token
        token: "{{ vault_token }}"
        path: "kv/data/{{ vault_env_path }}/agent-proxy"
        data:
          xray_uuid: "{{ xray_uuid }}"
      # This task is delegated to the controller.  Explicitly use the same
      # interpreter that launched ansible-playbook so the hvac installed by
      # the runner bootstrap is available; automatic localhost discovery can
      # otherwise select /usr/bin/python3 from a different environment.
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: 
        - vault_token | length > 0
        - existing_agent_proxy_secrets.secret is not defined or existing_agent_proxy_secrets.secret.xray_uuid | default('') != xray_uuid
      delegate_to: localhost
      run_once: true
      no_log: true
    - name: Validate INTERNAL_SERVICE_TOKEN is present
      ansible.builtin.assert:
        that:
          - agent_api_token | length > 0
        fail_msg: "INTERNAL_SERVICE_TOKEN must be exported before running this playbook."
        success_msg: "INTERNAL_SERVICE_TOKEN found"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Pin controller hostname to this run's web-saas host before DNS cutover
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^[[:space:]]*[^#[:space:]]+[[:space:]]+{{ agent_controller_host | regex_escape() }}[[:space:]]+# platform-ops temporary agent controller$'
        line: "{{ agent_controller_ip }} {{ agent_controller_host }} # platform-ops temporary agent controller"
        state: present
        create: true
        mode: "0644"
      when:
        - agent_controller_ip | length > 0
        - agent_controller_host | length > 0

  roles:
    - roles/vhosts/caddy
    - roles/vhosts/tky-proxy
    - roles/vhosts/agent-svc-plus
