---
# Control-plane entrypoint. The manifest is checked out from GitOps by the
# toolkit and passed in as ai_aggregator_manifest_file.
- name: Plan or stage the personal AI aggregator
  hosts: ai_aggregator_cpa:ai_aggregator_gateway
  become: true
  gather_facts: true
  roles:
    - role: roles/vhosts/ai_aggregator_v1
      when: ai_aggregator_operation | default('plan') != 'activate'

# Activation is deliberately split into ordered plays. CPA hosts are started
# before the gateway host; Caddy is reloaded last after its config validates.
- name: Activate CPA instances first
  hosts: ai_aggregator_cpa
  become: true
  gather_facts: true
  roles:
    - role: roles/vhosts/ai_aggregator_v1
      when: ai_aggregator_operation | default('plan') == 'activate'

- name: Activate gateway services after CPA instances
  hosts: ai_aggregator_gateway
  become: true
  gather_facts: true
  roles:
    - role: roles/vhosts/ai_aggregator_v1
      when: ai_aggregator_operation | default('plan') == 'activate'
