# Inventory comes from the caller (normally inventory/terraform_cmdb.py) and is
# matched by host name; every identity input comes from the GitOps declaration.
- name: Initialize Kubernetes identities on explicitly selected existing masters
  hosts: k3s
  become: true
  gather_facts: false
  pre_tasks:
    - name: Bind identity inputs from the GitOps resource declaration
      ansible.builtin.include_role:
        name: vhosts/k3s_identity
        tasks_from: from_declaration.yml
  tasks:
    - name: Run only independent identity initialization without reinstalling K3s
      ansible.builtin.include_role:
        name: vhosts/k3s_identity
