---
- name: Parse host-role dependencies on the controller only
  hosts: localhost
  gather_facts: false
  vars:
    docker_bootstrap_host: false
  tasks:
    - name: Statically parse Docker owner dependencies without enabling bootstrap
      ansible.builtin.import_role:
        name: vhosts/docker
    - name: Statically parse host configuration even when Vault reads are skipped
      ansible.builtin.import_role:
        name: vhosts/web_saas_host_config
    - name: Statically parse reconciler dependencies even when bootstrap is skipped
      ansible.builtin.import_role:
        name: vhosts/Doco-CD
    - name: Statically parse the final application selection owner
      ansible.builtin.import_role:
        name: doco_cd_release_selection
