[defaults]
host_key_checking = True
timeout = 30
fact_caching = memory
gathering = explicit
retry_files_enabled = False
display_args_to_stdout = False
interpreter_python = auto_silent

[inventory]
cache = False

[ssh_connection]
timeout = 30
retries = 2
pipelining = True
ssh_args = -o StrictHostKeyChecking=yes -o BatchMode=yes
