services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: platform-k3s-pgvector
    restart: unless-stopped
    environment:
      - POSTGRES_DB=k3s_vector
      - POSTGRES_USER=k3s
      - POSTGRES_PASSWORD=k3s-vector-secret-123
    ports:
      - "127.0.0.1:15435:5432"
    volumes:
      - k3s_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k3s -d k3s_vector && psql -U k3s -d k3s_vector -c 'CREATE EXTENSION IF NOT EXISTS vector;'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  k3s_pgdata:
