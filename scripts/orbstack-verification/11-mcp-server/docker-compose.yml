services:
  mcp-gateway:
    image: alpine:3.20
    pull_policy: if_not_present
    container_name: platform-mcp-gateway
    restart: unless-stopped
    volumes:
      - ./config.json:/etc/infrastructure-mcp-server/config.json:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "127.0.0.1:18888:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
