services:
  new-api:
    image: calciumion/new-api:v0.4.10
    pull_policy: if_not_present
    container_name: platform-ai-new-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - GLOBAL_WEB_TOKEN=newapi-root-secret
    ports:
      - "127.0.0.1:13001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  litellm:
    image: ghcr.io/berriai/litellm:v1.51.0
    pull_policy: if_not_present
    container_name: platform-ai-litellm
    restart: unless-stopped
    environment:
      - PORT=4000
      - LITELLM_MASTER_KEY=sk-litellm-master-key-12345678
    ports:
      - "127.0.0.1:14000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
