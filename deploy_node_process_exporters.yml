---
- name: Deploy Node Exporter and Process Exporter
  hosts: "{{ node_process_exporter_hosts | default('all') }}"
  # 兜底用的短等待窗口。首次启动的收敛由 deploy_base 的
  # common_wait_for_host_init.sh 统一负责(它在 bootstrap 前等 cloud-init 与
  # unattended-upgrades 退出), 所以到这里锁通常已经放开; 这里只覆盖那之后
  # 偶发的短暂占用, 不需要很长。单个任务仍可自行覆盖。
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"
  become: true
  vars:
    group: "{{ node_process_exporter_group | default('all') }}"
  tasks:
    - import_role:
        name: vhosts/node_exporter
    - import_role:
        name: vhosts/process_exporter
    - import_role:
        name: vhosts/vector-agent
