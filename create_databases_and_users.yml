---
# =============================================================================
# 自动化建库/建用户任务 (PostgreSQL 逻辑隔离)
# 确保每个服务仅拥有自己独立库的独立账户，不越界使用 postgres 账号。
# =============================================================================

- name: Provision Dedicated PostgreSQL Databases and Users
  hosts: all
  become: yes
  vars:
    # If neither is set via environment, we'll auto-detect
    postgresql_deploy_mode: "{{ lookup('env', 'POSTGRESQL_DEPLOY_MODE') | default('native', true) }}"
    postgresql_deploy_mode_effective: >-
      {{ 'native' if (lookup('env', 'POSTGRESQL_DEPLOY_MODE') | default('native', true)) == 'standalone'
         else (lookup('env', 'POSTGRESQL_DEPLOY_MODE') | default('native', true)) }}
    pg_container_default: "postgresql"
    pg_root_host: "{{ lookup('env', 'POSTGRESQL_HOST') | default('127.0.0.1', true) }}"
    pg_root_port: "{{ lookup('env', 'POSTGRESQL_PORT') | default('5432', true) }}"
    pg_root_user: "{{ lookup('env', 'POSTGRESQL_ADMIN_USER') | default('postgres', true) }}"
    # 若配置了密码，可通过环境变量传入，或从本地密码影子文件读取
    pg_root_password: "{{ lookup('env', 'POSTGRESQL_ADMIN_PASSWORD') | default(lookup('env', 'POSTGRES_PASSWORD') | default(lookup('file', '/root/.ai_workspace_postgres_password', errors='ignore') | default('postgres', true), true), true) }}"

    vault_env_path: "{{ lookup('env', 'VAULT_ENV_PATH') | default('uat', true) }}"
    vault_deploy_mode: "{{ lookup('env', 'VAULT_DEPLOY_MODE') | default('standalone', true) }}"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default(('http://127.0.0.1:8200' if vault_deploy_mode != 'external' else 'https://vault.svc.plus'), true) }}"
    vault_token: "{{ lookup('env', 'VAULT_SERVER_ROOT_ACCESS_TOKEN') | default(lookup('env', 'VAULT_TOKEN'), true) }}"
    vault_pg_shadow_file: >-
      {{ (ansible_env.HOME ~ '/.ai_workspace_vault_pg_password')
         if ansible_os_family == 'Darwin'
         else '/root/.ai_workspace_vault_pg_password' }}

    # 业务数据库清单与对应专有用户 (Passwords resolved in pre_tasks)
    db_configs_raw:
      - db: account
        user: account_user
        env_var: 'ACCOUNT_PG_PASSWORD'
        vault_key: 'account_pg_password'
      - db: litellm
        user: litellm_user
        env_var: 'LITELLM_PG_PASSWORD'
        vault_key: 'litellm_pg_password'
      - db: rag
        user: rag_user
        env_var: 'RAG_PG_PASSWORD'
        vault_key: 'rag_pg_password'
      - db: zitadel
        user: zitadel_user
        env_var: 'ZITADEL_PG_PASSWORD'
        vault_key: 'zitadel_pg_password'
      - db: gitea
        user: gitea_user
        env_var: 'GITEA_PG_PASSWORD'
        vault_key: 'gitea_pg_password'
      - db: vault_storage
        user: vault_storage
        env_var: 'VAULT_PG_PASSWORD'
        vault_key: 'vault_pg_password'
      # Billing and Accounts intentionally share the account database and
      # account_user. Do not create a second billing role or database: the
      # canonical credential is kv/data/<env>/databases.account_pg_password.

  pre_tasks:
    # path 是相对 engine_mount_point 的, 不能带 mount 前缀, kv2 也不能带
    # /data/ (见 community.hashi_vault.vault_kv2_get 文档)。写成
    # "kv/data/<env>/databases" 会被拼成 kv/data/kv/data/<env>/databases,
    # 404 后被下面的 failed_when: false 吞掉, 于是所有库密码都静默落到
    # "自动生成" 分支 —— 这正是 UAT 六个角色 (account_user / litellm_user /
    # rag_user / zitadel_user / gitea_user / vault_storage) 密码集体漂移的
    # 根因。目标 secret 仍是 kv/data/<env>/databases。
    - name: Try to read existing databases secrets from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        auth_method: token
        token: "{{ vault_token }}"
        path: "{{ vault_env_path }}/databases"
        engine_mount_point: "kv"
      register: existing_vault_db_secrets
      failed_when: false
      when: vault_token | length > 0
      delegate_to: localhost
      become: false

    # 这次读取是 failed_when: false 的, 失败会静默退回自动生成分支。不把它显式
    # 说出来, 现象就只剩下"某天服务连不上库", 根因隔着好几层。
    - name: Warn when the Vault databases secret could not be read
      ansible.builtin.debug:
        msg: >-
          Vault read of kv/data/{{ vault_env_path }}/databases failed or
          returned nothing; database passwords will fall back to environment
          variables, then to freshly generated values. Pre-existing roles will
          not be reconciled to a generated value (the play fails instead).
      when:
        - vault_token | length > 0
        - (existing_vault_db_secrets.secret | default({})) | length == 0

    - name: Resolve database passwords (Env > Vault > Auto-generate)
      ansible.builtin.set_fact:
        resolved_db_configs: >-
          {%- set results = [] -%}
          {%- set existing_secrets = existing_vault_db_secrets.secret | default({}) -%}
          {%- for db in db_configs_raw -%}
            {%- set env_pw = lookup('env', db.env_var) -%}
            {%- set vault_pw = existing_secrets.get(db.vault_key, '') -%}
            {%- if env_pw -%}
              {%- set final_pw = env_pw -%}
              {%- set pw_source = 'env' -%}
            {%- elif vault_pw -%}
              {%- set final_pw = vault_pw -%}
              {%- set pw_source = 'vault' -%}
            {%- else -%}
              {%- set final_pw = lookup('password', '/dev/null length=16 chars=ascii_letters,digits') -%}
              {%- set pw_source = 'generated' -%}
            {%- endif -%}
            {%- set _ = results.append({'db': db.db, 'user': db.user, 'password': final_pw, 'vault_key': db.vault_key, 'source': pw_source}) -%}
          {%- endfor -%}
          {{ results }}

    - name: Export passwords as top-level facts
      ansible.builtin.set_fact:
        "{{ item.vault_key }}": "{{ item.password }}"
      loop: "{{ resolved_db_configs }}"
      no_log: true

    - name: Persist vault_pg_password to shadow file (read by setup-vault.yaml)
      ansible.builtin.copy:
        dest: "{{ vault_pg_shadow_file }}"
        content: "{{ vault_pg_password }}"
        mode: "0600"
      no_log: true
      when:
        - vault_pg_password is defined
        - vault_pg_password | length > 0

    # 探测运行中的 Postgres 容器。
    # 当显式声明为 compose 模式时，它可能正在被另一个并行的 GitOps (Doco-CD) 进程
    # 异步拉起。此时我们给予最多 3 分钟的重试等待时间，避免刚触发部署就因为容器还
    # 没启动而宣告失败。
    - name: Detect running Postgres container
      ansible.builtin.shell: "docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -E '^web-saas-postgresql$'"
      register: detected_pg
      until: detected_pg.stdout != "" or lookup('env', 'POSTGRESQL_DEPLOY_MODE') != 'compose'
      retries: 36
      delay: 5
      changed_when: false
      failed_when: false

    - name: Check if psql is available on the host
      ansible.builtin.command: which psql
      register: psql_check
      failed_when: false
      changed_when: false

    # Compose 模式只接受已探测到的目标容器。此前容器缺失时仍强制进入
    # compose 分支，最终把错误延后并隐藏在 CREATE ROLE 的 no_log 输出里。
    - name: Resolve effective PostgreSQL topology
      ansible.builtin.set_fact:
        pg_topology: >-
          {{ 'compose' if (detected_pg.stdout | default('') | trim) != ''
             else ('none' if postgresql_deploy_mode_effective == 'compose'
                   else ('native' if (psql_check.rc | default(-1)) == 0 else 'none')) }}
        pg_container: "{{ (detected_pg.stdout | default('') | trim) or pg_container_default }}"

    # 探测不到可用 PostgreSQL 时必须失败。跳过会让建库整体静默不执行, 而后续
    # 依赖这些库的步骤(如 Vault storage schema)才在很远处报 "database ... does
    # not exist" —— 真正的原因已经被甩在几步之外。
    - name: Fail when no reachable PostgreSQL was found
      ansible.builtin.fail:
        msg: >-
          No reachable PostgreSQL: neither the required web-saas-postgresql
          container nor a host psql binary was found. These databases would
          have been silently skipped:
          {{ resolved_db_configs | map(attribute='db') | join(', ') }}
      when: pg_topology == 'none'


    - name: Conditional DB creation block
      when: pg_topology in ['compose', 'native']
      block:
      - name: Fetch existing roles in a single query
        ansible.builtin.command: >
          docker exec -i {{ pg_container }} psql -U {{ pg_root_user }} -tAc
          "SELECT rolname FROM pg_catalog.pg_roles;"
        register: existing_roles_raw
        changed_when: false
        when: pg_topology == 'compose'
        no_log: true

      - name: Fetch existing roles via PostgreSQL TCP in a single query
        ansible.builtin.command: >
          psql -h {{ pg_root_host }} -p {{ pg_root_port }} -U {{ pg_root_user }} -d postgres -tAc
          "SELECT rolname FROM pg_catalog.pg_roles;"
        register: existing_roles_raw_tcp
        changed_when: false
        environment:
          PGPASSWORD: "{{ pg_root_password }}"
        when: pg_topology != 'compose'
        no_log: true

      - name: Parse existing roles list
        ansible.builtin.set_fact:
          existing_roles_list: >-
            {{ (existing_roles_raw.stdout_lines | default([]))
               if pg_topology == 'compose'
               else (existing_roles_raw_tcp.stdout_lines | default([])) }}

      - name: Fetch existing databases in a single query
        ansible.builtin.command: >
          docker exec -i {{ pg_container }} psql -U {{ pg_root_user }} -tAc
          "SELECT datname FROM pg_catalog.pg_database;"
        register: existing_dbs_raw
        changed_when: false
        when: pg_topology == 'compose'
        no_log: true

      - name: Fetch existing databases via PostgreSQL TCP in a single query
        ansible.builtin.command: >
          psql -h {{ pg_root_host }} -p {{ pg_root_port }} -U {{ pg_root_user }} -d postgres -tAc
          "SELECT datname FROM pg_catalog.pg_database;"
        register: existing_dbs_raw_tcp
        changed_when: false
        environment:
          PGPASSWORD: "{{ pg_root_password }}"
        when: pg_topology != 'compose'
        no_log: true

      - name: Parse existing databases list
        ansible.builtin.set_fact:
          existing_dbs_list: >-
            {{ (existing_dbs_raw.stdout_lines | default([]))
               if pg_topology == 'compose'
               else (existing_dbs_raw_tcp.stdout_lines | default([])) }}

      # 收敛已存在角色的密码前, 先挡住"用自动生成的密码去改一个已在用的角色"。
      - name: Refuse to reconcile a pre-existing role with a generated password
        ansible.builtin.fail:
          msg: >-
            Refusing to reset the password of pre-existing role(s)
            {{ generated_pw_existing_roles | join(', ') }} to a freshly
            generated value. No password was supplied via environment or
            Vault, so the new value would be known only to this run while
            running services keep the old one. Supply the credential via the
            role's env var or kv/data/{{ vault_env_path }}/databases, then
            re-run.
        vars:
          generated_pw_existing_roles: >-
            {{ resolved_db_configs
               | selectattr('user', 'in', existing_roles_list)
               | selectattr('source', 'equalto', 'generated')
               | map(attribute='user') | list }}
        when: generated_pw_existing_roles | length > 0

      - name: Batch execute CREATE / ALTER ROLE statements
        ansible.builtin.command:
          argv:
            - docker
            - exec
            - -i
            - -e
            - PGCONNECT_TIMEOUT=5
            - "{{ pg_container }}"
            - psql
            - -U
            - "{{ pg_root_user }}"
            - -d
            - postgres
            - -v
            - ON_ERROR_STOP=1
          stdin: >-
            {% for item in resolved_db_configs %}
            {% if item.user not in existing_roles_list %}
            CREATE ROLE {{ item.user }} LOGIN PASSWORD '{{ item.password }}';
            {% else %}
            ALTER ROLE {{ item.user }} WITH PASSWORD '{{ item.password }}';
            {% endif %}
            {% endfor %}
        when: pg_topology == 'compose'
        no_log: true

      - name: Batch execute CREATE / ALTER ROLE statements via PostgreSQL TCP
        ansible.builtin.command:
          argv:
            - psql
            - -h
            - "{{ pg_root_host }}"
            - -p
            - "{{ pg_root_port }}"
            - -U
            - "{{ pg_root_user }}"
            - -d
            - postgres
            - -v
            - ON_ERROR_STOP=1
          stdin: >-
            {% for item in resolved_db_configs %}
            {% if item.user not in existing_roles_list %}
            CREATE ROLE {{ item.user }} LOGIN PASSWORD '{{ item.password }}';
            {% else %}
            ALTER ROLE {{ item.user }} WITH PASSWORD '{{ item.password }}';
            {% endif %}
            {% endfor %}
        environment:
          PGPASSWORD: "{{ pg_root_password }}"
        when: pg_topology != 'compose'
        no_log: true

      - name: Execute CREATE DATABASE for missing databases
        ansible.builtin.command: >
          docker exec -i {{ pg_container }} psql -U {{ pg_root_user }} -c "CREATE DATABASE {{ item.db }} OWNER {{ item.user }} ENCODING 'UTF8';"
        loop: "{{ resolved_db_configs | rejectattr('db', 'in', existing_dbs_list) | list }}"
        register: create_db_results
        changed_when: true
        when: pg_topology == 'compose'
        no_log: true

      - name: Execute CREATE DATABASE for missing databases via PostgreSQL TCP
        ansible.builtin.command: >
          psql -h {{ pg_root_host }} -p {{ pg_root_port }} -U {{ pg_root_user }} -d postgres -c "CREATE DATABASE {{ item.db }} OWNER {{ item.user }} ENCODING 'UTF8';"
        loop: "{{ resolved_db_configs | rejectattr('db', 'in', existing_dbs_list) | list }}"
        register: create_db_results_tcp
        changed_when: true
        environment:
          PGPASSWORD: "{{ pg_root_password }}"
        when: pg_topology != 'compose'
        no_log: true

      # Docker/PostgreSQL startup and the first application connection can
      # overlap during a fresh UAT bootstrap.  Do not run the role check until
      # every target database is queryable; otherwise a transient "database
      # does not exist" is misreported as a password failure.
      - name: Wait for dedicated databases to become queryable
        ansible.builtin.command:
          argv:
            - docker
            - exec
            - -i
            - -e
            - PGCONNECT_TIMEOUT=5
            - "{{ pg_container }}"
            - psql
            - -h
            - 127.0.0.1
            - -p
            - "5432"
            - -U
            - "{{ pg_root_user }}"
            - -d
            - postgres
            - -tAc
            - "SELECT 1 FROM pg_database WHERE datname = '{{ item.db }}'"
        loop: "{{ resolved_db_configs }}"
        register: database_ready_results
        changed_when: false
        failed_when: false
        retries: 12
        delay: 2
        until:
          - database_ready_results.rc | default(1) == 0
          - (database_ready_results.stdout | default('') | trim) == '1'
        when: pg_topology == 'compose'
        no_log: true

      # The database existence query above must use the same TCP path as the
      # application and the final role check.  A Unix-socket query can succeed
      # while PostgreSQL is still bringing up its TCP listener, which turns the
      # next task into a slow, misleading authentication failure on fresh
      # compose deployments.
      - name: Wait for PostgreSQL TCP listener to become ready
        ansible.builtin.command:
          argv:
            - docker
            - exec
            - -i
            - -e
            - PGCONNECT_TIMEOUT=5
            - "{{ pg_container }}"
            - pg_isready
            - -h
            - 127.0.0.1
            - -p
            - "5432"
            - -d
            - postgres
        register: pg_tcp_ready
        changed_when: false
        retries: 30
        delay: 2
        until: pg_tcp_ready.rc | default(1) == 0
        when: pg_topology == 'compose'
        no_log: true

      # Resolve the container's own address on the postgres network. The
      # verification below must not dial 127.0.0.1: the shipped pg_hba grants
      # "host all all 127.0.0.1/32 trust", so a loopback connection succeeds
      # without ever presenting the password and the check proves nothing.
      # Applications arrive over the docker network (via stunnel) and match
      # the "host all all all scram-sha-256" rule instead, which is the path
      # worth asserting.
      - name: Resolve the postgres container address for the auth check
        ansible.builtin.command:
          argv:
            - docker
            - inspect
            - "{{ pg_container }}"
            - --format
            - '{{ "{{" }}range .NetworkSettings.Networks{{ "}}" }}{{ "{{" }}.IPAddress{{ "}}" }} {{ "{{" }}end{{ "}}" }}'
        register: pg_container_ip_raw
        changed_when: false
        when: pg_topology == 'compose'

      - name: Select the first postgres container address
        ansible.builtin.set_fact:
          pg_container_probe_host: >-
            {{ (pg_container_ip_raw.stdout | default('') | trim).split(' ')
               | reject('equalto', '') | first | default('') }}
        when: pg_topology == 'compose'

      # The role reconciliation above must be checked through PostgreSQL TCP,
      # not only through the local postgres socket.  This check intentionally
      # runs after database creation: on a fresh compose deployment the role
      # may be created before its database, so validating against item.db
      # earlier would report a false authentication failure (database does
      # not exist).  The applications reach this container through stunnel and
      # pg_hba applies password auth on the TCP path; a successful ALTER ROLE
      # alone is not a useful deployment contract if the role password or
      # quoting is wrong.
      - name: Verify dedicated role TCP authentication
        ansible.builtin.command:
          argv:
            - docker
            - exec
            - -i
            - -e
            - "PGPASSWORD={{ item.item.password }}"
            - -e
            - PGCONNECT_TIMEOUT=5
            - "{{ pg_container }}"
            - psql
            - -h
            - "{{ pg_container_probe_host }}"
            - -U
            - "{{ item.item.user }}"
            - -d
            - "{{ item.item.db }}"
            - -tAc
            - SELECT 1
        loop: "{{ user_check_results.results }}"
        register: role_auth_results
        changed_when: false
        # failed_when must judge *this* psql attempt. It previously read
        # item.rc / item.stdout, which are the fields of the loop item -- the
        # result of the earlier role-existence probe, not of the connection
        # being verified. Two consequences, both seen in UAT:
        #   * a genuine auth failure was masked, because the probe's rc was 0;
        #   * on a fresh database every role is newly created, so the probe's
        #     stdout is empty rather than '1' and the check failed for all
        #     roles at once, aborting the play before the schema was seeded.
        failed_when: >-
          role_auth_results.rc | default(1) != 0 or
          (role_auth_results.stdout | default('') | trim) != '1'
        retries: 3
        delay: 2
        no_log: true
        when: pg_topology == 'compose'
  
