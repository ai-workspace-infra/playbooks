name: PROD managed runtime image qualification
description: Short-lived isolated fixed Accounts/Billing standby probes; registry-only credentials.
inputs:
  cmdb_dir: {required: true, description: 'Original accepted CMDB artifact directory'}
  cmdb_sha256: {required: true, description: 'Accepted CMDB checksum'}
  gitops_checkout: {required: true, description: 'Fixed authoritative GitOps checkout'}
  gitops_commit: {required: true, description: 'Reviewed full GitOps commit'}
  access_file: {required: true, description: 'IaC same-run private access'}
  spec_file: {required: true, description: 'Reviewed full-SHA image/digest manifest'}
  dry_run: {default: 'true', description: 'False only after same-run production qualification review'}
  runtime_gate_verified: {default: 'false', description: 'Toolkit verification of reviewed non-data image qualification'}
  ghcr_username: {required: true, description: 'Registry principal only'}
  ghcr_token: {required: true, description: 'Runtime registry pull credential only'}
outputs:
  receipt_file:
    description: 'Sanitized image receipt; all DB, deployment and cutover acceptance false'
    value: ${{ runner.temp }}/prod-managed-runtime-receipt.json
runs:
  using: composite
  steps:
    - name: Install isolated owner runtime
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/prod-managed-runtime-ansible"
        "$RUNNER_TEMP/prod-managed-runtime-ansible/bin/python" -m pip install ansible-core==2.18.12
    - name: Run canonical host image qualification owner
      shell: bash
      env:
        CMDB_DIR: ${{ inputs.cmdb_dir }}
        EXPECTED_CMDB_SHA256: ${{ inputs.cmdb_sha256 }}
        GITOPS_CHECKOUT: ${{ inputs.gitops_checkout }}
        GITOPS_COMMIT: ${{ inputs.gitops_commit }}
        NATIVE_ACCESS_FILE: ${{ inputs.access_file }}
        MANAGED_RUNTIME_SPEC_FILE: ${{ inputs.spec_file }}
        MANAGED_RUNTIME_DRY_RUN: ${{ inputs.dry_run }}
        MANAGED_RUNTIME_GATE_VERIFIED: ${{ inputs.runtime_gate_verified }}
        GHCR_USERNAME: ${{ inputs.ghcr_username }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
        DEPLOY_ENV: prod
        NATIVE_RECEIPT_FILE: ${{ runner.temp }}/prod-managed-runtime-receipt.json
      run: bash "${GITHUB_ACTION_PATH}/../../../scripts/data_operations/selfhost/managed_runtime_runner.sh"
