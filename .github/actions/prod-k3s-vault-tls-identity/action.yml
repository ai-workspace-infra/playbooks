name: V6 Vault TLS identity owner
description: Configure or verify the dedicated Vault TLS reader using reviewed evidence and scoped identities.
inputs:
  mode: {required: true, description: configure or verify}
  cmdb: {required: true, description: Verified IaC CMDB file}
  cmdb-sha256: {required: true, description: CMDB checksum from verified receipt}
  gitops: {required: true, description: Reviewed immutable GitOps checkout}
  gitops-sha: {required: true, description: Reviewed GitOps commit}
  bootstrap-receipt: {required: true, description: Verified V6 bootstrap receipt}
  bootstrap-sha256: {required: true, description: Independently verified receipt digest}
  bootstrap-gitops-sha: {required: true, description: GitOps commit in the verified bootstrap receipt}
  known-hosts: {required: true, description: Provider-attested SSH host keys}
  receipt: {required: true, description: Output path for redacted evidence}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned owner dependencies
      shell: bash
      env:
        NODE_STAGE_ANSIBLE_CORE_VERSION: 2.18.12
        NODE_STAGE_VENV: ${{ runner.temp }}/v6-identity-owner-venv
      run: bash "${GITHUB_ACTION_PATH}/../setup-node-stage-runner/scripts/setup.sh"
    - name: Run identity owner with isolated SSH agent
      shell: bash
      env:
        V6_MODE: ${{ inputs.mode }}
        V6_CMDB: ${{ inputs.cmdb }}
        V6_CMDB_SHA256: ${{ inputs.cmdb-sha256 }}
        V6_GITOPS: ${{ inputs.gitops }}
        V6_GITOPS_SHA: ${{ inputs.gitops-sha }}
        V6_BOOTSTRAP_RECEIPT: ${{ inputs.bootstrap-receipt }}
        V6_BOOTSTRAP_SHA256: ${{ inputs.bootstrap-sha256 }}
        V6_BOOTSTRAP_GITOPS_SHA: ${{ inputs.bootstrap-gitops-sha }}
        V6_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        V6_RECEIPT: ${{ inputs.receipt }}
      run: |
        set -euo pipefail
        : "${SSH_PRIVATE_KEY:?runtime SSH identity required}"
        eval "$(env -u VAULT_TOKEN -u SSH_PRIVATE_KEY ssh-agent -s)" >/dev/null
        trap 'env -u VAULT_TOKEN -u SSH_PRIVATE_KEY ssh-agent -k >/dev/null 2>&1 || true' EXIT
        printf '%s\n' "$SSH_PRIVATE_KEY" | env -u VAULT_TOKEN -u SSH_PRIVATE_KEY ssh-add - >/dev/null 2>&1
        unset SSH_PRIVATE_KEY
        python3 "${GITHUB_ACTION_PATH}/../../../scripts/prod_k3s_vault_tls_identity.py" \
          --mode "$V6_MODE" --cmdb "$V6_CMDB" --cmdb-sha256 "$V6_CMDB_SHA256" \
          --gitops "$V6_GITOPS" --gitops-sha "$V6_GITOPS_SHA" \
          --bootstrap-receipt "$V6_BOOTSTRAP_RECEIPT" --bootstrap-sha256 "$V6_BOOTSTRAP_SHA256" \
          --bootstrap-gitops-sha "$V6_BOOTSTRAP_GITOPS_SHA" --known-hosts "$V6_KNOWN_HOSTS" \
          --receipt "$V6_RECEIPT"
