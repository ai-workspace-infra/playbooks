name: Verify XConnect lab data-plane evidence
description: Verify one exact Gateway and One pair and write a sanitized same-run UAT receipt.
inputs:
  owner-sha:
    description: Exact reviewed Playbooks commit SHA containing this action.
    required: true
  contract-file:
    description: Private exact-target evidence contract below RUNNER_TEMP.
    required: true
  receipt-file:
    description: Sanitized verification receipt destination below RUNNER_TEMP.
    required: true
outputs:
  owner_sha:
    description: Exact Playbooks owner commit bound to the receipt.
    value: ${{ steps.evidence.outputs.owner_sha }}
  run_id:
    description: Exact lab run identity verified by the owner.
    value: ${{ steps.evidence.outputs.run_id }}
  network_id:
    description: Exact XConnect network identity verified by the owner.
    value: ${{ steps.evidence.outputs.network_id }}
  handshake_age_seconds:
    description: Age of the exact One peer handshake observed on Gateway.
    value: ${{ steps.evidence.outputs.handshake_age_seconds }}
runs:
  using: composite
  steps:
    - id: evidence
      shell: bash
      env:
        XCONNECT_EVIDENCE_OWNER_SHA: ${{ inputs.owner-sha }}
        XCONNECT_EVIDENCE_ACTION_REF: ${{ github.action_ref }}
        XCONNECT_EVIDENCE_CONTRACT_FILE: ${{ inputs.contract-file }}
        XCONNECT_EVIDENCE_RECEIPT_FILE: ${{ inputs.receipt-file }}
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/pipeline/xconnect-lab-evidence.py"
