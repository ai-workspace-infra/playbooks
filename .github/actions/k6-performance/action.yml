name: Observability k6 execution owner
description: Bounded service load test using the owner-local k6 profile.
inputs:
  environment: {required: true, description: "sit, uat or prod"}
  profile: {required: true, description: "smoke or capacity"}
  duration: {required: true, description: "profile, 60s, 5m, 10m or 30m"}
  max_vus: {required: true, description: "profile, 1, 5, 20, 100 or 500"}
  target_url: {required: false, default: '', description: "Explicit controlled HTTPS target or the profile default"}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
        K6_TEST_PROFILE: ${{ inputs.profile }}
        LOAD_DURATION: ${{ inputs.duration }}
        LOAD_MAX_VUS: ${{ inputs.max_vus }}
        TARGET_BASE_URL: ${{ inputs.target_url }}
      run: |
        set -euo pipefail
        case "$TARGET_ENV" in sit|uat|prod) ;; *) exit 2 ;; esac
        case "$K6_TEST_PROFILE" in smoke|capacity) ;; *) exit 2 ;; esac
        case "$LOAD_DURATION" in profile|60s|5m|10m|30m) ;; *) exit 2 ;; esac
        case "$LOAD_MAX_VUS" in profile|1|5|20|100|500) ;; *) exit 2 ;; esac
        [[ -z "$TARGET_BASE_URL" || "$TARGET_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^[:space:]]*)?$ ]] || exit 2
        bash "$GITHUB_ACTION_PATH/../../../scripts/pipeline/run-k6-performance.sh"
