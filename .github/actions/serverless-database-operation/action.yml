name: Serverless database operation
description: >-
  Run the reviewed Serverless database checkpoint, probe, baseline, or migration
  contract from the pinned Playbooks owner source.
inputs:
  owner_sha:
    description: Full immutable SHA of the checked-out Playbooks owner.
    required: true
  environment:
    description: Target environment. Only uat or prod; SIT is deliberately unsupported.
    required: true
  operation:
    description: checkpoint, probe, baseline, or migrate.
    required: true
  release_tag:
    description: Immutable release tag required by data-changing operations.
    required: false
    default: ''
  config_json:
    description: Validated, non-secret operation configuration JSON.
    required: false
    default: '{}'
  accounts_ref:
    description: Accounts source ref fallback; migration prefers release_tag.
    required: false
    default: main
  correlation_id:
    description: Caller-provided operation correlation identifier.
    required: true
  vault_addr:
    description: Vault HTTPS endpoint supplied by the caller environment.
    required: false
    default: https://vault.svc.plus
outputs:
  data_run_id:
    description: GitHub run ID that executed this operation.
    value: ${{ steps.receipt.outputs.data_run_id }}
  data_run_attempt:
    description: GitHub run attempt that executed this operation.
    value: ${{ steps.receipt.outputs.data_run_attempt }}
  receipt_artifact_name:
    description: Sanitized, current-run operation receipt artifact name.
    value: ${{ steps.receipt.outputs.receipt_artifact_name }}
  receipt_sha256:
    description: SHA-256 of the sanitized operation receipt.
    value: ${{ steps.receipt.outputs.receipt_sha256 }}
  operation_result:
    description: Job result recorded in the receipt.
    value: ${{ steps.receipt.outputs.operation_result }}
runs:
  using: composite
  steps:
    - name: Verify the owner checkout before credentials
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        EXPECTED_OWNER_SHA: ${{ inputs.owner_sha }}
      run: python3 scripts/data_operations/serverless/verify_owner_checkout.py

    - name: Validate request and evidence gates before Vault access
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        REQUESTED_OPERATION: ${{ inputs.operation }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        CONFIG_JSON: ${{ inputs.config_json }}
        CORRELATION_ID: ${{ inputs.correlation_id }}
      run: python3 scripts/data_operations/serverless/validate_serverless_operation.py

    - name: Preflight trusted receipt run and metadata artifact before download
      if: ${{ inputs.operation == 'baseline' || inputs.operation == 'migrate' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        GH_TOKEN: ${{ github.token }}
        TRUSTED_REPOSITORY: ${{ github.repository }}
        TRUSTED_CALLER_SHA: ${{ github.sha }}
        CURRENT_RUN_ID: ${{ github.run_id }}
        VAULT_ENV_PATH: ${{ inputs.environment }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        REQUESTED_OPERATION: ${{ inputs.operation }}
        CONFIG_JSON: ${{ inputs.config_json }}
      run: python3 scripts/data_operations/serverless/verify_checkpoint_receipt.py --preflight

    - name: Download sanitized trusted checkpoint receipt
      if: ${{ inputs.operation == 'baseline' || inputs.operation == 'migrate' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ fromJSON(inputs.config_json).backup_receipt.artifact_name }}
        repository: ${{ fromJSON(inputs.config_json).backup_receipt.source_repository }}
        run-id: ${{ fromJSON(inputs.config_json).checkpoint_run_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/trusted-checkpoint-receipt

    - name: Verify trusted source run and sanitized isolated restore receipt
      id: checkpoint_receipt
      if: ${{ inputs.operation == 'baseline' || inputs.operation == 'migrate' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        GH_TOKEN: ${{ github.token }}
        TRUSTED_REPOSITORY: ${{ github.repository }}
        TRUSTED_CALLER_SHA: ${{ github.sha }}
        CURRENT_RUN_ID: ${{ github.run_id }}
        VAULT_ENV_PATH: ${{ inputs.environment }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        REQUESTED_OPERATION: ${{ inputs.operation }}
        CONFIG_JSON: ${{ inputs.config_json }}
      run: python3 scripts/data_operations/serverless/verify_checkpoint_receipt.py "$RUNNER_TEMP/trusted-checkpoint-receipt"

    - name: Install PostgreSQL client
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes postgresql-client

    - name: Check out Accounts migration source
      if: ${{ inputs.operation == 'migrate' }}
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-services/accounts
        ref: ${{ inputs.release_tag || inputs.accounts_ref }}
        path: accounts

    - name: Verify reviewed schema repair source
      if: ${{ inputs.operation == 'migrate' && fromJSON(inputs.config_json).repair_schema == true }}
      shell: bash
      run: test "$(git -C accounts rev-parse HEAD)" = c2c343fe2c91bb31e7f7f9b4fa60512a66e2b4c9

    - name: Set up Go for the official Accounts migrator
      if: ${{ inputs.operation == 'migrate' }}
      uses: actions/setup-go@v6
      with:
        go-version-file: accounts/go.mod
        cache-dependency-path: accounts/go.sum

    - name: Load database credentials from Vault with GitHub OIDC
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ inputs.vault_addr }}
        role: github-actions-platform-ops-toolkit-${{ inputs.environment }}
        method: jwt
        jwtGithubAudience: vault
        secrets: |
          ${{ fromJSON(inputs.config_json).supabase_vault_path || format('kv/data/{0}/serverless/supabase', inputs.environment) }} DATABASE_SESSION_POOLER_URL | TARGET_DSN ;
          ${{ fromJSON(inputs.config_json).supabase_vault_path || format('kv/data/{0}/serverless/supabase', inputs.environment) }} PROJECT_REF | PROJECT_REF ;

    - name: Load supplementary encrypted S3 checkpoint credentials
      id: vault_checkpoint
      if: ${{ inputs.operation == 'checkpoint' && fromJSON(inputs.config_json).require_durable_checkpoint == true }}
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ inputs.vault_addr }}
        role: github-actions-platform-ops-toolkit-uat
        method: jwt
        jwtGithubAudience: vault
        secrets: |
          kv/data/CICD/uat/iac_state TF_STATE_BUCKET | S3_BUCKET ;
          kv/data/CICD/uat/iac_state TF_STATE_ACCESS_KEY | AWS_ACCESS_KEY_ID ;
          kv/data/CICD/uat/iac_state TF_STATE_SECRET_KEY | AWS_SECRET_ACCESS_KEY ;
          kv/data/CICD/uat/iac_state TF_STATE_REGION | S3_REGION ;
          kv/data/CICD/uat/iac_state TF_STATE_ENDPOINT | S3_ENDPOINT ;
          kv/data/uat/serverless/database-backup BACKUP_ENCRYPTION_PASS | BACKUP_ENCRYPTION_PASS ;

    - name: Load read-only serving probe identity from Vault
      id: vault_gcp
      if: ${{ inputs.operation == 'migrate' && fromJSON(inputs.config_json).repair_schema == true }}
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ inputs.vault_addr }}
        role: github-actions-platform-ops-toolkit-uat
        method: jwt
        jwtGithubAudience: vault
        secrets: |
          kv/data/uat/serverless/gcp GCP_WORKLOAD_IDENTITY_PROVIDER | GCP_WORKLOAD_IDENTITY_PROVIDER ;
          kv/data/uat/serverless/gcp GCP_SERVICE_ACCOUNT_EMAIL | GCP_SERVICE_ACCOUNT_EMAIL ;

    - name: Authenticate for read-only Cloud Run repair evidence
      if: ${{ inputs.operation == 'migrate' && fromJSON(inputs.config_json).repair_schema == true }}
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ steps.vault_gcp.outputs.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ steps.vault_gcp.outputs.GCP_SERVICE_ACCOUNT_EMAIL }}

    - name: Set up gcloud for read-only serving evidence
      if: ${{ inputs.operation == 'migrate' && fromJSON(inputs.config_json).repair_schema == true }}
      uses: google-github-actions/setup-gcloud@v2

    - name: Create release checkpoint
      if: ${{ inputs.operation == 'checkpoint' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        DATABASE_BACKEND: supabase
        DATABASE_ENV: ${{ inputs.environment }}
        DATABASE_NAME: postgres
        TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
        GIT_SHA: ${{ github.sha }}
        REQUIRE_DURABLE_CHECKPOINT: ${{ fromJSON(inputs.config_json).require_durable_checkpoint == true && 'true' || 'false' }}
        S3_BUCKET: ${{ steps.vault_checkpoint.outputs.S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ steps.vault_checkpoint.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.vault_checkpoint.outputs.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ steps.vault_checkpoint.outputs.S3_REGION }}
        S3_REGION: ${{ steps.vault_checkpoint.outputs.S3_REGION }}
        S3_ENDPOINT: ${{ steps.vault_checkpoint.outputs.S3_ENDPOINT }}
        S3_PREFIX: database-checkpoints
        BACKUP_ENCRYPTION_PASS: ${{ steps.vault_checkpoint.outputs.BACKUP_ENCRYPTION_PASS }}
      run: scripts/data_operations/database/create_release_checkpoint.sh

    - name: Probe Accounts schema without writes
      if: ${{ inputs.operation == 'probe' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        VAULT_ENV_PATH: ${{ inputs.environment }}
        TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
        PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}
      run: scripts/data_operations/serverless/probe_accounts_schema.sh

    - name: Adopt reviewed UAT Accounts baseline
      if: ${{ inputs.operation == 'baseline' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        VAULT_ENV_PATH: ${{ inputs.environment }}
        TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
        PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}
      run: scripts/data_operations/serverless/adopt_accounts_uat_baseline.sh

    - name: Capture private before-repair evidence
      if: ${{ inputs.operation == 'migrate' && fromJSON(inputs.config_json).repair_schema == true }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        VAULT_ENV_PATH: ${{ inputs.environment }}
        TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
        PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}
        GCP_PROJECT_ID: open-platform-uat
        GCP_REGION: ${{ fromJSON(inputs.config_json).gcp_region }}
      run: python3 scripts/data_operations/serverless/uat_schema_repair_evidence.py before --state "$RUNNER_TEMP/uat-repair-private.json" --report "$RUNNER_TEMP/uat-schema-repair-report.json"

    - name: Apply reviewed Accounts incremental migration
      id: migration_apply
      if: ${{ inputs.operation == 'migrate' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        VAULT_ENV_PATH: ${{ inputs.environment }}
        SNAPSHOT_TAG: ${{ inputs.release_tag }}
        ACCOUNTS_DIR: ${{ github.workspace }}/accounts
        TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
        PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}
        ACCOUNTS_SCHEMA_EXPECTED_VERSION: ${{ fromJSON(inputs.config_json).expected_schema_version }}
        ACCOUNTS_SCHEMA_TARGET_VERSION: ${{ fromJSON(inputs.config_json).target_schema_version }}
        ACCOUNTS_SCHEMA_SHA256: ${{ fromJSON(inputs.config_json).migration_sha256 }}
        RELEASE_CHECKPOINT_VERIFIED: ${{ steps.checkpoint_receipt.outputs.checkpoint_verified || 'false' }}
      run: scripts/data_operations/serverless/apply_accounts_incremental_schema.sh

    - name: Verify retained data and serving health after repair
      if: ${{ inputs.operation == 'migrate' && fromJSON(inputs.config_json).repair_schema == true && success() }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        VAULT_ENV_PATH: ${{ inputs.environment }}
        TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
        PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}
        GCP_PROJECT_ID: open-platform-uat
        GCP_REGION: ${{ fromJSON(inputs.config_json).gcp_region }}
        OFFICIAL_MIGRATOR_REPEAT_VERIFIED: ${{ steps.migration_apply.outputs.official_migrator_repeat_verified }}
      run: python3 scripts/data_operations/serverless/uat_schema_repair_evidence.py after --state "$RUNNER_TEMP/uat-repair-private.json" --report "$RUNNER_TEMP/uat-schema-repair-report.json"

    - name: Upload aggregate repair evidence only
      if: ${{ inputs.operation == 'migrate' && fromJSON(inputs.config_json).repair_schema == true && success() }}
      uses: actions/upload-artifact@v4
      with:
        name: uat-schema-repair-${{ inputs.correlation_id }}
        path: ${{ runner.temp }}/uat-schema-repair-report.json
        if-no-files-found: error
        retention-days: 7

    - name: Write sanitized caller-bound operation receipt
      id: receipt
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        RECEIPT_PATH: ${{ runner.temp }}/serverless-database-operation-receipt.json
        OPERATION_RESULT: ${{ job.status }}
        OPERATION_ENVIRONMENT: ${{ inputs.environment }}
        OPERATION_NAME: ${{ inputs.operation }}
        CORRELATION_ID: ${{ inputs.correlation_id }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        CALLER_REPOSITORY: ${{ github.repository }}
        CALLER_SHA: ${{ github.sha }}
        CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        CALLER_RUN_ID: ${{ github.run_id }}
        CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
        OWNER_ACTION_REF: ${{ inputs.owner_sha }}
      run: python3 scripts/data_operations/serverless/write_operation_receipt.py

    - name: Upload sanitized caller-bound operation receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.receipt.outputs.receipt_artifact_name }}
        path: ${{ runner.temp }}/serverless-database-operation-receipt.json
        if-no-files-found: error
        retention-days: 14
