name: Shared readiness probe contract
on:
  pull_request:
    paths:
      - 'scripts/pipeline/check-shared-readiness.sh'
      - 'tests/service_probes/**'
      - '.github/workflows/shared-readiness-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/service_probes -v
