name: PROD K3s cold bootstrap contract
on:
  pull_request:
    paths:
      - 'scripts/prod_k3s*.py'
      - 'scripts/bootstrap_k3s_identity_keys.*'
      - 'k3s_identity_bootstrap.yml'
      - 'tests/test_k3s_identity_bootstrap.py'
      - 'tests/test_k3s_reset_decision.py'
      - 'roles/vhosts/k3s-reset/**'
      - 'k3s_reset.yml'
      - 'tests/test_k3s_volume_target_contract.py'
      - 'tests/test_k3s_identity_rbac_readiness.py'
      - 'tests/fixtures/k3s_identity_syntax_playbook.yml'
      - 'prod_k3s_generation_bootstrap.yml'
      - 'roles/web_saas_data_volume/**'
      - 'roles/vhosts/k3s_platform_bootstrap/**'
      - 'roles/vhosts/k3s-cluster-server/**'
      - 'k3s_platform_bootstrap.yml'
      - 'k3s_platform_bootstrap_with_gitops.yml'
      - 'k3s-cluster.yaml'
      - 'setup-k3s-node.yaml'
      - 'init_k3s_cluster_server'
      - 'roles/vhosts/helm_cli/**'
      - 'roles/vhosts/flux_controllers/**'
      - 'roles/vhosts/flux_gitops/**'
      - 'roles/vhosts/k3s_identity/**'
      - 'tests/test_k3s_role_separation.py'
      - 'tests/test_k3s_platform_node_identity.py'
      - 'roles/vhosts/common/**'
      - 'inventory/terraform_cmdb.py'
      - '.github/actions/prod-k3s-bootstrap/**'
      - 'tests/test_prod_k3s*.py'
      - '.github/workflows/prod-k3s-bootstrap-contract.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ansible-core==2.18.12 PyYAML==6.0.2
      - run: ansible-galaxy collection install 'ansible.posix:==2.1.0' 'community.general:==10.7.0'
      - run: python -m unittest discover -s tests -p test_prod_k3s*.py
      - run: python -m unittest discover -s tests -p test_k3s_role_separation.py
      - run: python -m unittest discover -s tests -p test_k3s_platform_node_identity.py
      - run: python -m unittest discover -s tests -p test_paused_flux_declarations.py
      - run: python -m unittest discover -s tests -p test_k3s_identity_bootstrap.py
      - run: python -m unittest discover -s tests -p test_k3s_reset_decision.py
      - run: python -m unittest discover -s tests -p test_k3s_volume_target_contract.py
      - run: python -m unittest discover -s tests -p test_k3s_identity_rbac_readiness.py
      - run: ANSIBLE_ROLES_PATH=roles ansible-playbook -i tests/fixtures/dev_k3s_syntax.yml tests/fixtures/k3s_identity_syntax_playbook.yml --syntax-check
      - run: ANSIBLE_ROLES_PATH=roles ansible-playbook -i tests/fixtures/dev_k3s_syntax.yml prod_k3s_generation_bootstrap.yml --syntax-check
