name: Data Operations Owner Contracts
on:
  pull_request:
    paths: [scripts/data_operations/**, scripts/lib/**, roles/uat_data_import/**, roles/web_saas_data_*/**, roles/web_saas_release_upgrade/**, web-saas-release-upgrade.yml, web-saas-data-operations.yml, tests/test_web_saas_*roles.py, tests/data_operations/**, scripts/tests/uat_data_import_guard_test.sh, .github/workflows/*data*.yml, .github/workflows/uat-data-import.yaml]
  push:
    branches: [main, feature/release-upgrade-role]
    paths: [scripts/data_operations/**, scripts/lib/**, roles/uat_data_import/**, roles/web_saas_data_*/**, roles/web_saas_release_upgrade/**, web-saas-release-upgrade.yml, web-saas-data-operations.yml, tests/test_web_saas_*roles.py, tests/data_operations/**, scripts/tests/uat_data_import_guard_test.sh, .github/workflows/*data*.yml, .github/workflows/uat-data-import.yaml]
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Credential-free operation gates
        run: |
          set -euo pipefail
          bash scripts/tests/uat_data_import_guard_test.sh
          python3 -m unittest discover -s tests/data_operations -p 'test_*.py'
          python3 -m unittest discover -s tests/data_operations/import -p 'full_business*bootstrap_test.py'
          python3 -m unittest discover -s tests/data_operations/import -p 'full_business_contract_test.py'
          for test in tests/data_operations/import/*test.sh; do bash "$test"; done
          bash tests/data_operations/selfhost/web_saas_upgrade_acceptance_test.sh
          bash tests/data_operations/selfhost/acceptance_rules_test.sh
      - name: Verify parameterized data roles and controller-only manifest guards
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_web_saas_*roles.py'
          for file in roles/web_saas_data_*/files/*.sh; do bash -n "$file"; done
          python3 -m pip install ansible-core==2.18.12
          ansible-playbook web-saas-release-upgrade.yml --syntax-check
          ansible-playbook web-saas-data-operations.yml --syntax-check
          ansible-playbook xconnect-lab-runtime.yml --syntax-check
  selfhost-postgres17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Acceptance implementation against disposable PostgreSQL (loopback only)
        run: bash tests/data_operations/selfhost/web_saas_upgrade_acceptance_postgres_test.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Provision private archive fixture on disposable CI runner only
        run: sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /data/backups/web-saas/uat/ci-role-contract
      - name: Real encrypted backup and isolated restore role scripts (not live acceptance)
        run: python3 tests/data_operations/selfhost/backup_restore_roles_postgres_test.py
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Full business readonly visibility on a shared snapshot (loopback only)
        run: python3 tests/data_operations/import/full_business_visibility_postgres_test.py
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
