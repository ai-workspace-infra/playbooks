name: Pipeline owner Shell contracts
on:
  pull_request:
    paths: ['.github/actions/**', 'scripts/pipeline/**', 'scripts/node_deploy/**', 'tests/node_deploy/**', '.github/workflows/pipeline-owner-contracts.yml']
  push:
    branches: [main]
    paths: ['.github/actions/**', 'scripts/pipeline/**', 'scripts/node_deploy/**', 'tests/node_deploy/**', '.github/workflows/pipeline-owner-contracts.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install checksum-pinned YAML reader
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  $RUNNER_TEMP/yq" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate owner scripts and action YAML
        run: |
          set -euo pipefail
          while IFS= read -r file; do bash -n "$file"; done < <(git ls-files -co --exclude-standard scripts/pipeline | grep -E '\.sh$')
          for action in .github/actions/*/action.yml; do yq -e '.name != null and .runs.using == "composite"' "$action" >/dev/null; done
          bash -n .github/actions/setup-deployment-runner/scripts/setup.sh .github/actions/setup-node-stage-runner/scripts/setup.sh scripts/node_deploy/*.sh
          python3 -m py_compile scripts/node_deploy/*.py
      - name: Run node deployment owner behavior and contract tests
        run: |
          python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.2'
          python3 -m unittest discover -s tests/node_deploy -p 'test_*.py' -v
      - name: Falsify dynamic target and cleanup contracts
        run: |
          bash scripts/pipeline/tests/action-metadata-test.sh .github/actions/k6-performance/action.yml .github/actions/service-probes/action.yml .github/actions/xconnect-node-observation/action.yml .github/actions/xconnect-network-bootstrap/action.yml .github/actions/xconnect-lab-runtime/action.yml
          bash scripts/pipeline/tests/xconnect-dynamic-targets-test.sh
          python3 scripts/pipeline/tests/test_xconnect_network_bootstrap.py -v
          python3 scripts/pipeline/tests/test_xconnect_lab_runtime.py -v
          python3 -m unittest tests.test_xconnect_lab_runtime_role -v
