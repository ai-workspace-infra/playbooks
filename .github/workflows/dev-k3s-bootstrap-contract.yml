name: Dev K3s bootstrap contract
on:
  pull_request:
    paths:
      - 'roles/vhosts/k3s_platform_bootstrap/**'
      - 'scripts/dev_k3s_bootstrap.py'
      - 'tests/test_dev_k3s_bootstrap_contract.py'
      - 'tests/test_paused_flux_declarations.py'
      - '.github/workflows/dev-k3s-bootstrap*.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ansible-core==2.17.14 PyYAML==6.0.2
      - run: python -m unittest discover -s tests -p test_dev_k3s_bootstrap_contract.py
      - run: python -m unittest discover -s tests -p test_paused_flux_declarations.py
      - name: Check role syntax with a syntax-only local inventory
        run: ANSIBLE_ROLES_PATH=roles ansible-playbook -i tests/fixtures/dev_k3s_syntax.yml tests/fixtures/dev_k3s_syntax_playbook.yml --syntax-check
