name: XConnect Gateway Agent

on:
  pull_request:
    paths:
      - "tools/xconnect-gateway-agent/**"
      - "roles/vhosts/xconnect-gateway/**"
      - "scripts/validate-xconnect-gateway-agent.sh"
      - "scripts/validate-xconnect-gateway-role.sh"
      - "scripts/test-xconnect-cutover-integration.sh"
      - "docs/xconnect/accounts-only-cutover.md"
      - "tests/xconnect-gateway-*.yml"
      - "tests/tasks/xconnect-gateway-*.yml"
      - "tests/fixtures/xconnect-gateway/**"
      - ".github/workflows/xconnect-gateway-agent.yml"
  push:
    branches:
      - codex/xconnect-overlay-productization
      - codex/xconnect-batch-05-gateway-apply
      - codex/xconnect-batch-06-rollout-gates
    paths:
      - "tools/xconnect-gateway-agent/**"
      - "roles/vhosts/xconnect-gateway/**"
      - "scripts/validate-xconnect-gateway-agent.sh"
      - "scripts/validate-xconnect-gateway-role.sh"
      - "scripts/test-xconnect-cutover-integration.sh"
      - "docs/xconnect/accounts-only-cutover.md"
      - "tests/xconnect-gateway-*.yml"
      - "tests/tasks/xconnect-gateway-*.yml"
      - "tests/fixtures/xconnect-gateway/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/xconnect-gateway-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xconnect-gateway-agent/go.mod
          cache-dependency-path: |
            tools/xconnect-gateway-agent/go.mod
            tools/xconnect-gateway-agent/go.sum
      - name: Static shadow-mode guard
        working-directory: .
        run: scripts/validate-xconnect-gateway-agent.sh
      - name: Validate Gateway role contracts
        working-directory: .
        run: scripts/validate-xconnect-gateway-role.sh
      - name: Install pinned Ansible contract runner
        run: python3 -m pip install ansible-core==2.15.13
      - name: Verify disabled safety, idempotence, and takeover rollback matrix
        working-directory: .
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles/vhosts
        run: |
          ansible-playbook -i localhost, tests/xconnect-gateway-disabled.yml --syntax-check
          ansible-playbook -i localhost, tests/xconnect-gateway-takeover-state.yml --syntax-check
          ansible-playbook -i localhost, tests/xconnect-gateway-accounts-only.yml --syntax-check
          ansible-playbook -i localhost, tests/xconnect-gateway-disabled.yml
          ansible-playbook -i localhost, tests/xconnect-gateway-service-state.yml
          ansible-playbook -i localhost, tests/xconnect-gateway-takeover-state.yml
          ansible-playbook -i localhost, tests/xconnect-gateway-accounts-only.yml
          ansible-playbook -i localhost, tests/xconnect-gateway-templates.yml
          ansible-playbook -i localhost, tests/xconnect-gateway-version.yml
      - run: go vet ./...
      - run: go test -race ./...
      - name: Install isolated namespace test dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Verify scoped nftables transaction in an isolated namespace
        working-directory: .
        run: scripts/test-xconnect-gateway-namespace.sh
      - name: Verify accounts-only cutover gates with mock HTTPS and namespace evidence
        working-directory: .
        run: scripts/test-xconnect-cutover-integration.sh

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: tools/xconnect-gateway-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xconnect-gateway-agent/go.mod
          cache-dependency-path: |
            tools/xconnect-gateway-agent/go.mod
            tools/xconnect-gateway-agent/go.sum
      - name: Build Linux artifact
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=0.1.0"
          -o "${RUNNER_TEMP}/xconnect-gateway-agent-linux-${GOARCH}"
          ./cmd/xconnect-gateway-agent
      - name: Build Linux cutover readiness verifier
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=0.1.0"
          -o "${RUNNER_TEMP}/xconnect-cutover-readiness-linux-${GOARCH}"
          ./cmd/xconnect-cutover-readiness
