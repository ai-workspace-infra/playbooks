name: XHTTP Edge relay role

on:
  pull_request:
    paths:
      - "deploy_xray_edge.yml"
      - "roles/vhosts/xray-edge/**"
      - "tests/test_xray_edge_candidate.py"
      - ".github/workflows/xray-edge-role.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install ansible-core
      - name: Run candidate-validation unit tests
        run: python -m unittest discover -s tests -p test_xray_edge_candidate.py -v
      - name: Check playbook syntax
        run: ansible-playbook -i 'localhost,' -e xray_edge_hosts=localhost deploy_xray_edge.yml --syntax-check
