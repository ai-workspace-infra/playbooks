name: Referral deployment acceptance contract
on:
  pull_request:
    paths:
      - 'roles/referral_deployment_acceptance/**'
      - 'referral-deployment-acceptance.yml'
      - 'tests/test_referral_deployment_acceptance.py'
      - 'tests/fixtures/referral_pinned_routes.json'
      - '.github/workflows/referral-deployment-contract.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ansible-core==2.17.14 PyYAML==6.0.2
      - run: python -m unittest discover -s tests -p test_referral_deployment_acceptance.py -v
      - run: ANSIBLE_ROLES_PATH=roles ansible-playbook -i localhost, referral-deployment-acceptance.yml --syntax-check
