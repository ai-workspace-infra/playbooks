name: XConnect Static Import

on:
  pull_request:
    paths:
      - "tools/xconnect-gateway-agent/**"
      - "scripts/validate-xconnect-static-import.sh"
      - "tests/fixtures/xconnect-static-import/**"
      - "docs/xconnect/static-to-dynamic-migration.md"
      - ".github/workflows/xconnect-static-import.yml"
  push:
    branches:
      - codex/xconnect-overlay-productization
    paths:
      - "tools/xconnect-gateway-agent/**"
      - "scripts/validate-xconnect-static-import.sh"
      - "tests/fixtures/xconnect-static-import/**"
      - "docs/xconnect/static-to-dynamic-migration.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xconnect-gateway-agent/go.mod
          cache-dependency-path: |
            tools/xconnect-gateway-agent/go.mod
            tools/xconnect-gateway-agent/go.sum
      - run: scripts/validate-xconnect-static-import.sh
      - working-directory: tools/xconnect-gateway-agent
        run: go vet ./...
      - working-directory: tools/xconnect-gateway-agent
        run: go test -race ./...

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xconnect-gateway-agent/go.mod
          cache-dependency-path: |
            tools/xconnect-gateway-agent/go.mod
            tools/xconnect-gateway-agent/go.sum
      - name: Build migration utility
        working-directory: tools/xconnect-gateway-agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=0.1.0"
          -o "${RUNNER_TEMP}/xconnect-static-import-linux-${GOARCH}"
          ./cmd/xconnect-static-import
