name: Serverless Database Operations

on:
  workflow_call:
    outputs:
      data_run_id:
        description: Caller workflow run ID for the database operation; a locator, not backup or restore proof.
        value: ${{ jobs.database_operation.outputs.data_run_id }}
      data_run_attempt:
        description: Caller workflow run attempt for the database operation.
        value: ${{ jobs.database_operation.outputs.data_run_attempt }}
      receipt_artifact_name:
        description: Sanitized operation receipt artifact bound to caller run and attempt.
        value: ${{ jobs.database_operation.outputs.receipt_artifact_name }}
      receipt_sha256:
        description: SHA-256 of the sanitized caller-bound operation receipt.
        value: ${{ jobs.database_operation.outputs.receipt_sha256 }}
      operation_result:
        description: Database operation job result recorded in its receipt.
        value: ${{ jobs.database_operation.outputs.operation_result }}
    inputs:
      environment:
        description: Target environment (uat or prod).
        required: true
        type: string
      operation:
        description: Database operation (checkpoint, probe, baseline, or migrate; init-schema is retired and fails closed).
        required: true
        type: string
      release_tag:
        description: Release or immutable snapshot tag.
        required: false
        default: ''
        type: string
      config_json:
        description: >-
          JSON object. checkpoint accepts require_durable_checkpoint. baseline and migrate
          require checkpoint_run_id plus backup_receipt locator fields source_run_id,
          source_repository, artifact_id, the exact artifact_name serverless-database-receipt,
          and backup_sha256. The trusted artifact must contain only backup-receipt.json with the host's sanitized
          same-environment encrypted /data backup and isolated restore evidence. migrate
          also accepts repair_schema, expected_schema_version, target_schema_version,
          and migration_sha256. A run ID or boolean alone is never restore proof.
        required: false
        default: '{}'
        type: string
      accounts_ref:
        description: Accounts source ref fallback; migration uses the immutable release_tag as its source ref.
        required: false
        default: main
        type: string
      correlation_id:
        description: Caller-provided operation correlation identifier.
        required: true
        type: string
      toolkit_ref:
        description: Optional toolkit ref for read-only snapshot evidence only; database operations use this Playbooks workflow's own snapshot.
        required: false
        default: main
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: serverless-database-${{ inputs.environment }}-${{ inputs.correlation_id }}
  cancel-in-progress: false

jobs:
  database_operation:
    name: ${{ inputs.environment }} / ${{ inputs.operation }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      data_run_id: ${{ steps.serverless_database.outputs.data_run_id }}
      data_run_attempt: ${{ steps.serverless_database.outputs.data_run_attempt }}
      receipt_artifact_name: ${{ steps.serverless_database.outputs.receipt_artifact_name }}
      receipt_sha256: ${{ steps.serverless_database.outputs.receipt_sha256 }}
      operation_result: ${{ steps.serverless_database.outputs.operation_result }}
    steps:
      - name: Check out the pinned Playbooks execution owner
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: playbooks-owner
          persist-credentials: false

      - name: Run the pinned Serverless database operation action
        id: serverless_database
        uses: ./playbooks-owner/.github/actions/serverless-database-operation
        with:
          owner_sha: ${{ job.workflow_sha }}
          environment: ${{ inputs.environment }}
          operation: ${{ inputs.operation }}
          release_tag: ${{ inputs.release_tag }}
          config_json: ${{ inputs.config_json }}
          accounts_ref: ${{ inputs.accounts_ref }}
          correlation_id: ${{ inputs.correlation_id }}
          vault_addr: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
