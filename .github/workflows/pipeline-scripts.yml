name: Pipeline Scripts

# scripts/pipeline/ is called by the platform-ops-toolkit workflows (this repo is
# checked out as playbooks/). This gate keeps the scripts runnable on their own so a
# change here is caught before the toolkit pins a new ref.
on:
  pull_request:
    paths:
      - "scripts/pipeline/**"
      - "scripts/node_deploy/**"
      - "tests/node_deploy/**"
      - ".github/actions/setup-deployment-runner/**"
      - ".github/workflows/pipeline-scripts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/pipeline/**"
      - "scripts/node_deploy/**"
      - "tests/node_deploy/**"
      - ".github/actions/setup-deployment-runner/**"

permissions:
  contents: read

jobs:
  pipeline-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: |
          set -euo pipefail
          for f in scripts/pipeline/*.sh scripts/pipeline/lib/*.sh scripts/pipeline/tests/*.sh; do
            bash -n "$f"
          done
          shellcheck -S error scripts/pipeline/*.sh scripts/pipeline/lib/*.sh scripts/pipeline/tests/*.sh
          bash -n .github/actions/setup-deployment-runner/scripts/setup.sh .github/actions/setup-node-stage-runner/scripts/setup.sh scripts/node_deploy/*.sh
          python3 -m py_compile scripts/node_deploy/*.py

      - name: Entry points are executable
        run: |
          # The toolkit workflows invoke these as bare commands; a lost exec bit
          # fails the job only at run time.
          bad=0
          for f in $(git ls-files ':(glob)scripts/pipeline/*.sh' ':(glob)scripts/pipeline/tests/*.sh'); do
            [[ "$(git ls-files -s -- "$f" | cut -c1-6)" == 100755 ]] || { echo "not 100755: $f"; bad=1; }
          done
          exit "$bad"

      - name: Behaviour tests
        run: |
          set -euo pipefail
          for t in scripts/pipeline/tests/*_test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
          python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.2'
          python3 -m unittest discover -s tests/node_deploy -p 'test_*.py' -v
