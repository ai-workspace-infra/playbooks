name: CMDB isolated monitoring contract

on:
  pull_request:
    paths:
      - deploy_cmdb_monitoring.yml
      - roles/vhosts/cmdb-monitoring/**
      - roles/vhosts/vector-agent/templates/vector.service.d_override.conf.j2
      - roles/vhosts/vector-agent/templates/vector.toml.j2
      - tests/test_cmdb_monitoring.py
      - .github/workflows/cmdb-monitoring-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install 'ansible-core>=2.19,<2.20' 'jinja2==3.1.6' 'PyYAML>=6,<7'
      - name: Verify credential rendering and isolated services
        run: |
          python -m unittest discover -s tests -p test_cmdb_monitoring.py -v
          python -m unittest discover -s tests -p test_vector_agent_contract.py -v
          python -m unittest discover -s tests -p test_vector_journald_render.py -v
      - name: Validate Ansible entrypoint without deployment
        run: ansible-playbook -i 'localhost,' deploy_cmdb_monitoring.yml --syntax-check
