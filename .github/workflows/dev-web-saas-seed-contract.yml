name: Dev web-saas seed owner contracts
on:
  pull_request:
    paths:
      - 'dev_web_saas_seed.yml'
      - 'roles/platform/dev_web_saas_seed/**'
      - 'scripts/run_dev_web_saas_seed.py'
      - 'scripts/tagged_seed_baseline.py'
      - 'scripts/dev_ssh_binding.py'
      - 'tests/test_dev_web_saas_seed.py'
      - 'tests/test_tagged_seed*.py'
      - 'tests/test_dev_feature_flux.py'
      - 'tests/dev_web_saas_seed_logging_pg_integration.py'
      - '.github/workflows/dev-web-saas-seed*.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ansible-core==2.17.14 PyYAML==6.0.3 pytest==8.4.2
      - run: python -m pytest -q tests/test_dev_web_saas_seed.py tests/test_dev_feature_flux.py tests/test_tagged_seed_baseline.py tests/test_tagged_seed_schema.py tests/test_tagged_seed_prepare.py
      - run: ansible-playbook -i inventory/terraform_cmdb.py dev_web_saas_seed.yml --syntax-check -e dev_web_saas_seed_target=all
      - name: Verify server-side credential error-statement protection in an isolated database
        shell: bash
        run: PG17_BIN="$(pg_config --bindir)" python tests/dev_web_saas_seed_logging_pg_integration.py
