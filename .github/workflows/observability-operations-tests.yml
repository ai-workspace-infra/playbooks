name: Observability Operations Tests

on:
  pull_request:
    paths:
      - observability_operations.yml
      - observability_closure_acceptance.yml
      - observability_alert_config_review.yml
      - roles/observability_alert_config_review/**
      - tests/test_observability_alert_config_review.py
      - observability_audit_session.yml
      - roles/observability_audit_session/**
      - tests/test_observability_audit_session.py
      - tests/test_observability_audit_verifier.py
      - import_starsl_k8s_dashboard.yml
      - roles/platform/grafana_starsl_dashboard/**
      - roles/docker/observability-server/files/starsl-k8s-dashboard.json
      - tests/test_starsl_k8s_dashboard.py
      - roles/docker/observability_server_operations/**
      - roles/observability_acceptance/**
      - scripts/verify_observability_closure.py
      - docs/observability-diagnostics.md
      - tests/test_observability_operations_role_contract.py
      - tests/test_observability_post_dns_cutover.py
      - tests/test_observability_local_grafana.py
      - tests/test_observability_closure_acceptance.py
      - .github/workflows/observability-operations-tests.yml
  push:
    branches: [main]
    paths:
      - observability_operations.yml
      - observability_closure_acceptance.yml
      - observability_alert_config_review.yml
      - roles/observability_alert_config_review/**
      - tests/test_observability_alert_config_review.py
      - observability_audit_session.yml
      - roles/observability_audit_session/**
      - tests/test_observability_audit_session.py
      - tests/test_observability_audit_verifier.py
      - import_starsl_k8s_dashboard.yml
      - roles/platform/grafana_starsl_dashboard/**
      - roles/docker/observability-server/files/starsl-k8s-dashboard.json
      - tests/test_starsl_k8s_dashboard.py
      - roles/docker/observability_server_operations/**
      - roles/observability_acceptance/**
      - scripts/verify_observability_closure.py
      - docs/observability-diagnostics.md
      - tests/test_observability_operations_role_contract.py
      - tests/test_observability_post_dns_cutover.py
      - tests/test_observability_local_grafana.py
      - tests/test_observability_closure_acceptance.py
      - .github/workflows/observability-operations-tests.yml

permissions:
  contents: read

jobs:
  role-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime
        run: python3 -m pip install ansible-core PyYAML
      - name: Verify role and simulate post-cutover host checks
        run: >-
          python3 -m unittest
          tests/test_observability_operations_role_contract.py
          tests/test_observability_post_dns_cutover.py
          tests/test_observability_local_grafana.py
          tests/test_observability_closure_acceptance.py
          tests/test_starsl_k8s_dashboard.py
          tests/test_observability_audit_session.py
          tests/test_observability_audit_verifier.py
          tests/test_observability_alert_config_review.py
      - name: Validate role shell and playbook syntax
        run: |
          for script in roles/docker/observability_server_operations/files/*.sh; do bash -n "$script"; done
          ansible-playbook --syntax-check -i 'localhost,' observability_operations.yml
          ansible-playbook --syntax-check -i 'localhost,' observability_closure_acceptance.yml
          ansible-playbook --syntax-check -i 'localhost,' import_starsl_k8s_dashboard.yml
          ansible-playbook --syntax-check -i 'localhost,' observability_audit_session.yml
          ansible-playbook --syntax-check -i 'localhost,' observability_alert_config_review.yml
          git diff --check
