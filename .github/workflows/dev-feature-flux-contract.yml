name: Dev feature namespace owner contracts
on:
  pull_request:
    paths:
      - 'dev_feature_flux.yml'
      - 'roles/platform/dev_feature_flux/**'
      - 'scripts/dev_feature_candidate.py'
      - 'scripts/run_dev_feature_flux.py'
      - 'tests/test_dev_feature_flux.py'
      - 'roles/vhosts/k3s_runtime_secret_sync/**'
      - '.github/workflows/dev-feature-flux*.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ansible-core==2.17.14 PyYAML==6.0.3
      - run: python -m unittest discover -s tests -p test_dev_feature_flux.py
      - run: ansible-playbook -i 'localhost,' dev_feature_flux.yml --syntax-check -e dev_feature_target=localhost
