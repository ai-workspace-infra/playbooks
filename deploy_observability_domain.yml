---
# Open Platform service unit: Observability (observability.svc.plus).
# Run after deploy_vault_domain.yml; it does not touch the legacy
# observability.svc.plus host used as the migration source.
- import_playbook: deploy_observability_server.yml
  vars:
    observability_server_hosts: all
    # A legacy host-level Blackbox Exporter may already own 127.0.0.1:9115
    # while the split service unit is bootstrapped on the same machine.
    observability_blackbox_host_port: >-
      {{ '9116' if (lookup('ansible.builtin.env', 'OPEN_PLATFORM_DEPLOY_ONLY')
      | default('false', true) | bool) else '9115' }}
