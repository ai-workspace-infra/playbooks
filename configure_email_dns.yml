---
- name: Reconcile transactional email providers and Cloudflare DNS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    config_path: "{{ lookup('env', 'EMAIL_DNS_CONFIG_PATH') | default(playbook_dir ~ '/../gitops/resources/xworktech.com/prod/cloudflare/email-dns.yaml', true) }}"
    resend_api_base: https://api.resend.com
    cloudflare_api_base: https://api.cloudflare.com/client/v4
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('https://vault.svc.plus', true) }}"
    vault_env_path: "{{ lookup('env', 'VAULT_ENV_PATH') | default('prod', true) }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('', true) }}"
    vault_email_secret_path: "{{ lookup('env', 'RESEND_VAULT_PATH') | default('kv/data/' ~ vault_env_path ~ '/xworktech-email', true) }}"
    # Safe by default: read-only discovery is allowed, provider mutations require
    # an explicit opt-in from the caller (the CI apply workflow sets this).
    email_dns_apply: "{{ lookup('env', 'EMAIL_DNS_APPLY') | default('false', true) | bool }}"
  pre_tasks:
    - name: Load declarative email DNS policy
      ansible.builtin.include_vars:
        file: "{{ config_path }}"
        name: email_dns

    - name: Read provider credentials from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        auth_method: token
        token: "{{ vault_token }}"
        path: "{{ vault_email_secret_path | regex_replace('^kv/data/', '') }}"
        engine_mount_point: kv
      register: email_secrets
      no_log: true
      when: vault_token | length > 0

    - name: Decide which providers this policy declares
      ansible.builtin.set_fact:
        resend_enabled: "{{ email_dns.spec.resend is defined }}"

    - name: Resolve credentials from Vault or environment
      ansible.builtin.set_fact:
        resend_api_key: "{{ (email_secrets.secret | default({})).resend_api_key | default(lookup('env', 'RESEND_API_KEY'), true) }}"
        cloudflare_api_token: "{{ (email_secrets.secret | default({})).cloudflare_api_token | default(lookup('env', 'CLOUDFLARE_DNS_API_TOKEN'), true) }}"
      no_log: true

    - name: Validate required credentials
      ansible.builtin.assert:
        that:
          - cloudflare_api_token | length > 0
          - (not resend_enabled) or (resend_api_key | length > 0)
        fail_msg: >-
          Provide CLOUDFLARE_DNS_API_TOKEN (and RESEND_API_KEY when the policy
          declares spec.resend), or the Vault secret at {{ vault_email_secret_path }}.
      when: email_dns_apply

  tasks:
    - name: Show reconciliation mode
      ansible.builtin.debug:
        msg: >-
          {{ email_dns.spec.zone }} DNS reconciliation mode:
          {{ 'APPLY' if email_dns_apply else 'PLAN (read-only)' }};
          providers: google_workspace{{ ' + resend' if resend_enabled else '' }}

    - name: Find Resend domain
      ansible.builtin.uri:
        url: "{{ resend_api_base }}/domains"
        method: GET
        headers: {Authorization: "Bearer {{ resend_api_key }}"}
        return_content: true
      register: resend_domains
      no_log: true
      when: email_dns_apply and resend_enabled

    - name: Create Resend domain when absent
      ansible.builtin.uri:
        url: "{{ resend_api_base }}/domains"
        method: POST
        headers: {Authorization: "Bearer {{ resend_api_key }}", Content-Type: application/json}
        body_format: json
        body: {name: "{{ email_dns.spec.resend.domain }}"}
        status_code: [200, 201, 409]
        return_content: true
      register: resend_domain_create
      no_log: true
      check_mode: false
      when: email_dns_apply and resend_enabled and (resend_domains.json.data | default(resend_domains.json.result | default([])) | selectattr('name', 'equalto', email_dns.spec.resend.domain) | list | length) == 0

    - name: Resolve Resend domain object
      ansible.builtin.set_fact:
        resend_domain: "{{ ((resend_domains.json.data | default(resend_domains.json.result | default([]))) + [resend_domain_create.json]) | selectattr('name', 'equalto', email_dns.spec.resend.domain) | list | first }}"
      no_log: true
      when: email_dns_apply and resend_enabled

    - name: Read Resend verification records
      ansible.builtin.uri:
        url: "{{ resend_api_base }}/domains/{{ resend_domain.id }}"
        method: GET
        headers: {Authorization: "Bearer {{ resend_api_key }}"}
        return_content: true
      register: resend_domain_detail
      no_log: true
      when: email_dns_apply and resend_enabled

    - name: Resolve Cloudflare zone
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones?name={{ email_dns.spec.zone }}&status=active"
        headers: {Authorization: "Bearer {{ cloudflare_api_token }}", Content-Type: application/json}
        return_content: true
      register: cloudflare_zone
      no_log: true
      when: email_dns_apply

    - name: Validate Cloudflare zone
      ansible.builtin.assert:
        that: [cloudflare_zone.json.success, cloudflare_zone.json.result | length > 0]
        fail_msg: "Cloudflare zone {{ email_dns.spec.zone }} was not found or is not accessible."
      when: email_dns_apply

    - name: Set Cloudflare zone id
      ansible.builtin.set_fact:
        cloudflare_zone_id: "{{ cloudflare_zone.json.result[0].id }}"
      when: email_dns_apply

    - name: Build managed DNS records (SPF is reconciled separately)
      ansible.builtin.set_fact:
        resend_records: "{{ (resend_domain_detail.json.records | default([]) | rejectattr('value', 'default', '') | rejectattr('value', 'search', 'v=spf1') | map('combine', {'ttl': 3600, 'proxied': false}) | list) if resend_enabled else [] }}"
        dmarc_records: "{{ [email_dns.spec.dmarc | combine({'type': 'TXT', 'name': email_dns.spec.dmarc.name, 'content': email_dns.spec.dmarc.value})] }}"
        # A DKIM entry with an empty content is a placeholder for a key that has
        # not been generated in the Admin console yet. Publishing it would put a
        # broken selector in DNS, so skip it until the public key is filled in.
        dkim_records: "{{ email_dns.spec.google_workspace.dkim | default([]) | rejectattr('content', 'equalto', '') | list }}"
      when: email_dns_apply

    - name: Collect the records this run manages
      ansible.builtin.set_fact:
        managed_records: "{{ resend_records + dmarc_records + dkim_records }}"
      when: email_dns_apply

    - name: Warn about DKIM selectors still awaiting a generated key
      ansible.builtin.debug:
        msg: >-
          {{ item.name }} has no public key yet - generate it in Admin console
          -> Apps -> Google Workspace -> Gmail -> Authenticate email for
          {{ email_dns.spec.zone }}, paste it into the GitOps policy, then re-run.
      loop: "{{ email_dns.spec.google_workspace.dkim | default([]) | selectattr('content', 'equalto', '') | list }}"
      loop_control: {label: "{{ item.name }}"}

    - name: Query apex TXT records for SPF merge
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records?name={{ email_dns.spec.zone }}&type=TXT"
        headers: {Authorization: "Bearer {{ cloudflare_api_token }}"}
        return_content: true
      register: apex_txt_records
      no_log: true
      when: email_dns_apply

    - name: Merge Google Workspace and Resend SPF into one apex record
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records{{ '/' ~ (spf_record.id if spf_record is defined else '') }}"
        method: "{{ 'PUT' if spf_record is defined else 'POST' }}"
        headers: {Authorization: "Bearer {{ cloudflare_api_token }}", Content-Type: application/json}
        body_format: json
        body:
          type: TXT
          name: "{{ email_dns.spec.zone }}"
          content: "v=spf1 {{ ([email_dns.spec.google_workspace.spf_include] + ([email_dns.spec.resend.spf_include] if resend_enabled else [])) | join(' ') }} ~all"
          ttl: 3600
        return_content: true
      vars:
        spf_record: "{{ apex_txt_records.json.result | selectattr('content', 'search', '^v=spf1') | list | first | default(omit) }}"
      no_log: true
      when: email_dns_apply

    # A (name, type) pair can hold more than one record - svc.plus carries five
    # MX rows at the apex. The previous shape addressed that set through
    # result[0], so five desired values were written onto one record id in turn:
    # the last one won, the other four rows kept whatever they already held, and
    # aspmx.l.google.com at priority 1 was overwritten out of existence. Reconcile
    # per name instead, the way roles/cloudflare_dns already does it.
    - name: Collect the record set this run owns
      ansible.builtin.set_fact:
        desired_records: "{{ managed_records + email_dns.spec.google_workspace.mx }}"
      when: email_dns_apply

    # The apex TXT name is shared, not owned: it holds the merged SPF written a
    # few tasks above and any google-site-verification token the domain carries
    # for Search Console, Workspace or anyone else. Reconciling it by wiping the
    # name would take those out as collateral, so it is excluded from the owned
    # set - and a declared record that lands there is an error worth stopping
    # for rather than skipping quietly.
    - name: Refuse to take ownership of the shared apex TXT name
      ansible.builtin.assert:
        that:
          - desired_records | selectattr('name', 'equalto', email_dns.spec.zone)
                            | selectattr('type', 'equalto', 'TXT') | list | length == 0
        fail_msg: >-
          A declared record targets the apex TXT of {{ email_dns.spec.zone }}, which this
          reconciler shares with SPF and domain-verification tokens. Move it to a
          subdomain, or extend the SPF merge task to own it explicitly.
      when: email_dns_apply

    # Pairs rather than dicts, and zip rather than json_query: the CI step
    # installs ansible-core plus community.hashi_vault, and json_query needs
    # community.general, which is not there.
    - name: Resolve the distinct name/type pairs to reconcile
      ansible.builtin.set_fact:
        record_keys: >-
          {{ desired_records | map(attribute='name')
             | zip(desired_records | map(attribute='type'))
             | map('list') | unique | list }}
      when: email_dns_apply

    - name: Query existing records under each owned name
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records?name={{ item[0] }}&type={{ item[1] }}"
        headers: {Authorization: "Bearer {{ cloudflare_api_token }}"}
        return_content: true
      loop: "{{ record_keys }}"
      loop_control: {label: "{{ item[1] }} {{ item[0] }}"}
      register: existing_sets
      no_log: true
      when: email_dns_apply

    # Delete then create, one name at a time. The alternative - create first,
    # delete after - reads safer but Cloudflare rejects an exact duplicate of a
    # record that is already correct, so a no-op run would start erroring.
    - name: Remove the existing records under each owned name
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records/{{ item.1.id }}"
        method: DELETE
        headers: {Authorization: "Bearer {{ cloudflare_api_token }}", Content-Type: application/json}
      loop: "{{ existing_sets.results | subelements('json.result', skip_missing=True) }}"
      loop_control: {label: "{{ item.1.type }} {{ item.1.name }}"}
      no_log: true
      when: email_dns_apply

    - name: Create the declared records
      ansible.builtin.uri:
        url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records"
        method: POST
        headers: {Authorization: "Bearer {{ cloudflare_api_token }}", Content-Type: application/json}
        body_format: json
        body: "{{ {'type': item.type, 'name': item.name, 'content': item.value | default(item.content), 'ttl': item.ttl | default(3600), 'proxied': false} | combine({'priority': item.priority} if item.priority is defined else {}) }}"
        status_code: [200, 201]
        return_content: true
      loop: "{{ desired_records }}"
      loop_control: {label: "{{ item.type }} {{ item.name }}"}
      no_log: true
      when: email_dns_apply
