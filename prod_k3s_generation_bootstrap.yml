- name: Bootstrap one verified fresh PROD K3s generation
  hosts: k3s
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require the explicit source and target generation boundary
      ansible.builtin.assert:
        that:
          - target_generation == 'prod-v6'
          - k3s_platform_flux_bootstrap_mode == 'declarative_paused'
          - k3s_platform_node_name == 'prod-k3s-v6'
          - k3s_platform_write_kubeconfig_mode == '0600'
          - k3s_platform_local_storage_path == '/data/k3s/storage'
    - name: Run vhost common identity and PV checks before storage
      ansible.builtin.include_role:
        name: vhosts/common
        tasks_from: node_bootstrap.yml
    - name: Install empty-disk and observation prerequisites
      ansible.builtin.apt:
        name: [python3-yaml, util-linux, e2fsprogs]
        state: present
        update_cache: true
  roles:
    - web_saas_data_volume
    - vhosts/k3s_platform_bootstrap
