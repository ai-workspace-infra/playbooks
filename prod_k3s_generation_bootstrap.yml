- name: Bootstrap one verified fresh PROD K3s generation
  hosts: k3s
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require the explicit source and target generation boundary
      ansible.builtin.assert:
        that:
          - prod_k3s_bootstrap_phase in ['common', 'cluster']
          - target_generation is match('^[a-z0-9][a-z0-9-]*$')
          - k3s_platform_flux_bootstrap_mode == 'declarative_active'
          - k3s_platform_node_name == inventory_hostname
          - k3s_platform_write_kubeconfig_mode == '0600'
          - k3s_platform_local_storage_path is match('^/[^.]+$')
    - name: Run vhost common identity and PV checks before storage
      ansible.builtin.include_role:
        name: vhosts/common
        tasks_from: node_bootstrap.yml
      vars:
        common_os_identity_environment: "{{ web_saas_data_environment }}"
    - name: Install empty-disk and observation prerequisites
      ansible.builtin.apt:
        name: [python3-yaml, util-linux, e2fsprogs]
        state: present
        update_cache: true
      when: prod_k3s_bootstrap_phase == 'cluster'
  roles:
    - role: web_saas_data_volume
      when: prod_k3s_bootstrap_phase == 'cluster'
    - role: vhosts/k3s_platform_bootstrap
      when: prod_k3s_bootstrap_phase == 'cluster'
  post_tasks:
    - name: Save common-only verified receipt after infrastructure preparation
      ansible.builtin.copy:
        content: "{{ common_node_bootstrap_evidence | combine({'gitops_sha': k3s_platform_git_commit, 'phase': 'common'}) | to_json }}\n"
        dest: '{{ k3s_platform_receipt_path }}'
        mode: '0600'
      delegate_to: localhost
      become: false
      when: prod_k3s_bootstrap_phase == 'common'
