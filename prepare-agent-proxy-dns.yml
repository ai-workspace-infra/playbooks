---
- name: Prepare agent-proxy DNS for first ACME issuance
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_domain_base: >-
      {{ lookup('ansible.builtin.env', 'TARGET_DOMAIN_BASE')
         | default('onwalk.net', true) }}
    agent_proxy_ip: >-
      {{ lookup('ansible.builtin.env', 'AGENT_PROXY_IP')
         | default('', true) }}
    agent_proxy_dns_name: "agent-proxy.{{ target_domain_base }}"
    cloudflare_dns_records:
      - type: A
        name: "{{ agent_proxy_dns_name }}"
        content: "{{ agent_proxy_ip }}"
        ttl: 1
        proxied: false
  pre_tasks:
    - name: Validate agent-proxy DNS inputs
      ansible.builtin.assert:
        that:
          - agent_proxy_ip | length > 0
          - target_domain_base | length > 0
        fail_msg: >-
          TARGET_DOMAIN_BASE and AGENT_PROXY_IP are required before publishing
          the temporary agent-proxy DNS record.
  roles:
    - role: cloudflare_dns
