# k3s-normal-2c2g Profile Vars
# 标准生产运行基线 (2 vCPU, 2 GB RAM)
# 目标：满足正常业务运行需要，支持轻量存储与监控

k3s_platform_profile_name: "k3s-normal-2c2g"
k3s_platform_disable_components:
  - traefik

k3s_platform_disable_helm_controller: false
k3s_platform_disable_network_policy: false
k3s_platform_flannel_backend: "vxlan"
k3s_platform_datastore: "sqlite"
k3s_platform_require_data_mount: false

k3s_platform_gomemlimit: "768MiB"
k3s_platform_gogc: "50"
