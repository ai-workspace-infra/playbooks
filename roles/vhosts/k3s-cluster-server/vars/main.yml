---
# Bootstrap platforms validated for the K3s control-plane initializer.
# Package names differ per family, so the dependency list is explicit instead of
# relying on a generic package module guess (RHEL publishes openssh-clients,
# Debian publishes openssh-client).
k3s_platform_supported_os_families:
  - Debian
  - RedHat

k3s_platform_bootstrap_packages:
  Debian:
    - curl
    - git
    - openssh-client
    - ca-certificates
    - python3-pip
    - tar
  RedHat:
    - curl
    - git
    - openssh-clients
    - ca-certificates
    - python3-pip
    - tar

# Container networking userspace. RHEL 10 minimal images omit it entirely, which
# leaves kube-proxy unable to program rules; Debian images include it already.
k3s_platform_networking_packages:
  Debian: []
  RedHat:
    - iptables-nft
    - nftables
    - conntrack-tools
