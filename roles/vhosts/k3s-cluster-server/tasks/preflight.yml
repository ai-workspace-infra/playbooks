- name: Require an implemented initialization action
  ansible.builtin.assert:
    that:
      - action | default('bootstrap') == 'bootstrap'
    fail_msg: This role initializes the control plane only; upgrade, destroy, backup and recovery require their own reviewed owner entrypoints.

- name: Verify the OS hostname prepared by common
  ansible.builtin.command:
    argv: [hostname]
  register: k3s_control_plane_hostname
  changed_when: false

- name: Require the declared node identity before K3s installation
  ansible.builtin.assert:
    that:
      - k3s_control_plane_hostname.stdout | trim == k3s_platform_node_name
      - k3s_platform_write_kubeconfig_mode == '0600'
    fail_msg: Run vhosts/common to establish the declared OS hostname; admin kubeconfig must remain private.
