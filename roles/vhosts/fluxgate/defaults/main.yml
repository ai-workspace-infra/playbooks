---
fluxgate_enabled: true
fluxgate_replace_caddy: false
fluxgate_vhost_enabled: false
fluxgate_vhost_name: "jp-xconnect"
fluxgate_vhost_template: "xconnect.conf.j2"
fluxgate_version: "0.2.0"
fluxgate_release_repo: "ai-workspace-xstream/fluxgate"
fluxgate_release_tag: "{{ fluxgate_version if (fluxgate_version is match('^v')) else ('v' ~ fluxgate_version) }}"
fluxgate_release_arch: "{{ 'arm64' if (ansible_architecture | default('x86_64')) in ['aarch64', 'arm64'] else 'amd64' }}"
fluxgate_release_asset_name: "fluxgate-linux-{{ fluxgate_release_arch }}"
fluxgate_default_download_url: "https://github.com/{{ fluxgate_release_repo }}/releases/download/{{ fluxgate_release_tag }}/{{ fluxgate_release_asset_name }}"
fluxgate_binary_src: ""
fluxgate_download_url: "{{ fluxgate_default_download_url }}"
fluxgate_checksum_url: "https://github.com/{{ fluxgate_release_repo }}/releases/download/{{ fluxgate_release_tag }}/SHA256SUMS"
fluxgate_checksum: ""
fluxgate_download_timeout: 120
fluxgate_release_checksums:
  "0.2.0":
    amd64: "sha256:d3a539bdf4a51f3448653d98e8d32c7465ee8f84918af4def8927372145e7d73"
    arm64: "sha256:b28e60d77df6b2228589594673dec21450c765b2e33029683292fc6755f281d5"
fluxgate_binary_dest: "/usr/local/bin/fluxgate"
fluxgate_config_dir: "/etc/fluxgate"
fluxgate_tls_dir: "/etc/fluxgate/tls"
fluxgate_source_cert_path: "/etc/caddy/tls/agent-proxy.crt"
fluxgate_source_key_path: "/etc/caddy/tls/agent-proxy.key"

fluxgate_grace_period: "15s"
fluxgate_log_level: "INFO"
fluxgate_metrics_enabled: true
fluxgate_metrics_listen: "127.0.0.1:9102"

fluxgate_legacy_vhosts: []

fluxgate_vhosts: >-
  {{ (
       (agent_proxy_domains if (agent_proxy_domains is defined and agent_proxy_domains is iterable and agent_proxy_domains is not string) else ([agent_proxy_domains] if (agent_proxy_domains is defined and agent_proxy_domains) else []))
       + ([agent_id] if (agent_id is defined and agent_id) else [])
       + ([agent_entry_point] if (agent_entry_point is defined and agent_entry_point) else [])
       + ([xconnect_proxy_domain] if (xconnect_proxy_domain is defined and xconnect_proxy_domain) else [])
       + (service_domains if (service_domains is defined and service_domains is iterable and service_domains is not string) else [])
       + ([inventory_hostname] if (inventory_hostname is defined and inventory_hostname and inventory_hostname != 'localhost' and inventory_hostname != '127.0.0.1') else [])
       + (fluxgate_legacy_vhosts | default([]))
     ) | reject('equalto', '') | unique | list }}

fluxgate_xhttp_unix_socket: "/dev/shm/xray.sock"
fluxgate_exporter_xhttp_upstream: "127.0.0.1:8080"
fluxgate_exporter_tcp_upstream: "127.0.0.1:8081"
fluxgate_default_response: "XConnect Edge Agent"
fluxgate_strip_x_padding: true
fluxgate_gateway_enabled: "{{ xconnect_gateway_caddy_enabled | default(false) | bool }}"
fluxgate_gateway_path: "{{ xconnect_gateway_caddy_path | default('/xconnect', true) }}"
fluxgate_gateway_unix_socket: "{{ xconnect_gateway_listen_socket | default(xconnect_gateway_caddy_socket | default('/run/xconnect-gateway/xray.sock', true), true) }}"
