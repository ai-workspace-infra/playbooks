---
fluxgate_enabled: true
fluxgate_replace_caddy: false
fluxgate_version: "0.1.0"
fluxgate_binary_src: ""
fluxgate_download_url: ""
fluxgate_binary_dest: "/usr/local/bin/fluxgate"
fluxgate_config_dir: "/etc/fluxgate"
fluxgate_tls_dir: "/etc/fluxgate/tls"
fluxgate_source_cert_path: "/etc/caddy/tls/agent-proxy.crt"
fluxgate_source_key_path: "/etc/caddy/tls/agent-proxy.key"

fluxgate_grace_period: "15s"
fluxgate_log_level: "INFO"
fluxgate_metrics_enabled: true
fluxgate_metrics_listen: "127.0.0.1:9102"

fluxgate_vhosts:
  - jp-xconnect-01.svc.plus
  - jp-xconnect-02.svc.plus
  - jp-xconnect.svc.plus
  - tky-proxy.svc.plus

fluxgate_xhttp_unix_socket: "/dev/shm/xray.sock"
fluxgate_exporter_xhttp_upstream: "127.0.0.1:8080"
fluxgate_exporter_tcp_upstream: "127.0.0.1:8081"
fluxgate_default_response: "XConnect Edge Agent"
fluxgate_strip_x_padding: true
