---
- name: Ensure Fluxgate directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ fluxgate_config_dir }}"
    - "{{ fluxgate_config_dir }}/conf.d"
    - "{{ fluxgate_tls_dir }}"
  become: true

- name: Determine candidate TLS certificate sources for Fluxgate
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ fluxgate_source_cert_path }}"
    - "{{ agent_tls_cert_path | default('/etc/caddy/tls/agent-proxy.crt') }}"
  register: fluxgate_cert_source_stats

- name: Determine candidate TLS key sources for Fluxgate
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ fluxgate_source_key_path }}"
    - "{{ agent_tls_key_path | default('/etc/caddy/tls/agent-proxy.key') }}"
  register: fluxgate_key_source_stats

- name: Select resolved Fluxgate TLS paths
  ansible.builtin.set_fact:
    resolved_fluxgate_source_cert: >-
      {{ (fluxgate_cert_source_stats.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first)
         | default(fluxgate_source_cert_path) }}
    resolved_fluxgate_source_key: >-
      {{ (fluxgate_key_source_stats.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first)
         | default(fluxgate_source_key_path) }}

- name: Copy TLS cert and key into Fluxgate TLS directory
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ fluxgate_tls_dir }}/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ resolved_fluxgate_source_cert }}", dest: "agent-proxy.crt", mode: "0644" }
    - { src: "{{ resolved_fluxgate_source_key }}", dest: "agent-proxy.key", mode: "0600" }
  become: true
  notify: Restart fluxgate

- name: Render global Fluxgatefile
  ansible.builtin.template:
    src: Fluxgatefile.j2
    dest: "{{ fluxgate_config_dir }}/Fluxgatefile"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart fluxgate

- name: Export Fluxgate ingress contract facts
  ansible.builtin.set_fact:
    xconnect_ingress_engine: "fluxgate"
    xconnect_ingress_conf_d_dir: "{{ fluxgate_config_dir }}/conf.d"
    xconnect_ingress_tls_dir: "{{ fluxgate_tls_dir }}"
