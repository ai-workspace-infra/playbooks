- name: Ensure process_exporter user exists
  ansible.builtin.user:
    name: process_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode

- name: Download process-exporter archive
  ansible.builtin.get_url:
    url: >-
      https://github.com/ncabatoff/process-exporter/releases/download/v{{
      process_exporter_version | default('0.7.10') }}/process-exporter-{{
      process_exporter_version | default('0.7.10') }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.tar.gz
    dest: /tmp/process-exporter.tar.gz
    mode: "0644"
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode

- name: Extract process-exporter
  ansible.builtin.unarchive:
    src: /tmp/process-exporter.tar.gz
    dest: /tmp
    remote_src: true
    creates: "/tmp/process-exporter-{{ process_exporter_version | default('0.7.10') }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode

- name: Install process-exporter binary
  ansible.builtin.copy:
    src: "/tmp/process-exporter-{{ process_exporter_version | default('0.7.10') }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}/process-exporter"
    dest: /usr/local/bin/process-exporter
    mode: '0755'
    remote_src: true
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode
  become: true

- name: Remove process-exporter archive
  ansible.builtin.file:
    path: /tmp/process-exporter.tar.gz
    state: absent
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode

- name: Cleanup extracted process-exporter directory
  ansible.builtin.file:
    path: "/tmp/process-exporter-{{ process_exporter_version | default('0.7.10') }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    state: absent
  when: inventory_hostname in groups[group]

- name: Deploy process-exporter config
  ansible.builtin.template:
    src: process-exporter.yml
    dest: /etc/process-exporter.yml
    owner: process_exporter
    group: process_exporter
    mode: '0644'
  when: inventory_hostname in groups[group]

- name: Check whether node-exporter is available for combined metrics service
  ansible.builtin.stat:
    path: /opt/metrics-agent/node_exporter
  register: process_exporter_node_binary
  when: inventory_hostname in groups[group]

- name: Create process-exporter service
  ansible.builtin.template:
    src: process-exporter.service
    dest: /etc/systemd/system/process-exporter.service
    owner: root
    group: root
    mode: '0644'
  when:
    - inventory_hostname in groups[group]
    - not (process_exporter_node_binary.stat.exists | default(false))

- name: Install combined metrics supervisor
  ansible.builtin.copy:
    src: metrics-supervisor.py
    dest: /usr/local/bin/metrics-supervisor.py
    owner: root
    group: root
    mode: "0755"
  when:
    - inventory_hostname in groups[group]
    - process_exporter_node_binary.stat.exists | default(false)
    - not ansible_check_mode

- name: Install combined metrics service
  ansible.builtin.template:
    src: metrics.service
    dest: /etc/systemd/system/xconnect-host-metrics.service
    owner: root
    group: root
    mode: "0644"
  when:
    - inventory_hostname in groups[group]
    - process_exporter_node_binary.stat.exists | default(false)

- name: Stop split metrics services after consolidation
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    daemon_reload: true
  loop:
    - node-exporter.service
    - process-exporter.service
  when:
    - inventory_hostname in groups[group]
    - process_exporter_node_binary.stat.exists | default(false)
  failed_when: false

- name: Remove split metrics service files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - node-exporter.service
    - process-exporter.service
  when:
    - inventory_hostname in groups[group]
    - process_exporter_node_binary.stat.exists | default(false)

- name: Enable and start combined metrics service
  ansible.builtin.systemd:
    name: xconnect-host-metrics
    enabled: true
    state: restarted
    daemon_reload: true
  when:
    - inventory_hostname in groups[group]
    - process_exporter_node_binary.stat.exists | default(false)
    - not ansible_check_mode

- name: Enable and start process-exporter
  ansible.builtin.systemd:
    name: process-exporter
    enabled: true
    state: restarted
    daemon_reload: true
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode
    - not (process_exporter_node_binary.stat.exists | default(false))
