---
process_exporter_version: '0.7.10'
group: all
process_exporter_port: 9256
process_exporter_bind_addr: 127.0.0.1

# 在整套 fleet 上恒为 success=0 的 node_exporter collector。它们每次抓取都要遍历
# /proc 与 /sys, 却不产出任何可用序列。由 xconnect-host-metrics 的
# metrics-supervisor.py 渲染成 --no-collector.<name>。
# 复现: curl -s 127.0.0.1:9100/metrics | grep 'node_scrape_collector_success.*} 0'
node_exporter_disabled_collectors:
  - bonding
  - conntrack
  - fibrechannel
  - infiniband
  - ipvs
  - mdadm
  - nfs
  - nfsd
  - tapestats
  - watchdog
  - zfs
