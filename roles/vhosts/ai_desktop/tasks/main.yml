---
- name: Validate AI Desktop remote access selection
  ansible.builtin.assert:
    that:
      - ai_desktop_remote_type in ['xrdp', 'webrtc']
    fail_msg: "ai_desktop_remote_type must be xrdp or webrtc."
  when: ai_desktop_remote_enabled | bool

- name: Validate AI Desktop desktop selection
  ansible.builtin.assert:
    that:
      - ai_desktop_desktop_type in ['xfce', 'icewm']
    fail_msg: "ai_desktop_desktop_type must be either xfce or icewm."

- name: Validate single-account node scope
  ansible.builtin.assert:
    that:
      - ai_desktop_account_scope == 'single'
    fail_msg: "Each AI Desktop/proxy node must use ai_desktop_account_scope: single."

- name: Ensure swap space is configured on low memory hosts
  when:
    - ai_desktop_enabled | bool
    - ai_desktop_swap_enabled | bool
    - ansible_os_family == 'Debian'
  block:
    - name: Check active swap devices
      ansible.builtin.command: swapon --show --noheadings
      register: ai_desktop_swapon_check
      changed_when: false

    - name: Create and enable swap file when no swap space is active
      when: ai_desktop_swapon_check.stdout | length == 0
      block:
        - name: Allocate swap file
          ansible.builtin.command: "fallocate -l {{ ai_desktop_swap_size_mb }}M /swapfile"
          args:
            creates: /swapfile

        - name: Set secure permissions on swap file
          ansible.builtin.file:
            path: /swapfile
            owner: root
            group: root
            mode: "0600"

        - name: Format swap file
          ansible.builtin.command: mkswap /swapfile
          changed_when: false

        - name: Enable swap file
          ansible.builtin.command: swapon /swapfile
          changed_when: true

        - name: Add swap file to /etc/fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: "/swapfile none swap sw 0 0"
            state: present

- name: Install and enable SSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present
    install_recommends: false
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none
  become: true
  when:
    - ai_desktop_enabled | bool
    - ai_desktop_sshd_enabled | bool
    - ansible_os_family == 'Debian'

- name: Ensure SSH server is enabled and running
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started
  become: true
  when:
    - ai_desktop_enabled | bool
    - ai_desktop_sshd_enabled | bool
    - ansible_os_family == 'Debian'

- name: Install minimal XFCE desktop
  ansible.builtin.include_role:
    name: roles/vhosts/xfce_desktop_minimal_runtime
  vars:
    xfce_user: "{{ ai_desktop_user }}"
    xfce_packages: "{{ ai_desktop_xfce_packages }}"
    xfce_desktop_install_nodejs_runtime: "{{ ai_desktop_install_nodejs_runtime }}"
    xfce_desktop_install_playwright_runtime: "{{ ai_desktop_install_playwright_runtime }}"
  when:
    - ai_desktop_enabled | bool
    - ai_desktop_desktop_type == 'xfce'
    - ansible_os_family != 'Darwin'

- name: Install minimal IceWM desktop
  ansible.builtin.include_role:
    name: roles/vhosts/icewm_desktop_minimal
  vars:
    icewm_desktop_user: "{{ ai_desktop_user }}"
    icewm_desktop_user_password: "{{ ai_desktop_user_password }}"
    icewm_desktop_manage_user: "{{ ai_desktop_manage_user }}"
    icewm_desktop_user_groups: "{{ ai_desktop_user_groups }}"
    icewm_desktop_remote_enabled: "{{ ai_desktop_remote_enabled | bool and ai_desktop_remote_type == 'xrdp' }}"
    icewm_desktop_browser: "{{ ai_desktop_icewm_browser }}"
    icewm_desktop_chrome_download_url: "{{ ai_desktop_icewm_chrome_download_url }}"
    icewm_desktop_chrome_checksum: "{{ ai_desktop_icewm_chrome_checksum }}"
  when:
    - ai_desktop_enabled | bool
    - ai_desktop_desktop_type == 'icewm'
    - ansible_os_family != 'Darwin'

- name: Install XRDP remote desktop access
  ansible.builtin.include_role:
    name: roles/vhosts/remote_desktop_xrdp_server
  vars:
    xfce_user: "{{ ai_desktop_user }}"
    xfce_manage_user: "{{ ai_desktop_manage_user }}"
    xfce_user_password_plaintext: "{{ ai_desktop_user_password }}"
    xfce_user_groups: "{{ ai_desktop_user_groups }}"
    remote_desktop_session: "{{ ai_desktop_desktop_type }}"
    remote_desktop_browser_command: >-
      {{ '/usr/bin/google-chrome' if (ai_desktop_browser == 'chrome' and ansible_architecture in ['x86_64', 'amd64']) else '/usr/bin/chromium' }}
    xfce_rdp_listen_address: "{{ ai_desktop_rdp_listen_address }}"
  when:
    - ai_desktop_enabled | bool
    - ai_desktop_remote_enabled | bool
    - ai_desktop_remote_type == 'xrdp'
    - ai_desktop_desktop_type in ['xfce', 'icewm']
    - ansible_os_family != 'Darwin'

- name: Reserve AI Agent capability slot
  ansible.builtin.include_role:
    name: "{{ item }}"
  loop: "{{ ai_desktop_ai_agent_roles }}"
  when:
    - ai_desktop_enabled | bool
    - ai_desktop_ai_agent_enabled | bool
    - ai_desktop_ai_agent_roles | length > 0

- name: Reserve monitoring capability slot
  ansible.builtin.include_role:
    name: "{{ item }}"
  loop: "{{ ai_desktop_monitoring_roles }}"
  when:
    - ai_desktop_enabled | bool
    - ai_desktop_monitoring_enabled | bool
    - ai_desktop_monitoring_roles | length > 0

- name: Reserve WebRTC remote desktop capability slot
  ansible.builtin.include_role:
    name: "{{ item }}"
  loop: "{{ ai_desktop_webrtc_roles }}"
  vars:
    webrtc_desktop_bridge_user: "{{ ai_desktop_user }}"
    webrtc_desktop_bridge_listen: "{{ ai_desktop_webrtc_listen }}"
    webrtc_desktop_bridge_display: "{{ ai_desktop_webrtc_display }}"
    webrtc_desktop_bridge_service_enabled: "{{ ai_desktop_webrtc_service_enabled }}"
  when:
    - ai_desktop_enabled | bool
    - (ai_desktop_webrtc_enabled | bool or (ai_desktop_remote_enabled | bool and ai_desktop_remote_type == 'webrtc'))
    - ai_desktop_webrtc_roles | length > 0
