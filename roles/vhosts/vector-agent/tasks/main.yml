---
- name: Install the minimal Agent identity environment helper
  ansible.builtin.copy:
    src: vector-agent-domain-env
    dest: /usr/local/libexec/vector-agent-domain-env
    owner: root
    group: root
    mode: '0750'
  when: "'agent_proxy' in (group_names | default([]))"

- name: Read the canonical identity from this Agent configuration
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vector-agent-domain-env
      - --print
      - /etc/agent/account-agent.yaml
  register: vector_agent_config_identity
  changed_when: false
  when: "'agent_proxy' in (group_names | default([]))"

- name: Require a valid business identity for Agent Proxy telemetry
  ansible.builtin.assert:
    that:
      - vector_agent_config_identity.stdout | trim | length > 0
      - vector_agent_config_identity.stdout is match('^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?$')
    fail_msg: >-
      Agent Proxy telemetry requires a valid account-agent.yaml agent.id.
  when: "'agent_proxy' in (group_names | default([]))"

- name: Bind Vector labels to the target's canonical Agent ID
  ansible.builtin.set_fact:
    vector_observability_node_identity: "{{ vector_agent_config_identity.stdout }}"
    vector_observability_service_domain: "{{ vector_agent_config_identity.stdout }}"
  when: "'agent_proxy' in (group_names | default([]))"

- name: Check existing xray-exporter configuration for billing snapshot integration
  ansible.builtin.stat:
    path: /etc/xray-exporter.env
  register: existing_xray_exporter_env_stat

- name: Read existing xray-exporter configuration
  ansible.builtin.slurp:
    path: /etc/xray-exporter.env
  register: existing_xray_exporter_env_content
  when: existing_xray_exporter_env_stat.stat.exists | default(false)

- name: Check existing vector secrets configuration
  ansible.builtin.stat:
    path: /etc/vector/secrets.json
  register: existing_vector_secrets_stat

- name: Read existing vector secrets
  ansible.builtin.slurp:
    path: /etc/vector/secrets.json
  register: existing_vector_secrets_content
  when: existing_vector_secrets_stat.stat.exists | default(false)

- name: Detect existing billing snapshot integration state
  ansible.builtin.set_fact:
    vector_billing_snapshot_configured: >-
      {{ (existing_xray_exporter_env_stat.stat.exists | default(false)) and
         ('VECTOR_SNAPSHOT_URL' in (existing_xray_exporter_env_content.content | b64decode | default(''))) }}
    existing_xray_exporter_service_token: >-
      {{ (((existing_xray_exporter_env_content.content | b64decode | default('')).splitlines()
           | select('match', '^INTERNAL_SERVICE_TOKEN=')
           | map('regex_replace', '^INTERNAL_SERVICE_TOKEN=', '') | list | first) | default('', true))
         if (existing_xray_exporter_env_stat.stat.exists | default(false)) else '' }}
    existing_vector_billing_token: >-
      {{ ((existing_vector_secrets_content.content | b64decode | from_json | default({})).get('billing_token', ''))
         if (existing_vector_secrets_stat.stat.exists | default(false)) else '' }}
  no_log: true

- name: Resolve effective vector billing ingest state
  ansible.builtin.set_fact:
    vector_billing_ingest_enabled: >-
      {{ (vector_billing_ingest_enabled | default(false) | bool)
         or (lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_ENABLED') | default(false, true) | bool)
         or (vector_billing_snapshot_configured | default(false) | bool) }}

- name: Resolve canonical Vault credentials before any Vector changes
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/resolve-canonical-service-token.yml'
  when:
    - vector_billing_ingest_enabled | default(false) | bool
    - lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') | length == 0
    - existing_xray_exporter_service_token | default('') | length == 0
    - existing_vector_billing_token | default('') | length == 0
    - canonical_internal_service_token | default('') | length == 0

- name: Bind Vector billing to the canonical credential
  ansible.builtin.set_fact:
    vector_billing_ingest_token: >-
      {{ vector_billing_ingest_token
         if (vector_billing_ingest_token | default('') | length > 0)
         else (
           canonical_internal_service_token
           if (canonical_internal_service_token | default('') | length > 0)
           else (
             lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN')
             if (lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') | default('') | length > 0)
             else (
               existing_xray_exporter_service_token
               if (existing_xray_exporter_service_token | default('') | length > 0)
               else (existing_vector_billing_token | default(''))
             )
           )
         ) }}
  no_log: true
  when: vector_billing_ingest_enabled | default(false) | bool

- name: Resolve Vector billing ingest URL from environment or exporter configuration
  ansible.builtin.set_fact:
    vector_billing_ingest_url: >-
      {{ vector_billing_ingest_url
         if (vector_billing_ingest_url | default('') | length > 0)
         else (
           lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_URL')
           if (lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_URL') | default('') | length > 0)
           else (
             ((lookup('ansible.builtin.env', 'BILLING_SERVICE_BASE_URL')
               | default(lookup('ansible.builtin.env', 'BILLING_SERVICE_URL'), true)) | regex_replace('/+$', '') ~ '/v1/ingest/snapshots')
             if ((lookup('ansible.builtin.env', 'BILLING_SERVICE_BASE_URL') | default(lookup('ansible.builtin.env', 'BILLING_SERVICE_URL'), true)) | length > 0)
             else 'https://billing.svc.plus/v1/ingest/snapshots'
           )
         ) }}
  when: vector_billing_ingest_enabled | default(false) | bool

- name: Gather service state for optional Vector sources
  ansible.builtin.service_facts:

- name: Auto-detect active proxy engine on host
  ansible.builtin.set_fact:
    vector_proxy_engine_effective: >-
      {{ agent_proxy_engine
         if (agent_proxy_engine is defined and agent_proxy_engine | trim | length > 0)
         else (lookup('ansible.builtin.env', 'AGENT_PROXY_ENGINE')
               if (lookup('ansible.builtin.env', 'AGENT_PROXY_ENGINE') | default('') | trim | length > 0)
               else ('fluxgate'
                     if ((ansible_facts.services | default({})).get('fluxgate.service', {}).get('state', 'stopped') == 'running')
                     else ('haproxy'
                           if ((ansible_facts.services | default({})).get('haproxy.service', {}).get('state', 'stopped') == 'running')
                           else ('caddy'
                                 if ((ansible_facts.services | default({})).get('caddy.service', {}).get('state', 'stopped') == 'running')
                                 else ('fluxgate'
                                       if ('agent_proxy' in (group_names | default([])))
                                       else 'none'))))) }}

- name: Auto-detect active Xray exporter and monitoring on host
  ansible.builtin.set_fact:
    vector_xray_exporter_enabled: >-
      {{ vector_xray_exporter_enabled | bool
         if vector_xray_exporter_enabled is defined
         else (
           ((ansible_facts.services | default({})).get('xray-exporter-xhttp.service', {}).get('state', 'stopped') == 'running') or
           ((ansible_facts.services | default({})).get('xray.service', {}).get('state', 'stopped') == 'running') or
           (inventory_hostname in (groups.get('xray_exporter', [])))
         ) }}
    vector_xhttp_monitoring_enabled: >-
      {{ vector_xhttp_monitoring_enabled | bool
         if vector_xhttp_monitoring_enabled is defined
         else (
           ((ansible_facts.services | default({})).get('xray.service', {}).get('state', 'stopped') == 'running') or
           ((ansible_facts.services | default({})).get('fluxgate.service', {}).get('state', 'stopped') == 'running') or
           ((ansible_facts.services | default({})).get('caddy.service', {}).get('state', 'stopped') == 'running') or
           ((ansible_facts.services | default({})).get('haproxy.service', {}).get('state', 'stopped') == 'running')
         ) }}

- name: Resolve effective proxy engine metrics collection states
  ansible.builtin.set_fact:
    vector_fluxgate_metrics_enabled: >-
      {{ true if (vector_proxy_engine_effective == 'fluxgate')
         else (vector_fluxgate_metrics_enabled | bool) }}
    vector_caddy_metrics_enabled: >-
      {{ true if (vector_proxy_engine_effective == 'caddy')
         else (false if vector_proxy_engine_effective in ['fluxgate', 'haproxy']
               else (vector_caddy_metrics_enabled | bool)) }}
    vector_haproxy_metrics_enabled: >-
      {{ true if (vector_proxy_engine_effective == 'haproxy')
         else (false if vector_proxy_engine_effective in ['fluxgate', 'caddy']
               else (vector_haproxy_metrics_enabled | bool)) }}
    vector_fluxgate_health_probe_enabled: >-
      {{ (vector_fluxgate_health_probe_enabled | default(true) | bool) and
         ((ansible_facts.services | default({})).get('blackbox_exporter.service', {}).get('state', 'stopped') == 'running') }}
    vector_caddy_health_probe_enabled: >-
      {{ (vector_caddy_health_probe_enabled | default(true) | bool) and
         ((ansible_facts.services | default({})).get('blackbox_exporter.service', {}).get('state', 'stopped') == 'running') }}
    vector_haproxy_health_probe_enabled: >-
      {{ (vector_haproxy_health_probe_enabled | default(true) | bool) and
         ((ansible_facts.services | default({})).get('blackbox_exporter.service', {}).get('state', 'stopped') == 'running') }}

- name: Resolve K3s and Docker runtime state
  ansible.builtin.set_fact:
    vector_k3s_node_effective: >-
      {{ (vector_k3s_node | default(false) | bool)
         or ('k3s' in (group_names | default([])))
         or ('k3s_server' in (group_names | default([])))
         or ('k3s_agent' in (group_names | default([])))
         or ((runtime_form | default(cmdb_runtime_form | default(''))) == 'k3s')
         or ((deployment_mode | default('')) in ['kubernetes', 'k3s'])
         or ((ansible_facts.services | default({})).get('k3s.service', {}).get('state', 'stopped') == 'running')
         or ((ansible_facts.services | default({})).get('k3s-agent.service', {}).get('state', 'stopped') == 'running') }}
    vector_docker_service_running: >-
      {{ (ansible_facts.services | default({})).get('docker.service', {}).get('state', 'stopped') == 'running' }}

- name: Resolve Docker log source state and canonical runtime form
  ansible.builtin.set_fact:
    vector_docker_logs_enabled_effective: >-
      {{ (vector_docker_logs_enabled | bool)
         if (vector_docker_logs_enabled is defined)
         else (false if (vector_k3s_node_effective | bool) else (vector_docker_service_running | bool)) }}
    vector_observability_runtime_form: >-
      {{ vector_observability_runtime_form
         if (vector_observability_runtime_form | default('') | trim | length > 0)
         else ('k3s' if (vector_k3s_node_effective | bool)
               else ('docker' if (vector_docker_service_running | bool) else 'systemd')) }}

- name: Stop duplicate secondary host collectors when Vector is canonical
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - alloy.service
    - cmdb-metrics-agent.service
    - cmdb-node-exporter.service
  when:
    - not ansible_check_mode
    - vector_stop_duplicate_collectors | default(true) | bool
    - (ansible_facts.services | default({})).get(item, {}).get('state', 'stopped') == 'running'
  failed_when: false

- name: Determine Vector architecture
  ansible.builtin.set_fact:
    vector_arch: >-
      {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}

- name: Resolve Blackbox defaults needed by the namespaced defaults file
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_version: "{{ blackbox_version | default('0.27.0', true) }}"
    blackbox_probe_domain_base: >-
      {{ blackbox_probe_domain_base | default(lookup('ansible.builtin.env', 'TARGET_DOMAIN_BASE') | default('svc.plus', true), true) }}
    blackbox_probe_env: >-
      {{ blackbox_probe_env | default(lookup('ansible.builtin.env', 'DEPLOY_ENV') | default('production', true), true) }}

- name: Resolve Blackbox environment suffix before loading the defaults file
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_probe_env_suffix: >-
      {{ blackbox_probe_env_suffix | default('' if blackbox_probe_domain_base == 'svc.plus' else '-' ~ blackbox_probe_env, true) }}

- name: Load Blackbox probe defaults
  tags: [vector-blackbox-defaults]
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../blackbox_exporter/defaults/main.yml"
    name: blackbox_exporter_role_defaults

# The Blackbox defaults are loaded under a namespace so this role does not
# overwrite inventory overrides.  Their derived values refer to the
# unqualified variables below, therefore resolve them in dependency order
# before vector.toml.j2 evaluates blackbox_ssl_targets.  Without this, the
# namespaced expression is rendered on the target with undefined variables and
# Vector receives no blackbox sources at all.
- name: Resolve Blackbox probe base and environment
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_probe_domain_base: >-
      {{ blackbox_probe_domain_base | default(
           blackbox_exporter_role_defaults.blackbox_probe_domain_base, true) }}
    blackbox_probe_env: >-
      {{ blackbox_probe_env | default(
           blackbox_exporter_role_defaults.blackbox_probe_env, true) }}

- name: Resolve Blackbox probe environment suffix
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_probe_env_suffix: >-
      {{ blackbox_probe_env_suffix | default(
           blackbox_exporter_role_defaults.blackbox_probe_env_suffix, true) }}

- name: Resolve Blackbox SSL targets
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_ssl_targets: >-
      {{ blackbox_ssl_targets | default(
           blackbox_exporter_role_defaults.blackbox_ssl_targets, true) }}

- name: Check if Vector binary already exists
  ansible.builtin.stat:
    path: /usr/bin/vector
  register: vector_bin_check

- name: Download Vector deb package
  ansible.builtin.get_url:
    url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector_{{ vector_version }}-1_{{ vector_arch }}.deb"
    dest: "/tmp/vector_{{ vector_version }}.deb"
    mode: '0644'
  when: not vector_bin_check.stat.exists

- name: Install Vector from downloaded deb
  ansible.builtin.apt:
    deb: "/tmp/vector_{{ vector_version }}.deb"
    state: present
    lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"
  when: not vector_bin_check.stat.exists

- name: Create Vector configuration directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: '0755'

- name: Store Vector sink credentials outside vector.toml
  ansible.builtin.template:
    src: secrets.json.j2
    dest: /etc/vector/secrets.json
    owner: root
    group: root
    mode: '0600'
    backup: true
  register: vector_secrets_template
  no_log: true
  when: vector_billing_ingest_enabled | default(false) | bool

- name: Create Vector helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: vector_billing_ingest_enabled | default(false) | bool

- name: Install Vector exec-backed secret provider
  ansible.builtin.copy:
    src: vector-secret-provider
    dest: /usr/local/libexec/vector-secret-provider
    owner: root
    group: root
    mode: '0750'
  when: vector_billing_ingest_enabled | default(false) | bool

- name: Remove unused Vector sink credentials
  ansible.builtin.file:
    path: /etc/vector/secrets.json
    state: absent
  when:
    - not (vector_billing_ingest_enabled | default(false) | bool)
    - not (vector_billing_snapshot_configured | default(false) | bool)

- name: Remove unused Vector secret provider
  ansible.builtin.file:
    path: /usr/local/libexec/vector-secret-provider
    state: absent
  when:
    - not (vector_billing_ingest_enabled | default(false) | bool)
    - not (vector_billing_snapshot_configured | default(false) | bool)

- name: Detect local PostgreSQL exporter metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ postgres_exporter_port | default(9187) }}/metrics"
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: vector_postgres_exporter_metrics_endpoint
  changed_when: false
  failed_when: false

- name: Resolve PostgreSQL exporter collection state
  ansible.builtin.set_fact:
    vector_postgres_exporter_enabled_effective: >-
      {{ (vector_postgres_exporter_enabled | default(false) | bool)
         or (vector_postgres_exporter_metrics_endpoint.status | default(0) | int == 200) }}

- name: Remove default vector.yaml (if exists) to force toml
  ansible.builtin.file:
    path: /etc/vector/vector.yaml
    state: absent
  notify: Restart vector

- name: Configure vector default environment
  ansible.builtin.template:
    src: vector.default.j2
    dest: /etc/default/vector
    mode: '0644'
    backup: true
  register: vector_default_template
  notify: Restart vector

# 控制面推送时手上有 VECTOR_AUTH_* 环境变量, 这是唯一能拿到凭据的时刻。
# 在这里落盘, pull 模式后续才能复用同一份凭据, 而不是渲染出无鉴权 sink。
- name: Persist the control-plane supplied remote-write credential for pull mode
  ansible.builtin.copy:
    dest: "{{ vector_auth_static_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      # Written by the control-plane run from VECTOR_AUTH_USER/VECTOR_AUTH_PASSWORD.
      # Consumed by ansible-pull runs, which have no environment variables.
      VECTOR_AUTH_USER={{ vector_auth_user }}
      VECTOR_AUTH_PASSWORD={{ vector_auth_password }}
  no_log: true
  when:
    - vector_auth_user | default('') | trim | length > 0
    - vector_auth_password | default('') | trim | length > 0
    - not (vector_local_observability_enabled | default(false) | bool)
    - inventory_hostname != 'install.svc.plus'

- name: Install the remote-write credential bootstrap helper
  ansible.builtin.copy:
    src: bootstrap-remote-write-auth
    dest: /usr/local/libexec/bootstrap-vector-remote-write-auth
    owner: root
    group: root
    mode: "0750"

- name: Stat the Vault Agent rendered remote-write auth file
  ansible.builtin.stat:
    path: "{{ vector_auth_external_file }}"
  register: vector_auth_external_stat
  when: vector_auth_external_file_enabled | bool

# pull 模式没有任何环境变量。首次由控制面推送时把凭据落盘, 之后 pull 直接复用;
# 已经落盘的情况下脚本是幂等的, 不会改写既有值, 也不会轮换秘密。
- name: Bootstrap the persistent remote-write credential when none is supplied
  ansible.builtin.command:
    argv: [/usr/local/libexec/bootstrap-vector-remote-write-auth]
  environment:
    VECTOR_AUTH_STATIC_FILE: "{{ vector_auth_static_file }}"
    VECTOR_CONFIG_PATH: "{{ vector_config_dir }}/vector.toml"
  register: vector_auth_bootstrap
  changed_when: "'persisted remote-write credential' in vector_auth_bootstrap.stdout"
  failed_when: false
  when:
    - not (vector_local_observability_enabled | default(false) | bool)
    - inventory_hostname != 'install.svc.plus'
    - (vector_auth_user | default('') | trim | length == 0)
    - not (vector_auth_external_file_enabled | bool and (vector_auth_external_stat.stat.exists | default(false)))

- name: Stat the persistent static remote-write auth file
  ansible.builtin.stat:
    path: "{{ vector_auth_static_file }}"
  register: vector_auth_static_stat

# 解析渲染时真正采用的鉴权来源。必须显式失败而不是渲染无鉴权 sink:
# 静默降级会让节点"看起来正常", 实际所有指标与日志被摄取端 401 拒绝。
- name: Resolve the effective remote-write auth mode
  ansible.builtin.set_fact:
    vector_auth_mode: >-
      {{ 'vault'
         if (vector_auth_external_file_enabled | bool and vector_auth_external_stat.stat.exists | default(false))
         else ('static'
               if (vector_auth_user | default('') | trim | length > 0 and vector_auth_password | default('') | trim | length > 0)
               else ('static-file'
                     if vector_auth_static_stat.stat.exists | default(false)
                     else 'none')) }}

- name: Require a usable remote-write credential on collector hosts
  ansible.builtin.assert:
    that:
      - vector_auth_mode != 'none'
    fail_msg: >-
      no remote-write credential available: {{ vector_auth_external_file }} is absent,
      no vector_auth_user/password was supplied, and {{ vector_auth_static_file }}
      does not exist. Refusing to render sinks without authentication.
  when:
    - not (vector_local_observability_enabled | default(false) | bool)
    - inventory_hostname != 'install.svc.plus'

- name: Template Vector configuration
  ansible.builtin.template:
    src: vector.toml.j2
    dest: "{{ vector_config_dir }}/vector.toml"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: '0600'
    backup: true
  register: vector_config_template
  no_log: "{{ vector_billing_ingest_enabled | bool or (vector_auth_password | default('') | length > 0) }}"
  notify: Restart vector

- name: Validate rendered Vector configuration before service start
  ansible.builtin.shell: |
    set -o pipefail
    cmd=(/usr/bin/vector validate)
    if [[ -r "{{ vector_auth_static_file }}" ]]; then
      while IFS='=' read -r k v; do
        if [[ -n "$k" && ! "$k" =~ ^[[:space:]]*# ]]; then
          export "$k=$v"
        fi
      done < "{{ vector_auth_static_file }}"
    elif [[ "{{ vector_auth_mode }}" != "static-file" ]]; then
      cmd+=(--no-environment)
    fi
    cmd+=(--config-toml "{{ vector_config_dir }}/vector.toml")
    "${cmd[@]}" 2>&1 |
      sed -E \
        -e 's/(Authorization[[:space:]]*=[[:space:]]*")[^"]*"/\1<redacted>"/Ig' \
        -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1<redacted>/Ig' \
        -e 's/((token|password|secret)[[:space:]]*[=:][[:space:]]*")[^"]*"/\1<redacted>"/Ig' \
        -e 's/((token|password|secret)[[:space:]]*[=:][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig'
  args:
    executable: /bin/bash
  register: vector_config_validation
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Restore previous Vector configuration after validation failure
  ansible.builtin.copy:
    src: "{{ vector_config_template.backup_file }}"
    dest: "{{ vector_config_dir }}/vector.toml"
    remote_src: true
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: '0600'
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_config_template.backup_file is defined

- name: Restore previous Vector default environment after validation failure
  ansible.builtin.copy:
    src: "{{ vector_default_template.backup_file }}"
    dest: /etc/default/vector
    remote_src: true
    mode: '0644'
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_default_template.backup_file is defined

- name: Remove newly created Vector configuration after validation failure
  ansible.builtin.file:
    path: "{{ vector_config_dir }}/vector.toml"
    state: absent
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_config_template.changed | default(false)
    - vector_config_template.backup_file is not defined

- name: Restore previous Vector secrets after validation failure
  ansible.builtin.copy:
    src: "{{ vector_secrets_template.backup_file }}"
    dest: /etc/vector/secrets.json
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_secrets_template is defined
    - vector_secrets_template.backup_file is defined

- name: Remove newly created Vector secrets after validation failure
  ansible.builtin.file:
    path: /etc/vector/secrets.json
    state: absent
  no_log: true
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_secrets_template is defined
    - vector_secrets_template.changed | default(false)
    - vector_secrets_template.backup_file is not defined

- name: Reject invalid rendered Vector configuration
  ansible.builtin.fail:
    msg: >-
      Rendered Vector configuration failed validation. The sanitized Vector
      diagnostic follows:
      {{ vector_config_validation.stdout | default('no diagnostic output') | trim }}
  when: not ansible_check_mode and vector_config_validation.rc | int != 0

- name: Create systemd override directory for Vector
  ansible.builtin.file:
    path: /etc/systemd/system/vector.service.d
    state: directory
    mode: '0755'

- name: Apply Vector resource limits via systemd override
  ansible.builtin.template:
    src: vector.service.d_override.conf.j2
    dest: /etc/systemd/system/vector.service.d/override.conf
    mode: '0644'
    backup: true
  register: vector_override_template
  notify:
    - Reload systemd
    - Restart vector

- name: Enable and start Vector service with safe failure diagnostics
  block:
    - name: Apply validated Vector configuration changes now
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Vector service
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
      when: not ansible_check_mode
  rescue:
    - name: Restore previous Vector configuration after startup failure
      ansible.builtin.copy:
        src: "{{ vector_config_template.backup_file }}"
        dest: "{{ vector_config_dir }}/vector.toml"
        remote_src: true
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
        mode: '0600'
      when: vector_config_template.backup_file is defined

    - name: Restore previous Vector default environment after startup failure
      ansible.builtin.copy:
        src: "{{ vector_default_template.backup_file }}"
        dest: /etc/default/vector
        remote_src: true
        mode: '0644'
      when: vector_default_template.backup_file is defined

    - name: Remove newly created Vector configuration after startup failure
      ansible.builtin.file:
        path: "{{ vector_config_dir }}/vector.toml"
        state: absent
      when:
        - vector_config_template.changed | default(false)
        - vector_config_template.backup_file is not defined

    - name: Restore previous Vector secrets after startup failure
      ansible.builtin.copy:
        src: "{{ vector_secrets_template.backup_file }}"
        dest: /etc/vector/secrets.json
        remote_src: true
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when:
        - vector_secrets_template is defined
        - vector_secrets_template.backup_file is defined

    - name: Restore previous Vector service override after startup failure
      ansible.builtin.copy:
        src: "{{ vector_override_template.backup_file }}"
        dest: /etc/systemd/system/vector.service.d/override.conf
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: vector_override_template.backup_file is defined

    - name: Remove newly created Vector service override after startup failure
      ansible.builtin.file:
        path: /etc/systemd/system/vector.service.d/override.conf
        state: absent
      when:
        - vector_override_template.changed | default(false)
        - vector_override_template.backup_file is not defined

    - name: Remove newly created Vector secrets after startup failure
      ansible.builtin.file:
        path: /etc/vector/secrets.json
        state: absent
      no_log: true
      when:
        - vector_secrets_template is defined
        - vector_secrets_template.changed | default(false)
        - vector_secrets_template.backup_file is not defined

    - name: Reload systemd and restart Vector with restored configuration
      ansible.builtin.systemd_service:
        name: vector
        daemon_reload: true
        state: restarted
      failed_when: false

    - name: Read Vector service state after failed start
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - vector.service
          - -p
          - ActiveState
          - -p
          - SubState
          - -p
          - Result
          - -p
          - ExecMainCode
          - -p
          - ExecMainStatus
          - -p
          - NRestarts
      register: vector_service_state
      changed_when: false
      failed_when: false

    - name: Read sanitized Vector journal after failed start
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -u vector.service -b --no-pager -n 80 2>&1 |
          sed -E \
            -e 's/(Authorization[[:space:]]*=[[:space:]]*")[^"]*"/\1<redacted>"/Ig' \
            -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1<redacted>/Ig' \
            -e 's/((token|password|secret)[[:space:]]*[=:][[:space:]]*")[^"]*"/\1<redacted>"/Ig' \
            -e 's/((token|password|secret)[[:space:]]*[=:][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig'
      args:
        executable: /bin/bash
      register: vector_service_journal
      changed_when: false
      failed_when: false

    - name: Fail with safe Vector service diagnostics
      ansible.builtin.fail:
        msg: >-
          Vector service failed to start.
          systemd state:
          {{ vector_service_state.stdout | default('unavailable') | trim }}
          Sanitized journal:
          {{ vector_service_journal.stdout | default('unavailable') | trim }}
