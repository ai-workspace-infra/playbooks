---
- name: Gather service state for optional Vector sources
  ansible.builtin.service_facts:

- name: Resolve Docker log source state
  ansible.builtin.set_fact:
    vector_docker_logs_enabled_effective: >-
      {{ vector_docker_logs_enabled | default(
           (ansible_facts.services | default({})).get('docker.service', {}).get('state', 'stopped') == 'running') | bool }}

- name: Determine Vector architecture
  ansible.builtin.set_fact:
    vector_arch: >-
      {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}

- name: Resolve Blackbox defaults needed by the namespaced defaults file
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_version: "{{ blackbox_version | default('0.27.0', true) }}"
    blackbox_probe_domain_base: >-
      {{ blackbox_probe_domain_base | default(lookup('ansible.builtin.env', 'TARGET_DOMAIN_BASE') | default('svc.plus', true), true) }}
    blackbox_probe_env: >-
      {{ blackbox_probe_env | default(lookup('ansible.builtin.env', 'DEPLOY_ENV') | default('production', true), true) }}

- name: Resolve Blackbox environment suffix before loading the defaults file
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_probe_env_suffix: >-
      {{ blackbox_probe_env_suffix | default('' if blackbox_probe_domain_base == 'svc.plus' else '-' ~ blackbox_probe_env, true) }}

- name: Load Blackbox probe defaults
  tags: [vector-blackbox-defaults]
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../blackbox_exporter/defaults/main.yml"
    name: blackbox_exporter_role_defaults

# The Blackbox defaults are loaded under a namespace so this role does not
# overwrite inventory overrides.  Their derived values refer to the
# unqualified variables below, therefore resolve them in dependency order
# before vector.toml.j2 evaluates blackbox_ssl_targets.  Without this, the
# namespaced expression is rendered on the target with undefined variables and
# Vector receives no blackbox sources at all.
- name: Resolve Blackbox probe base and environment
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_probe_domain_base: >-
      {{ blackbox_probe_domain_base | default(
           blackbox_exporter_role_defaults.blackbox_probe_domain_base, true) }}
    blackbox_probe_env: >-
      {{ blackbox_probe_env | default(
           blackbox_exporter_role_defaults.blackbox_probe_env, true) }}

- name: Resolve Blackbox probe environment suffix
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_probe_env_suffix: >-
      {{ blackbox_probe_env_suffix | default(
           blackbox_exporter_role_defaults.blackbox_probe_env_suffix, true) }}

- name: Resolve Blackbox SSL targets
  tags: [vector-blackbox-defaults]
  ansible.builtin.set_fact:
    blackbox_ssl_targets: >-
      {{ blackbox_ssl_targets | default(
           blackbox_exporter_role_defaults.blackbox_ssl_targets, true) }}

- name: Check if Vector binary already exists
  ansible.builtin.stat:
    path: /usr/bin/vector
  register: vector_bin_check

- name: Download Vector deb package
  ansible.builtin.get_url:
    url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector_{{ vector_version }}-1_{{ vector_arch }}.deb"
    dest: "/tmp/vector_{{ vector_version }}.deb"
    mode: '0644'
  when: not vector_bin_check.stat.exists

- name: Install Vector from downloaded deb
  ansible.builtin.apt:
    deb: "/tmp/vector_{{ vector_version }}.deb"
    state: present
    lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"
  when: not vector_bin_check.stat.exists

- name: Create Vector configuration directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: '0755'

- name: Store Vector sink credentials outside vector.toml
  ansible.builtin.template:
    src: secrets.json.j2
    dest: /etc/vector/secrets.json
    owner: root
    group: root
    mode: '0600'
    backup: true
  register: vector_secrets_template
  no_log: true
  when: vector_billing_ingest_enabled | default(false) | bool

- name: Create Vector helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: vector_billing_ingest_enabled | default(false) | bool

- name: Install Vector exec-backed secret provider
  ansible.builtin.copy:
    src: vector-secret-provider
    dest: /usr/local/libexec/vector-secret-provider
    owner: root
    group: root
    mode: '0750'
  when: vector_billing_ingest_enabled | default(false) | bool

- name: Remove unused Vector sink credentials
  ansible.builtin.file:
    path: /etc/vector/secrets.json
    state: absent
  when: not (vector_billing_ingest_enabled | default(false) | bool)

- name: Remove unused Vector secret provider
  ansible.builtin.file:
    path: /usr/local/libexec/vector-secret-provider
    state: absent
  when: not (vector_billing_ingest_enabled | default(false) | bool)

- name: Detect local PostgreSQL exporter metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ postgres_exporter_port | default(9187) }}/metrics"
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: vector_postgres_exporter_metrics_endpoint
  changed_when: false
  failed_when: false

- name: Resolve PostgreSQL exporter collection state
  ansible.builtin.set_fact:
    vector_postgres_exporter_enabled_effective: >-
      {{ (vector_postgres_exporter_enabled | default(false) | bool)
         or (vector_postgres_exporter_metrics_endpoint.status | default(0) | int == 200) }}

- name: Remove default vector.yaml (if exists) to force toml
  ansible.builtin.file:
    path: /etc/vector/vector.yaml
    state: absent
  notify: Restart vector

- name: Configure vector default environment
  ansible.builtin.template:
    src: vector.default.j2
    dest: /etc/default/vector
    mode: '0644'
    backup: true
  register: vector_default_template
  notify: Restart vector

- name: Template Vector configuration
  ansible.builtin.template:
    src: vector.toml.j2
    dest: "{{ vector_config_dir }}/vector.toml"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: '0600'
    backup: true
  register: vector_config_template
  no_log: "{{ vector_billing_ingest_enabled | bool or (vector_auth_password | default('') | length > 0) }}"
  notify: Restart vector

- name: Validate rendered Vector configuration before service start
  ansible.builtin.shell: |
    set -o pipefail
    /usr/bin/vector validate --no-environment --config-toml "{{ vector_config_dir }}/vector.toml" 2>&1 |
      sed -E \
        -e 's/(Authorization[[:space:]]*=[[:space:]]*")[^"]*"/\1<redacted>"/Ig' \
        -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1<redacted>/Ig' \
        -e 's/((token|password|secret)[[:space:]]*[=:][[:space:]]*")[^"]*"/\1<redacted>"/Ig' \
        -e 's/((token|password|secret)[[:space:]]*[=:][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig'
  args:
    executable: /bin/bash
  register: vector_config_validation
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Restore previous Vector configuration after validation failure
  ansible.builtin.copy:
    src: "{{ vector_config_template.backup_file }}"
    dest: "{{ vector_config_dir }}/vector.toml"
    remote_src: true
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: '0600'
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_config_template.backup_file is defined

- name: Restore previous Vector default environment after validation failure
  ansible.builtin.copy:
    src: "{{ vector_default_template.backup_file }}"
    dest: /etc/default/vector
    remote_src: true
    mode: '0644'
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_default_template.backup_file is defined

- name: Remove newly created Vector configuration after validation failure
  ansible.builtin.file:
    path: "{{ vector_config_dir }}/vector.toml"
    state: absent
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_config_template.changed | default(false)
    - vector_config_template.backup_file is not defined

- name: Restore previous Vector secrets after validation failure
  ansible.builtin.copy:
    src: "{{ vector_secrets_template.backup_file }}"
    dest: /etc/vector/secrets.json
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_secrets_template is defined
    - vector_secrets_template.backup_file is defined

- name: Remove newly created Vector secrets after validation failure
  ansible.builtin.file:
    path: /etc/vector/secrets.json
    state: absent
  no_log: true
  when:
    - not ansible_check_mode
    - vector_config_validation.rc | int != 0
    - vector_secrets_template is defined
    - vector_secrets_template.changed | default(false)
    - vector_secrets_template.backup_file is not defined

- name: Reject invalid rendered Vector configuration
  ansible.builtin.fail:
    msg: >-
      Rendered Vector configuration failed validation. The sanitized Vector
      diagnostic follows:
      {{ vector_config_validation.stdout | default('no diagnostic output') | trim }}
  when: not ansible_check_mode and vector_config_validation.rc | int != 0

- name: Create systemd override directory for Vector
  ansible.builtin.file:
    path: /etc/systemd/system/vector.service.d
    state: directory
    mode: '0755'

- name: Apply Vector resource limits via systemd override
  ansible.builtin.template:
    src: vector.service.d_override.conf.j2
    dest: /etc/systemd/system/vector.service.d/override.conf
    mode: '0644'
    backup: true
  register: vector_override_template
  notify:
    - Reload systemd
    - Restart vector

- name: Enable and start Vector service with safe failure diagnostics
  block:
    - name: Apply validated Vector configuration changes now
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Vector service
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
      when: not ansible_check_mode
  rescue:
    - name: Restore previous Vector configuration after startup failure
      ansible.builtin.copy:
        src: "{{ vector_config_template.backup_file }}"
        dest: "{{ vector_config_dir }}/vector.toml"
        remote_src: true
        owner: "{{ vector_user }}"
        group: "{{ vector_group }}"
        mode: '0600'
      when: vector_config_template.backup_file is defined

    - name: Restore previous Vector default environment after startup failure
      ansible.builtin.copy:
        src: "{{ vector_default_template.backup_file }}"
        dest: /etc/default/vector
        remote_src: true
        mode: '0644'
      when: vector_default_template.backup_file is defined

    - name: Remove newly created Vector configuration after startup failure
      ansible.builtin.file:
        path: "{{ vector_config_dir }}/vector.toml"
        state: absent
      when:
        - vector_config_template.changed | default(false)
        - vector_config_template.backup_file is not defined

    - name: Restore previous Vector secrets after startup failure
      ansible.builtin.copy:
        src: "{{ vector_secrets_template.backup_file }}"
        dest: /etc/vector/secrets.json
        remote_src: true
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when:
        - vector_secrets_template is defined
        - vector_secrets_template.backup_file is defined

    - name: Restore previous Vector service override after startup failure
      ansible.builtin.copy:
        src: "{{ vector_override_template.backup_file }}"
        dest: /etc/systemd/system/vector.service.d/override.conf
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: vector_override_template.backup_file is defined

    - name: Remove newly created Vector service override after startup failure
      ansible.builtin.file:
        path: /etc/systemd/system/vector.service.d/override.conf
        state: absent
      when:
        - vector_override_template.changed | default(false)
        - vector_override_template.backup_file is not defined

    - name: Remove newly created Vector secrets after startup failure
      ansible.builtin.file:
        path: /etc/vector/secrets.json
        state: absent
      no_log: true
      when:
        - vector_secrets_template is defined
        - vector_secrets_template.changed | default(false)
        - vector_secrets_template.backup_file is not defined

    - name: Reload systemd and restart Vector with restored configuration
      ansible.builtin.systemd_service:
        name: vector
        daemon_reload: true
        state: restarted
      failed_when: false

    - name: Read Vector service state after failed start
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - vector.service
          - -p
          - ActiveState
          - -p
          - SubState
          - -p
          - Result
          - -p
          - ExecMainCode
          - -p
          - ExecMainStatus
          - -p
          - NRestarts
      register: vector_service_state
      changed_when: false
      failed_when: false

    - name: Read sanitized Vector journal after failed start
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -u vector.service -b --no-pager -n 80 2>&1 |
          sed -E \
            -e 's/(Authorization[[:space:]]*=[[:space:]]*")[^"]*"/\1<redacted>"/Ig' \
            -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1<redacted>/Ig' \
            -e 's/((token|password|secret)[[:space:]]*[=:][[:space:]]*")[^"]*"/\1<redacted>"/Ig' \
            -e 's/((token|password|secret)[[:space:]]*[=:][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig'
      args:
        executable: /bin/bash
      register: vector_service_journal
      changed_when: false
      failed_when: false

    - name: Fail with safe Vector service diagnostics
      ansible.builtin.fail:
        msg: >-
          Vector service failed to start.
          systemd state:
          {{ vector_service_state.stdout | default('unavailable') | trim }}
          Sanitized journal:
          {{ vector_service_journal.stdout | default('unavailable') | trim }}
