---
vector_version: "0.41.1" # Using a recent stable version
vector_config_dir: "/etc/vector"
vector_user: "vector"
vector_group: "vector"

vector_scrape_interval: "15s"
# Internal constraints
vector_batch_timeout: 5
vector_batch_max_events: 500
vector_buffer_max_events: 1000

# Stable labels on every metric and log let shared backends separate UAT and
# PROD without relying on host IPs.
vector_observability_environment: "{{ lookup('ansible.builtin.env', 'DEPLOY_ENV') | default('unknown', true) }}"
vector_observability_provider: "{{ cloud_provider | default('unknown', true) }}"
vector_observability_service_domain: "{{ observability_service_domain | default(inventory_hostname, true) }}"

# Disk buffer & rate limiting optimization for off-peak snapshot fanout
vector_disk_buffer_max_bytes: 536870912 # 512 MiB persistent disk buffer
vector_sink_rate_limit_num: 5 # Rate limit to prevent IO/bandwidth spikes
vector_cron_offpeak_hour: "03" # Off-peak execution hour (03:00 AM)

# Billing usage fan-out is opt-in; existing observability-only hosts remain
# unchanged until the UAT contract is configured.
vector_billing_ingest_enabled: false
vector_billing_ingest_address: "127.0.0.1:8686"
vector_billing_ingest_url: ""
vector_billing_ingest_token: ""

# Minimal Debian nodes often only retain systemd journals. Opt in per node to
# avoid duplicating syslog streams on existing fleet installations.
vector_system_journald_enabled: false
vector_system_journald_units:
  - xconnect-edge-agent.service
  - agent-proxy.service
  - agent-svc-plus.service
  - caddy.service
  - xray.service
  - xray-tcp.service
