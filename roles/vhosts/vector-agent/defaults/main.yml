---
vector_version: "0.41.1" # Using a recent stable version
vector_config_dir: "/etc/vector"
vector_user: "vector"
vector_group: "vector"

vector_scrape_interval: "15s"
# Internal constraints
vector_batch_timeout: 5
vector_batch_max_events: 500
vector_buffer_max_events: 1000

# systemd 内存上限(由 vector.service.d/override.conf 消费)。必须与 GitOps 治理值
# topology/{prod,uat}/selfhost/xconnect-regional-pool*.yaml 的
# node_maintenance.vector 对齐; 治理值优先, 这里只是未解析到治理配置时的安全默认。
vector_memory_high: "150M"
vector_memory_max: "250M"
vector_cpu_quota: "80%"

# 边缘主机是否自带对外 HTTPS 探活。全局可用性与证书探活已收口到集群侧
# (observability-agent blackboxExporter + vmagent), 边缘默认关闭, 避免每台机器
# 每 15 秒对全球 9 个域名各发一次请求。需要本机排障时按主机打开。
vector_blackbox_probe_enabled: false
blackbox_probe_interval_secs: 3600
# Stable labels on every metric and log let shared backends separate UAT and
# PROD without relying on host IPs.
vector_observability_endpoint: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENDPOINT') | default('https://observability.svc.plus', true) }}"
vector_auth_external_file_enabled: false
vector_auth_external_file: /run/vector/remote-write-auth.json
vector_observability_environment: "{{ environment | default(cmdb_environment | default(lookup('ansible.builtin.env', 'DEPLOY_ENV') | default('unknown', true), true), true) }}"
vector_observability_provider: "{{ provider | default(cloud_provider | default(cmdb_cloud_provider | default('unknown', true), true), true) }}"
vector_observability_region: "{{ region | default(cmdb_region | default(cloud_region | default(provider_region | default(logical_region | default('unknown', true), true), true), true), true) }}"
vector_observability_project_id: "{{ project_id | default(cmdb_project_id | default(account | default('', true), true), true) }}"
vector_observability_resource_id: "{{ resource_id | default(cmdb_resource_id | default(instance_id | default(cmdb_instance_id | default(inventory_hostname, true), true), true), true) }}"
vector_observability_runtime_form: "{{ runtime_form | default(cmdb_runtime_form | default('', true), true) }}"
# AGENT_PROXY_DOMAIN is passed by the installer from account-agent.yaml's
# agent.id. It is required on Agent Proxy nodes; hostname remains origin only.
vector_observability_node_identity: "{{ agent_proxy_domain | default(lookup('ansible.builtin.env', 'AGENT_PROXY_DOMAIN') | default(observability_service_domain | default(inventory_hostname, true), true), true) }}"
vector_observability_service_domain: "{{ vector_observability_node_identity | default(observability_service_domain | default(inventory_hostname, true), true) }}"
vector_node_metrics_enabled: true
vector_process_metrics_enabled: true
# Caddy metrics are opt-in because not every Vector host runs Caddy.
vector_caddy_metrics_enabled: false
vector_caddy_metrics_endpoint: "http://127.0.0.1:2019/metrics"
# Probe Caddy through the local blackbox exporter to expose real `up` values.
vector_caddy_health_probe_enabled: true

# HAProxy 3.0 metrics (built-in Prometheus exporter)
vector_haproxy_metrics_enabled: false
vector_haproxy_metrics_endpoint: "http://127.0.0.1:8404/metrics"
vector_haproxy_health_probe_enabled: true

# Fluxgate (Pingora) metrics
vector_fluxgate_metrics_enabled: false
vector_fluxgate_metrics_endpoint: "http://127.0.0.1:9102/metrics"
vector_fluxgate_health_probe_enabled: true
vector_k3s_cluster_scrapes_node_exporter: false
vector_stop_duplicate_collectors: true

# Disk buffer & rate limiting optimization for off-peak snapshot fanout
vector_disk_buffer_max_bytes: 536870912 # 512 MiB persistent disk buffer
vector_sink_rate_limit_num: 5 # Rate limit to prevent IO/bandwidth spikes
vector_cron_offpeak_hour: "03" # Off-peak execution hour (03:00 AM)

# Billing usage fan-out is opt-in; existing observability-only hosts remain
# unchanged until the UAT contract is configured.
vector_billing_ingest_enabled: false
vector_billing_ingest_address: "127.0.0.1:8686"
vector_billing_ingest_url: ""
vector_billing_ingest_token: ""

# Minimal Debian nodes often only retain systemd journals. Opt in per node to
# avoid duplicating syslog streams on existing fleet installations.
vector_system_journald_enabled: false
# Enable on XHTTP nodes through inventory or the canonical agent playbook.
vector_xhttp_monitoring_enabled: false
vector_system_journald_units:
  - xconnect-edge-agent.service
  - agent-proxy.service
  - agent-svc-plus.service
  - caddy.service
  - haproxy.service
  - fluxgate.service
  - xray.service
  - xray-tcp.service

# Opt in on the AI Aggregator gateway host. Application metrics remain on
# loopback and Vector forwards them through the existing authenticated sink.
vector_ai_aggregator_enabled: false
vector_ai_aggregator_metrics_targets:
  - name: apisix
    endpoint: http://127.0.0.1:9091/apisix/prometheus/metrics
  - name: litellm
    endpoint: http://127.0.0.1:4000/metrics
vector_ai_aggregator_probe_targets:
  - name: apisix
    target: 127.0.0.1:9080
    module: tcp_connect
  - name: new-api
    target: http://127.0.0.1:3000/api/status
    module: http_2xx
  - name: litellm
    target: 127.0.0.1:4000
    module: tcp_connect
  - name: cpa-0
    target: 127.0.0.1:8317
    module: tcp_connect
  - name: cpa-1
    target: 127.0.0.1:8318
    module: tcp_connect
  - name: cpa-2
    target: 127.0.0.1:8319
    module: tcp_connect
  - name: cpa-3
    target: 127.0.0.1:8320
    module: tcp_connect
vector_ai_aggregator_public_target: ""
