---
- name: Require narrow Dev registry adapter context
  ansible.builtin.assert:
    that:
      - k3s_runtime_secret_sync_apply | bool
      - k3s_runtime_secret_sync_items | length == 0
      - dev_feature_config.namespace in ['feature-xconnect-referral-sit', 'web-saas-uat']
      - dev_feature_config.mode == 'prepare'
  no_log: true
- name: Project only the approved Dev GHCR record over strict SSH stdin
  ansible.builtin.command:
    argv:
      - '{{ ansible_playbook_python }}'
      - '{{ role_path }}/files/dev_registry.py'
  delegate_to: localhost
  become: false
  environment:
    DEV_REGISTRY_NAMESPACE: '{{ dev_feature_config.namespace }}'
    DEV_REGISTRY_CONTEXT: "{{ (lookup('ansible.builtin.env', 'DEV_REGISTRY_CONTEXT') | from_json) | combine({'namespace_uid': (dev_feature_result.stdout | from_json).namespace_uid}) | to_json }}"
  register: dev_registry_result
  changed_when: true
  no_log: true
