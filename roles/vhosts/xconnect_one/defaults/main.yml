---
# This role is intentionally opt-in. It configures only the XConnect One
# runtime and its small observability companion; it never imports host-wide
# firewall, SSH-hardening, hostname or application roles.
xconnect_one_enabled: false
xconnect_one_environment: uat
xconnect_one_state_dir: "/var/lib/xconnect-one/{{ xconnect_one_environment }}"
xconnect_one_binary_source: ""
xconnect_one_binary_path: /usr/local/bin/xconnect
xconnect_one_device_id: ""
xconnect_one_device_name: ""
xconnect_one_invite_uri: ""
xconnect_one_invite_path: "/run/xconnect-one/{{ xconnect_one_environment }}.invite"
xconnect_one_expected_overlay_cidr: ""
xconnect_one_expected_wireguard_interface: xconone0
xconnect_one_expected_xray_loopback_port: 18080
xconnect_one_sync_interval_seconds: 300
xconnect_one_runtime_release_base_url: ""
xconnect_one_install_observability: true
