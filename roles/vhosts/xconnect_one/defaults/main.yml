---
# This role is intentionally opt-in. It configures only the XConnect One
# runtime and its small observability companion; it never imports host-wide
# firewall, SSH-hardening, hostname or application roles.
xconnect_one_enabled: false
xconnect_one_environment: uat
xconnect_one_state_dir: "/var/lib/xconnect-one/{{ xconnect_one_environment }}"
xconnect_one_binary_source: ""
xconnect_one_binary_path: /usr/local/bin/xconnect
xconnect_one_ca_certificate_source: ""
xconnect_one_device_id: ""
xconnect_one_device_name: ""
xconnect_one_expected_network_id: ""
xconnect_one_invite_uri: ""
xconnect_one_invite_file_source: ""
xconnect_one_invite_path: "/run/xconnect-one/{{ xconnect_one_environment }}.invite"
xconnect_one_expected_overlay_cidr: ""
xconnect_one_expected_wireguard_interface: xconone0
xconnect_one_expected_xray_loopback_port: 18080
xconnect_one_sync_interval_seconds: 60
xconnect_one_runtime_release_base_url: ""
# Minimal join is the safe default: do not install a host-wide metrics agent
# unless the node explicitly opts into the observability role.
xconnect_one_install_observability: false
# Leave other XConnect networks first (Vault migration source only).
xconnect_one_release_foreign_overlays: false
# Optional per-interface resolver wiring. When enabled, public names still
# resolve normally, while declared private suffixes use the Gateway overlay
# DNS server.
xconnect_one_dns_enabled: false
xconnect_one_dns_server: ""
xconnect_one_dns_domains: []
xconnect_one_dns_manage_resolv_conf: true
xconnect_one_dns_script_path: "/usr/local/lib/xconnect-one/configure-dns-{{ xconnect_one_environment }}.sh"
