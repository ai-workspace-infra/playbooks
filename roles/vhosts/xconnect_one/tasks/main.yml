---
- name: Validate XConnect One role inputs
  ansible.builtin.assert:
    that:
      - xconnect_one_enabled | bool
      - xconnect_one_environment in ['uat', 'prod', 'shared']
      - xconnect_one_binary_source | trim | length > 0
      - (xconnect_one_device_id | trim) is match('^[a-z0-9][a-z0-9._-]{0,127}$')
      - xconnect_one_device_name | trim | length > 0
      - xconnect_one_expected_network_id | trim | length > 0
      - (xconnect_one_expected_overlay_cidr | trim) is match('^[0-9.]+/[0-9]{1,2}$')
      - xconnect_one_expected_overlay_cidr != '0.0.0.0/0'
      - (xconnect_one_expected_wireguard_interface | trim) is match('^[a-zA-Z0-9_.-]{1,15}$')
      - xconnect_one_expected_xray_loopback_port | int > 1023
      - xconnect_one_expected_xray_loopback_port | int < 65536
      - xconnect_one_sync_interval_seconds | int >= 60
  no_log: true

- name: Install XConnect One preflight dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3
    state: present
    update_cache: true
    lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"

- name: Create XConnect One runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - "{{ xconnect_one_state_dir }}"
    - /run/xconnect-one
    - /usr/local/lib/xconnect-one

- name: Install optional XConnect One transport CA
  ansible.builtin.copy:
    src: "{{ xconnect_one_ca_certificate_source }}"
    dest: "/usr/local/share/ca-certificates/xconnect-one-{{ xconnect_one_environment }}.crt"
    owner: root
    group: root
    mode: '0644'
  register: xconnect_one_transport_ca
  when: xconnect_one_ca_certificate_source | trim | length > 0

- name: Refresh trusted CA certificates for XConnect One transport
  ansible.builtin.command: update-ca-certificates
  changed_when: true
  when:
    - xconnect_one_ca_certificate_source | trim | length > 0
    - xconnect_one_transport_ca.changed

- name: Install the foreign XConnect network release
  ansible.builtin.template:
    src: release_foreign.py.j2
    dest: "/usr/local/lib/xconnect-one/release-foreign-{{ xconnect_one_environment }}.py"
    owner: root
    group: root
    mode: '0700'
  when: xconnect_one_release_foreign_overlays | bool

# Only for a node the caller declares may move (the Vault migration source):
# every One binds the same loopback port, so it must leave its other network.
- name: Take this host off other XConnect networks
  ansible.builtin.command: "/usr/local/lib/xconnect-one/release-foreign-{{ xconnect_one_environment }}.py"
  register: xconnect_one_release_foreign
  changed_when: "'xconnect released: none' not in xconnect_one_release_foreign.stdout"
  when: xconnect_one_release_foreign_overlays | bool

- name: Install XConnect One collision preflight
  ansible.builtin.template:
    src: preflight.py.j2
    dest: "/usr/local/lib/xconnect-one/preflight-{{ xconnect_one_environment }}.py"
    owner: root
    group: root
    mode: '0700'

- name: Refuse overlapping XConnect One host networking
  ansible.builtin.command: "/usr/local/lib/xconnect-one/preflight-{{ xconnect_one_environment }}.py"
  changed_when: false

- name: Install reviewed XConnect One CLI artifact
  ansible.builtin.copy:
    src: "{{ xconnect_one_binary_source }}"
    dest: "{{ xconnect_one_binary_path }}"
    owner: root
    group: root
    mode: '0755'

- name: Bootstrap external Xray and WireGuard runtime
  ansible.builtin.command:
    argv:
      - "{{ xconnect_one_binary_path }}"
      - runtime
      - bootstrap
      - --state-dir
      - "{{ xconnect_one_state_dir }}"
      - --install-system-packages=true
      - --release-base-url
      - "{{ xconnect_one_runtime_release_base_url }}"
  when: xconnect_one_runtime_release_base_url | trim | length > 0
  no_log: true

- name: Bootstrap external Xray and WireGuard runtime with default release source
  ansible.builtin.command:
    argv:
      - "{{ xconnect_one_binary_path }}"
      - runtime
      - bootstrap
      - --state-dir
      - "{{ xconnect_one_state_dir }}"
      - --install-system-packages=true
  when: xconnect_one_runtime_release_base_url | trim | length == 0

- name: Inspect existing XConnect One enrollment
  ansible.builtin.stat:
    path: "{{ xconnect_one_state_dir }}/state.json"
  register: xconnect_one_existing_state

# A joined node re-runs without an invitation, so a re-run never needs or
# consumes a new one-use invite.
- name: Require an invitation only for a node that has not joined yet
  ansible.builtin.assert:
    that:
      - >-
        xconnect_one_existing_state.stat.exists or
        (xconnect_one_invite_file_source | trim | length > 0) or
        ((xconnect_one_invite_uri | trim) is match('^xconnect://join/'))
    fail_msg: This node has not joined XConnect and no one-use invitation was provided.
  no_log: true

- name: Write short-lived XConnect One invite file
  ansible.builtin.copy:
    content: "{{ xconnect_one_invite_uri }}\n"
    dest: "{{ xconnect_one_invite_path }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - not xconnect_one_existing_state.stat.exists
    - xconnect_one_invite_file_source | trim | length == 0
  no_log: true

- name: Stage short-lived XConnect One invite file from controller
  ansible.builtin.copy:
    src: "{{ xconnect_one_invite_file_source }}"
    dest: "{{ xconnect_one_invite_path }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - not xconnect_one_existing_state.stat.exists
    - xconnect_one_invite_file_source | trim | length > 0
  no_log: true

- name: Join XConnect One with protected invite file
  block:
    - name: Join the signed XConnect Zero network
      ansible.builtin.shell: >-
        set -eu;
        exec {{ xconnect_one_binary_path | quote }} join
        --state-dir {{ xconnect_one_state_dir | quote }}
        --device-id {{ xconnect_one_device_id | quote }}
        --name {{ xconnect_one_device_name | quote }}
        "$(cat {{ xconnect_one_invite_path | quote }})"
      args:
        executable: /bin/sh
      register: xconnect_one_join
      failed_when: false
      no_log: true

    # The join result stays hidden (it carries the invitation), but its error
    # must not: report the last lines with anything token-shaped redacted.
    - name: Report why the XConnect One join failed
      ansible.builtin.fail:
        msg: >-
          xconnect join failed (rc={{ xconnect_one_join.rc | default('unknown') }}):
          {{ ((xconnect_one_join.stderr_lines | default([])) + (xconnect_one_join.stdout_lines | default([])))[-6:]
             | map('regex_replace', '[A-Za-z0-9+/_=-]{32,}', '<redacted>')
             | map('regex_replace', 'xconnect://[^ ]+', 'xconnect://<redacted>') | list }}
      when: (xconnect_one_join.rc | default(1)) != 0
  always:
    - name: Remove short-lived XConnect One invite file
      ansible.builtin.file:
        path: "{{ xconnect_one_invite_path }}"
        state: absent
      no_log: true
  when: not xconnect_one_existing_state.stat.exists

- name: Synchronize signed XConnect One configuration
  ansible.builtin.command:
    argv:
      - "{{ xconnect_one_binary_path }}"
      - sync
      - --state-dir
      - "{{ xconnect_one_state_dir }}"
  changed_when: false

- name: Verify expected WireGuard interface is active
  ansible.builtin.command: "ip link show {{ xconnect_one_expected_wireguard_interface }}"
  changed_when: false

- name: Verify XConnect One leaves the host default route intact
  ansible.builtin.command: ip route show default
  changed_when: false
  failed_when: false
  register: xconnect_one_default_route

- name: Fail when XConnect One removed the host default route
  ansible.builtin.assert:
    that:
      - xconnect_one_default_route.stdout | trim | length > 0
    fail_msg: XConnect One must only add the declared private overlay route and must not replace the host default route.

- name: Install XConnect One signed-config synchronization service
  ansible.builtin.template:
    src: xconnect-one-sync.service.j2
    dest: "/etc/systemd/system/xconnect-one-sync@{{ xconnect_one_environment }}.service"
    owner: root
    group: root
    mode: '0644'

- name: Install XConnect One signed-config synchronization timer
  ansible.builtin.template:
    src: xconnect-one-sync.timer.j2
    dest: "/etc/systemd/system/xconnect-one-sync@{{ xconnect_one_environment }}.timer"
    owner: root
    group: root
    mode: '0644'

- name: Enable XConnect One signed-config synchronization timer
  ansible.builtin.systemd:
    name: "xconnect-one-sync@{{ xconnect_one_environment }}.timer"
    enabled: true
    state: started
    daemon_reload: true

- name: Install isolated XConnect One observability
  ansible.builtin.include_role:
    name: vhosts/vpn-overlay/observability
  vars:
    xconnect_observability_role: one
    xconnect_observability_environment: "{{ xconnect_one_environment }}"
    xconnect_observability_instance: "{{ xconnect_one_device_id }}"
    xconnect_observability_wireguard_interface: "{{ xconnect_one_expected_wireguard_interface }}"
    xconnect_observability_state_dir: "{{ xconnect_one_state_dir }}"
  when: xconnect_one_install_observability | bool
