---
icewm_desktop_enabled: true
icewm_desktop_remote_enabled: true
icewm_desktop_user: "{{ ansible_user | default('ubuntu') }}"
icewm_desktop_user_password: ""
icewm_desktop_manage_user: true
icewm_desktop_user_groups:
  - sudo

# The default is Google Chrome on amd64. Set this to chromium when the host
# must use distribution packages only (or when it is not amd64).
icewm_desktop_browser: chrome
icewm_desktop_chrome_download_url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
icewm_desktop_chrome_deb_path: /var/cache/ai-desktop/google-chrome-stable_current_amd64.deb
icewm_desktop_chrome_checksum: ""
icewm_desktop_chromium_package: chromium
icewm_desktop_browser_command: ""
icewm_desktop_terminal_command: xfce4-terminal
icewm_desktop_file_manager_command: pcmanfm

icewm_desktop_packages:
  - icewm
  - dbus-x11
  - dbus-user-session
  - polkitd
  - lxpolkit
  - xfce4-notifyd
  - xfce4-terminal
  - pcmanfm
  - xdg-utils
  - xdg-user-dirs
  - fonts-noto-cjk

icewm_desktop_remote_packages:
  - xserver-xorg-core
  - xorgxrdp
  - xrdp
