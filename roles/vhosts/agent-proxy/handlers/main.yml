---
- name: Restart agent-proxy
  ansible.builtin.systemd:
    name: "{{ agent_proxy_service_name }}"
    state: restarted
    daemon_reload: true

- name: Restart Xray services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - xray.service
    - xray-tcp.service
