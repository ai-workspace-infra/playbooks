---
- name: Check installed Xray version
  ansible.builtin.command: "{{ xray_binary_path }} version"
  register: xray_version_check
  changed_when: false
  failed_when: false
  when: xray_enabled | bool

- name: Explain unsupported Xray executable before replacement
  ansible.builtin.debug:
    msg: >-
      Installed Xray cannot execute on {{ ansible_architecture }}; it will be
      replaced with Xray-linux-{{ xray_release_asset_arch }}.zip.
  when:
    - xray_enabled | bool
    - xray_version_check.rc != 0
    - xray_version_check.stderr | default('') | length > 0

- name: Ensure Xray cache directory exists
  ansible.builtin.file:
    path: "{{ xray_release_archive_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Ensure Xray archive extraction prerequisites are installed
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Download pinned Xray release
  ansible.builtin.get_url:
    url: "{{ xray_release_url }}"
    dest: "{{ xray_release_archive_path }}"
    checksum: "sha256:{{ xray_release_sha256 }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 120
  register: xray_release_download
  until: xray_release_download is succeeded
  retries: 3
  delay: 5
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Create temporary Xray extraction directory
  ansible.builtin.file:
    path: "/var/cache/agent-proxy/xray-{{ xray_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Extract pinned Xray release
  ansible.builtin.unarchive:
    src: "{{ xray_release_archive_path }}"
    dest: "/var/cache/agent-proxy/xray-{{ xray_version }}"
    remote_src: true
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Install pinned Xray binary atomically
  ansible.builtin.copy:
    src: "/var/cache/agent-proxy/xray-{{ xray_version }}/xray"
    dest: "{{ xray_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart Xray services
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Validate installed Xray executable for the target architecture
  ansible.builtin.command: "{{ xray_binary_path }} version"
  register: xray_installed_version_check
  changed_when: false
  failed_when:
    - xray_installed_version_check.rc != 0
    - xray_version not in (xray_installed_version_check.stdout | default(''))
  when: xray_enabled | bool

- name: Ensure Xray asset directory exists
  ansible.builtin.file:
    path: "/usr/local/share/xray"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xray_enabled | bool

- name: Install pinned Xray routing assets
  ansible.builtin.copy:
    src: "/var/cache/agent-proxy/xray-{{ xray_version }}/{{ item }}"
    dest: "/usr/local/share/xray/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - geoip.dat
    - geosite.dat
  when:
    - xray_enabled | bool

