---
- name: Require a distinct replacement Xray service identity
  ansible.builtin.assert:
    that:
      - xray_legacy_service_user != xray_xhttp_service_user
    fail_msg: "The legacy Xray account cannot be the active replacement identity."


- name: Read the active Xray service account
  ansible.builtin.command:
    argv: [systemctl, show, xray.service, --property=User, --value]
  register: xray_active_service_user
  changed_when: false

- name: Require Xray active under the replacement identity
  ansible.builtin.assert:
    that:
      - xray_active_service_user.stdout | trim == xray_xhttp_service_user
    fail_msg: "The Xray service did not switch to the declared replacement identity."

- name: Read the active Xray service group
  ansible.builtin.command:
    argv: [systemctl, show, xray.service, --property=Group, --value]
  register: xray_active_service_group
  changed_when: false

- name: Require Xray active under the declared replacement group
  ansible.builtin.assert:
    that:
      - xray_active_service_group.stdout | trim == xray_xhttp_service_group
    fail_msg: "The Xray service did not switch to the declared replacement group."

- name: Read Xray service state after handler completion
  ansible.builtin.command:
    argv: [systemctl, is-active, xray.service]
  register: xray_active_service_state
  changed_when: false

- name: Require Xray service to be active before account cleanup
  ansible.builtin.assert:
    that:
      - xray_active_service_state.stdout | trim == 'active'

- name: Check for running processes owned by the legacy Xray account
  ansible.builtin.command:
    argv: [pgrep, -u, "{{ xray_legacy_service_user }}"]
  register: xray_legacy_processes
  changed_when: false
  failed_when: xray_legacy_processes.rc not in [0, 1]

- name: Require no processes owned by the legacy Xray account
  ansible.builtin.assert:
    that:
      - xray_legacy_processes.rc == 1
    fail_msg: "The legacy Xray account still owns running processes."

- name: Find files outside the legacy home owned by the old Xray account
  ansible.builtin.command:
    argv:
      - find
      - /
      - -path
      - /home/{{ xray_legacy_service_user }}
      - -prune
      - -o
      - -user
      - "{{ xray_legacy_service_user }}"
      - -print
  register: xray_legacy_owned_files
  changed_when: false
  failed_when: xray_legacy_owned_files.rc != 0

- name: Require no legacy-owned files outside the home directory
  ansible.builtin.assert:
    that:
      - xray_legacy_owned_files.stdout_lines | length == 0
    fail_msg: "Legacy-owned files exist outside the account home and require review."

- name: Create protected account backup directory
  ansible.builtin.file:
    path: /var/backups/xray-service-account
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Archive legacy Xray account home before removal
  ansible.builtin.command:
    argv:
      - tar
      - --numeric-owner
      - -czf
      - /var/backups/xray-service-account/{{ xray_legacy_service_user }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz
      - -C
      - /home
      - "{{ xray_legacy_service_user }}"
  args:
    creates: /var/backups/xray-service-account/{{ xray_legacy_service_user }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz

- name: Verify legacy account archive exists and is nonempty
  ansible.builtin.stat:
    path: /var/backups/xray-service-account/{{ xray_legacy_service_user }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz
  register: xray_legacy_home_archive

- name: Require a complete legacy account archive before removal
  ansible.builtin.assert:
    that:
      - xray_legacy_home_archive.stat.exists
      - xray_legacy_home_archive.stat.size | int > 0

- name: Remove legacy Xray account from the shared access group
  ansible.builtin.command:
    argv:
      - gpasswd
      - -d
      - "{{ xray_legacy_service_user }}"
      - "{{ xray_access_log_group }}"
  register: xray_legacy_group_removal
  changed_when: xray_legacy_group_removal.rc == 0
  failed_when: xray_legacy_group_removal.rc not in [0, 3]

- name: Remove the retired Xray service account and home
  ansible.builtin.user:
    name: "{{ xray_legacy_service_user }}"
    state: absent
    remove: true
