---
- name: Validate requested Agent Proxy operation
  ansible.builtin.assert:
    that:
      - agent_proxy_operation in ['deploy', 'standalone', 'upgrade', 'print-arch']
    fail_msg: "agent_proxy_operation must be deploy, standalone, upgrade, or print-arch."

- name: Deploy a controller-managed XConnect node
  ansible.builtin.import_tasks: deploy.yml
  when: agent_proxy_operation == 'deploy'
  tags: [install, configure, validate]

- name: Deploy standalone Caddy and Xray services
  ansible.builtin.import_tasks: standalone.yml
  when: agent_proxy_operation == 'standalone'
  tags: [install, configure, validate]

- name: Upgrade Agent and Xray binaries without changing configuration
  ansible.builtin.import_tasks: upgrade.yml
  when: agent_proxy_operation == 'upgrade'
  tags: [install, validate]

- name: Report target binary architecture
  ansible.builtin.import_tasks: print_arch.yml
  when: agent_proxy_operation == 'print-arch'
  tags: [validate]
