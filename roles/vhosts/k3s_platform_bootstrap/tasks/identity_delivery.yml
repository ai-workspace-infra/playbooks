- name: Require explicit identity delivery contract
  ansible.builtin.assert:
    that:
      - k3s_identity_environment in ['sit', 'uat', 'prod']
      - k3s_identity_cluster is match('^[a-z0-9][a-z0-9-]*$')
      - k3s_identity_api_server is match('^https://')
      - k3s_identity_tls_dir | length > 0
      - k3s_identity_state_dir is match("^/[^.]+$")
      - k3s_identity_checks.keys() | list | sort == ["auditor", "operator", "root"]
      - k3s_identity_checks | length > 0
    fail_msg: Identity delivery requires a reviewed target, CA and real-identity acceptance contract

- name: Read actual cluster identity before credential delivery
  ansible.builtin.command:
    argv: [kubectl, get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  register: k3s_identity_actual_uid
  changed_when: false

- name: Require nonempty actual cluster identity
  ansible.builtin.assert:
    that: k3s_identity_actual_uid.stdout | trim | length > 0

- name: Bind newly initialized cluster UID from the actual API
  ansible.builtin.set_fact:
    k3s_identity_cluster_uid: '{{ k3s_identity_actual_uid.stdout }}'
  when: k3s_identity_cluster_uid | default('') | length == 0

- name: Verify cluster identity binding
  ansible.builtin.assert:
    that: k3s_identity_actual_uid.stdout == k3s_identity_cluster_uid

- name: Require actual allow and deny cases for each role
  ansible.builtin.assert:
    that:
      - k3s_identity_checks[item] | selectattr('allowed', 'equalto', true) | list | length > 0
      - k3s_identity_checks[item] | selectattr('allowed', 'equalto', false) | list | length > 0
  loop: [root, operator, auditor]

- name: Install master-local credential generator
  ansible.builtin.copy:
    src: bootstrap_k3s_identity_keys.py
    dest: "{{ k3s_platform_install_dir }}/bootstrap_k3s_identity_keys.py"
    owner: root
    group: root
    mode: '0700'

- name: Generate verify and archive independent client credentials on master
  ansible.builtin.command:
    argv:
      - python3
      - "{{ k3s_platform_install_dir }}/bootstrap_k3s_identity_keys.py"
      - --environment
      - "{{ k3s_identity_environment }}"
      - --cluster
      - "{{ k3s_identity_cluster }}"
      - --cluster-uid
      - "{{ k3s_identity_cluster_uid }}"
      - --api-server
      - "{{ k3s_identity_api_server }}"
      - --admin-kubeconfig
      - "{{ k3s_platform_kubeconfig_path }}"
      - --client-ca
      - "{{ k3s_identity_tls_dir }}/client-ca.crt"
      - --client-ca-key
      - "{{ k3s_identity_tls_dir }}/client-ca.key"
      - --server-ca
      - "{{ k3s_identity_tls_dir }}/server-ca.crt"
      - --state-dir
      - "{{ k3s_identity_state_dir }}"
      - --days
      - "{{ k3s_identity_certificate_days | string }}"
  environment:
    VAULT_ADDR: "{{ lookup('env', 'VAULT_ADDR') }}"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  register: k3s_identity_generation
  changed_when: (k3s_identity_generation.stdout | from_json).created | length > 0
  no_log: true

- name: Deliver each independently authenticated identity
  ansible.builtin.include_tasks: identity_user.yml
  loop: [root, operator, auditor]
  loop_control:
    loop_var: k3s_identity_role
