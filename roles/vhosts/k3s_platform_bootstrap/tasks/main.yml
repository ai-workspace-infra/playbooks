- name: Validate bootstrap inputs
  ansible.builtin.assert:
    that:
      - k3s_platform_git_url | length > 0
      - k3s_platform_git_commit | length > 0 or k3s_platform_git_branch | length > 0
      - k3s_platform_git_commit | length == 0 or k3s_platform_git_commit is match("^[0-9a-f]{40}$")
      - k3s_platform_flux_root_path | length > 0
      - not (k3s_platform_require_data_mount | bool) or (common_node_bootstrap_evidence | default({})).get('result') == 'COMMON_NODE_VERIFIED'
      - k3s_platform_flux_bootstrap_mode in ['generated', 'declarative_paused', 'declarative_active']
      - k3s_platform_git_auth_mode | default('public') | lower in ['public', 'ssh', 'https-basic', 'https-bearer', '']
    fail_msg: "k3s platform bootstrap requires git url, branch, root path, and a supported git auth mode."

- name: Prepare immutable paused GitOps declarations before host changes
  when: k3s_platform_flux_bootstrap_mode in ['declarative_paused', 'declarative_active']
  block:
    - name: Require fixed checkout and staged receipt semantics
      ansible.builtin.assert:
        that:
          - k3s_platform_gitops_checkout_path | length > 0
          - k3s_platform_git_commit is match('^[0-9a-f]{40}$')
          - not (k3s_platform_strict_dev_receipt | bool)
        fail_msg: Paused bootstrap requires an immutable checkout and cannot claim Ready reconciliation

    - name: Validate and render the declared Flux tree on the controller
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/stage_flux_declarations.py"
          - --checkout
          - "{{ k3s_platform_gitops_checkout_path }}"
          - --commit
          - "{{ k3s_platform_git_commit }}"
          - --root-path
          - "{{ k3s_platform_flux_root_path }}"
          - --root-name
          - "{{ k3s_platform_flux_root_name }}"
          - --source
          - "{{ k3s_platform_flux_source_name }}"
          - --namespace
          - "{{ k3s_platform_flux_namespace }}"
          - --git-url
          - "{{ k3s_platform_git_url }}"
          - --state
          - "{{ 'active' if k3s_platform_flux_bootstrap_mode == 'declarative_active' else 'paused' }}"
      delegate_to: localhost
      become: false
      changed_when: false
      register: k3s_platform_paused_declarations

- name: Resolve flux git auth inputs
  ansible.builtin.set_fact:
    k3s_platform_git_auth_mode_effective: "{{ (k3s_platform_git_auth_mode | default('public')) | lower | trim }}"
  no_log: true

- name: Resolve SSH git private key when needed
  ansible.builtin.set_fact:
    k3s_platform_git_private_key_resolved: >-
      {{
        k3s_platform_git_private_key
        if (k3s_platform_git_auth_mode_effective == 'ssh' and k3s_platform_git_private_key | default('') | length > 0)
        else (
          lookup('ansible.builtin.file', k3s_platform_git_private_key_path) | trim
          if (k3s_platform_git_auth_mode_effective == 'ssh')
          else ''
        )
      }}
  no_log: true

- name: Assert SSH auth material is available
  ansible.builtin.assert:
    that:
      - k3s_platform_git_private_key_resolved | length > 0
    fail_msg: "SSH auth requires a git deploy key content or readable key path."
  when:
    - k3s_platform_git_auth_mode_effective == 'ssh'

- name: Assert HTTPS basic auth material is available
  ansible.builtin.assert:
    that:
      - k3s_platform_git_http_username | default('') | length > 0
      - k3s_platform_git_http_password | default('') | length > 0
    fail_msg: "HTTPS basic auth requires username and password/token."
  when:
    - k3s_platform_git_auth_mode_effective == 'https-basic'

- name: Assert HTTPS bearer auth material is available
  ansible.builtin.assert:
    that:
      - k3s_platform_git_bearer_token | default('') | length > 0
    fail_msg: "HTTPS bearer auth requires a bearer token."
  when:
    - k3s_platform_git_auth_mode_effective == 'https-bearer'

- name: Normalize public git auth mode
  ansible.builtin.set_fact:
    k3s_platform_git_auth_mode_effective: public
  when:
    - k3s_platform_git_auth_mode_effective in ['', 'public', 'none']

- name: Install bootstrap dependencies
  ansible.builtin.package:
    name:
      - curl
      - git
      - openssh-client
      - ca-certificates
      - python3-pip
      - tar
    state: present

- name: Ensure cloud-init configuration directory exists
  ansible.builtin.file:
    path: /etc/cloud/cloud.cfg.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Preserve the configured node hostname across cloud-init runs
  ansible.builtin.copy:
    content: "preserve_hostname: true\n"
    dest: /etc/cloud/cloud.cfg.d/99-k3s-platform-hostname.cfg
    owner: root
    group: root
    mode: "0644"
  when: not (k3s_platform_require_data_mount | bool)

- name: Set host hostname to the configured K3s node identity
  ansible.builtin.hostname:
    name: "{{ k3s_platform_node_name }}"
  when: not (k3s_platform_require_data_mount | bool)

- name: Remove explicitly retired hostnames from local hosts entries
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "(^|\\s){{ item | regex_escape }}(\\s|$)"
    state: absent
  loop: "{{ k3s_platform_retired_hostnames }}"
  when: not (k3s_platform_require_data_mount | bool)

- name: Set local loopback mapping for the configured K3s node identity
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ k3s_platform_node_name }} {{ k3s_platform_node_name }}.svc.plus"
    state: present
  when: not (k3s_platform_require_data_mount | bool)

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_platform_k3s_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ k3s_platform_install_dir }}"
    state: directory
    mode: "0755"

- name: Bind K3s to the verified independent data mount
  ansible.builtin.include_tasks: data_mount.yml
  when: k3s_platform_require_data_mount | bool

- name: Render k3s config
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: "{{ k3s_platform_k3s_config_path }}"
    mode: "0644"

- name: Check whether k3s is already installed
  ansible.builtin.shell: |
    set -euo pipefail
    if { [ -x /usr/local/bin/k3s ] || [ -x /usr/bin/k3s ]; } && [ -f /etc/systemd/system/k3s.service ]; then
      echo "installed"
      exit 0
    fi
    echo "missing"
  args:
    executable: /bin/bash
  register: k3s_platform_k3s_install_state
  changed_when: false

- name: Download k3s installer script
  ansible.builtin.shell: |
    set -euo pipefail
    if [ "{{ k3s_platform_k3s_install_state.stdout | default('missing') }}" = "installed" ]; then
      exit 0
    fi
    echo "[k3s-bootstrap] downloading installer from {{ k3s_platform_k3s_install_script_url }}"
    rm -f "{{ k3s_platform_k3s_install_script_path }}"
    curl -fL \
      --retry 5 \
      --retry-all-errors \
      --connect-timeout 15 \
      --max-time 1800 \
      -o "{{ k3s_platform_k3s_install_script_path }}" \
      "{{ k3s_platform_k3s_install_script_url }}"
    chmod 0755 "{{ k3s_platform_k3s_install_script_path }}"
  args:
    executable: /bin/bash
  when:
    - k3s_platform_k3s_install_state.stdout | default('missing') != 'installed'

- name: Run k3s installer script
  ansible.builtin.shell: |
    set -euo pipefail
    if [ "{{ k3s_platform_k3s_install_state.stdout | default('missing') }}" = "installed" ]; then
      exit 0
    fi
    echo "[k3s-bootstrap] starting installer at $(date -Is)"
    bash -x "{{ k3s_platform_k3s_install_script_path }}" \
      2>&1 | tee "{{ k3s_platform_k3s_install_log_path }}"
    echo "[k3s-bootstrap] finished installer at $(date -Is)"
  args:
    executable: /bin/bash
  async: "{{ k3s_platform_k3s_install_timeout_seconds }}"
  poll: 15
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_platform_k3s_version }}"
  when:
    - k3s_platform_k3s_install_state.stdout | default('missing') != 'installed'

- name: Wait for k3s binary and unit file to appear
  ansible.builtin.shell: |
    set -euo pipefail
    for attempt in $(seq 1 30); do
      k3s_state="missing"
      unit_state="missing"
      if command -v k3s >/dev/null 2>&1; then
        k3s_state="present"
      fi
      if [ -f /etc/systemd/system/k3s.service ]; then
        unit_state="present"
      fi
      echo "[k3s-bootstrap] wait ${attempt}/30: k3s=${k3s_state}, unit=${unit_state}"
      if [ "${k3s_state}" = "present" ] && [ "${unit_state}" = "present" ]; then
        echo "[k3s-bootstrap] k3s binary and unit file detected"
        exit 0
      fi
      sleep 2
    done
    echo "[k3s-bootstrap] timed out waiting for k3s binary and unit file" >&2
    exit 1
  args:
    executable: /bin/bash

- name: Reload systemd after k3s install
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure k3s service is enabled and started
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Install helm
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v helm >/dev/null 2>&1; then
      exit 0
    fi
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
      | DESIRED_VERSION="{{ k3s_platform_helm_version }}" bash
  args:
    executable: /bin/bash

- name: Install flux cli
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v flux >/dev/null 2>&1; then
      exit 0
    fi
    curl -fsSL https://fluxcd.io/install.sh \
      | FLUX_VERSION="{{ k3s_platform_flux_version }}" bash
  args:
    executable: /bin/bash

- name: Ensure flux namespace exists
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k3s_platform_kubeconfig_path }}"
    kubectl get namespace "{{ k3s_platform_flux_namespace }}" >/dev/null 2>&1 || kubectl create namespace "{{ k3s_platform_flux_namespace }}"
  args:
    executable: /bin/bash

- name: Install flux controllers
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k3s_platform_kubeconfig_path }}"
    flux install --namespace "{{ k3s_platform_flux_namespace }}"
  args:
    executable: /bin/bash

- name: Wait for flux controllers to become ready
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k3s_platform_kubeconfig_path }}"
    kubectl -n "{{ k3s_platform_flux_namespace }}" rollout status deployment/source-controller --timeout=300s
    kubectl -n "{{ k3s_platform_flux_namespace }}" rollout status deployment/kustomize-controller --timeout=300s
    kubectl -n "{{ k3s_platform_flux_namespace }}" rollout status deployment/helm-controller --timeout=300s
    kubectl -n "{{ k3s_platform_flux_namespace }}" rollout status deployment/notification-controller --timeout=300s
  args:
    executable: /bin/bash

- name: Wait for Kubernetes API to become ready for bootstrap resources
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k3s_platform_kubeconfig_path }}"
    kubectl get --raw=/readyz >/dev/null
  args:
    executable: /bin/bash
  register: k3s_platform_apiserver_ready
  changed_when: false
  retries: 24
  delay: 5
  until: k3s_platform_apiserver_ready.rc == 0

- name: Check paused cluster before modifying Flux authentication
  when: k3s_platform_flux_bootstrap_mode == 'declarative_paused'
  block:
    - name: Inspect existing Flux resources before staged bootstrap
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - gitrepositories.source.toolkit.fluxcd.io,kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io
          - --all-namespaces
          - -o
          - json
      environment:
        KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
      changed_when: false
      register: k3s_platform_existing_flux

    - name: Refuse to restage any active Flux resources
      ansible.builtin.assert:
        that:
          - item.spec.suspend | default(false) | bool
        fail_msg: Staged bootstrap is for an empty or already paused cluster; active resources require their normal release path
      loop: "{{ (k3s_platform_existing_flux.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"

- name: Render flux bootstrap env file
  ansible.builtin.template:
    src: flux-bootstrap.env.j2
    dest: /tmp/flux-bootstrap.env
    mode: "0600"

- name: Write flux git private key file
  ansible.builtin.copy:
    content: "{{ k3s_platform_git_private_key_resolved }}\n"
    dest: /tmp/flux-git-deploy.key
    mode: "0600"
  no_log: true
  when:
    - k3s_platform_git_auth_mode_effective == 'ssh'

- name: Write flux git public key file when provided
  ansible.builtin.copy:
    content: "{{ k3s_platform_git_public_key }}\n"
    dest: /tmp/flux-git-deploy.pub
    mode: "0644"
  when:
    - k3s_platform_git_public_key | length > 0
    - k3s_platform_git_auth_mode_effective == 'ssh'

- name: Remove flux git auth secret for public repositories
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ k3s_platform_flux_namespace }}"
      - delete
      - secret
      - "{{ k3s_platform_flux_source_name }}"
      - --ignore-not-found
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  when:
    - k3s_platform_git_auth_mode_effective in ['public', 'none', '']

- name: Create or update flux git auth secret with SSH
  ansible.builtin.shell: |
    set -euo pipefail
    . /tmp/flux-bootstrap.env
    flux create secret git "${GIT_SOURCE_NAME}" \
      --url="${GIT_URL}" \
      --private-key-file=/tmp/flux-git-deploy.key \
      --namespace="${FLUX_NAMESPACE}" \
      --export | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  no_log: true
  when:
    - k3s_platform_git_auth_mode_effective == 'ssh'

- name: Create or update flux git auth secret with HTTPS basic auth
  ansible.builtin.shell: |
    set -euo pipefail
    . /tmp/flux-bootstrap.env
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Secret
    metadata:
      name: ${GIT_SOURCE_NAME}
      namespace: ${FLUX_NAMESPACE}
    type: Opaque
    stringData:
      username: {{ k3s_platform_git_http_username | to_json }}
      password: {{ k3s_platform_git_http_password | to_json }}
    EOF
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  no_log: true
  when:
    - k3s_platform_git_auth_mode_effective == 'https-basic'

- name: Create or update flux git auth secret with HTTPS bearer token
  ansible.builtin.shell: |
    set -euo pipefail
    . /tmp/flux-bootstrap.env
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Secret
    metadata:
      name: ${GIT_SOURCE_NAME}
      namespace: ${FLUX_NAMESPACE}
    type: Opaque
    stringData:
      bearerToken: {{ k3s_platform_git_bearer_token | to_json }}
    EOF
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  no_log: true
  when:
    - k3s_platform_git_auth_mode_effective == 'https-bearer'

- name: Apply root Flux source and kustomization
  when: k3s_platform_flux_bootstrap_mode == 'generated'
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k3s_platform_kubeconfig_path }}"
    . /tmp/flux-bootstrap.env
    if [ "{{ k3s_platform_git_auth_mode_effective }}" = "public" ] || [ "{{ k3s_platform_git_auth_mode_effective }}" = "none" ] || [ -z "{{ k3s_platform_git_auth_mode_effective }}" ]; then
      SECRET_REF_BLOCK=""
    else
      SECRET_REF_BLOCK="      secretRef:\n        name: ${GIT_SOURCE_NAME}\n"
    fi
    cat <<EOF | kubectl apply -f -
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    metadata:
      name: ${GIT_SOURCE_NAME}
      namespace: ${FLUX_NAMESPACE}
    spec:
      interval: 1m0s
      url: ${GIT_URL}
      ref:
    {% if k3s_platform_git_commit | length > 0 %}
        commit: {{ k3s_platform_git_commit }}
    {% else %}
        branch: ${GIT_BRANCH}
    {% endif %}
    ${SECRET_REF_BLOCK}
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: {{ k3s_platform_flux_root_name }}
      namespace: ${FLUX_NAMESPACE}
    spec:
      interval: 5m0s
      sourceRef:
        kind: GitRepository
        name: ${GIT_SOURCE_NAME}
      path: ${FLUX_ROOT_PATH}
      prune: true
      wait: true
      timeout: 5m0s
    EOF
  args:
    executable: /bin/bash

- name: Apply unified paused declarations without reconciliation
  when: k3s_platform_flux_bootstrap_mode == 'declarative_paused'
  block:
    - name: Copy validated declaration bundle to target
      ansible.builtin.copy:
        content: "{{ k3s_platform_paused_declarations.stdout }}\n"
        dest: /tmp/flux-bootstrap-declarations.yaml
        mode: "0600"

    - name: Load paused source root child Kustomizations and HelmReleases
      ansible.builtin.command:
        argv: [kubectl, apply, -f, /tmp/flux-bootstrap-declarations.yaml]
      environment:
        KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"

- name: Establish independent audit access for the fresh cluster
  ansible.builtin.include_tasks: audit_identity.yml
  when: k3s_platform_require_data_mount | bool

- name: Hand active declarations to Flux without applying business workloads
  when: k3s_platform_flux_bootstrap_mode == 'declarative_active'
  block:
    - name: Install active bootstrap entrypoint and verifier
      ansible.builtin.copy:
        src: active_flux_bootstrap.py
        dest: "{{ k3s_platform_install_dir }}/active_flux_bootstrap.py"
        mode: '0700'
    - name: Copy the validated full graph for local entrypoint selection
      ansible.builtin.copy:
        content: "{{ k3s_platform_paused_declarations.stdout }}\n"
        dest: /tmp/flux-bootstrap-declarations.yaml
        mode: '0600'
    - name: Apply source and root then verify Flux handover
      ansible.builtin.command:
        argv:
          - python3
          - "{{ k3s_platform_install_dir }}/active_flux_bootstrap.py"
          - --bundle
          - /tmp/flux-bootstrap-declarations.yaml
          - --root
          - "{{ k3s_platform_flux_root_name }}"
          - --source
          - "{{ k3s_platform_flux_source_name }}"
          - --namespace
          - "{{ k3s_platform_flux_namespace }}"
          - --node
          - "{{ k3s_platform_node_name }}"
          - --version
          - "{{ k3s_platform_k3s_version }}"
          - --commit
          - "{{ k3s_platform_git_commit }}"
          - --volume-uuid
          - "{{ web_saas_data_evidence.filesystem_uuid }}"
      environment:
        KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
      register: k3s_platform_active_receipt
    - name: Save Flux handover evidence separately from service acceptance
      ansible.builtin.copy:
        content: "{{ (k3s_platform_active_receipt.stdout | from_json) | combine({'audit': (k3s_platform_audit_evidence.stdout | from_json), 'common': common_node_bootstrap_evidence}) | to_json }}\n"
        dest: "{{ k3s_platform_receipt_path }}"
        mode: '0600'
      delegate_to: localhost
      become: false

- name: Verify paused declarations against actual cluster resources
  when: k3s_platform_flux_bootstrap_mode == 'declarative_paused'
  block:
    - name: Install paused state verifier
      ansible.builtin.copy:
        src: verify_paused_bootstrap.py
        dest: "{{ k3s_platform_install_dir }}/verify_paused_bootstrap.py"
        mode: '0700'
    - name: Verify node identity mount and exact paused resource graph
      ansible.builtin.command:
        argv:
          - python3
          - "{{ k3s_platform_install_dir }}/verify_paused_bootstrap.py"
          - --bundle
          - /tmp/flux-bootstrap-declarations.yaml
          - --node
          - "{{ k3s_platform_node_name }}"
          - --version
          - "{{ k3s_platform_k3s_version }}"
          - --commit
          - "{{ k3s_platform_git_commit }}"
          - --volume-uuid
          - "{{ web_saas_data_evidence.filesystem_uuid }}"
      environment:
        KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
      register: k3s_platform_paused_receipt
      changed_when: false
    - name: Retain public paused bootstrap evidence on controller
      ansible.builtin.copy:
        content: "{{ (k3s_platform_paused_receipt.stdout | from_json) | combine({'audit': (k3s_platform_audit_evidence.stdout | default('{}') | from_json), 'common': (common_node_bootstrap_evidence | default({}))}) | to_json }}\n"
        dest: "{{ k3s_platform_receipt_path }}"
        mode: '0600'
      delegate_to: localhost
      become: false
      when: k3s_platform_receipt_path | length > 0

- name: Install bounded bootstrap receipt verifier
  ansible.builtin.copy:
    src: verify_bootstrap.py
    dest: "{{ k3s_platform_install_dir }}/verify_bootstrap.py"
    owner: root
    group: root
    mode: "0700"
  when: k3s_platform_strict_dev_receipt | bool

- name: Reconcile root Flux source synchronously
  when: k3s_platform_flux_bootstrap_mode == 'generated'
  ansible.builtin.command:
    argv:
      - flux
      - reconcile
      - source
      - git
      - "{{ k3s_platform_flux_source_name }}"
      - --namespace
      - "{{ k3s_platform_flux_namespace }}"
      - --timeout=5m
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  changed_when: true

- name: Reconcile root Flux kustomization synchronously
  when: k3s_platform_flux_bootstrap_mode == 'generated'
  ansible.builtin.command:
    argv:
      - flux
      - reconcile
      - kustomization
      - "{{ k3s_platform_flux_root_name }}"
      - --namespace
      - "{{ k3s_platform_flux_namespace }}"
      - --with-source
      - --timeout=10m
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  changed_when: true

- name: Verify actual node cluster and observed Flux revision
  ansible.builtin.command:
    argv:
      - python3
      - "{{ k3s_platform_install_dir }}/verify_bootstrap.py"
      - --node
      - "{{ k3s_platform_node_name | default(inventory_hostname) }}"
      - --namespace
      - "{{ k3s_platform_flux_namespace }}"
      - --source
      - "{{ k3s_platform_flux_source_name }}"
      - --root-name
      - "{{ k3s_platform_flux_root_name }}"
      - --commit
      - "{{ k3s_platform_git_commit }}"
      - --version
      - "{{ k3s_platform_k3s_version }}"
      - --architecture
      - "{{ k3s_platform_expected_architecture }}"
      - --timeout
      - "{{ k3s_platform_ready_timeout | string }}"
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  register: k3s_platform_verified_receipt
  changed_when: false
  when: k3s_platform_strict_dev_receipt | bool

- name: Save verified public bootstrap receipt on controller
  ansible.builtin.copy:
    content: "{{ k3s_platform_verified_receipt.stdout }}\n"
    dest: "{{ k3s_platform_receipt_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  when:
    - k3s_platform_strict_dev_receipt | bool
    - k3s_platform_receipt_path | length > 0

- name: Remove temporary K3s and Flux bootstrap files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ k3s_platform_k3s_install_script_path }}"
    - "{{ k3s_platform_k3s_install_log_path }}"
    - /tmp/flux-bootstrap.env
    - /tmp/flux-bootstrap-declarations.yaml
    - /tmp/flux-git-deploy.key
    - /tmp/flux-git-deploy.pub
    - /tmp/v6-audit-rbac.yaml

- name: Initialize OS-linked Kubernetes identities and verify real credentials
  ansible.builtin.include_tasks: identity_delivery.yml
  when: k3s_identity_enabled | bool
