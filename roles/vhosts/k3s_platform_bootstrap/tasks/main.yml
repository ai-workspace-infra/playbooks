# This role owns only the dependency order; execution belongs to the component roles.
- name: Validate GitOps declarations before changing the host
  ansible.builtin.import_role:
    name: vhosts/flux_gitops
    tasks_from: preflight.yml

- name: Validate identity inputs before changing the host
  ansible.builtin.import_role:
    name: vhosts/k3s_identity
    tasks_from: preflight.yml
  when: k3s_identity_enabled | bool

- name: Initialize the Kubernetes control plane
  ansible.builtin.import_role:
    name: vhosts/k3s-cluster-server

- name: Prepare the declared Helm client
  ansible.builtin.import_role:
    name: vhosts/helm_cli

- name: Initialize Flux controllers
  ansible.builtin.import_role:
    name: vhosts/flux_controllers

- name: Hand reviewed declarations to Flux
  ansible.builtin.import_role:
    name: vhosts/flux_gitops

- name: Initialize and verify independent Kubernetes identities
  ansible.builtin.import_role:
    name: vhosts/k3s_identity
  when: k3s_identity_enabled | bool

- name: Observe declared Flux workload readiness
  ansible.builtin.import_role:
    name: vhosts/flux_workload_readiness
  when: k3s_platform_acceptance_objects | default([]) | length > 0
