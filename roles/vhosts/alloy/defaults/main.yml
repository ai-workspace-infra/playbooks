# Default variables for alloy
alloy_config_path: "/etc/alloy/config.alloy"
alloy_allow_duplicate_collector: false

grafana_gpg_key_url: "https://apt.grafana.com/gpg.key"
grafana_apt_source: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"

alloy_metrics_endpoint_url: "https://observability.svc.plus/ingest/metrics/api/v1/write"
alloy_logs_endpoint_url: "https://observability.svc.plus/ingest/logs/insert/loki/api/v1/push"
alloy_traces_endpoint_url: "https://observability.svc.plus/ingest/otlp"
loki_endpoint_url: "{{ alloy_logs_endpoint_url }}"

alloy_basic_auth_username: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_AUTH_USER') | default(lookup('ansible.builtin.env', 'VECTOR_AUTH_USER'), true) }}"
alloy_basic_auth_password: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_AUTH_PASSWORD') | default(lookup('ansible.builtin.env', 'VECTOR_AUTH_PASSWORD'), true) }}"
loki_basic_auth_username: "{{ alloy_basic_auth_username }}"
loki_basic_auth_password: "{{ alloy_basic_auth_password }}"

alloy_tls_insecure_skip_verify: false
alloy_scrape_interval: "15s"
alloy_node_exporter_enabled: true
alloy_node_exporter_address: "127.0.0.1:9100"
alloy_process_exporter_enabled: true
alloy_process_exporter_address: "127.0.0.1:9256"

alloy_environment: "{{ environment | default(cmdb_environment | default('production', true), true) }}"
alloy_provider: "{{ cloud_provider | default(provider | default(cmdb_provider | default('unknown', true), true), true) }}"
alloy_project_id: "{{ project_id | default(cmdb_project_id | default(alloy_provider, true), true) }}"
alloy_region: "{{ region | default(cmdb_region | default('unknown', true), true) }}"
alloy_instance: "{{ inventory_hostname | default('localhost', true) }}"
alloy_resource_id: "{{ resource_id | default(cmdb_resource_id | default(alloy_instance, true), true) }}"
alloy_runtime_form: "{{ runtime_form | default(cmdb_runtime_form | default('systemd', true), true) }}"
alloy_resource_key: "{{ resource_key | default(cmdb_resource_key | default(alloy_provider ~ ':' ~ alloy_project_id ~ ':' ~ alloy_region ~ ':' ~ alloy_resource_id, true), true) }}"

loki_journal_sources: []

