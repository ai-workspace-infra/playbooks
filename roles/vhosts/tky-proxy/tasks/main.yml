---
- name: Verify Vault-restored public TLS material is available
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ agent_tls_source_cert_path }}"
    - "{{ agent_tls_source_key_path }}"
  register: agent_tls_source_files

- name: Require Vault-restored public TLS material before configuring Caddy
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.size | int > 0
    fail_msg: >-
      Vault-restored TLS material {{ item.item }} is missing. Refusing to fall
      back to ACME for agent-proxy; restore the web-saas domain certificate
      first so repeated rebuilds do not consume ACME issuance quota.
  loop: "{{ agent_tls_source_files.results }}"

- name: Ensure agent-proxy Caddy TLS directory exists
  ansible.builtin.file:
    path: "{{ agent_proxy_caddy_config_dir }}/tls"
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"

- name: Stop legacy XConnect gateway before Caddy claims HTTPS
  ansible.builtin.systemd:
    name: xconnect-gateway-xray.service
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - tky_proxy_disable_legacy_xconnect_gateway | bool
    - ansible_facts.services is defined
    - "'xconnect-gateway-xray.service' in ansible_facts.services"

- name: Stage Vault-restored certificate for the system Caddy user
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: caddy
    group: caddy
    mode: "{{ item.mode }}"
  loop:
    - src: "{{ agent_tls_source_cert_path }}"
      dest: "{{ agent_tls_cert_path }}"
      mode: "0644"
    - src: "{{ agent_tls_source_key_path }}"
      dest: "{{ agent_tls_key_path }}"
      mode: "0640"

- name: Ensure Caddy conf.d directory exists
  ansible.builtin.file:
    path: "{{ agent_proxy_caddy_conf_dir }}"
    state: directory
    mode: '0755'

- name: Configure Agent Proxy root Caddyfile
  ansible.builtin.template:
    src: agent-proxy.Caddyfile.j2
    dest: "{{ agent_proxy_caddy_config_dir }}/Caddyfile"
    mode: '0644'
  notify:
    - Restart caddy

- name: Configure Caddy for agent proxy domains in conf.d
  ansible.builtin.assert:
    that:
      - agent_proxy_domains | default([]) | length == 1
      - (agent_proxy_domains | first) | length > 0
    fail_msg: "Agent Proxy requires exactly one canonical node domain; legacy aliases are unsupported."

- name: Configure Caddy for the canonical node domain in conf.d
  ansible.builtin.template:
    src: agent-proxy.conf.j2
    dest: "{{ agent_proxy_caddy_conf_dir }}/{{ agent_proxy_domains | first }}.caddy"
    mode: '0644'
  notify:
    - Restart caddy

- name: Remove legacy Agent Proxy Caddy fragments
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ agent_proxy_caddy_conf_dir }}/agent-proxy.caddy"
    - "{{ agent_proxy_caddy_conf_dir }}/tky-proxy.caddy"
    - "{{ agent_proxy_caddy_conf_dir }}/tky-proxy.conf"
    - "{{ agent_proxy_caddy_conf_dir }}/tky-proxy-svc-plus.caddy"
  notify:
    - Restart caddy

- name: Remove canonical fragments for domains no longer assigned to this node
  ansible.builtin.find:
    paths: "{{ agent_proxy_caddy_conf_dir }}"
    patterns: "*.caddy"
    excludes:
      - "{{ agent_proxy_domains | first }}.caddy"
      - "00-logging.caddy"
  register: agent_proxy_stale_domain_fragments

- name: Delete stale canonical domain fragments
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ agent_proxy_stale_domain_fragments.files }}"
  notify:
    - Restart caddy

- name: Remove unmanaged Caddy logging fragment now defined in the root Caddyfile
  ansible.builtin.file:
    path: "{{ agent_proxy_caddy_conf_dir }}/00-logging.caddy"
    state: absent
  notify:
    - Restart caddy

- name: Validate composed Agent Proxy Caddy configuration
  ansible.builtin.command:
    cmd: >-
      caddy validate --config {{ agent_proxy_caddy_config_dir }}/Caddyfile
      --adapter caddyfile
  changed_when: false
