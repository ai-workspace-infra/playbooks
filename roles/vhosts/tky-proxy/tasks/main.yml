---
- name: Verify Vault-restored public TLS material is available
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ agent_tls_source_cert_path }}"
    - "{{ agent_tls_source_key_path }}"
  register: agent_tls_source_files

- name: Require Vault-restored public TLS material before configuring Caddy
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.size | int > 0
    fail_msg: >-
      Vault-restored TLS material {{ item.item }} is missing. Refusing to fall
      back to ACME for agent-proxy; restore the web-saas domain certificate
      first so repeated rebuilds do not consume ACME issuance quota.
  loop: "{{ agent_tls_source_files.results }}"

- name: Ensure agent-proxy Caddy TLS directory exists
  ansible.builtin.file:
    path: /etc/caddy/tls
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"

- name: Stage Vault-restored certificate for the system Caddy user
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: caddy
    group: caddy
    mode: "{{ item.mode }}"
  loop:
    - src: "{{ agent_tls_source_cert_path }}"
      dest: "{{ agent_tls_cert_path }}"
      mode: "0644"
    - src: "{{ agent_tls_source_key_path }}"
      dest: "{{ agent_tls_key_path }}"
      mode: "0640"

- name: Ensure Caddy conf.d directory exists
  ansible.builtin.file:
    path: /etc/caddy/conf.d
    state: directory
    mode: '0755'

- name: Configure Agent Proxy root Caddyfile
  ansible.builtin.template:
    src: agent-proxy.Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
  notify:
    - Restart caddy

- name: Configure Caddy for agent proxy domains in conf.d
  ansible.builtin.template:
    src: agent-proxy.conf.j2
    dest: /etc/caddy/conf.d/agent-proxy.caddy
    mode: '0644'
  notify:
    - Restart caddy

- name: Configure legacy Agent Proxy Caddy fragment when explicitly enabled
  ansible.builtin.template:
    src: agent-proxy.conf.j2
    dest: /etc/caddy/conf.d/tky-proxy.caddy
    mode: '0644'
  vars:
    agent_proxy_domains:
      - "{{ agent_proxy_legacy_domain }}"
  when:
    - agent_proxy_legacy_domain | default('') | length > 0
    - agent_proxy_legacy_domain not in (agent_proxy_primary_domains | default([]))
  notify:
    - Restart caddy

- name: Remove legacy Agent Proxy Caddy fragment when not configured
  ansible.builtin.file:
    path: /etc/caddy/conf.d/tky-proxy.caddy
    state: absent
  when: agent_proxy_legacy_domain | default('') | length == 0
  notify:
    - Restart caddy

- name: Remove obsolete legacy Agent Proxy Caddy configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/caddy/conf.d/tky-proxy.conf
    # Older releases used this generated filename; remove it before creating
    # the explicit compatibility fragment to avoid duplicate site addresses.
    - /etc/caddy/conf.d/tky-proxy-svc-plus.caddy
  notify:
    - Restart caddy

- name: Validate composed Agent Proxy Caddy configuration
  ansible.builtin.command:
    cmd: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  changed_when: false
