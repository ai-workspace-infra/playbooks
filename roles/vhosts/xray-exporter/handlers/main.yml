---
- name: Restart xray-exporters
  ansible.builtin.systemd:
    name: "{{ xray_exporter_instance.name }}"
    state: restarted
    daemon_reload: true
  loop: "{{ xray_exporter_instances }}"
  loop_control:
    loop_var: xray_exporter_instance
    label: "{{ xray_exporter_instance.name }}"

- name: Restart Xray services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - xray.service
    - xray-tcp.service
