---
- name: Determine architecture
  ansible.builtin.set_fact:
    xray_exporter_arch: >-
      {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}

- name: Download primary xray-exporter binary
  ansible.builtin.get_url:
    url: "https://github.com/{{ xray_exporter_release_repository }}/releases/download/{{ xray_exporter_version }}/xray-exporter-linux-{{ xray_exporter_arch }}"
    dest: "{{ xray_exporter_binary_path }}"
    mode: '0755'
    owner: "{{ xray_exporter_user }}"
    group: "{{ xray_exporter_group }}"
  register: xray_exporter_primary_download
  ignore_errors: true
  notify: Restart xray-exporters

- name: Download fallback xray-exporter binary if primary release asset is unavailable
  ansible.builtin.get_url:
    url: "https://github.com/{{ xray_exporter_fallback_release_repository | default('compassvpn/xray-exporter') }}/releases/download/{{ xray_exporter_fallback_version | default('v0.6.0') }}/xray-exporter-linux-{{ xray_exporter_arch }}"
    dest: "{{ xray_exporter_binary_path }}"
    mode: '0755'
    owner: "{{ xray_exporter_user }}"
    group: "{{ xray_exporter_group }}"
  register: xray_exporter_fallback_download
  when: xray_exporter_primary_download is failed
  ignore_errors: true
  notify: Restart xray-exporters

- name: Verify xray-exporter binary presence
  ansible.builtin.stat:
    path: "{{ xray_exporter_binary_path }}"
  register: xray_exporter_binary_stat
  failed_when: not xray_exporter_binary_stat.stat.exists

- name: Ensure xray-exporter snapshot store directory exists
  ansible.builtin.file:
    path: "{{ xray_exporter_snapshot_store_dir }}"
    state: directory
    owner: "{{ xray_exporter_user }}"
    group: "{{ xray_exporter_group }}"
    mode: "0750"

- name: Render xray-exporter runtime environment
  ansible.builtin.template:
    src: xray-exporter.env.j2
    dest: "{{ xray_exporter_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart xray-exporters

- name: Stop and disable legacy xray-exporter services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ xray_exporter_legacy_service_names }}"
  failed_when: false

- name: Remove legacy xray-exporter service files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service"
    state: absent
  loop: "{{ xray_exporter_legacy_service_names }}"
  notify: Restart xray-exporters

- name: Remove immutable flag from existing service file if it exists
  ansible.builtin.command: "chattr -i /etc/systemd/system/{{ xray_exporter_instance.name }}.service"
  loop: "{{ xray_exporter_instances }}"
  loop_control:
    loop_var: xray_exporter_instance
    label: "{{ xray_exporter_instance.name }}"
  failed_when: false
  changed_when: false


- name: Install xray-exporter systemd service
  ansible.builtin.template:
    src: xray-exporter.service.j2
    dest: "/etc/systemd/system/{{ xray_exporter_instance.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ xray_exporter_instances }}"
  loop_control:
    loop_var: xray_exporter_instance
    label: "{{ xray_exporter_instance.name }}"
  notify: Restart xray-exporters

- name: Enable and start xray-exporter instances
  ansible.builtin.systemd:
    name: "{{ xray_exporter_instance.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ xray_exporter_instances }}"
  loop_control:
    loop_var: xray_exporter_instance
    label: "{{ xray_exporter_instance.name }}"
