---
- name: Require Xray metrics repair certificate domain
  ansible.builtin.assert:
    that:
      - xray_exporter_tcp_certificate_domain | trim | length > 0
    fail_msg: >-
      xray_exporter_tcp_certificate_domain must be set when
      xray_exporter_repair_xray_services_enabled=true.
  when: xray_exporter_repair_xray_services_enabled | bool

- name: Verify Xray metrics repair certificate files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ xray_exporter_tcp_certificate_file }}"
    - "{{ xray_exporter_tcp_key_file }}"
  register: xray_exporter_repair_certificates
  when: xray_exporter_repair_xray_services_enabled | bool

- name: Require Xray metrics repair certificate files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Required Xray TLS file is missing: {{ item.item }}"
  loop: "{{ xray_exporter_repair_certificates.results | default([]) }}"
  when: xray_exporter_repair_xray_services_enabled | bool

- name: Repair Xray metrics API ports and TCP certificate atomically
  ansible.builtin.script: >-
    {{ role_path }}/files/patch_xray_metrics.py
    --xhttp-config {{ xray_exporter_xray_config_path }}
    --tcp-config {{ xray_exporter_tcp_xray_config_path }}
    --xray-binary {{ xray_exporter_xray_binary_path }}
    --xhttp-api-port {{ xray_exporter_xray_api_port }}
    --tcp-api-port {{ xray_exporter_tcp_xray_api_port }}
    --tcp-certificate-file {{ xray_exporter_tcp_certificate_file }}
    --tcp-key-file {{ xray_exporter_tcp_key_file }}
  register: xray_exporter_repair
  changed_when: "'No changes required' not in xray_exporter_repair.stdout"
  notify: Restart Xray services
  when: xray_exporter_repair_xray_services_enabled | bool

- name: Apply Xray service repair before starting exporter
  ansible.builtin.meta: flush_handlers

- name: Determine architecture
  ansible.builtin.set_fact:
    xray_exporter_arch: >-
      {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}

- name: Download xray-exporter binary
  ansible.builtin.get_url:
    url: "https://github.com/{{ xray_exporter_release_repository }}/releases/download/{{ xray_exporter_version }}/xray-exporter-linux-{{ xray_exporter_arch }}"
    dest: "{{ xray_exporter_binary_path }}"
    mode: '0755'
    owner: "{{ xray_exporter_user }}"
    group: "{{ xray_exporter_group }}"
  notify: Restart xray-exporters

- name: Ensure xray-exporter snapshot store directory exists
  ansible.builtin.file:
    path: "{{ xray_exporter_snapshot_store_dir }}"
    state: directory
    owner: "{{ xray_exporter_user }}"
    group: "{{ xray_exporter_group }}"
    mode: "0750"

- name: Preserve shared Xray access log permissions if present
  ansible.builtin.file:
    path: "{{ xray_exporter_log_path }}"
    group: "{{ xray_exporter_log_group }}"
    mode: "0660"
  when:
    - xray_exporter_log_path is defined
    - xray_exporter_log_path | length > 0
  failed_when: false

- name: Render xray-exporter runtime environment
  ansible.builtin.template:
    src: xray-exporter.env.j2
    dest: "{{ xray_exporter_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart xray-exporters

- name: Validate Vector snapshot handoff for Xray exporters
  ansible.builtin.assert:
    that:
      - xray_exporter_vector_snapshot_url | trim == 'http://127.0.0.1:8686'
    fail_msg: >-
      Xray exporter snapshot handoff must target Vector at
      http://127.0.0.1:8686 on Agent Proxy hosts; got
      {{ xray_exporter_vector_snapshot_url | default('') }}.
  when: xray_exporter_snapshot_features_enabled | bool

- name: Stop and disable legacy xray-exporter services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ xray_exporter_legacy_service_names }}"
  failed_when: false

- name: Remove legacy xray-exporter service files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service"
    state: absent
  loop: "{{ xray_exporter_legacy_service_names }}"
  notify: Restart xray-exporters

- name: Remove immutable flag from existing service file if it exists
  ansible.builtin.command: "chattr -i /etc/systemd/system/{{ xray_exporter_instance.name }}.service"
  loop: "{{ xray_exporter_instances }}"
  loop_control:
    loop_var: xray_exporter_instance
    label: "{{ xray_exporter_instance.name }}"
  failed_when: false
  changed_when: false


- name: Install xray-exporter systemd service
  ansible.builtin.template:
    src: xray-exporter.service.j2
    dest: "/etc/systemd/system/{{ xray_exporter_instance.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ xray_exporter_instances }}"
  loop_control:
    loop_var: xray_exporter_instance
    label: "{{ xray_exporter_instance.name }}"
  notify: Restart xray-exporters

- name: Enable and start xray-exporter instances
  ansible.builtin.systemd:
    name: "{{ xray_exporter_instance.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ xray_exporter_instances }}"
  loop_control:
    loop_var: xray_exporter_instance
    label: "{{ xray_exporter_instance.name }}"
