---
- name: Inspect the existing Exporter environment
  ansible.builtin.stat:
    path: '{{ xray_exporter_env_file }}'
    follow: false
  register: snapshot_repair_file

- name: Reject absent or indirect environment targets
  ansible.builtin.assert:
    that:
      - snapshot_repair_file.stat.isreg | default(false)
      - not (snapshot_repair_file.stat.islnk | default(false))
      - snapshot_repair_file.stat.mode == '0600'

- name: Require the existing Exporter instances to be running before repair
  ansible.builtin.command:
    argv: [systemctl, is-active, '{{ item.name }}']
  loop: '{{ xray_exporter_instances }}'
  loop_control:
    label: '{{ item.name }}'
  changed_when: false

- name: Read the existing snapshot handoff without exposing credentials
  ansible.builtin.slurp:
    src: '{{ xray_exporter_env_file }}'
  register: snapshot_repair_environment
  no_log: true

- name: Require an existing Vector-only snapshot configuration
  ansible.builtin.assert:
    that:
      - (snapshot_repair_environment.content | b64decode | regex_findall('(?m)^INTERNAL_SERVICE_TOKEN=.*$') | length) == 1
      - (snapshot_repair_environment.content | b64decode) is search('(?m)^VECTOR_SNAPSHOT_URL="?http://127\.0\.0\.1:8686"?\s*$')
      - canonical_internal_service_token is match('^[A-Za-z0-9._~+/=-]{32,}$')
  no_log: true

- name: Bind only the canonical snapshot credential
  ansible.builtin.lineinfile:
    path: '{{ xray_exporter_env_file }}'
    regexp: '^INTERNAL_SERVICE_TOKEN='
    line: 'INTERNAL_SERVICE_TOKEN={{ canonical_internal_service_token }}'
    owner: root
    group: root
    mode: '0600'
    backup: true
  no_log: true
  register: snapshot_repair_bound

- name: Reload only the two Exporter processes when their credential changed
  ansible.builtin.systemd:
    name: '{{ item.name }}'
    state: restarted
  loop: '{{ xray_exporter_instances }}'
  loop_control:
    label: '{{ item.name }}'
  when: snapshot_repair_bound.changed

- name: Verify authenticated snapshots from each existing Exporter
  ansible.builtin.uri:
    url: 'http://{{ item.listen_addr }}/v1/snapshots/latest'
    headers:
      Authorization: 'Bearer {{ canonical_internal_service_token }}'
    return_content: true
    status_code: 200
  loop: '{{ xray_exporter_instances }}'
  loop_control:
    label: '{{ item.name }}'
  register: snapshot_repair_probe
  no_log: true
  retries: 12
  delay: 5
  until:
    - snapshot_repair_probe.json.collected_at is defined
    - ((now(utc=true).strftime('%Y-%m-%dT%H:%M:%S') | to_datetime('%Y-%m-%dT%H:%M:%S')) - (snapshot_repair_probe.json.collected_at[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))).total_seconds() <= 120
    - ((now(utc=true).strftime('%Y-%m-%dT%H:%M:%S') | to_datetime('%Y-%m-%dT%H:%M:%S')) - (snapshot_repair_probe.json.collected_at[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))).total_seconds() >= -5

- name: Report only safe snapshot metadata
  ansible.builtin.debug:
    msg:
      unit: '{{ item.item.name }}'
      collected_at: '{{ item.json.collected_at }}'
      node_id: '{{ item.json.node_id }}'
      samples: '{{ item.json.samples | default([], true) | length }}'
      total_counter: '{{ (item.json.samples | default([], true) | map(attribute="uplink_bytes_total") | sum) + (item.json.samples | default([], true) | map(attribute="downlink_bytes_total") | sum) }}'
  loop: '{{ snapshot_repair_probe.results }}'
  loop_control:
    label: '{{ item.item.name }}'
