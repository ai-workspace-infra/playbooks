---
# 这个角色只负责 web-saas 那套 compose 栈的**主机侧**输入: 机密、配置、
# 证书。compose 文件本身不在这里 —— 它在 ai-workspace-infra/gitops 的
# compose/web-saas/, 由 Doco-CD 拉取。
#
# 分工的判据是"谁来管版本": 镜像 tag 由 git 追踪(gitops 仓 .env.<env>),
# 口令与证书由 Vault 追踪。两者混在一起就会出现"改个 tag 要动证书"或者
# "证书轮换触发一次业务发布"。
# 数据库口令从 Vault 取, 与 create_databases_and_users.yml 建角色时用的是
# 同一个 secret 的同一个 key。此前这里独立读环境变量, 同一口令因此有两条
# 来源, 一旦不一致 postgres 与容器就各持一份。环境变量保留为显式覆盖(临时
# 排障用), 但不再是默认路径。
web_saas_host_config_vault_addr: >-
  {{ lookup('ansible.builtin.env', 'VAULT_ADDR')
     | default('https://vault.svc.plus', true) }}
web_saas_host_config_vault_token: >-
  {{ lookup('ansible.builtin.env', 'VAULT_SERVER_ROOT_ACCESS_TOKEN')
     | default(lookup('ansible.builtin.env', 'VAULT_TOKEN'), true) }}
web_saas_host_config_vault_env_path: >-
  {{ lookup('ansible.builtin.env', 'VAULT_ENV_PATH') | default('uat', true) }}

# 业务库的专用角色。accounts 与 billing 都用它 —— 没有理由让任何业务服务
# 拿 postgres 超级用户连库。
web_saas_host_config_account_pg_user: >-
  {{ lookup('ansible.builtin.env', 'ACCOUNT_PG_USER') | default('account_user', true) }}

# Vault 是事实源; 只有显式设置了环境变量才覆盖它。
web_saas_host_config_account_pg_password: >-
  {{ lookup('ansible.builtin.env', 'ACCOUNT_PG_PASSWORD')
     | default((web_saas_host_config_vault_databases.secret | default({}))
               .get('account_pg_password', ''), true) }}
web_saas_host_config_postgres_root_password: >-
  {{ lookup('ansible.builtin.env', 'WEB_SAAS_POSTGRES_PASSWORD')
     | default((web_saas_host_config_vault_databases.secret | default({}))
               .get('postgres_root_password', ''), true) }}

web_saas_host_config_base_dir: /etc/xcontrol/web-saas
web_saas_host_config_config_dir: "{{ web_saas_host_config_base_dir }}/config"
web_saas_host_config_certs_dir: "{{ web_saas_host_config_base_dir }}/certs"
web_saas_host_config_secrets_file: "{{ web_saas_host_config_base_dir }}/secrets.env"
web_saas_host_config_caddyfile: "{{ web_saas_host_config_base_dir }}/Caddyfile"
# Caddy 单独一个 env 文件, 不共用 secrets.env。secrets.env 被 postgres /
# accounts / billing / console 四个服务同时 env_file 引用, 而 Cloudflare DNS
# token 能改整个 zone 的解析 —— 没有理由让业务容器拿到它。这里按最小权限
# 单独发一份, gitops 侧只把它挂给 caddy。
web_saas_host_config_caddy_env_file: "{{ web_saas_host_config_base_dir }}/caddy.env"

# 必须与 gitops 仓 compose/web-saas/docker-compose.yml 的 networks 块一致。
web_saas_host_config_shared_network: docker_shared_network
# postgres 与 stunnel-server 之间的专用网络。compose 把它声明为
# external: true —— 只有 stunnel-server 同时接入两张网, 业务服务够不到
# postgres, 必须走 TLS 隧道。external 意味着 compose 不会创建它, 缺失时
# 部署直接失败, 所以这里负责建。
web_saas_host_config_postgres_network: docker_web_saas_postgres_network

# compose 栈里 stunnel-server 对外暴露的 TLS 端口。
web_saas_host_config_stunnel_accept_port: 15433
web_saas_host_config_stunnel_service_name: postgres-tls-server
# stunnel-client 连的是 compose 网络内的服务名, 不是主机地址。
web_saas_host_config_stunnel_client_connect_host: stunnel-server
# 15432 是应用侧 stunnel-client 端口；15433 是 stunnel-server 的 TLS 端口。
web_saas_host_config_stunnel_client_accept_port: 15432
web_saas_host_config_stunnel_check_host: ""

# 对外站点。console 与 accounts 共用一台主机, 由 Caddy 按域名分流。
web_saas_host_config_console_domain: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_CONSOLE_DOMAIN') | default('', true) }}"
web_saas_host_config_accounts_domain: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_ACCOUNTS_DOMAIN') | default('', true) }}"
# Billing 的 job trigger 入口只给 agent-proxy 使用。它不是用户面板 API；
# 没有同时提供域名和允许访问的 agent CIDR 时不渲染站点，避免误把
# /v1/jobs/* 暴露到公网。
web_saas_host_config_billing_domain: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_BILLING_DOMAIN') | default('', true) }}"
web_saas_host_config_billing_allowed_cidrs: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_BILLING_ALLOWED_CIDRS') | default('', true) }}"

# Cloudflare DNS API token, 用于 ACME DNS-01。给了它就走 DNS-01 + 泛域名证书,
# 没给就退回原来的 HTTP-01 逐域名签发。
#
# 为什么要 DNS-01: web-saas 的交付顺序是"先部署新主机、最后才切 DNS", 而
# HTTP-01 要求域名 A 记录已经指向本机 —— 切换之前必然签不出证书。DNS-01 不看
# A 记录, 还能签泛域名: 一张 *.<base> 覆盖 console/accounts/postgresql-saas
# 所有子域, 每次重建的签发次数从 3 张降到 1 张。
#
# 注意 Let's Encrypt 的"同一组域名 5 次/周"仍然成立, 泛域名只是把分母变小;
# 真正做到无限次重建要靠证书持久化(平台侧从 Vault 恢复 caddy_data)。
web_saas_host_config_cloudflare_dns_api_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_DNS_API_TOKEN') | default('', true) }}"
web_saas_host_config_acme_dns_enabled: "{{ (web_saas_host_config_cloudflare_dns_api_token | trim | length > 0) }}"

# 泛域名从 console 域名推导: console-uat.onwalk.net -> *.onwalk.net。
# 允许显式覆盖, 以防将来 console 与 accounts 不在同一个 zone。
web_saas_host_config_wildcard_domain: >-
  {{ lookup('ansible.builtin.env', 'WEB_SAAS_WILDCARD_DOMAIN') | default('', true)
     or ('*.' ~ (web_saas_host_config_console_domain.split('.')[1:] | join('.'))) }}

# 平台侧从 Vault 恢复下来的泛域名证书落盘位置(见 platform-ops-toolkit 的
# platform-ops_deploy_base_restore-caddy-certs.sh 的 DOMAIN_TLS_DIR)。
#
# 只要这两个文件在, Caddy 就直接用它们提供 TLS, 完全不碰 ACME —— 这才是
# "泛域名证书在有效期内可以无限次复用"真正落地的地方。在此之前, 恢复步骤
# 把证书写到了磁盘上, 而 Caddyfile 仍然渲染成 ACME 模式, 于是证书躺在那里
# 没人用, Caddy 照旧去签、照旧撞 429(2026-07-31 run 30623661870 就是如此:
# 日志显示 "Reusing backed-up certificates ... 88 day(s) left", 主机上
# /etc/xcontrol/tls/onwalk.net/current/ 五个文件俱全, 而 caddy_data 里一张
# 证书都没有)。
web_saas_host_config_domain_tls_dir: >-
  {{ lookup('ansible.builtin.env', 'DOMAIN_TLS_DIR') | default('', true)
     or ('/etc/xcontrol/tls/' ~ (web_saas_host_config_console_domain.split('.')[1:] | join('.'))) }}
web_saas_host_config_domain_tls_fullchain: "{{ web_saas_host_config_domain_tls_dir }}/current/fullchain.pem"
web_saas_host_config_domain_tls_key: "{{ web_saas_host_config_domain_tls_dir }}/current/key.pem"

# 机密。全部来自环境变量, 由流水线经 Vault OIDC 注入 —— 角色自己不连
# Vault, 也不在仓库里保存任何默认值。缺失时由 tasks 里的断言明确报错,
# 而不是渲染出一个空口令让 postgres 起来却谁也连不上。
web_saas_host_config_secrets:
  POSTGRES_USER: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_POSTGRES_USER') | default('postgres', true) }}"
  POSTGRES_PASSWORD: "{{ web_saas_host_config_postgres_root_password }}"
  POSTGRES_DB: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_POSTGRES_DB') | default('postgres', true) }}"

  # accounts system admin bootstrap credential. The value is owned by
  # kv/data/CICD and injected by the platform-ops workflow.
  ROOT_BOOTSTRAP_PASSWORD: "{{ lookup('ansible.builtin.env', 'ROOT_BOOTSTRAP_PASSWORD') | default('', true) }}"

  ACCOUNT_PG_USER: "{{ web_saas_host_config_account_pg_user }}"
  ACCOUNT_PG_PASSWORD: "{{ web_saas_host_config_account_pg_password }}"
  # Billing and Accounts use the same account database/role. Keep the
  # legacy variable name for compose compatibility, but never source a
  # separate billing credential by default.
  BILLING_DB_PASSWORD: "{{ web_saas_host_config_account_pg_password }}"

  # accounts 与 billing 都经 stunnel-client 连库, 所以 host 是容器名。
  DATABASE_URL: "postgres://{{ web_saas_host_config_account_pg_user }}:{{ web_saas_host_config_account_pg_password }}@stunnel-client:15432/account?sslmode=disable"

  AUTH_TOKEN_PUBLIC_TOKEN: "{{ lookup('ansible.builtin.env', 'AUTH_TOKEN_PUBLIC_TOKEN') | default('', true) }}"
  AUTH_TOKEN_REFRESH_SECRET: "{{ lookup('ansible.builtin.env', 'AUTH_TOKEN_REFRESH_SECRET') | default('', true) }}"
  AUTH_TOKEN_ACCESS_SECRET: "{{ lookup('ansible.builtin.env', 'AUTH_TOKEN_ACCESS_SECRET') | default('', true) }}"

  GITHUB_CLIENT_ID: "{{ lookup('ansible.builtin.env', 'OAUTH_GITHUB_CLIENT_ID') | default('', true) }}"
  GITHUB_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'OAUTH_GITHUB_CLIENT_SECRET') | default('', true) }}"
  GOOGLE_CLIENT_ID: "{{ lookup('ansible.builtin.env', 'OAUTH_GOOGLE_CLIENT_ID') | default('', true) }}"
  GOOGLE_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'OAUTH_GOOGLE_CLIENT_SECRET') | default('', true) }}"

  INTERNAL_SERVICE_TOKEN: "{{ lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') | default('', true) }}"

  # Stripe 密钥归 Vault kv/billing-service, 与本角色其余密钥不同源 ——
  # 那个 KV 是计费域专用, 按 SANDBOX_/PROD_ 前缀存两套。留空时 accounts
  # 自己的 stripe 客户端会软性 disabled(见 accounts api/stripe.go
  # enabled()), 不阻塞其余服务启动, 所以不放进下面的 required_secrets。
  STRIPE_SECRET_KEY: "{{ lookup('ansible.builtin.env', 'STRIPE_SECRET_KEY') | default('', true) }}"
  STRIPE_WEBHOOK_SECRET: "{{ lookup('ansible.builtin.env', 'STRIPE_WEBHOOK_SECRET') | default('', true) }}"

  # Billing must receive its exporter source list from the deployment
  # environment. Keeping this in the host-rendered env file allows UAT to
  # point at one or more remote agent-proxy exporters without baking topology
  # into the GitOps compose file.
  EXPORTER_BASE_URL: "{{ lookup('ansible.builtin.env', 'EXPORTER_BASE_URL') | default('', true) }}"
  EXPORTER_SOURCES_JSON: "{{ lookup('ansible.builtin.env', 'EXPORTER_SOURCES_JSON') | default('', true) }}"
  BILLING_INGEST_MODE: "{{ lookup('ansible.builtin.env', 'BILLING_INGEST_MODE') | default('push', true) }}"

  ACCOUNT_SERVICE_URL: "{{ lookup('ansible.builtin.env', 'ACCOUNT_SERVICE_URL') | default('https://' ~ web_saas_host_config_accounts_domain, true) }}"
  NEXT_PUBLIC_ACCOUNT_SERVICE_URL: "{{ lookup('ansible.builtin.env', 'NEXT_PUBLIC_ACCOUNT_SERVICE_URL') | default('https://' ~ web_saas_host_config_accounts_domain, true) }}"
  SERVER_SERVICE_URL: "{{ lookup('ansible.builtin.env', 'SERVER_SERVICE_URL') | default('https://' ~ web_saas_host_config_console_domain ~ '/api', true) }}"
  NEXT_PUBLIC_SERVER_SERVICE_URL: "{{ lookup('ansible.builtin.env', 'NEXT_PUBLIC_SERVER_SERVICE_URL') | default('https://' ~ web_saas_host_config_console_domain ~ '/api', true) }}"

# 这些键为空就让部署失败。它们不是"可选配置", 是没有就跑不起来的东西 ——
# 空口令会让 postgres 正常启动、accounts 正常启动, 然后在第一次登录时才
# 暴露问题, 那时 job 早已报绿。
web_saas_host_config_required_secrets:
  - POSTGRES_PASSWORD
  - ROOT_BOOTSTRAP_PASSWORD
  - ACCOUNT_PG_PASSWORD
  - AUTH_TOKEN_PUBLIC_TOKEN
  - AUTH_TOKEN_REFRESH_SECRET
  - AUTH_TOKEN_ACCESS_SECRET

# TLS 证书。stunnel 用自签 CA, 三份 PEM 由流水线从 Vault 取出后经环境
# 变量传入(base64, 避免换行在 env 里被破坏)。
web_saas_host_config_ca_cert_b64: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_STUNNEL_CA_CERT_B64') | default('', true) }}"
web_saas_host_config_server_cert_b64: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_STUNNEL_SERVER_CERT_B64') | default('', true) }}"
web_saas_host_config_server_key_b64: "{{ lookup('ansible.builtin.env', 'WEB_SAAS_STUNNEL_SERVER_KEY_B64') | default('', true) }}"

web_saas_host_config_postgres_conf:
  listen_addresses: "*"
  port: 5432
  max_connections: 100
  shared_buffers: 256MB
  effective_cache_size: 1GB
  maintenance_work_mem: 64MB
  work_mem: 16MB
  wal_buffers: 16MB
  min_wal_size: 1GB
  max_wal_size: 4GB
  checkpoint_completion_target: 0.9
  random_page_cost: 1.1
  log_destination: stderr
  log_line_prefix: "%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
  log_timezone: UTC
  log_min_duration_statement: 1000
  timezone: UTC
