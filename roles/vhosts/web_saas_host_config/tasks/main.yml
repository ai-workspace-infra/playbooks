---
# 数据库口令的唯一事实源是 Vault kv/data/<env>/databases —— 与
# create_databases_and_users.yml 建角色时读的是同一个 secret 的同一个 key。
#
# 在此之前这里只读环境变量, 于是同一个口令有两条互不相干的来源: 角色密码
# 来自 playbook 读的 Vault, secrets.env 来自 workflow 传进来的环境变量。
# 两者一旦不一致, postgres 与容器就会各持一份, 而且症状被 pg_hba 的
# "127.0.0.1 trust" 掩盖 —— 本机检查全绿, 应用经 stunnel 走 scram 才失败。
#
# 读取失败不在这里终止: 下面的必填断言会因为空值而失败, 那里的报错更具体。
- name: Read web-saas database credentials from Vault
  community.hashi_vault.vault_kv2_get:
    url: "{{ web_saas_host_config_vault_addr }}"
    auth_method: token
    token: "{{ web_saas_host_config_vault_token }}"
    path: "{{ web_saas_host_config_vault_env_path }}/databases"
    engine_mount_point: "kv"
  register: web_saas_host_config_vault_databases
  failed_when: false
  no_log: true
  when: web_saas_host_config_vault_token | trim | length > 0

- name: Warn when the Vault databases secret could not be read
  ansible.builtin.debug:
    msg: >-
      Vault read of kv/data/{{ web_saas_host_config_vault_env_path }}/databases
      returned nothing; database credentials fall back to environment
      variables. If those are also empty the required-secret assertion below
      fails rather than rendering an env file that starts and then breaks at
      first use.
  when:
    - web_saas_host_config_vault_token | trim | length > 0
    - (web_saas_host_config_vault_databases.secret | default({})) | length == 0

# 断言放在最前面。这些值缺失时下游不会崩 —— postgres 会带着空口令正常
# 启动, accounts 会正常监听, 部署报绿, 直到有人第一次尝试登录才发现。
# 那正是这条交付链一直在对付的静默失败, 所以这里必须先失败。
- name: Assert required web-saas secrets are present
  ansible.builtin.assert:
    that:
      - web_saas_host_config_secrets[item] | default('') | trim | length > 0
    fail_msg: >-
      {{ item }} is empty. It is injected from Vault by the delivery pipeline;
      an empty value would deploy a stack that starts cleanly and then fails
      at first use.
  loop: "{{ web_saas_host_config_required_secrets }}"
  no_log: true

- name: Assert stunnel TLS material is present
  ansible.builtin.assert:
    that:
      - web_saas_host_config_ca_cert_b64 | trim | length > 0
      - web_saas_host_config_server_cert_b64 | trim | length > 0
      - web_saas_host_config_server_key_b64 | trim | length > 0
    fail_msg: >-
      WEB_SAAS_STUNNEL_{CA_CERT,SERVER_CERT,SERVER_KEY}_B64 must all be set.
      Without them the compose stack mounts three nonexistent paths, which
      docker turns into empty directories rather than an error.
  no_log: true

- name: Assert public domains are set
  ansible.builtin.assert:
    that:
      - web_saas_host_config_console_domain | trim | length > 0
      - web_saas_host_config_accounts_domain | trim | length > 0
    fail_msg: >-
      WEB_SAAS_CONSOLE_DOMAIN and WEB_SAAS_ACCOUNTS_DOMAIN must be set —
      Caddy needs them to request certificates and to route by host.

- name: Report Billing external ingress mode
  ansible.builtin.debug:
    msg: >-
      Billing external ingress:
      {{ 'enabled for ' ~ web_saas_host_config_billing_domain ~ ', allowed CIDRs ' ~ web_saas_host_config_billing_allowed_cidrs
         if (web_saas_host_config_billing_domain | trim | length > 0 and web_saas_host_config_billing_allowed_cidrs | trim | length > 0)
         else 'disabled — WEB_SAAS_BILLING_DOMAIN and WEB_SAAS_BILLING_ALLOWED_CIDRS are both required' }}

- name: Ensure web-saas host config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ web_saas_host_config_base_dir }}"
    - "{{ web_saas_host_config_config_dir }}"

# 证书目录比其余部分严格一格: 里面有私钥。
- name: Ensure web-saas certs directory exists
  ansible.builtin.file:
    path: "{{ web_saas_host_config_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render web-saas secrets env file
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ web_saas_host_config_secrets_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write stunnel TLS material
  ansible.builtin.copy:
    content: "{{ item.value | b64decode }}"
    dest: "{{ web_saas_host_config_certs_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {name: ca-cert.pem, value: "{{ web_saas_host_config_ca_cert_b64 }}", mode: "0644"}
    - {name: server-cert.pem, value: "{{ web_saas_host_config_server_cert_b64 }}", mode: "0644"}
    - {name: server-key.pem, value: "{{ web_saas_host_config_server_key_b64 }}", mode: "0600"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Render web-saas config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ web_saas_host_config_config_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: postgresql.conf.j2, dest: postgresql.conf}
    - {src: stunnel-server.conf.j2, dest: stunnel-server.conf}
    - {src: stunnel-client.conf.j2, dest: stunnel-client.conf}
    - {src: account.yaml.j2, dest: account.yaml}
  loop_control:
    label: "{{ item.dest }}"

# 平台侧的证书恢复步骤排在本 role 之前, 所以这里能看到它落下来的文件。
# 两个都在才算数: 只有证书没有私钥(或反过来)时 Caddy 起不来, 而那种半截状态
# 应该退回 ACME, 而不是渲染出一份指向缺失文件的配置。
- name: Check for a restored wildcard certificate on disk
  ansible.builtin.stat:
    path: "{{ item }}"
  register: web_saas_host_config_restored_tls
  loop:
    - "{{ web_saas_host_config_domain_tls_fullchain }}"
    - "{{ web_saas_host_config_domain_tls_key }}"
  loop_control:
    label: "{{ item }}"

- name: Decide how Caddy obtains TLS
  ansible.builtin.set_fact:
    web_saas_host_config_use_restored_tls: >-
      {{ web_saas_host_config_restored_tls.results
         | map(attribute='stat.exists') | select | list | length == 2 }}

- name: Render web-saas Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ web_saas_host_config_caddyfile }}"
    owner: root
    group: root
    mode: "0644"
  # Caddy 只在启动时读配置; 改了文件不重启, 容器会一直跑旧的那份。
  notify: web-saas caddy config changed

# 0600 而不是 Caddyfile 的 0644: 这里面是一个能改整个 zone 解析的 token。
- name: Render Caddy env file (Cloudflare DNS token)
  ansible.builtin.template:
    src: caddy.env.j2
    dest: "{{ web_saas_host_config_caddy_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  # token 也是启动时读进进程环境的, 换了同样要重启才生效。
  notify: web-saas caddy config changed

# 走 DNS-01 时把模式和泛域名打出来。签发模式是"证书为什么签不出来"排查的
# 第一个岔路口, 而它由一个 token 在不在悄悄决定 —— 不打出来的话, 现场只能
# 看到"没有证书", 看不出它当时到底在试哪条路。
- name: Report ACME issuance mode
  ansible.builtin.debug:
    msg: >-
      web-saas Caddy ACME mode:
      {{ 'DNS-01 (cloudflare), wildcard ' ~ web_saas_host_config_wildcard_domain
         if (web_saas_host_config_acme_dns_enabled | bool)
         else 'HTTP-01 per-domain (CLOUDFLARE_DNS_API_TOKEN not set) — requires DNS to already point here' }}

# 预先建好共享网络并保持幂等, 让它的存在不依赖某一次 compose 的执行顺序。
# 用 command 而非 community.docker.docker_network: 那个集合本仓从未使用,
# 也没有 requirements.yml 声明它, 引入等于给每台 controller 加一个装不上
# 就静默换路径的依赖。
# 两张网都必须在 compose 之前存在: compose 里它们都是 external: true,
# 意味着 compose 不会创建、只会查找, 缺失时整个 stack 部署失败。
- name: Check for the required Docker networks
  ansible.builtin.command: docker network inspect "{{ item }}"
  register: web_saas_host_config_network_inspect
  changed_when: false
  failed_when: false
  loop:
    - "{{ web_saas_host_config_shared_network }}"
    - "{{ web_saas_host_config_postgres_network }}"

- name: Create the required Docker networks when missing
  ansible.builtin.command: docker network create "{{ item.item }}"
  when: item.rc != 0
  loop: "{{ web_saas_host_config_network_inspect.results }}"
  loop_control:
    label: "{{ item.item }}"
