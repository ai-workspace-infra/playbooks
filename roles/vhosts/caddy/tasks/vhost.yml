---
- name: Ensure target Caddy vhost config is not immutable
  ansible.builtin.command:
    argv:
      - chattr
      - -i
      - "{{ caddy_config_dir | default('/etc/caddy', true) }}/conf.d/{{ caddy_vhost_name | default('jp-xconnect') }}.caddy"
  failed_when: false
  changed_when: false
  become: true

- name: Resolve effective Caddy vhosts list
  ansible.builtin.set_fact:
    caddy_resolved_vhosts: >-
      {{ (caddy_vhosts if (caddy_vhosts is iterable and caddy_vhosts is not string) else (caddy_vhosts.split() if caddy_vhosts is string else []))
         | reject('equalto', '') | unique | list }}

- name: Render Caddy vhost configuration fragment
  ansible.builtin.template:
    src: "{{ caddy_vhost_template | default('xconnect.conf.j2') }}"
    dest: "{{ caddy_config_dir | default('/etc/caddy', true) }}/conf.d/{{ caddy_vhost_name | default('jp-xconnect') }}.caddy"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload caddy
