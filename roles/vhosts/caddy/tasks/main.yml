---
# Pure Caddy reverse proxy engine role.
# Can be freely composed with vhost providers (e.g. xconnect_gateway, gitea, etc.)
- name: Check and install Caddy package
  ansible.builtin.include_tasks: install.yml
  when: caddy_enabled | default(true) | bool

- name: Configure Caddy directories and root Caddyfile
  ansible.builtin.include_tasks: configure.yml
  when: caddy_enabled | default(true) | bool

- name: Ensure Caddy systemd service is active
  ansible.builtin.include_tasks: service.yml
  when: caddy_enabled | default(true) | bool

- name: Configure Caddy Prometheus metrics
  ansible.builtin.include_tasks: metrics.yml
  when:
    - caddy_enabled | default(true) | bool
    - caddy_metrics_enabled | default(false) | bool
