# The whole Caddy role is skipped when caddy_enabled is false (default on macOS
# single-host deploys), so /etc/caddy is never touched and no caddy service is
# expected. Override with -e caddy_enabled=true.
- name: Check if Caddy is already installed
  ansible.builtin.command: caddy version
  register: caddy_bin_check
  failed_when: false
  changed_when: false
  when: caddy_enabled | default(true) | bool

- name: Drop the Caddy apt source while its signing key is expired
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/caddy_apt_source.yml"
  when:
    - caddy_enabled | default(true) | bool
    - ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Configure Caddy reverse proxy
  when: caddy_enabled | default(true) | bool
  block:
    - name: Ensure Caddy repo prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present
        update_cache: true
      when:
        - caddy_bin_check.rc != 0
        - ansible_facts['distribution'] in ['Debian', 'Ubuntu']

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: caddy_bin_check.rc != 0

    - name: Download Caddy GPG key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /etc/apt/keyrings/caddy-stable.asc
        force: true
        mode: '0644'
      when: caddy_bin_check.rc != 0

    - name: Dearmor Caddy GPG key
      ansible.builtin.command:
        cmd: gpg --batch --yes --dearmor --output /etc/apt/keyrings/caddy-stable.gpg /etc/apt/keyrings/caddy-stable.asc
      when: caddy_bin_check.rc != 0

    - name: Set Caddy GPG keyring permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/caddy-stable.gpg
        owner: root
        group: root
        mode: '0644'
      when: caddy_bin_check.rc != 0

    - name: Check the freshly downloaded Caddy signing key
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/caddy_apt_source.yml"
      when:
        - caddy_bin_check.rc != 0
        - ansible_facts['distribution'] in ['Debian', 'Ubuntu']

    - name: Refuse to install Caddy from a source with an expired signing key
      ansible.builtin.fail:
        msg: >-
          Caddy is not installed and the upstream Caddy apt signing key has
          expired (apt reports EXPKEYSIG). Refusing to install from an
          unverifiable source; retry once the Caddy maintainers renew the key.
      when:
        - caddy_bin_check.rc != 0
        - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
        - caddy_apt_key_expired | default(false) | bool

    - name: Add Caddy repository (Debian)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/caddy-stable.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        filename: caddy-stable
        state: present
      when:
        - caddy_bin_check.rc != 0
        - ansible_facts['distribution'] == 'Debian'

    - name: Add Caddy repository (Ubuntu)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/caddy-stable.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/ubuntu any-version main"
        filename: caddy-stable
        state: present
      when:
        - caddy_bin_check.rc != 0
        - ansible_facts['distribution'] == 'Ubuntu'

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true
      when:
        - caddy_bin_check.rc != 0
        - ansible_facts['distribution'] in ['Debian', 'Ubuntu']

    - name: Ensure Caddy config directory exists
      ansible.builtin.file:
        path: "{{ caddy_config_dir | default('/etc/caddy', true) }}"
        state: directory
        mode: '0755'

    - name: Deploy Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ caddy_config_dir | default('/etc/caddy', true) }}/Caddyfile"
        mode: '0644'
      notify: Reload caddy

    - name: Ensure Caddy is running
      ansible.builtin.service:
        name: caddy
        state: started
        enabled: true
