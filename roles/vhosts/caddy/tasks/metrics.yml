---
- name: Locate installed Caddy binary
  ansible.builtin.shell: command -v caddy
  register: xhttp_caddy_binary
  changed_when: false
  check_mode: false

- name: Read existing Caddy configuration for metrics enablement
  ansible.builtin.slurp:
    src: /etc/caddy/Caddyfile
  register: xhttp_caddy_config
  no_log: true

- name: Require a supported Caddy global options block
  ansible.builtin.assert:
    that: (xhttp_caddy_config.content | b64decode) is match('^\s*\{')
    fail_msg: "Expected an existing global options block in /etc/caddy/Caddyfile."

- name: Enable per-host HTTP metrics with Caddy validation
  ansible.builtin.copy:
    content: >-
      {{ (xhttp_caddy_config.content | b64decode)
         | regex_replace('^\s*\{', '{\n    metrics {\n        per_host\n    }') }}
    dest: /etc/caddy/Caddyfile
    mode: '0644'
    backup: true
    validate: "{{ xhttp_caddy_binary.stdout }} validate --config %s --adapter caddyfile"
  register: xhttp_caddy_metrics_config
  no_log: true
  when: not ((xhttp_caddy_config.content | b64decode) is search('(?m)^\s*metrics(?:\s*\{|\s*$)'))

- name: Gracefully reload Caddy metrics configuration
  ansible.builtin.command:
    argv:
      - "{{ xhttp_caddy_binary.stdout }}"
      - reload
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
  when: xhttp_caddy_metrics_config.changed | default(false)

- name: Bound Caddy graceful shutdown for long-lived XHTTP streams
  ansible.builtin.lineinfile:
    path: /etc/caddy/Caddyfile
    regexp: '^\s*grace_period\s+'
    insertafter: '^\s*\{\s*$'
    firstmatch: true
    line: '    grace_period 15s'
    backup: true
    validate: "{{ xhttp_caddy_binary.stdout }} validate --config %s --adapter caddyfile"
  register: xhttp_caddy_grace_config

- name: Create Caddy service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    mode: '0755'

- name: Allow Caddy to finish its bounded graceful shutdown
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/30-xhttp-shutdown.conf
    content: |
      [Service]
      TimeoutStopSec=30s
    mode: '0644'
  register: xhttp_caddy_shutdown_unit

- name: Load Caddy shutdown service override
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: xhttp_caddy_shutdown_unit.changed

- name: Load bounded Caddy graceful shutdown configuration
  ansible.builtin.command:
    argv: ["{{ xhttp_caddy_binary.stdout }}", reload, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
  when: xhttp_caddy_grace_config.changed
