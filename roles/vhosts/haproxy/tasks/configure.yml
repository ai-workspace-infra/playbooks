---
- name: Ensure HAProxy certificate and conf.d directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ haproxy_cert_dir }}", group: haproxy, mode: "0750" }
    - { path: "{{ haproxy_conf_d_dir }}", group: root, mode: "0755" }
  become: true

- name: Determine candidate TLS certificate sources for HAProxy
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ haproxy_source_cert_path }}"
    - "{{ agent_tls_cert_path | default('/etc/caddy/tls/agent-proxy.crt') }}"
  register: haproxy_cert_source_stats

- name: Determine candidate TLS key sources for HAProxy
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ haproxy_source_key_path }}"
    - "{{ agent_tls_key_path | default('/etc/caddy/tls/agent-proxy.key') }}"
  register: haproxy_key_source_stats

- name: Select resolved HAProxy TLS paths
  ansible.builtin.set_fact:
    resolved_haproxy_source_cert: >-
      {{ (haproxy_cert_source_stats.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first)
         | default(haproxy_source_cert_path) }}
    resolved_haproxy_source_key: >-
      {{ (haproxy_key_source_stats.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first)
         | default(haproxy_source_key_path) }}

- name: Check source TLS cert and key existence
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ resolved_haproxy_source_cert }}"
    - "{{ resolved_haproxy_source_key }}"
  register: haproxy_tls_sources

- name: Require TLS source cert and key
  ansible.builtin.assert:
    that:
      - haproxy_tls_sources.results | map(attribute='stat.exists') | min
    fail_msg: "Missing source TLS files for HAProxy PEM bundle."

- name: Build combined HAProxy PEM bundle from source cert and key
  ansible.builtin.shell: |
    set -euo pipefail
    tmp="$(mktemp)"
    cat "{{ resolved_haproxy_source_cert }}" "{{ resolved_haproxy_source_key }}" > "$tmp"
    chmod 0640 "$tmp"
    chown root:haproxy "$tmp"
    mv "$tmp" "{{ haproxy_pem_path }}"
  args:
    executable: /bin/bash
  become: true
  notify: Reload haproxy

- name: Resolve effective HAProxy vhosts list
  ansible.builtin.set_fact:
    haproxy_resolved_vhosts: >-
      {{ (haproxy_vhosts if (haproxy_vhosts is iterable and haproxy_vhosts is not string) else (haproxy_vhosts.split() if haproxy_vhosts is string else []))
         | reject('equalto', '') | unique | list }}
    haproxy_resolved_gateway_vhosts: >-
      {{ (haproxy_gateway_vhosts if (haproxy_gateway_vhosts is defined and haproxy_gateway_vhosts is iterable and haproxy_gateway_vhosts is not string) else (haproxy_gateway_vhosts.split() if (haproxy_gateway_vhosts is defined and haproxy_gateway_vhosts is string) else []))
         | reject('equalto', '') | unique | list }}

- name: Render HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/haproxy -c -f %s"
  become: true
  notify: Reload haproxy

- name: Export HAProxy ingress contract facts
  ansible.builtin.set_fact:
    xconnect_ingress_engine: "haproxy"
    xconnect_ingress_conf_d_dir: "{{ haproxy_conf_d_dir }}"
    xconnect_ingress_tls_dir: "{{ haproxy_cert_dir }}"
