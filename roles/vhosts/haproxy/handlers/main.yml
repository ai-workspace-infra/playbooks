---
- name: Validate HAProxy configuration before reload
  ansible.builtin.command:
    argv:
      - /usr/sbin/haproxy
      - -c
      - -f
      - "{{ haproxy_config_path }}"
  changed_when: false
  listen: reload ingress

- name: Reload haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: reloaded
  become: true
  listen: reload ingress

- name: Restart haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted
  become: true
