---
- name: Validate WebRTC desktop bridge runtime selection
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - webrtc_desktop_bridge_backend in ['x11']
      - webrtc_desktop_bridge_capture_tool in ['gstreamer']
    fail_msg: >-
      The extracted WebRTC bridge currently supports only Debian X11 and
      GStreamer runtime.

- name: Validate externally managed desktop authorization token
  when: webrtc_desktop_bridge_service_enabled | bool
  block:
    - name: Reject legacy inline token configuration
      ansible.builtin.assert:
        that:
          - webrtc_desktop_bridge_token | default('') | length == 0
          - webrtc_desktop_bridge_token_file | length > 0
        fail_msg: "Provision a separate token file and remove the legacy inline token variable."
      no_log: true

    - name: Inspect token file metadata
      ansible.builtin.stat:
        path: "{{ webrtc_desktop_bridge_token_file }}"
        follow: false
      register: webrtc_desktop_bridge_token_stat
      become: true

    - name: Require a private service-owned token file
      ansible.builtin.assert:
        that:
          - webrtc_desktop_bridge_token_stat.stat.exists
          - webrtc_desktop_bridge_token_stat.stat.isreg | default(false)
          - webrtc_desktop_bridge_token_stat.stat.pw_name | default('') == webrtc_desktop_bridge_user
          - webrtc_desktop_bridge_token_stat.stat.mode | default('') == '0600'
          - webrtc_desktop_bridge_token_stat.stat.size | default(0) | int > 0
        fail_msg: "Provision a service-owned 0600 token file before enabling the bridge."

    - name: Verify service identity can read a nonempty token file
      ansible.builtin.command:
        argv: [test, -r, "{{ webrtc_desktop_bridge_token_file }}"]
      changed_when: false
      become: true
      become_user: "{{ webrtc_desktop_bridge_user }}"

- name: Install WebRTC desktop bridge runtime packages
  ansible.builtin.apt:
    name: "{{ webrtc_desktop_bridge_packages }}"
    state: present
    install_recommends: false
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none
  become: true

- name: Deploy WebRTC remote desktop binary and service
  when:
    - webrtc_desktop_bridge_service_enabled | bool
  block:
    - name: Install xworkmate-remote-desktop binary
      ansible.builtin.copy:
        src: "{{ webrtc_desktop_bridge_binary_local_path }}"
        dest: "{{ webrtc_desktop_bridge_binary_dest }}"
        owner: root
        group: root
        mode: "0755"
      become: true
      notify:
        - Restart xworkmate-remote-desktop

    - name: Install xworkmate-remote-desktop systemd service unit
      ansible.builtin.template:
        src: xworkmate-remote-desktop.service.j2
        dest: /etc/systemd/system/xworkmate-remote-desktop.service
        owner: root
        group: root
        mode: "0644"
      become: true
      notify:
        - Reload systemd
        - Restart xworkmate-remote-desktop

    - name: Enable and start xworkmate-remote-desktop service
      ansible.builtin.service:
        name: xworkmate-remote-desktop
        state: started
        enabled: true
      become: true
