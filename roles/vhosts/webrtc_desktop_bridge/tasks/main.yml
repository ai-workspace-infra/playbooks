---
- name: Validate WebRTC desktop bridge runtime selection
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - webrtc_desktop_bridge_backend in ['x11']
      - webrtc_desktop_bridge_capture_tool in ['gstreamer']
    fail_msg: >-
      The extracted WebRTC bridge currently supports only Debian X11 and
      GStreamer runtime.

- name: Install WebRTC desktop bridge runtime packages
  ansible.builtin.apt:
    name: "{{ webrtc_desktop_bridge_packages }}"
    state: present
    install_recommends: false
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none
  become: true

- name: Deploy WebRTC remote desktop binary and service
  when:
    - webrtc_desktop_bridge_service_enabled | bool
  block:
    - name: Ensure xworkmate-remote-desktop config directory exists
      ansible.builtin.file:
        path: "{{ webrtc_desktop_bridge_token_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Ensure authorization token file exists
      ansible.builtin.copy:
        content: "{{ webrtc_desktop_bridge_token }}\n"
        dest: "{{ webrtc_desktop_bridge_token_file }}"
        owner: "{{ webrtc_desktop_bridge_user }}"
        group: "{{ webrtc_desktop_bridge_user }}"
        mode: "0600"
      become: true
      when: webrtc_desktop_bridge_token | length > 0

    - name: Install xworkmate-remote-desktop binary
      ansible.builtin.copy:
        src: "{{ webrtc_desktop_bridge_binary_local_path }}"
        dest: "{{ webrtc_desktop_bridge_binary_dest }}"
        owner: root
        group: root
        mode: "0755"
      become: true
      notify:
        - Restart xworkmate-remote-desktop

    - name: Install xworkmate-remote-desktop systemd service unit
      ansible.builtin.template:
        src: xworkmate-remote-desktop.service.j2
        dest: /etc/systemd/system/xworkmate-remote-desktop.service
        owner: root
        group: root
        mode: "0644"
      become: true
      notify:
        - Reload systemd
        - Restart xworkmate-remote-desktop

    - name: Enable and start xworkmate-remote-desktop service
      ansible.builtin.service:
        name: xworkmate-remote-desktop
        state: started
        enabled: true
      become: true
