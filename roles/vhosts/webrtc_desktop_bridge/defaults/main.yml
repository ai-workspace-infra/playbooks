---
webrtc_desktop_bridge_backend: x11
webrtc_desktop_bridge_capture_tool: gstreamer
webrtc_desktop_bridge_packages:
  - xdotool
  - gstreamer1.0-tools
  - gstreamer1.0-x
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-plugins-ugly
  - gstreamer1.0-libav

webrtc_desktop_bridge_repository: git@github.com:ai-workspace-lab/xworkmate-remote-desktop.git
webrtc_desktop_bridge_service_enabled: true
webrtc_desktop_bridge_user: "{{ ai_desktop_user | default('operator') }}"
webrtc_desktop_bridge_listen: "0.0.0.0:8090"
webrtc_desktop_bridge_display: ""
webrtc_desktop_bridge_token: ""
webrtc_desktop_bridge_token_file: "/etc/xworkmate-remote-desktop/token"
webrtc_desktop_bridge_accounts_url: ""
webrtc_desktop_bridge_login_url: ""
webrtc_desktop_bridge_allowed_roles: ""
webrtc_desktop_bridge_allowed_emails: ""
webrtc_desktop_bridge_nat1to1_ip: "{{ ansible_default_ipv4.address | default(ansible_host | default('172.237.9.58')) }}"
webrtc_desktop_bridge_binary_local_path: "/Users/shenlan/workspaces/ai-workspace-lab/xworkmate-remote-desktop-server/dist/xworkmate-remote-desktop-linux-amd64"
webrtc_desktop_bridge_binary_dest: "/usr/local/bin/xworkmate-remote-desktop"
