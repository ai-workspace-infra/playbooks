---
- name: Ensure Doco-CD directory exists
  ansible.builtin.file:
    path: "{{ doco_cd_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read Doco-CD credentials from Vault KV CICD
  community.hashi_vault.vault_kv2_get:
    url: "{{ doco_cd_vault_addr }}"
    auth_method: "{{ 'jwt' if doco_cd_vault_jwt_token | length > 0 else 'token' }}"
    jwt: "{{ doco_cd_vault_jwt_token if doco_cd_vault_jwt_token | length > 0 else omit }}"
    token: "{{ doco_cd_vault_token if doco_cd_vault_jwt_token | length == 0 else omit }}"
    path: "{{ doco_cd_vault_path }}"
    engine_mount_point: kv
  register: doco_cd_vault_secret
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  no_log: true
  failed_when: false
  when:
    - doco_cd_git_access_token | trim | length == 0
    - doco_cd_vault_jwt_token | trim | length > 0 or doco_cd_vault_token | trim | length > 0

- name: Resolve Doco-CD Git access token
  ansible.builtin.set_fact:
    doco_cd_git_access_token: >-
      {{ lookup('ansible.builtin.env', 'DOCO_CD_GIT_ACCESS_TOKEN')
         | default(doco_cd_vault_secret.secret.DOCO_CD_GIT_ACCESS_TOKEN | default('', true), true) }}
  no_log: true

# Git 访问 token 是可选的: 公开仓库不需要它, 强制要求会让部署卡在一个
# 根本不存在的凭据上。私有仓库才需要, 那时给 DOCO_CD_GIT_ACCESS_TOKEN
# 即可。webhook secret 则不同 —— 一旦开了 webhook, 没有 secret 就是把
# 一个能触发部署的端点无鉴权暴露出去, 必须要求。
- name: Validate Doco-CD webhook settings
  ansible.builtin.assert:
    that:
      - not (doco_cd_enable_webhook | bool) or (doco_cd_webhook_secret | trim | length > 0)
    fail_msg: >-
      doco_cd_enable_webhook is true, so DOCO_CD_WEBHOOK_SECRET (or
      doco_cd_webhook_secret) must be set -- an unauthenticated webhook
      endpoint lets anyone trigger a deployment.

# compose 文件把 /root/.docker/config.json 挂进容器, 好让 Doco-CD 用宿主机
# 的 registry 凭据拉私有镜像。但这个文件从来没有人创建 —— 而 bind mount
# 的源路径不存在时, Docker 会**自动建一个目录**顶上, 于是宿主机上出现:
#
#   WARNING: Error parsing config file (/root/.docker/config.json):
#            read /root/.docker/config.json: is a directory
#
# 之后每一次 docker 命令都带着这条警告, 且容器里拿到的是个空目录而不是
# 凭据 —— 私有镜像一律拉不动, 但 Doco-CD 自身是公开镜像, 照样 healthy,
# 所以从容器状态上完全看不出问题。
- name: Remove the placeholder directory Docker creates for a missing config.json
  ansible.builtin.file:
    path: /root/.docker/config.json
    state: absent
  when: doco_cd_registry_username | trim | length > 0
  register: doco_cd_config_cleanup

- name: Log into the container registry for Doco-CD
  ansible.builtin.shell: |
    set -euo pipefail
    printf '%s' '{{ doco_cd_registry_password }}' \
      | docker login {{ doco_cd_registry_server }} \
          -u '{{ doco_cd_registry_username }}' --password-stdin
  args:
    executable: /bin/bash
  no_log: true
  when:
    - doco_cd_registry_username | trim | length > 0
    - doco_cd_registry_password | trim | length > 0

# 断言登录确实产出了一个**文件**。跳过这一步的判据只有"没给凭据",
# 而不是"登录失败" —— 后者必须红。
- name: Assert the registry credentials landed as a file
  ansible.builtin.stat:
    path: /root/.docker/config.json
  register: doco_cd_docker_config
  when: doco_cd_registry_username | trim | length > 0

- name: Fail when config.json is still not a regular file
  ansible.builtin.fail:
    msg: >-
      /root/.docker/config.json is
      {{ 'a directory' if doco_cd_docker_config.stat.isdir | default(false) else 'missing' }}
      after docker login. Doco-CD would mount it as an empty directory and
      silently fail to pull private images while still reporting healthy.
  when:
    - doco_cd_registry_username | trim | length > 0
    - not (doco_cd_docker_config.stat.exists | default(false)) or (doco_cd_docker_config.stat.isdir | default(false))

- name: Render Doco-CD Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ doco_cd_compose_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Validate Doco-CD Docker Compose file
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ doco_cd_project_name }}"
      - -f
      - "{{ doco_cd_compose_file }}"
      - config
  args:
    chdir: "{{ doco_cd_base_dir }}"
  changed_when: false

# Doco-CD keeps cloned Git repositories in its persistent data volume.  A
# failed fetch can leave zero-value refs behind; the container remains healthy
# but every poll then fails with "ref file is empty" and the last application
# revision stays deployed forever.  Repair only the affected Git cache.  Do
# not remove the volume: it may contain state for other Doco-CD jobs.
- name: Stop Doco-CD before validating its Git cache
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ doco_cd_project_name }}"
      - -f
      - "{{ doco_cd_compose_file }}"
      - down
  args:
    chdir: "{{ doco_cd_base_dir }}"
  changed_when: false

- name: Locate Doco-CD Git cache repositories
  ansible.builtin.find:
    paths: "/var/lib/docker/volumes/{{ doco_cd_project_name }}_data/_data"
    patterns: ".git"
    file_type: directory
    recurse: true
  register: doco_cd_git_cache_dirs
  failed_when: false

- name: Validate Doco-CD Git cache refs
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ item.path | dirname }}"
      - show-ref
      - --head
  loop: "{{ doco_cd_git_cache_dirs.files | default([]) }}"
  register: doco_cd_git_cache_checks
  changed_when: false
  failed_when: false

- name: Remove only corrupted Doco-CD Git cache repositories
  ansible.builtin.file:
    path: "{{ item.item.path | dirname }}"
    state: absent
  loop: "{{ doco_cd_git_cache_checks.results | default([]) }}"
  when:
    - item.rc | int != 0
    - (item.item.path | dirname) is match('/var/lib/docker/volumes/[^/]+_data/_data/.+')

- name: Pull Doco-CD image
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ doco_cd_project_name }}"
      - -f
      - "{{ doco_cd_compose_file }}"
      - pull
  args:
    chdir: "{{ doco_cd_base_dir }}"
  when: doco_cd_pull_image | bool

- name: Start Doco-CD
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ doco_cd_project_name }}"
      - -f
      - "{{ doco_cd_compose_file }}"
      - up
      - -d
      - --remove-orphans
  args:
    chdir: "{{ doco_cd_base_dir }}"

- name: Show Doco-CD status
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ doco_cd_project_name }}"
      - -f
      - "{{ doco_cd_compose_file }}"
      - ps
  args:
    chdir: "{{ doco_cd_base_dir }}"
  changed_when: false
