---
postgres_exporter_enabled: true
postgres_exporter_version: "0.19.1"
postgres_exporter_checksums:
  "0.19.1":
    amd64: "sha256:229096c7988df6ca41fe5b4bf66865089971535e7f0d819c12c920ec64dd2bd0"
    arm64: "sha256:0ac6fe8c1f66f13b12adb8da282d248d9e1a48df6684e453ca232fd8fd62a11a"
postgres_exporter_checksum: >-
  {{ postgres_exporter_checksums.get(postgres_exporter_version, {}).get(
       'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64', '') }}
postgres_exporter_user: postgres_exporter
postgres_exporter_group: postgres_exporter
postgres_exporter_binary_dir: /opt/metrics-agent
postgres_exporter_binary_path: /opt/metrics-agent/postgres_exporter
postgres_exporter_config_dir: /etc/postgres_exporter
postgres_exporter_password_file: /etc/postgres_exporter/password
postgres_exporter_env_file: /etc/postgres_exporter/postgres_exporter.env
postgres_exporter_service_name: postgres-exporter
postgres_exporter_bind_address: 127.0.0.1
postgres_exporter_port: 9187
postgres_exporter_database_port_default: 5432
postgres_exporter_database_name: postgres
postgres_exporter_database_user: postgres
postgres_exporter_database_password: "{{ lookup('ansible.builtin.env', 'POSTGRESQL_ADMIN_PASSWORD') | default(lookup('ansible.builtin.env', 'POSTGRES_PASSWORD') | default('', true), true) }}"
postgres_exporter_monitoring_password: "{{ lookup('ansible.builtin.env', 'POSTGRES_EXPORTER_PASSWORD') | default('', true) }}"
postgres_exporter_auto_discover_databases: true
postgres_exporter_collection_timeout: 1m
postgres_exporter_log_level: info
postgres_exporter_group_name: postgres_exporter
postgres_exporter_postgres_container_name: ""
