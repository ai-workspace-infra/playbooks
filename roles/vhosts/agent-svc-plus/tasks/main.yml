---
- name: Map Go architecture
  ansible.builtin.set_fact:
    agent_svc_plus_go_arch: >-
      {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}
    agent_svc_plus_release_arch: >-
      {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}
  when: agent_svc_plus_build_on_target | bool

- name: Map release artifact architecture when build is disabled
  ansible.builtin.set_fact:
    agent_svc_plus_release_arch: >-
      {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}
  when: not (agent_svc_plus_build_on_target | bool)

- name: Ensure agent build prerequisites are installed
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - tar
    state: present
    update_cache: true
  when: agent_svc_plus_build_on_target | bool

- name: Check installed Go version
  ansible.builtin.command: "{{ agent_svc_plus_go_bin }} version"
  register: agent_svc_plus_go_version_check
  changed_when: false
  failed_when: false
  when: agent_svc_plus_build_on_target | bool

- name: Download Go toolchain archive
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ agent_svc_plus_go_version }}.linux-{{ agent_svc_plus_go_arch }}.tar.gz"
    dest: "/tmp/go{{ agent_svc_plus_go_version }}.linux-{{ agent_svc_plus_go_arch }}.tar.gz"
    mode: "0644"
  when:
    - agent_svc_plus_build_on_target | bool
    - agent_svc_plus_go_version_check.rc != 0 or ('go' ~ agent_svc_plus_go_version) not in agent_svc_plus_go_version_check.stdout

- name: Remove previous Go installation
  ansible.builtin.file:
    path: "{{ agent_svc_plus_go_root }}"
    state: absent
  when:
    - agent_svc_plus_build_on_target | bool
    - agent_svc_plus_go_version_check.rc != 0 or ('go' ~ agent_svc_plus_go_version) not in agent_svc_plus_go_version_check.stdout

- name: Install Go toolchain
  ansible.builtin.unarchive:
    src: "/tmp/go{{ agent_svc_plus_go_version }}.linux-{{ agent_svc_plus_go_arch }}.tar.gz"
    dest: "/usr/local"
    remote_src: true
  when:
    - agent_svc_plus_build_on_target | bool
    - agent_svc_plus_go_version_check.rc != 0 or ('go' ~ agent_svc_plus_go_version) not in agent_svc_plus_go_version_check.stdout

- name: Create agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_svc_plus_user }}"
    group: "{{ agent_svc_plus_group }}"
    mode: "0755"
  loop:
    - "{{ agent_svc_plus_app_dir }}"
    - "{{ agent_svc_plus_config_dir }}"
    - "{{ agent_svc_plus_data_dir }}"
    - "{{ xray_template_dir }}"

- name: Clone agent.svc.plus repository
  ansible.builtin.git:
    repo: "{{ agent_svc_plus_repo_url }}"
    dest: "{{ agent_svc_plus_app_dir }}"
    version: "{{ agent_svc_plus_repo_version }}"
    update: true
  notify: Restart agent-svc-plus
  when: agent_svc_plus_manage_source_checkout | bool

- name: Build agent.svc.plus binary
  ansible.builtin.command: >-
    {{ agent_svc_plus_go_bin }} build -o {{ agent_svc_plus_binary_path }} {{ agent_svc_plus_build_target }}
  args:
    chdir: "{{ agent_svc_plus_app_dir }}"
  environment:
    GOROOT: "{{ agent_svc_plus_go_root }}"
    PATH: "{{ agent_svc_plus_go_root }}/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local
  notify: Restart agent-svc-plus
  when: agent_svc_plus_build_on_target | bool

- name: Deploy prebuilt agent binary from control machine
  ansible.builtin.copy:
    src: "{{ agent_svc_plus_binary_src }}"
    dest: "{{ agent_svc_plus_binary_path }}"
    owner: "{{ agent_svc_plus_user }}"
    group: "{{ agent_svc_plus_group }}"
    mode: "0755"
  notify: Restart agent-svc-plus
  when:
    - not (agent_svc_plus_build_on_target | bool)
    - agent_svc_plus_binary_src | length > 0

- name: Download prebuilt agent binary from GitHub Release
  ansible.builtin.get_url:
    url: "{{ agent_svc_plus_release_asset_url }}"
    dest: "{{ agent_svc_plus_binary_path }}"
    owner: "{{ agent_svc_plus_user }}"
    group: "{{ agent_svc_plus_group }}"
    mode: "0755"
  notify: Restart agent-svc-plus
  when:
    - not (agent_svc_plus_build_on_target | bool)
    - agent_svc_plus_binary_src | length == 0
    - agent_svc_plus_release_tag | length > 0

- name: Check existing agent binary on target host
  ansible.builtin.stat:
    path: "{{ agent_svc_plus_binary_path }}"
  register: agent_svc_plus_binary_stat

- name: Assert target host already has agent binary when build is disabled
  ansible.builtin.assert:
    that:
      - agent_svc_plus_binary_stat.stat.exists
      - not agent_svc_plus_binary_stat.stat.isdir
    fail_msg: >-
      {{ agent_svc_plus_binary_path }} does not exist on the target host.
      This role is configured to avoid clone/build on target. Provide
      agent_svc_plus_binary_src, or set agent_svc_plus_release_tag so the role
      can download {{ agent_svc_plus_release_asset_name }}, or enable
      agent_svc_plus_build_on_target.
  when: not (agent_svc_plus_build_on_target | bool)

- name: Ensure agent binary permissions
  ansible.builtin.file:
    path: "{{ agent_svc_plus_binary_path }}"
    owner: "{{ agent_svc_plus_user }}"
    group: "{{ agent_svc_plus_group }}"
    mode: "0755"

- name: Check installed Xray version
  ansible.builtin.command: "{{ xray_binary_path }} version"
  register: xray_version_check
  changed_when: false
  failed_when: false
  when: xray_enabled | bool

- name: Ensure Xray cache directory exists
  ansible.builtin.file:
    path: "{{ xray_release_archive_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Download pinned Xray release
  ansible.builtin.get_url:
    url: "{{ xray_release_url }}"
    dest: "{{ xray_release_archive_path }}"
    checksum: "sha256:{{ xray_release_sha256 }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 120
  register: xray_release_download
  until: xray_release_download is succeeded
  retries: 3
  delay: 5
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Create temporary Xray extraction directory
  ansible.builtin.file:
    path: "/var/cache/agent-svc-plus/xray-{{ xray_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Extract pinned Xray release
  ansible.builtin.unarchive:
    src: "{{ xray_release_archive_path }}"
    dest: "/var/cache/agent-svc-plus/xray-{{ xray_version }}"
    remote_src: true
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Install pinned Xray binary atomically
  ansible.builtin.copy:
    src: "/var/cache/agent-svc-plus/xray-{{ xray_version }}/xray"
    dest: "{{ xray_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart Xray services
  when:
    - xray_enabled | bool
    - xray_version not in (xray_version_check.stdout | default(''))

- name: Ensure Xray asset directory exists
  ansible.builtin.file:
    path: "/usr/local/share/xray"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xray_enabled | bool

- name: Install pinned Xray routing assets
  ansible.builtin.copy:
    src: "/var/cache/agent-svc-plus/xray-{{ xray_version }}/{{ item }}"
    dest: "/usr/local/share/xray/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - geoip.dat
    - geosite.dat
  when:
    - xray_enabled | bool

- name: Deploy agent configuration
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ agent_svc_plus_config_path }}"
    owner: "{{ agent_svc_plus_user }}"
    group: "{{ agent_svc_plus_group }}"
    mode: "0600"
  notify: Restart agent-svc-plus

- name: Deploy XHTTP template
  ansible.builtin.template:
    src: xray.xhttp.template.json.j2
    dest: "{{ xray_template_dir }}/xray.xhttp.template.json"
    owner: "{{ agent_svc_plus_user }}"
    group: "{{ agent_svc_plus_group }}"
    mode: "0644"
  when: xray_enabled | bool
  tags:
    - xray-runtime-config

- name: Deploy TCP template
  ansible.builtin.template:
    src: xray.tcp.template.json.j2
    dest: "{{ xray_template_dir }}/xray.tcp.template.json"
    owner: "{{ agent_svc_plus_user }}"
    group: "{{ agent_svc_plus_group }}"
    mode: "0644"
  when: xray_enabled | bool
  tags:
    - xray-runtime-config

- name: Deploy Xray systemd services
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.unit }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: xray.service.j2, unit: xray.service }
    - { src: xray-tcp.service.j2, unit: xray-tcp.service }
  when: xray_enabled | bool
  notify: Restart Xray services
  tags:
    - xray-runtime-config

- name: Install agent systemd service
  ansible.builtin.template:
    src: agent-svc-plus.service.j2
    dest: "/etc/systemd/system/{{ agent_svc_plus_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agent-svc-plus

- name: Enable and start agent-svc-plus
  ansible.builtin.systemd:
    name: "{{ agent_svc_plus_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for agent-generated Xray runtime configuration
  ansible.builtin.wait_for:
    path: "{{ item }}"
    timeout: 60
  loop:
    - "{{ xray_config_path }}"
    - "{{ xray_tcp_config_path }}"
  when: xray_enabled | bool

- name: Wait for Caddy-managed agent certificate before validating Xray
  ansible.builtin.wait_for:
    path: "/var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ agent_tls_cert_name }}/{{ agent_tls_cert_name }}.crt"
    timeout: 300
  when: xray_enabled | bool

- name: Validate Xray configuration before starting services
  ansible.builtin.command: "{{ xray_binary_path }} run -test -config {{ item }}"
  environment:
    XRAY_LOCATION_ASSET: "/usr/local/share/xray/"
  changed_when: false
  loop:
    - "{{ xray_config_path }}"
    - "{{ xray_tcp_config_path }}"
  when: xray_enabled | bool

- name: Enable and start Xray services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - xray.service
    - xray-tcp.service
  when: xray_enabled | bool
