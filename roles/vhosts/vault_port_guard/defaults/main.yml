---
vault_port_guard_enabled: false
vault_port_guard_table: vault_port_guard
vault_port_guard_ports: [8200, 8201]
# Loopback is always allowed; this is the one additional interface (the
# XConnect overlay, typically xconone0) Raft peer traffic may arrive on.
vault_port_guard_interface: xconone0
vault_port_guard_ruleset_path: /etc/vault-port-guard.nft
vault_port_guard_unit_name: vault-port-guard.service
vault_port_guard_service_name: vault
