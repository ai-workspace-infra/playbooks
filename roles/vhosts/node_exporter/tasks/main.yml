- name: Check if node_exporter binary already exists
  ansible.builtin.stat:
    path: /opt/metrics-agent/node_exporter
  register: node_exporter_bin_check
  when: inventory_hostname in groups[group]

- name: Check if consolidated xconnect-host-metrics service is active or installed
  ansible.builtin.stat:
    path: /etc/systemd/system/xconnect-host-metrics.service
  register: node_exporter_combined_service_check
  when: inventory_hostname in groups[group]

- name: Download node_exporter archive
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{
      node_exporter_version | default('1.8.2') }}/node_exporter-{{
      node_exporter_version | default('1.8.2') }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.tar.gz
    dest: /tmp/node_exporter.tar.gz
    mode: "0644"
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode
    - not (node_exporter_bin_check.stat.exists | default(false))

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version | default('1.8.2') }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode
    - not (node_exporter_bin_check.stat.exists | default(false))

- name: Ensure metrics-agent directory exists
  ansible.builtin.file:
    path: /opt/metrics-agent
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version | default('1.8.2') }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}/node_exporter"
    dest: /opt/metrics-agent/node_exporter
    mode: '0755'
    remote_src: true
  register: node_exporter_bin_install
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode
    - not (node_exporter_bin_check.stat.exists | default(false))

- name: Remove node_exporter archive
  ansible.builtin.file:
    path: /tmp/node_exporter.tar.gz
    state: absent
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode
    - not (node_exporter_bin_check.stat.exists | default(false))

- name: Cleanup extracted directory
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version | default('1.8.2') }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    state: absent
  when:
    - inventory_hostname in groups[group]
    - not (node_exporter_bin_check.stat.exists | default(false))

- name: Ensure textfile collector directory exists
  ansible.builtin.file:
    path: /var/lib/node_exporter
    state: directory
    owner: nobody
    group: nogroup
    mode: '0755'
  when: inventory_hostname in groups[group]

- name: Remove old node_exporter service file
  ansible.builtin.file:
    path: /etc/systemd/system/node_exporter.service
    state: absent
  when: inventory_hostname in groups[group]

- name: Create node_exporter service
  ansible.builtin.template:
    src: node-exporter.service
    dest: /etc/systemd/system/node-exporter.service
    owner: root
    group: root
    mode: '0644'
  register: node_exporter_unit_template
  when:
    - inventory_hostname in groups[group]
    - not (node_exporter_combined_service_check.stat.exists | default(false))

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node-exporter
    enabled: true
    state: "{{ 'restarted' if ((node_exporter_unit_template.changed | default(false)) or (node_exporter_bin_install.changed | default(false))) else 'started' }}"
    daemon_reload: "{{ node_exporter_unit_template.changed | default(false) }}"
  when:
    - inventory_hostname in groups[group]
    - not ansible_check_mode
    - not (node_exporter_combined_service_check.stat.exists | default(false))
