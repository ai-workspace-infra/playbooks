---
# Package-manager coordination is deliberately local to the Docker role.  The
# role is a dependency of web-saas_host_config and Doco-CD, so this runs before
# their first apt operation without changing apt policy for unrelated roles.
- name: Stop background APT services before Docker package changes
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ docker_apt_background_services }}"
  loop_control:
    label: "{{ item }}"
  failed_when: false
  when: ansible_facts.os_family == 'Debian'

