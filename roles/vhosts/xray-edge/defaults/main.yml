---
# No production domain or destination is embedded in role defaults.
xray_edge_domain: ""
xray_edge_upstream_address: ""
xray_edge_upstream_host: "{{ xray_edge_upstream_address }}"
xray_edge_upstream_sni: "{{ xray_edge_upstream_host }}"
xray_edge_upstream_port: 443
xray_edge_path: /split
xray_edge_mode: diagnostic

xray_edge_caddy_binary: caddy
xray_edge_caddy_service: caddy
xray_edge_caddyfile_path: /etc/caddy/Caddyfile
xray_edge_caddy_conf_dir: /etc/caddy/conf.d
xray_edge_site_filename: xray-edge.caddy
xray_edge_candidate_path: /run/xray-edge.candidate
