- name: Install flux cli
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v flux >/dev/null 2>&1; then
      exit 0
    fi
    curl -fsSL https://fluxcd.io/install.sh \
      | FLUX_VERSION="{{ k3s_platform_flux_version }}" bash
  args:
    executable: /bin/bash

- name: Ensure flux namespace exists
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k3s_platform_kubeconfig_path }}"
    kubectl get namespace "{{ k3s_platform_flux_namespace }}" >/dev/null 2>&1 || kubectl create namespace "{{ k3s_platform_flux_namespace }}"
  args:
    executable: /bin/bash

- name: Install flux controllers
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k3s_platform_kubeconfig_path }}"
    flux install --namespace "{{ k3s_platform_flux_namespace }}" \
      --components="{{ k3s_platform_flux_components | join(',') }}"
  args:
    executable: /bin/bash

- name: Wait for flux controllers to become ready
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k3s_platform_kubeconfig_path }}"
    # Jinja 控制行必须与块标量同缩进, 否则 {% %} 落在第 0 列会破坏 YAML 结构,
    # 整个文件无法解析(CI 的 ansible --list-tasks 直接报 Syntax Error)。
    {% for comp in k3s_platform_flux_components %}
    kubectl -n "{{ k3s_platform_flux_namespace }}" rollout status deployment/{{ comp }} --timeout=300s
    {% endfor %}
  args:
    executable: /bin/bash

- name: Apply the declared flux controller resource bounds
  ansible.builtin.import_tasks: limits.yml
  tags: [flux_limits]
