---
# Values are generated on the target and stay there (0600, owned by the service
# user). Nothing is read back to the controller; rotation = delete file + rerun.
- name: Generate host-local secret files when absent
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    f="{{ qmd_hub_etc_dir }}/{{ item }}"
    if [ -s "$f" ]; then echo unchanged; exit 0; fi
    od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > "$f.tmp"
    chown {{ qmd_hub_user }}:{{ qmd_hub_group }} "$f.tmp"; chmod 0600 "$f.tmp"; mv "$f.tmp" "$f"
    echo created
  args:
    executable: /bin/bash
  loop: "{{ ['mcp-token'] + (['sync-token'] if qmd_hub_sync_enabled | bool else []) + (['pg-password'] if qmd_hub_pg_enabled | bool else []) }}"
  register: qmd_hub_secret_gen
  changed_when: "'created' in qmd_hub_secret_gen.stdout"
  no_log: true

- name: Enforce secret file ownership and mode
  ansible.builtin.file:
    path: "{{ qmd_hub_etc_dir }}/{{ item }}"
    owner: "{{ qmd_hub_user }}"
    group: "{{ qmd_hub_group }}"
    mode: "0600"
  loop: "{{ ['mcp-token'] + (['sync-token'] if qmd_hub_sync_enabled | bool else []) + (['pg-password'] if qmd_hub_pg_enabled | bool else []) }}"
  when: not ansible_check_mode
