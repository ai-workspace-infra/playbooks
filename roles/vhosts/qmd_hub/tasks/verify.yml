---
- name: Wait for qmd-hub health endpoint
  ansible.builtin.uri:
    url: "http://{{ qmd_hub_listen_host }}:{{ qmd_hub_listen_port }}/health"
    status_code: 200
  register: qmd_hub_health
  retries: 20
  delay: 3
  until: qmd_hub_health.status == 200

- name: Require bearer token on /query
  ansible.builtin.uri:
    url: "http://{{ qmd_hub_listen_host }}:{{ qmd_hub_listen_port }}/query"
    method: POST
    body_format: json
    body: { searches: [{ type: lex, query: "qmd" }] }
    status_code: 401

- name: Sync API health on the CNI bridge
  ansible.builtin.uri:
    url: "http://{{ qmd_hub_sync_listen_host }}:{{ qmd_hub_sync_listen_port }}/api/v1/sync/health"
  register: qmd_hub_sync_health
  retries: 10
  delay: 3
  until: qmd_hub_sync_health.status == 200
  when: qmd_hub_sync_enabled | bool

- name: Sync API rejects missing and invalid credentials
  ansible.builtin.uri:
    url: "http://{{ qmd_hub_sync_listen_host }}:{{ qmd_hub_sync_listen_port }}{{ item.path }}"
    headers: "{{ item.headers }}"
    status_code: 401
  loop:
    - { path: "/api/v1/sync/changes?since_fence=0", headers: {} }
    - { path: "/", headers: {} }
    - { path: "/api/v1/sync/auth", headers: { Authorization: "Bearer invalid-qmd-hub-probe" } }
    - { path: "/api/v1/sync/auth", headers: { Cookie: "xc_session=invalid-qmd-hub-probe" } }
    - { path: "/api/v1/auth/whoami", headers: {} }
    - { path: "/api/v1/auth/whoami", headers: { Authorization: "Bearer invalid-qmd-hub-probe" } }
  when: qmd_hub_sync_enabled | bool

# Runs on the Hub so the token never leaves the host (header fed to curl on stdin).
- name: Sync API whoami identifies the machine sync token (qmd login --token-stdin)
  ansible.builtin.shell: |
    set -euo pipefail
    printf 'Authorization: Bearer %s\n' "$(cat {{ qmd_hub_etc_dir }}/sync-token)" \
      | curl -fsS -H @- "http://{{ qmd_hub_sync_listen_host }}:{{ qmd_hub_sync_listen_port }}/api/v1/auth/whoami"
  args:
    executable: /bin/bash
  become: true
  register: qmd_hub_whoami
  changed_when: false
  failed_when: qmd_hub_whoami.rc != 0 or '"static_token"' not in qmd_hub_whoami.stdout
  when: qmd_hub_sync_enabled | bool and not ansible_check_mode

- name: Run initial ingest (records fence in L2)
  ansible.builtin.command: "{{ qmd_hub_root }}/bin/qmd-hub-ingest all"
  become: true
  become_user: "{{ qmd_hub_user }}"
  register: qmd_hub_ingest
  changed_when: "'new=0' not in qmd_hub_ingest.stdout"

- name: QMD status
  ansible.builtin.command: "{{ qmd_hub_root }}/bin/qmd status"
  become: true
  become_user: "{{ qmd_hub_user }}"
  register: qmd_hub_status
  changed_when: false

- name: Show QMD Hub summary
  ansible.builtin.debug:
    msg:
      - "listener: {{ qmd_hub_listen_host }}:{{ qmd_hub_listen_port }} (token-protected /mcp /query /search)"
      - "ingest: {{ qmd_hub_ingest.stdout }}"
      - "{{ qmd_hub_status.stdout_lines[:12] }}"
