---
# QMD Hub: Level-4 enterprise persistence (QMD L1 + PG L2 + archive L3) that
# also acts as the Hub-Spoke centre. Baseline:
# ai-workspace-services/knowledge#400
# docs/reference/platform-delivery/architecture/QMD单体运行与分布式异步同步架构规范.md

qmd_hub_user: qmdhub
qmd_hub_group: qmdhub
qmd_hub_root: /opt/qmd-hub
qmd_hub_etc_dir: /etc/qmd-hub
qmd_hub_service_name: qmd-hub

# Source: the ai-workspace-lab fork, pinned commit (public repo, HTTPS, no deploy key).
qmd_hub_source_repo: https://github.com/ai-workspace-lab/qmd.git
qmd_hub_version: f626412ab21c596a9abe7be49b0a8d14d9e45914

# Isolated Node runtime under qmd_hub_root (does not touch system node/npm).
qmd_hub_node_version: v24.22.1
qmd_hub_node_arch: linux-x64

# HTTP MCP / REST (/health, /query, /search, /mcp). Loopback only by default;
# a bearer token is always generated on the host (0600, never leaves the host).
qmd_hub_listen_host: 127.0.0.1
qmd_hub_listen_port: 8181

# L2: dedicated local PostgreSQL 17 + pgvector cluster (loopback only). It is
# independent of any in-cluster PostgreSQL managed by GitOps.
qmd_hub_pg_enabled: true
qmd_hub_pg_version: "17"
qmd_hub_pg_cluster: qmdhub
qmd_hub_pg_port: 5433
qmd_hub_pg_database: qmd_memory
qmd_hub_pg_role: qmdhub
qmd_hub_pg_shared_buffers: 64MB
qmd_hub_pg_max_connections: 20
qmd_hub_namespace: qmd-hub

# L3: daily archive. Backend gdrive|s3 via rclone; "none" disables the timer.
# Credentials are NOT managed here: provide {{ qmd_hub_etc_dir }}/rclone.conf
# (owner qmd_hub_user, mode 0600) with remote `qmd_hub_archive_remote`.
qmd_hub_archive_backend: gdrive
qmd_hub_archive_remote: qmd-archive
qmd_hub_archive_path: ai-workspace-archive/qmd-hub/{{ inventory_hostname }}
qmd_hub_archive_on_calendar: "*-*-* 03:00:00"

# Spokes: public keys allowed to push/pull as qmd_hub_user over SSH (restricted).
qmd_hub_spoke_authorized_keys: []

qmd_hub_memory_max: 768M

# Delta Sync API (qmd-hub-syncd). Binds the CNI bridge address so only the
# in-cluster Traefik (TLS termination for qmd_hub_public_host) can reach it;
# it is never bound on the public interface. Bearer token: sync-token (0600).
qmd_hub_sync_enabled: true
qmd_hub_sync_listen_host: 10.42.0.1
qmd_hub_sync_listen_port: 8182
qmd_hub_sync_allow_from: 10.42.0.0/16
qmd_hub_public_host: qmd.svc.plus

# Shared svc.plus account authentication (same model as desktop.svc.plus /
# ai-desktop-lab/xworkmate-remote-desktop): accounts.svc.plus session token via
# Bearer or the `xc_session` cookie (domain .svc.plus), introspected at
# {accounts}/api/auth/session. The Spoke sync token stays valid as the machine
# credential. Empty accounts URL = machine token only.
qmd_hub_accounts_url: https://accounts.svc.plus
qmd_hub_login_url: https://console.svc.plus/login
# Restrict which accounts may read/write the shared memory (comma separated).
qmd_hub_allowed_roles: admin
qmd_hub_allowed_emails: ""
qmd_hub_auth_cache_seconds: 60
