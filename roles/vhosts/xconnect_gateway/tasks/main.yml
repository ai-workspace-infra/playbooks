---
- name: Create or reuse the Gateway local identity
  ansible.builtin.import_tasks: identity.yml

- name: Validate Gateway enrollment inputs
  ansible.builtin.assert:
    that:
      - xconnect_gateway_frontend != 'direct-tls' or xconnect_gateway_tls_cert_source | trim | length > 0
      - xconnect_gateway_frontend != 'direct-tls' or xconnect_gateway_tls_key_source | trim | length > 0
      - xconnect_gateway_trust_bundle_source | trim | length > 0
  no_log: true

- name: Install Gateway TLS certificate
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_tls_cert_source }}"
    dest: "{{ xconnect_gateway_tls_cert_path }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  when: xconnect_gateway_frontend == 'direct-tls'

- name: Install Gateway TLS private key
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_tls_key_source }}"
    dest: "{{ xconnect_gateway_tls_key_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: xconnect_gateway_frontend == 'direct-tls'

- name: Install Gateway trust bundle for One handoff
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_trust_bundle_source }}"
    dest: "{{ xconnect_gateway_trust_bundle_path }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true

- name: Validate Gateway trust bundle is PEM X.509 material
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ xconnect_gateway_trust_bundle_path }}"
      - -noout
  changed_when: false
  no_log: true

- name: Export Gateway public CA for the controlled-client handoff
  ansible.builtin.fetch:
    src: "{{ xconnect_gateway_trust_bundle_path }}"
    dest: "{{ xconnect_gateway_ca_fetch_dest }}"
    flat: true
  when: xconnect_gateway_ca_fetch_dest | trim | length > 0

- name: Inspect existing XConnect Gateway enrollment
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_state_dir }}/state.json"
  register: xconnect_gateway_state

- name: Inspect existing Gateway credential state
  ansible.builtin.command:
    argv:
      - jq
      - -er
      - .device_credential.credential // empty
      - "{{ xconnect_gateway_state_dir }}/state.json"
  when: xconnect_gateway_state.stat.exists
  register: xconnect_gateway_credential
  changed_when: false
  failed_when: false
  no_log: true

- name: Mark Gateway as enrolled only when its credential is present
  ansible.builtin.set_fact:
    xconnect_gateway_enrolled: >-
      {{ xconnect_gateway_state.stat.exists and
         (xconnect_gateway_credential.stdout | default('') | trim | length > 0) }}
  no_log: true

# An already enrolled Gateway re-runs without an invitation, so a re-run
# never consumes (or needs) a new one-use invite.
- name: Require an invitation only for a Gateway that is not enrolled yet
  ansible.builtin.assert:
    that:
      - xconnect_gateway_enrolled | bool or (xconnect_gateway_invite_file_source | trim | length > 0)
    fail_msg: The Gateway is not enrolled and no one-use invitation file was provided.

- name: Stage short-lived Gateway invitation
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_invite_file_source }}"
    dest: "{{ xconnect_gateway_invite_path }}"
    owner: root
    group: root
    mode: '0600'
  when: not (xconnect_gateway_enrolled | default(false) | bool)
  no_log: true

- name: Join XConnect Gateway with protected invitation
  block:
    - name: Exchange Gateway invitation with Zero
      ansible.builtin.shell: >-
        {{ xconnect_gateway_binary_path | quote }} join
        --state-dir {{ xconnect_gateway_state_dir | quote }}
        --gateway-id {{ xconnect_gateway_id | quote }}
        "$(cat {{ xconnect_gateway_invite_path | quote }})"
      args:
        executable: /bin/bash
      no_log: true
  always:
    - name: Remove short-lived Gateway invitation
      ansible.builtin.file:
        path: "{{ xconnect_gateway_invite_path }}"
        state: absent
      no_log: true
  when: not (xconnect_gateway_enrolled | default(false) | bool)

- name: Install Gateway Xray systemd service
  ansible.builtin.template:
    src: xconnect-gateway-xray.service.j2
    dest: /etc/systemd/system/xconnect-gateway-xray.service
    owner: root
    group: root
    mode: '0644'

- name: Install Zero-driven Gateway sync systemd service
  ansible.builtin.template:
    src: xconnect-gateway-sync.service.j2
    dest: /etc/systemd/system/xconnect-gateway-sync.service
    owner: root
    group: root
    mode: '0644'

- name: Install Zero-driven Gateway sync timer
  ansible.builtin.template:
    src: xconnect-gateway-sync.timer.j2
    dest: /etc/systemd/system/xconnect-gateway-sync.timer
    owner: root
    group: root
    mode: '0644'

- name: Reconcile signed Gateway configuration
  environment:
    PATH: "{{ xconnect_gateway_xray_binary_path | dirname }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    XCONNECT_GATEWAY_FRONTEND: "{{ xconnect_gateway_frontend }}"
    XCONNECT_GATEWAY_LISTEN_SOCKET: "{{ xconnect_gateway_listen_socket }}"
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_binary_path }}"
      - up
      - --state-dir
      - "{{ xconnect_gateway_state_dir }}"
      - --tls-cert
      - "{{ xconnect_gateway_tls_cert_path }}"
      - --tls-key
      - "{{ xconnect_gateway_tls_key_path }}"
      - --frontend
      - "{{ xconnect_gateway_frontend }}"
      - --listen-socket
      - "{{ xconnect_gateway_listen_socket }}"
  register: xconnect_gateway_up
  changed_when: false
  failed_when: false
  no_log: true

# The reconcile result stays hidden (it runs with the device credential), but
# its error must not: `xconnect-gateway up` prints only status lines and plain
# error messages (signed-config, `xray run -test` or wg-quick failures). Show
# the last lines with anything key- or token-shaped redacted.
- name: Report why the signed Gateway configuration did not reconcile
  ansible.builtin.fail:
    msg: >-
      xconnect-gateway up failed (rc={{ xconnect_gateway_up.rc | default('unknown') }}):
      {{ ((xconnect_gateway_up.stderr_lines | default([])) + (xconnect_gateway_up.stdout_lines | default([])))[-6:]
         | map('regex_replace', '[A-Za-z0-9+/_=-]{32,}', '<redacted>') | list }}
  when: (xconnect_gateway_up.rc | default(1)) != 0

- name: Enable Gateway data-plane and sync services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - xconnect-gateway-xray.service
    - xconnect-gateway-sync.timer

- name: Restart Gateway Xray after signed configuration reconciliation
  ansible.builtin.systemd:
    name: xconnect-gateway-xray.service
    state: restarted

# state.json already exists after identity.yml; only a stored device
# credential proves the Gateway actually enrolled.
- name: Verify the Gateway holds an enrollment credential
  ansible.builtin.command:
    argv:
      - jq
      - -e
      - (.device_credential.credential // "") | length > 0
      - "{{ xconnect_gateway_state_dir }}/state.json"
  changed_when: false
  no_log: true
