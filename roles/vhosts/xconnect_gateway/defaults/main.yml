---
# Zero-driven Gateway role. GitOps supplies only non-sensitive topology;
# credentials, TLS material and the short-lived invitation arrive at runtime.
xconnect_gateway_enabled: false
xconnect_gateway_environment: uat
xconnect_gateway_binary_source: ""
xconnect_gateway_binary_path: /usr/local/bin/xconnect-gateway
xconnect_gateway_xray_binary_source: ""
xconnect_gateway_xray_binary_path: /usr/local/bin/xray
xconnect_gateway_state_dir: "/var/lib/xconnect-gateway/{{ xconnect_gateway_environment }}"
xconnect_gateway_controller: ""
xconnect_gateway_id: ""
xconnect_gateway_invite_file_source: ""
xconnect_gateway_invite_path: "/run/xconnect-gateway/{{ xconnect_gateway_environment }}.invite"
xconnect_gateway_tls_cert_source: ""
xconnect_gateway_tls_key_source: ""
xconnect_gateway_tls_cert_path: /etc/xconnect-gateway/tls.crt
xconnect_gateway_tls_key_path: /etc/xconnect-gateway/tls.key
xconnect_gateway_trust_bundle_source: ""
xconnect_gateway_trust_bundle_path: /etc/xconnect-gateway/ca.crt
# Optional controller-local destination for the public CA handoff to One.
# The private TLS key is never fetched or exposed by this mechanism.
xconnect_gateway_ca_fetch_dest: ""
xconnect_gateway_sync_interval_seconds: 300
