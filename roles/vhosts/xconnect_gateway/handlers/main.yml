---
- name: Restart XConnect overlay DNS
  ansible.builtin.systemd:
    name: "{{ xconnect_gateway_dns_service_name }}"
    state: restarted
    daemon_reload: true
  when: xconnect_gateway_dns_enabled | bool

- name: Reload caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
  listen: reload ingress
  when: (xconnect_ingress_engine | default('caddy')) == 'caddy'

- name: Restart fluxgate
  ansible.builtin.systemd:
    name: fluxgate
    state: restarted
  listen: reload ingress
  when: (xconnect_ingress_engine | default('caddy')) == 'fluxgate'

- name: Reload haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: reloaded
  listen: reload ingress
  when: (xconnect_ingress_engine | default('caddy')) == 'haproxy'

- name: Restart xconnect-gateway-xray on xray-core upgrade
  ansible.builtin.systemd:
    name: xconnect-gateway-xray.service
    state: restarted
  listen: xray-core binary changed
  failed_when: false
