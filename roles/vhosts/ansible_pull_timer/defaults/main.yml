---
# Schedule a recurring unified `ansible-pull` convergence on a host.
#
# Defaults converge both GitOps declarations, Kubernetes resource bounds (when present),
# and observability collection via `pull_convergence.yml`.
ansible_pull_timer_name: ansible-pull
ansible_pull_timer_description: Unified systemd ansible-pull configuration convergence
ansible_pull_timer_state: started
# Install git/ansible-core when the host cannot run ansible-pull yet.
ansible_pull_timer_manage_prerequisites: true

# ansible-pull invocation
ansible_pull_repo_url: https://github.com/ai-workspace-infra/playbooks.git
ansible_pull_checkout: main
ansible_pull_playbook: pull_convergence.yml
ansible_pull_checkout_dir: /var/lib/ansible-pull/playbooks
ansible_pull_inventory: "localhost,"
ansible_pull_kubeconfig: /etc/rancher/k3s/k3s.yaml
ansible_pull_path: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
ansible_pull_timeout_sec: 1800
ansible_pull_environment_file: /etc/ansible-pull/gitops-declaration.env

# OS 层面参数控制：支持通过 -e 参数控制容器与非容器模式（例如 container_mode=false）
ansible_pull_extra_vars: ""

# systemd timer cadence
ansible_pull_schedule: "*-*-* 04:23:00"
ansible_pull_randomized_delay_sec: 1800

# 额外需要按同样的方式自我收敛的入口。每一项都是一个独立的 systemd timer
ansible_pull_extra_entrypoints: []
