---
- name: Validate the scheduled ansible-pull inputs
  ansible.builtin.assert:
    that:
      - ansible_pull_repo_url | length > 0
      - ansible_pull_playbook | length > 0
      - ansible_pull_checkout_dir | length > 0
      - ansible_pull_timer_name | length > 0
    fail_msg: >-
      ansible_pull_timer requires the repository, playbook, checkout directory
      and timer name inputs
  tags: [ansible_pull_timer, validate]

- name: Ensure git is available for the scheduled pull
  ansible.builtin.package:
    name: git
    state: present
  when: ansible_pull_timer_manage_prerequisites | bool
  tags: [ansible_pull_timer, install]

- name: Probe for an existing ansible-pull executable
  ansible.builtin.command:
    argv: [bash, -lc, "command -v ansible-pull || true"]
  register: ansible_pull_timer_probe
  changed_when: false
  tags: [ansible_pull_timer, validate]

- name: Install ansible-core when the host cannot run ansible-pull
  ansible.builtin.package:
    name: ansible-core
    state: present
  when:
    - ansible_pull_timer_manage_prerequisites | bool
    - ansible_pull_timer_probe.stdout | trim | length == 0
  tags: [ansible_pull_timer, install]

- name: Resolve the ansible-pull executable path
  ansible.builtin.command:
    argv: [bash, -lc, "command -v ansible-pull"]
  register: ansible_pull_timer_resolved
  changed_when: false
  failed_when: false
  tags: [ansible_pull_timer, validate]

- name: Require a usable ansible-pull executable
  ansible.builtin.assert:
    that:
      - ansible_pull_timer_resolved.rc == 0
      - ansible_pull_timer_resolved.stdout | trim | length > 0
    fail_msg: >-
      ansible-pull is unavailable and could not be installed; install
      ansible-core on this host before scheduling the convergence
  tags: [ansible_pull_timer, validate]

- name: Bind the resolved ansible-pull executable
  ansible.builtin.set_fact:
    ansible_pull_executable: "{{ ansible_pull_timer_resolved.stdout | trim }}"
  tags: [ansible_pull_timer, configure]

- name: Ensure the ansible-pull checkout directory exists
  ansible.builtin.file:
    path: "{{ ansible_pull_checkout_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [ansible_pull_timer, install]

- name: Stop, disable, and clean up legacy separate ansible-pull units
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ansible-pull-flux-limits.timer
    - ansible-pull-flux-limits.service
    - ansible-pull-observability.timer
    - ansible-pull-observability.service
  failed_when: false
  tags: [ansible_pull_timer, configure]

- name: Remove legacy separate ansible-pull unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - ansible-pull-flux-limits.timer
    - ansible-pull-flux-limits.service
    - ansible-pull-observability.timer
    - ansible-pull-observability.service
  failed_when: false
  notify: Reload systemd manager configuration
  tags: [ansible_pull_timer, configure]

- name: Reset failed state for legacy separate ansible-pull units
  ansible.builtin.command:
    cmd: "systemctl reset-failed {{ item }}"
  loop:
    - ansible-pull-flux-limits.service
    - ansible-pull-observability.service
  failed_when: false
  changed_when: false
  tags: [ansible_pull_timer, configure]

- name: Template the scheduled ansible-pull service unit
  ansible.builtin.template:
    src: ansible-pull.service.j2
    dest: "/etc/systemd/system/{{ ansible_pull_timer_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd manager configuration
  tags: [ansible_pull_timer, configure]

- name: Template the scheduled ansible-pull timer unit
  ansible.builtin.template:
    src: ansible-pull.timer.j2
    dest: "/etc/systemd/system/{{ ansible_pull_timer_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd manager configuration
  tags: [ansible_pull_timer, configure]

- name: Enable and start the scheduled ansible-pull timer
  ansible.builtin.systemd:
    name: "{{ ansible_pull_timer_name }}.timer"
    enabled: true
    state: "{{ ansible_pull_timer_state }}"
    daemon_reload: true
  tags: [ansible_pull_timer, configure]

- name: Validate the extra ansible-pull entrypoints
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.playbook | default('') | length > 0
    fail_msg: >-
      every ansible_pull_extra_entrypoints item needs a non-empty name and playbook
  loop: "{{ ansible_pull_extra_entrypoints }}"
  loop_control:
    label: "{{ item.name | default('(unnamed)') }}"
  tags: [ansible_pull_timer, validate]

- name: Template the extra ansible-pull service units
  ansible.builtin.template:
    src: ansible-pull-extra.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ansible_pull_extra_entrypoints }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd manager configuration
  tags: [ansible_pull_timer, configure]

- name: Template the extra ansible-pull timer units
  ansible.builtin.template:
    src: ansible-pull-extra.timer.j2
    dest: "/etc/systemd/system/{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ansible_pull_extra_entrypoints }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd manager configuration
  tags: [ansible_pull_timer, configure]

- name: Enable and start the extra ansible-pull timers
  ansible.builtin.systemd:
    name: "{{ item.name }}.timer"
    enabled: true
    state: "{{ item.state | default(ansible_pull_timer_state) }}"
    daemon_reload: true
  loop: "{{ ansible_pull_extra_entrypoints }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [ansible_pull_timer, configure]

- name: Read back the active timer schedule
  ansible.builtin.command:
    argv:
      - systemctl
      - list-timers
      - --all
      - --no-pager
      - "{{ ansible_pull_timer_name }}.timer"
  register: ansible_pull_timer_list
  changed_when: false
  tags: [ansible_pull_timer, validate]

- name: Assert the timer is scheduled
  ansible.builtin.assert:
    that:
      - ansible_pull_timer_name ~ '.timer' in ansible_pull_timer_list.stdout
    fail_msg: >-
      the scheduled timer is not active: {{ ansible_pull_timer_list.stdout }}
  tags: [ansible_pull_timer, validate]

- name: Read back the extra timer schedules
  ansible.builtin.command:
    argv:
      - systemctl
      - list-timers
      - --all
      - --no-pager
  register: ansible_pull_extra_timer_list
  changed_when: false
  when: ansible_pull_extra_entrypoints | length > 0
  tags: [ansible_pull_timer, validate]

- name: Assert every extra timer is scheduled
  ansible.builtin.assert:
    that:
      - item.name ~ '.timer' in ansible_pull_extra_timer_list.stdout
    fail_msg: >-
      scheduled timer {{ item.name }}.timer is missing from systemctl list-timers
  loop: "{{ ansible_pull_extra_entrypoints }}"
  loop_control:
    label: "{{ item.name }}"
  when: ansible_pull_extra_entrypoints | length > 0
  tags: [ansible_pull_timer, validate]
