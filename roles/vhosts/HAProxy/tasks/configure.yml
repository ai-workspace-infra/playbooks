---
- name: Ensure HAProxy certificate directory exists
  ansible.builtin.file:
    path: "{{ haproxy_cert_dir }}"
    state: directory
    owner: root
    group: haproxy
    mode: "0750"
  become: true

- name: Check source TLS cert and key existence
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ haproxy_source_cert_path }}"
    - "{{ haproxy_source_key_path }}"
  register: haproxy_tls_sources

- name: Require TLS source cert and key
  ansible.builtin.assert:
    that:
      - haproxy_tls_sources.results | map(attribute='stat.exists') | min
    fail_msg: "Missing source TLS files for HAProxy PEM bundle."

- name: Build combined HAProxy PEM bundle from source cert and key
  ansible.builtin.shell: |
    set -euo pipefail
    tmp="$(mktemp)"
    cat "{{ haproxy_source_cert_path }}" "{{ haproxy_source_key_path }}" > "$tmp"
    chmod 0640 "$tmp"
    chown root:haproxy "$tmp"
    mv "$tmp" "{{ haproxy_pem_path }}"
  args:
    executable: /bin/bash
  become: true
  notify: Reload haproxy

- name: Render HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/haproxy -c -f %s"
  become: true
  notify: Reload haproxy

- name: Stop and disable competing ingress services when taking over 80/443
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - caddy
    - fluxgate
  failed_when: false
  become: true
  when: haproxy_replace_caddy | default(false) | bool

- name: Enable and start HAProxy service
  ansible.builtin.systemd:
    name: haproxy
    state: started
    enabled: true
  become: true
