---
haproxy_enabled: true
haproxy_replace_caddy: false
haproxy_config_path: "/etc/haproxy/haproxy.cfg"
haproxy_cert_dir: "/etc/haproxy/certs"
haproxy_pem_path: "/etc/haproxy/certs/agent-proxy.pem"
haproxy_source_cert_path: "/etc/caddy/tls/agent-proxy.crt"
haproxy_source_key_path: "/etc/caddy/tls/agent-proxy.key"
haproxy_stats_listen: "127.0.0.1:8404"
haproxy_legacy_metrics_listen: ""
haproxy_nbthread: "{{ ansible_facts['processor_vcpus'] | default(1) }}"
haproxy_h2_initial_window_size: 1048576
haproxy_bufsize: 32768
haproxy_timeout_tunnel: "3600s"

haproxy_vhosts:
  - jp-xconnect-01.svc.plus
  - jp-xconnect-02.svc.plus
  - jp-xconnect.svc.plus
  - tky-proxy.svc.plus

haproxy_xhttp_unix_socket: "/dev/shm/xray.sock"
haproxy_exporter_xhttp_upstream: "127.0.0.1:8080"
haproxy_exporter_tcp_upstream: "127.0.0.1:8081"
haproxy_default_response: "Agent Service Plus Node"
