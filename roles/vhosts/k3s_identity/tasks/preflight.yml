- name: Require explicit identity delivery contract
  ansible.builtin.assert:
    that:
      - k3s_identity_environment in ['sit', 'uat', 'prod']
      - lookup('env', 'K3S_IDENTITY_VAULT_TOKEN') | length > 0
      - lookup('env', 'K3S_IDENTITY_VAULT_TOKEN') != lookup('env', 'VAULT_TOKEN')
      - k3s_identity_cluster is match('^[a-z0-9][a-z0-9-]*$')
      - k3s_identity_api_server is match('^https://')
      - k3s_identity_tls_dir | length > 0
      - k3s_identity_state_dir is match("^/[^.]+$")
      - k3s_identity_checks.keys() | list | sort == ["auditor", "operator", "root"]
      - k3s_identity_checks | length > 0
      - k3s_identity_rbac_revision is match('^[0-9a-f]{40}$')
      - k3s_identity_rbac_kustomizations | length > 0
      - k3s_identity_rbac_wait_retries | int > 0
      - k3s_identity_rbac_wait_delay | int > 0
    fail_msg: Identity delivery requires a reviewed target, CA and real-identity acceptance contract
  no_log: true

- name: Require declared allowed probes for every Kubernetes identity
  ansible.builtin.assert:
    that:
      - k3s_identity_checks[item] | selectattr('allowed', 'equalto', true) | list | length > 0
    fail_msg: Each Kubernetes identity needs at least one declared allowed permission probe
  loop: [root, operator, auditor]

- name: Require declared business boundary allow and deny probes for operator
  ansible.builtin.assert:
    that:
      - k3s_identity_checks.operator | selectattr('allowed', 'equalto', true) | list | length > 0
      - k3s_identity_checks.operator | selectattr('allowed', 'equalto', false) | list | length > 0
    fail_msg: Operator acceptance must cover both its allowed business scope and denied cross-scope actions

- name: Reject denied expectations for the cluster-admin root identity
  ansible.builtin.assert:
    that:
      - k3s_identity_checks.root | selectattr('allowed', 'equalto', false) | list | length == 0
    fail_msg: Root is cluster-admin; its declared authorization probes must assert allowed capabilities only

- name: Require explicitly declared Flux RBAC dependencies
  ansible.builtin.assert:
    that:
      - item.name | default('') is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
      - item.namespace | default('') is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
  loop: '{{ k3s_identity_rbac_kustomizations }}'
