- name: Validate independent identity prerequisites
  ansible.builtin.import_tasks: preflight.yml

- name: Wait for declared GitOps RBAC at the reviewed revision
  ansible.builtin.import_tasks: rbac_wait.yml

- name: Read actual cluster identity before credential delivery
  ansible.builtin.command:
    argv: [kubectl, get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
  environment:
    KUBECONFIG: "{{ k3s_platform_kubeconfig_path }}"
  register: k3s_identity_actual_uid
  changed_when: false

- name: Require nonempty actual cluster identity
  ansible.builtin.assert:
    that: k3s_identity_actual_uid.stdout | trim | length > 0

- name: Bind newly initialized cluster UID from the actual API
  ansible.builtin.set_fact:
    k3s_identity_cluster_uid: '{{ k3s_identity_actual_uid.stdout }}'
  when: k3s_identity_cluster_uid | default('') | length == 0

- name: Verify cluster identity binding
  ansible.builtin.assert:
    that: k3s_identity_actual_uid.stdout == k3s_identity_cluster_uid

- name: Install master-local credential generator
  ansible.builtin.copy:
    src: bootstrap_k3s_identity_keys.py
    dest: "{{ k3s_platform_install_dir }}/bootstrap_k3s_identity_keys.py"
    owner: root
    group: root
    mode: '0700'

- name: Generate and verify all identities locally
  ansible.builtin.include_tasks: credential_phase.yml
  vars:
    k3s_identity_phase: local

- name: Deliver each independently authenticated identity
  ansible.builtin.include_tasks: identity_user.yml
  loop: [root, operator, auditor]
  loop_control:
    loop_var: k3s_identity_role

- name: Archive verified identities to Vault
  ansible.builtin.include_tasks: credential_phase.yml
  vars:
    k3s_identity_phase: archive

- name: Save real-identity authentication and authorization evidence
  ansible.builtin.copy:
    content: "{{ {'result': 'K3S_IDENTITIES_VERIFIED', 'cluster_uid': k3s_identity_cluster_uid, 'rbac_revision': k3s_identity_rbac_revision, 'principals': ['root', 'operator', 'auditor'], 'checks': 'actual-authentication-and-allow-deny'} | to_json }}\n"
    dest: '{{ k3s_platform_receipt_path }}.identities.json'
    mode: '0600'
  delegate_to: localhost
  become: false
  when: k3s_platform_receipt_path | default('') | length > 0
