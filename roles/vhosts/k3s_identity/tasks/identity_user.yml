- name: Resolve existing OS identity
  ansible.builtin.getent:
    database: passwd
    key: "{{ k3s_identity_role }}"

- name: Prepare private Kubernetes client directory
  become: true
  become_user: "{{ k3s_identity_role }}"
  ansible.builtin.file:
    path: "{{ getent_passwd[k3s_identity_role][4] }}/.kube"
    state: directory
    owner: "{{ k3s_identity_role }}"
    group: "{{ k3s_identity_role }}"
    mode: '0700'

- name: Read root-protected master-generated private Kubernetes configuration
  ansible.builtin.slurp:
    src: "{{ k3s_identity_state_dir }}/{{ k3s_identity_role }}/kubeconfig"
  register: k3s_identity_local_config
  no_log: true

- name: Deliver master-generated private Kubernetes configuration as its OS owner
  become: true
  become_user: "{{ k3s_identity_role }}"
  ansible.builtin.copy:
    content: "{{ k3s_identity_local_config.content | b64decode }}"
    dest: "{{ getent_passwd[k3s_identity_role][4] }}/.kube/identity-config"
    owner: "{{ k3s_identity_role }}"
    group: "{{ k3s_identity_role }}"
    mode: '0600'
  no_log: true
  diff: false

- name: Inspect the restricted user's default Kubernetes config path
  ansible.builtin.stat:
    path: "{{ getent_passwd[k3s_identity_role][4] }}/.kube/config"
    follow: false
  register: k3s_identity_default_config
  when: k3s_identity_role in ['operator', 'auditor']

- name: Reject an unmanaged restricted-user default kubeconfig
  ansible.builtin.assert:
    that:
      - >-
        not k3s_identity_default_config.stat.exists or
        (k3s_identity_default_config.stat.islnk | default(false) and
        k3s_identity_default_config.stat.lnk_target ==
        getent_passwd[k3s_identity_role][4] ~ '/.kube/identity-config')
    fail_msg: >-
      The user's ~/.kube/config already exists and is not the role-managed
      link to that user's identity-config; inspect it before changing anything.
  when: k3s_identity_role in ['operator', 'auditor']

- name: Make the restricted user identity the default kubectl config
  ansible.builtin.file:
    src: "{{ getent_passwd[k3s_identity_role][4] }}/.kube/identity-config"
    dest: "{{ getent_passwd[k3s_identity_role][4] }}/.kube/config"
    state: link
    owner: "{{ k3s_identity_role }}"
    group: "{{ k3s_identity_role }}"
    force: false
  when: k3s_identity_role in ['operator', 'auditor']

- name: Verify actual authenticated Kubernetes username
  ansible.builtin.command:
    argv: [kubectl, auth, whoami, -o, json]
  become: true
  become_user: "{{ k3s_identity_role }}"
  environment:
    KUBECONFIG: "{{ getent_passwd[k3s_identity_role][4] }}/.kube/identity-config"
  register: k3s_identity_whoami
  changed_when: false

- name: Require expected independently authenticated subject
  ansible.builtin.assert:
    that:
      - (k3s_identity_whoami.stdout | from_json).status.userInfo.username == k3s_identity_role
      - "'system:masters' not in ((k3s_identity_whoami.stdout | from_json).status.userInfo.groups | default([]))"

- name: Verify the default kubectl config uses the restricted identity
  ansible.builtin.command:
    argv: [/usr/bin/env, -u, KUBECONFIG, kubectl, auth, whoami, -o, json]
  become: true
  become_user: "{{ k3s_identity_role }}"
  environment:
    HOME: "{{ getent_passwd[k3s_identity_role][4] }}"
  register: k3s_identity_default_whoami
  changed_when: false
  when: k3s_identity_role in ['operator', 'auditor']

- name: Require the default Kubernetes identity to remain non-admin
  ansible.builtin.assert:
    that:
      - (k3s_identity_default_whoami.stdout | from_json).status.userInfo.username == k3s_identity_role
      - "'system:masters' not in ((k3s_identity_default_whoami.stdout | from_json).status.userInfo.groups | default([]))"
  when: k3s_identity_role in ['operator', 'auditor']

- name: Validate declared allow and deny cases with actual credentials
  ansible.builtin.command:
    argv: "{{ ['kubectl', 'auth', 'can-i', item.verb, item.resource.split('/')[0], '--namespace', item.namespace] + (['--subresource=' ~ item.resource.split('/')[1]] if '/' in item.resource else []) }}"
  become: true
  become_user: "{{ k3s_identity_role }}"
  environment:
    KUBECONFIG: "{{ getent_passwd[k3s_identity_role][4] }}/.kube/identity-config"
  loop: "{{ k3s_identity_checks[k3s_identity_role] }}"
  register: k3s_identity_authorization
  changed_when: false
  failed_when: >-
    (k3s_identity_authorization.stdout | trim != ('yes' if item.allowed else 'no')) or
    (k3s_identity_authorization.rc != (0 if item.allowed else 1))

- name: Require mandatory sensitive-operation denials under actual non-admin identity
  ansible.builtin.command:
    argv: "{{ ['kubectl', 'auth', 'can-i', item.verb, item.resource.split('/')[0], '--namespace', k3s_identity_checks[k3s_identity_role][0].namespace] + (['--subresource=' ~ item.resource.split('/')[1]] if '/' in item.resource else []) }}"
  become: true
  become_user: "{{ k3s_identity_role }}"
  environment:
    KUBECONFIG: "{{ getent_passwd[k3s_identity_role][4] }}/.kube/identity-config"
  loop:
    - {verb: get, resource: secrets}
    - {verb: create, resource: pods/exec}
    - {verb: create, resource: pods/attach}
    - {verb: create, resource: pods/portforward}
    - {verb: get, resource: nodes/proxy}
    - {verb: create, resource: serviceaccounts/token}
    - {verb: bind, resource: roles.rbac.authorization.k8s.io}
    - {verb: escalate, resource: clusterroles.rbac.authorization.k8s.io}
    - {verb: impersonate, resource: users}
    - {verb: create, resource: certificatesigningrequests.certificates.k8s.io}
  register: k3s_identity_denial
  changed_when: false
  failed_when: k3s_identity_denial.stdout | trim != 'no' or k3s_identity_denial.rc != 1
  when: k3s_identity_role != 'root'

- name: Require auditor business write denials
  ansible.builtin.command:
    argv: "{{ ['kubectl', 'auth', 'can-i', item, 'deployments.apps', '--namespace', k3s_identity_checks[k3s_identity_role][0].namespace] }}"
  become: true
  become_user: auditor
  environment:
    KUBECONFIG: "{{ getent_passwd[k3s_identity_role][4] }}/.kube/identity-config"
  loop: [create, update, patch, delete]
  register: k3s_identity_auditor_denial
  changed_when: false
  failed_when: k3s_identity_auditor_denial.stdout | trim != 'no' or k3s_identity_auditor_denial.rc != 1
  when: k3s_identity_role == 'auditor'
