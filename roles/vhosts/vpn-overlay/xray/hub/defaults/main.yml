xray_main_port: 1443
xray_cert_path: "/etc/ssl/onwalk.net.pem"
xray_key_path: "/etc/ssl/onwalk.net.key"
xray_bin_path: /usr/local/bin/xray
xray_config_dir: /usr/local/etc/xray
# Optional XConnect transport profile. Empty preserves the existing 1443/TCP
# role for non-XConnect consumers; XConnect sets this explicitly to XHTTP/443.
xconnect_transport_kind: ""
xconnect_transport_port: 443
xconnect_transport_path: /xconnect
xconnect_transport_mode: auto
xconnect_transport_host: ""
