---
# This role writes only local Prometheus textfile metrics.  node_exporter and
# Vector remain the reusable collection/forwarding roles.
xconnect_observability_role: one
xconnect_observability_environment: uat
xconnect_observability_instance: "{{ inventory_hostname }}"
xconnect_observability_wireguard_interface: xconone0
xconnect_observability_state_dir: /var/lib/xconnect-one
xconnect_observability_metrics_dir: /var/lib/node_exporter
xconnect_observability_metrics_file: "{{ xconnect_observability_metrics_dir }}/xconnect.prom"
xconnect_observability_collector_path: /usr/local/lib/xconnect-observability/collect
xconnect_observability_collector_interval_seconds: 15
