# ---------------------------------------------------------------------------
# OS 通用: ansible-pull 自我收敛定时器
# ---------------------------------------------------------------------------
# 主机自己按周期拉取 playbooks 仓库并收敛。这属于 OS 基线能力(与 SSH、时区、
# 日志轮转同级), 因此放在 common, 而不是某个业务 role 或 k3s bootstrap: 任何
# 主机——不论是否 k3s、是否承载代理——都应该能自我收敛, 不该等控制面推送。
common_ansible_pull_enabled: false
common_ansible_pull_repo_url: https://github.com/ai-workspace-infra/playbooks.git
common_ansible_pull_checkout: main
common_ansible_pull_checkout_dir: /var/lib/ansible-pull
common_ansible_pull_path: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
common_ansible_pull_timeout_sec: 1800
common_ansible_pull_kubeconfig: /etc/rancher/k3s/k3s.yaml
common_ansible_pull_manage_prerequisites: true

# 每个入口一对独立的 service/timer, 各自 checkout 目录、周期与日志。
# 空列表表示该主机不需要任何 pull 入口。
common_ansible_pull_entrypoints: []
# 例:
#   - name: ansible-pull-observability
#     playbook: pull_observability_agent.yml
#     schedule: "*-*-* 04:23:00"
#     randomized_delay_sec: 1800
#     environment_file: /etc/ansible-pull/gitops-declaration.env

enable_set_timezone: true       # 默认启用 Set timezone
enable_set_hostname: true       # 默认启用 Set hostname
enable_all_hosts_update: false  # 默认不更新所有主机的条目

rsyslog_log_rotation:           # 可选的日志管理配置
  enable: true                  # 启用 rsyslog 日志管理
  rotate_count: 4               # 默认保留的日志文件数量
  rotate_frequency: daily      # 默认每周轮换, 可选：daily, hourly
  max_log_size: 100M            # 默认日志文件最大大小

journald_log_rotation:          # 启用 journald 日志管理
  enable: true                  # 启用 journald 日志管理
  max_log_size: 100M            # 默认日志文件最大大小
  max_files: 100                # 默认保留的最大日志文件数
  max_file_sec: 1month          # 默认日志文件保存的最大时长
  system_max_use: 1G            # 默认系统日志最大使用空间
  runtime_max_use: 500M         # 默认运行时日志最大使用空间

# 总开关
enable_common: true

# macOS (Darwin) baseline: shared Homebrew CLI prerequisites used by helper
# scripts across roles (e.g. jq is required by vault's init_vault_admin.sh).
# macOS ships curl/base64 already; jq is not present by default.
#
# docker/docker-compose/colima provide a headless container runtime on macOS
# (colima runs the Docker daemon in a lightweight VM; the docker formula is the
# CLI only, no Docker Desktop). Needed for container workloads such as the qmd
# PostgreSQL memory-bridge integration tests (test/pg-compose.yml). Each formula
# installs a /opt/homebrew/bin/<name> binary, so the task's `creates` check stays
# idempotent. After install, start the runtime once with `colima start`.
common_darwin_brew_packages:
  - jq
  - docker
  - docker-compose
  - colima

common_firewall:
  enabled: true
  ssh_port: 22
  http_port: 80
  https_port: 443
  allow_comments:
    ssh: XWorkmate SSH
    http: XWorkmate HTTP
    https: XWorkmate HTTPS

common_security_limits:
  enabled: true
  nofile_soft: 1048576
  nofile_hard: 1048576
  root_nofile_soft: 1048576
  root_nofile_hard: 1048576
  pam_enable: true
  pam_files:
    - /etc/pam.d/common-session
    - /etc/pam.d/common-session-noninteractive

repo:
  apt:
    enabled: false              # 是否配置仓库/keys
    enable_universe: false      # Ubuntu 是否启用 universe 仓库
    auto_update_cache: true     # 是否在 repo_setup 后自动 apt update
    key_dir: /etc/apt/keyrings  # keyring 目录
    keyrings: []                # 自定义 keyring 定义（由调用方传入）
    legacy_paths:               # 清理的遗留路径
      - /etc/apt/sources.list.d/hashicorp.sources
      - /usr/share/keyrings/hashicorp-archive-keyring.gpg
    entries: []                 # 声明式仓库定义
  yum:
    enabled: false              # 预留 RPM 系列配置
    entries: []
    cleanup_paths: []

packages:
  apt:
    enabled: true               # 是否安装软件包
    base_dependencies:          # APT 前置依赖（避免未规范化源时更新）
      - ca-certificates
      - gnupg
    list:                       # 要安装的软件包
      - auditd
      - uidmap
      - fuse-overlayfs
  yum:
    enabled: true
    list:
      - audit
      - uidmap
      - fuse-overlayfs

packages_cleanup:
  enabled: false
  ubuntu:
    purge: true
    list:
      - snapd
      - resolvconf
      - popularity-contest
      - apport
      - whoopsie
      - modemmanager

# Optional payment-audit / migration identity.  Keep this disabled for every
# common consumer unless a host explicitly opts in via inventory or extra vars.
common_readonly_ssh_user_enabled: false
common_readonly_ssh_user_name: readonly
common_readonly_ssh_user_profile: readonly
common_readonly_ssh_user_comment: "Read-only SSH user"
common_readonly_ssh_user_authorized_keys: []
common_readonly_ssh_user_manage_sshd: true
common_readonly_ssh_user_manage_postgresql: false
common_readonly_ssh_user_postgresql_password: ""
common_readonly_ssh_user_postgresql_passwordless_local: false
common_readonly_ssh_user_postgresql_role: '{{ common_readonly_ssh_user_name }}'
common_readonly_ssh_user_postgresql_admin_password: ""
common_readonly_ssh_user_postgresql_databases: []
common_readonly_ssh_user_postgresql_default_privilege_owners:
  - postgres

# Explicit fresh-node profile; business domain aliases must not become node names.
common_node_name: '{{ k3s_platform_node_name | default(inventory_hostname, true) }}'
common_node_require_data_volume: false

# Instance identity format is provider-owned. Akamai/Linode ids are numeric;
# most providers (UCloud UHost/ULightHost included) use prefixed string ids.
common_node_instance_id_patterns:
  akamai-cloud: '^[1-9][0-9]*$'
common_node_instance_id_pattern_default: '^[A-Za-z][A-Za-z0-9._-]{2,63}$'

# OPS-role operator K3s sudo (operator_k3s_sudo.yml, included by os_identity.yml).
# Host/group vars only toggle it; the command list below is the single definition.
common_operator_k3s_sudo_enabled: false
common_operator_k3s_sudo_user: operator
common_operator_k3s_sudo_file: /etc/sudoers.d/operator-k3s
common_operator_k3s_sudo_commands:
  - /usr/local/bin/k3s
  - /usr/local/bin/ctr
  - /usr/local/bin/kubectl
  - /usr/local/bin/flux

# os_identity.yml public-key source: "http" (Vault API with VAULT_TOKEN, default)
# or "vault-cli" (the controller's existing `vault` CLI login; no token export).
common_os_identity_key_source: http

# Explicit adoption of pre-existing operator/auditor accounts that lack the
# root-owned ownership marker. Enable per host only after inspection; the role
# then writes the 0600 markers instead of failing. Default: refuse.
common_os_identity_adopt_existing: false
# Per-account supplementary groups an adopted legacy account may keep, e.g.
#   {operator: [sudo]}. Anything else still fails the group assertion.
common_os_identity_preserve_groups: {}
# Accounts whose existing password state is left untouched (no lock/unlock).
common_os_identity_preserve_password: []

# OS families whose identity model this role validates: explicit sudoers files,
# shadow access denial, sshd -T policy probes and runuser login checks all exist
# on Debian and RedHat family hosts. Review any other family before adding it.
common_os_identity_supported_families: [Debian, RedHat]

# Remove a conflicting legacy system account (uid < 1000, no ownership marker)
# before creating the reviewed role account. Off by default: deleting a system
# account is a host decision and must be declared per host.
common_os_identity_remove_legacy_system_accounts: false
