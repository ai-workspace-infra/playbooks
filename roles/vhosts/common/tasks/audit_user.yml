- name: Common | create independent system audit group
  ansible.builtin.group:
    name: cluster-audit
    system: true

- name: Common | create independent locked system audit identity
  ansible.builtin.user:
    name: cluster-audit
    group: cluster-audit
    system: true
    create_home: false
    password_lock: true
    shell: /usr/sbin/nologin
    groups: ''
    append: false
