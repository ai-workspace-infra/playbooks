---
# Debian/Ubuntu 走 apt：play 的 module_defaults.apt.lock_timeout(模板值)经
# ansible.builtin.package 间接派发到 apt 时不渲染 → lock_timeout 收到字面 "{{ ... }}"
# 报 int 转换失败（与 xworkmate_bridge/litellm 同类修复）。
# The apt module's cache refresh reports an empty reason when a source fails
# ("Failed to update apt cache after 5 retries: "). apt-get prints the failing
# source (for example a repository whose Release file is gone), and Ansible
# shows that output when this task fails.
- name: Fail2ban | Refresh the apt package index (Debian/Ubuntu)
  ansible.builtin.command:
    argv: [apt-get, update]
  register: common_apt_index
  changed_when: false
  retries: 3
  delay: 10
  until: common_apt_index.rc == 0
  become: true
  when: ansible_os_family == 'Debian'

- name: Fail2ban | Install Fail2ban package (Debian/Ubuntu via apt)
  ansible.builtin.apt:
    name: fail2ban
    state: present
  become: true
  when: ansible_os_family == 'Debian'

- name: Fail2ban | probe the configured repositories (non-Debian)
  ansible.builtin.command:
    argv: [dnf, -q, list, --available, fail2ban]
  register: common_fail2ban_probe
  changed_when: false
  failed_when: false
  become: true
  when: ansible_os_family != 'Debian'

- name: Fail2ban | record whether the package can be installed on this host
  ansible.builtin.set_fact:
    common_fail2ban_installable: "{{ (ansible_os_family == 'Debian') or ((common_fail2ban_probe.rc | default(1)) == 0) }}"

- name: Fail2ban | explain the skipped installation
  ansible.builtin.debug:
    msg: >-
      fail2ban is not available in the configured repositories on
      {{ ansible_distribution }} {{ ansible_distribution_version }}; enable EPEL
      (or an equivalent reviewed source) before this hardening control is claimed.
      The package install, jail configuration and service stay unmanaged here.
  when: not (common_fail2ban_installable | bool)

- name: Fail2ban | Install Fail2ban package (non-Debian)
  ansible.builtin.package:
    name: fail2ban
    state: present
  become: true
  when:
    - ansible_os_family != 'Debian'
    - common_fail2ban_installable | bool

- name: Fail2ban | Deploy jail.local configuration
  when: common_fail2ban_installable | bool
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    owner: root
    group: root
    content: |
      [DEFAULT]
      bantime = 86400
      findtime = 600
      maxretry = 3

      [sshd]
      enabled = true
      port = ssh
  become: true
  notify: Restart Fail2ban

- name: Fail2ban | Ensure service is started and enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  become: true
  when:
    - not ansible_check_mode
    - common_fail2ban_installable | bool
