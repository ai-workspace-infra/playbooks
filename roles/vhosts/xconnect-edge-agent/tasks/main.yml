---
# Pure XConnect Edge Agent Control Plane Role (L3).
# Installs /usr/local/bin/agent-proxy, manages /etc/agent/account-agent.yaml and
# /etc/agent/conf.d/*.yaml profiles, and reconciles xconnect-edge-agent.service.

- name: Validate requested Edge Agent operation
  ansible.builtin.assert:
    that:
      - agent_proxy_operation in ['deploy', 'upgrade', 'print-arch']
    fail_msg: "xconnect-edge-agent agent_proxy_operation must be deploy, upgrade, or print-arch."
  when: xconnect_edge_agent_enabled | bool

- name: Deploy XConnect Edge Agent service and configuration
  ansible.builtin.import_tasks: deploy.yml
  when:
    - xconnect_edge_agent_enabled | bool
    - agent_proxy_operation == 'deploy'
  tags: [install, configure, validate]

- name: Upgrade XConnect Edge Agent binary without changing configuration
  ansible.builtin.import_tasks: upgrade.yml
  when:
    - xconnect_edge_agent_enabled | bool
    - agent_proxy_operation == 'upgrade'
  tags: [install, validate]

- name: Report target Edge Agent binary architecture
  ansible.builtin.import_tasks: print_arch.yml
  when:
    - xconnect_edge_agent_enabled | bool
    - agent_proxy_operation == 'print-arch'
  tags: [validate]
