---
- name: Validate OS support for AI Desktop addon
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "ai_desktop_addon currently supports Debian-family hosts only."
  when: ai_desktop_addon_enabled | bool

# 1. 浏览器收敛：保留 /usr/bin/google-chrome-stable，清理 /usr/local/bin/chromium 包装脚本
- name: Remove deprecated Chromium wrapper script if present
  ansible.builtin.file:
    path: "{{ ai_desktop_addon_chromium_wrapper_path }}"
    state: absent
  become: true
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_remove_chromium_wrapper | bool

- name: Verify Google Chrome stable is installed
  ansible.builtin.stat:
    path: "{{ ai_desktop_addon_chrome_path }}"
  register: ai_desktop_addon_chrome_stat
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_enforce_chrome | bool

- name: Ensure Google Chrome stable is present
  ansible.builtin.assert:
    that:
      - ai_desktop_addon_chrome_stat.stat.exists | bool
    fail_msg: "Google Chrome stable is required at {{ ai_desktop_addon_chrome_path }} but not found."
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_enforce_chrome | bool

# 2. 系统必备软件包与辅助工具 (Python3, xdotool, xclip, curl, jq 等)
- name: Install AI Desktop addon system packages
  ansible.builtin.apt:
    name: "{{ ai_desktop_addon_system_packages }}"
    state: present
    install_recommends: false
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none
  become: true
  when: ai_desktop_addon_enabled | bool

# 3. 核心运行时：Node.js LTS (通过 roles/vhosts/nodejs)
- name: Include Node.js role for AI Desktop addon
  ansible.builtin.include_role:
    name: roles/vhosts/nodejs
  vars:
    nodejs_major_version: "{{ ai_desktop_addon_nodejs_major_version }}"
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_nodejs_enabled | bool

# 4. Agent CLI 与 CodeAgent npm 全局工具安装
- name: Install global npm packages for AI Desktop
  ansible.builtin.command:
    cmd: "npm install -g {{ item }}"
  loop: "{{ ai_desktop_addon_npm_packages + ([ai_desktop_addon_grok_npm_package ~ '@' ~ ai_desktop_addon_grok_version] if (ai_desktop_addon_grok_enabled | bool) else []) }}"
  register: ai_desktop_addon_npm_install
  changed_when: "'added' in ai_desktop_addon_npm_install.stdout or 'updated' in ai_desktop_addon_npm_install.stdout"
  become: true
  when:
    - ai_desktop_addon_enabled | bool
    - (ai_desktop_addon_npm_packages | length > 0) or (ai_desktop_addon_grok_enabled | bool)

- name: Verify Grok CLI is runnable
  ansible.builtin.command:
    cmd: grok --version
  register: ai_desktop_addon_grok_check
  changed_when: false
  become: true
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_grok_enabled | bool

# Official immutable artifact; no remote installer or interactive login.
- name: Validate Antigravity artifact for host architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ai_desktop_addon_agy_artifacts
      - ai_desktop_addon_agy_version | length > 0
    fail_msg: "No pinned Antigravity CLI artifact is configured for {{ ansible_architecture }}."
  tags: [agy]
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_agy_enabled | bool

- name: Create Antigravity artifact cache
  ansible.builtin.file:
    path: "/var/cache/ai-desktop-addon/agy/{{ ai_desktop_addon_agy_version }}-{{ ansible_architecture }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [agy]
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_agy_enabled | bool

- name: Download and verify pinned Antigravity archive
  ansible.builtin.get_url:
    url: "{{ ai_desktop_addon_agy_artifacts[ansible_architecture].url }}"
    checksum: "sha512:{{ ai_desktop_addon_agy_artifacts[ansible_architecture].sha512 }}"
    dest: "/var/cache/ai-desktop-addon/agy/{{ ai_desktop_addon_agy_version }}-{{ ansible_architecture }}/cli.tar.gz"
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [agy]
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_agy_enabled | bool

- name: Extract Antigravity CLI
  ansible.builtin.unarchive:
    src: "/var/cache/ai-desktop-addon/agy/{{ ai_desktop_addon_agy_version }}-{{ ansible_architecture }}/cli.tar.gz"
    dest: "/var/cache/ai-desktop-addon/agy/{{ ai_desktop_addon_agy_version }}-{{ ansible_architecture }}"
    remote_src: true
    include: [antigravity]
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [agy]
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_agy_enabled | bool

- name: Install Antigravity CLI
  ansible.builtin.copy:
    src: "/var/cache/ai-desktop-addon/agy/{{ ai_desktop_addon_agy_version }}-{{ ansible_architecture }}/antigravity"
    dest: "{{ ai_desktop_addon_agy_bin_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [agy]
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_agy_enabled | bool

- name: Verify Antigravity CLI version
  ansible.builtin.command:
    argv: ["{{ ai_desktop_addon_agy_bin_path }}", "--version"]
  register: ai_desktop_addon_agy_check
  changed_when: false
  failed_when: ai_desktop_addon_agy_check.rc != 0 or ai_desktop_addon_agy_version not in ai_desktop_addon_agy_check.stdout
  tags: [agy]
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_agy_enabled | bool

# 5. 网络与凭据工具：HashiCorp Vault CLI
- name: Check if Vault binary exists
  ansible.builtin.command:
    cmd: vault --version
  register: ai_desktop_addon_vault_check
  changed_when: false
  failed_when: false
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_install_vault_cli | bool

- name: Resolve system architecture for Vault binary
  ansible.builtin.set_fact:
    ai_desktop_addon_vault_arch: >-
      {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_install_vault_cli | bool

- name: Download and install Vault CLI binary
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/vault/{{ ai_desktop_addon_vault_version }}/vault_{{ ai_desktop_addon_vault_version }}_linux_{{ ai_desktop_addon_vault_arch }}.zip"
    dest: /usr/local/bin/
    remote_src: true
    mode: "0755"
    owner: root
    group: root
  become: true
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_install_vault_cli | bool
    - ai_desktop_addon_vault_check.rc != 0

# 6. CPA 矩阵账号本地 Auth 目录最小权限保障 (0700 单用户隔离)
- name: Ensure CPA base directory exists
  ansible.builtin.file:
    path: "{{ ai_desktop_addon_cpa_root }}"
    state: directory
    owner: root
    group: "{{ ai_desktop_addon_cpa_group }}"
    mode: "0755"
  become: true
  when: ai_desktop_addon_enabled | bool

- name: Ensure CPA instance and auth directories exist with strict permissions
  ansible.builtin.file:
    path: "{{ ai_desktop_addon_cpa_root }}/{{ item.id }}/auth"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ ai_desktop_addon_cpa_group }}"
    mode: "0700"
  loop: "{{ ai_desktop_addon_cpa_matrix }}"
  become: true
  when:
    - ai_desktop_addon_enabled | bool
    - ai_desktop_addon_cpa_matrix | length > 0
