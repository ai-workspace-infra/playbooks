---
ai_desktop_addon_enabled: true

# 浏览器规范：保留 /usr/bin/google-chrome-stable，彻底移除已禁用的 /usr/local/bin/chromium 包装脚本
ai_desktop_addon_enforce_chrome: true
ai_desktop_addon_remove_chromium_wrapper: true
ai_desktop_addon_chromium_wrapper_path: /usr/local/bin/chromium
ai_desktop_addon_chrome_path: /usr/bin/google-chrome-stable

# 系统基础与工具依赖
ai_desktop_addon_system_packages:
  - python3
  - python3-pip
  - python3-venv
  - xdotool
  - xclip
  - xsel
  - curl
  - jq
  - unzip
  - git
  - ca-certificates

# 核心运行时：Node.js LTS (用于驱动 npm 全局 CLI)
ai_desktop_addon_nodejs_enabled: true
ai_desktop_addon_nodejs_major_version: 22

# Agent CLI 与 CodeAgent 工具 (npm 全局包)
ai_desktop_addon_npm_packages:
  - "@anthropic-ai/claude-code"
  - "@openai/codex"
  - "@google/gemini-cli"
  - opencode-ai

# Vault CLI 安装控制
ai_desktop_addon_install_vault_cli: true
ai_desktop_addon_vault_version: "1.18.2"

# Antigravity CLI: pinned official manifest artifact and SHA-512.
ai_desktop_addon_agy_enabled: true
ai_desktop_addon_agy_bin_path: /usr/local/bin/agy
ai_desktop_addon_agy_version: "1.5.3"
ai_desktop_addon_agy_artifacts:
  x86_64:
    url: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.3-6604829099950080/linux-x64/cli_linux_x64.tar.gz
    sha512: e363e1b17daaac2589f18e6973429c039fd5a5e5c15e9c0852fa349836f3992b10fe84732bc8d8c8208e149f0304f15aba9dec696d12efeed03917492c0580eb
  aarch64:
    url: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.3-6604829099950080/linux-arm/cli_linux_arm64.tar.gz
    sha512: c2fac818b3c1bb224079df03a714ccba99728b6a3a41d86d247ab2feb8582a43840c5032f1c2b75e72667623d5503e7ffda2712c4f37b6ee19f99c3fcfb25bae

# Grok CLI：xAI 官方 npm 包（发布者 xai-security@x.ai，bin 为 grok），固定版本保证可复现。
# 升级时需复核发布者与 dist.integrity 后再调整版本。
ai_desktop_addon_grok_enabled: true
ai_desktop_addon_grok_npm_package: "@xai-official/grok"
ai_desktop_addon_grok_version: "1.0.77"

# CPA 隔离目录规范矩阵（验证与确保所有 CPA 账号的本地 auth 目录存在并具备 0700 最小权限）
ai_desktop_addon_cpa_root: /var/lib/ai-aggregator/cpa
ai_desktop_addon_cpa_group: ai-aggregator
ai_desktop_addon_cpa_matrix:
  - id: cpa-claude-01
    user: ai-cpa-cpa-claude-01
    provider: anthropic
    cli: claude
  - id: cpa-codex-01
    user: ai-cpa-cpa-codex-01
    provider: openai
    cli: codex
  - id: cpa-antigravity-01
    user: ai-cpa-cpa-antigravity-01
    provider: google
    cli: antigravity
  - id: cpa-grok-01
    user: ai-cpa-cpa-grok-01
    provider: xai
    cli: grok
