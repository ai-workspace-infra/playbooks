---
# Pure Xray-core binary and routing asset installer (L0 foundation role).
# Reads legacy xray_* variables as defaults for backward compatibility.

xray_core_enabled: "{{ xray_enabled | default(true) }}"
xray_core_version: "{{ xray_version | default('v26.3.27') }}"
xray_core_binary_path: "{{ xray_binary_path | default('/usr/local/bin/xray') }}"
xray_core_asset_dir: "/usr/local/share/xray"
xray_core_cache_dir: "/var/cache/xray-core"

# Xray uses arm64-v8a for ARM64 and 64 for x86-64.
xray_core_release_asset_arch: >-
  {{ xray_release_asset_arch | default('arm64-v8a' if ansible_architecture in ['aarch64', 'arm64'] else '64') }}
xray_core_release_sha256: >-
  {{ xray_release_sha256 | default(
       '4d30283ae614e3057f730f67cd088a42be6fdf91f8639d82cb69e48cde80413c'
       if xray_core_release_asset_arch == 'arm64-v8a'
       else '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae'
     ) }}
xray_core_release_archive_path: >-
  {{ xray_release_archive_path | default(xray_core_cache_dir ~ '/Xray-linux-' ~ xray_core_release_asset_arch ~ '.zip') }}
xray_core_release_url: >-
  {{ xray_release_url | default('https://github.com/XTLS/Xray-core/releases/download/' ~ xray_core_version ~ '/Xray-linux-' ~ xray_core_release_asset_arch ~ '.zip') }}
