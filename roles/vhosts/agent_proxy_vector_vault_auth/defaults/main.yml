---
vector_group: vector
agent_proxy_vector_vault_auth_vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default('', true) }}"
agent_proxy_vector_vault_auth_kv_path: "{{ lookup('ansible.builtin.env', 'AGENT_PROXY_VECTOR_VAULT_KV_PATH') | default('', true) }}"
agent_proxy_vector_vault_auth_tls_kv_path: "{{ lookup('ansible.builtin.env', 'VAULT_TLS_SECRET_PATH') | default('', true) }}"
agent_proxy_vector_vault_auth_cert_mount: auth/cert
agent_proxy_vector_vault_auth_cert_role: ""
agent_proxy_vector_vault_auth_client_cert_file: /etc/vault.d/agent-proxy-vector-auth/client.crt
agent_proxy_vector_vault_auth_client_key_file: /etc/vault.d/agent-proxy-vector-auth/client.key
agent_proxy_vector_vault_auth_config_dir: /etc/vault.d/agent-proxy-vector-auth
agent_proxy_vector_vault_auth_state_dir: /run/vault-agent/agent-proxy-vector-auth
agent_proxy_vector_vault_auth_runtime_dir: /run/vector
agent_proxy_vector_vault_auth_file: /run/vector/remote-write-auth.json
agent_proxy_vector_vault_auth_render_interval: 5m
agent_proxy_vector_vault_auth_sync_interval: 5m
agent_proxy_vector_vault_auth_version: "1.21.4"
agent_proxy_vector_vault_auth_sha256_amd64: 889b681990fe221b884b7932fa9c9dd0ee9811b9349554f1aa287ab63c9f3dae
agent_proxy_vector_vault_auth_sha256_arm64: 1104ef701aad16e104e2e7b4d2a02a6ec993237559343f3097ac63a00b42e85d
