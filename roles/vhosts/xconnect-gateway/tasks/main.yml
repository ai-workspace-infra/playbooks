---
- name: Validate XConnect gateway bootstrap contract
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - ansible_service_mgr == "systemd"
      - xconnect_gateway_shadow_mode | bool
      - xconnect_gateway_proxy_core == "xray"
      - xconnect_gateway_xray_required_version | string | trim | length > 0
      - xconnect_gateway_snapshot_schema_min | int >= 1
      - xconnect_gateway_snapshot_schema_max | int >= xconnect_gateway_snapshot_schema_min | int
      - xconnect_gateway_empty_peer_snapshot_policy == "reject"
      - xconnect_gateway_config_root is match('^/')
      - xconnect_gateway_state_root is match('^/')
      - xconnect_gateway_runtime_root is match('^/')
    fail_msg: >-
      XConnect-One Batch 01 supports Linux/systemd shadow mode with the pinned
      Xray-core runtime and reject-on-empty snapshot protection only.

- name: Validate enabled gateway requirements
  ansible.builtin.assert:
    that:
      - xconnect_gateway_node_id | string | trim | length > 0
      - xconnect_gateway_control_plane_url is match('^https://')
      - xconnect_gateway_snapshot_signing_public_key | string | trim | length > 0
    fail_msg: >-
      An enabled gateway requires a node ID, an HTTPS control-plane URL, and a
      snapshot signing public key.
  when: xconnect_gateway_enabled | bool

- name: Install XConnect gateway bootstrap dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3
      - wireguard-tools
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Create XConnect gateway system group
  ansible.builtin.group:
    name: "{{ xconnect_gateway_group }}"
    system: true
    state: present

- name: Create XConnect gateway system user
  ansible.builtin.user:
    name: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    home: "{{ xconnect_gateway_state_root }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    state: present

- name: Create XConnect gateway configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ xconnect_gateway_config_root }}"
      mode: "0750"
    - path: "{{ xconnect_gateway_provider_dir }}"
      mode: "0750"

- name: Create XConnect gateway state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    mode: "0750"
  loop:
    - "{{ xconnect_gateway_state_root }}"
    - "{{ xconnect_gateway_candidate_dir }}"
    - "{{ xconnect_gateway_last_known_good_dir }}"
    - "{{ xconnect_gateway_evidence_dir }}"
    - "{{ xconnect_gateway_runtime_root }}"
    - "{{ xconnect_gateway_log_root }}"

- name: Install XConnect gateway agent binary
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_agent_binary_source }}"
    dest: "{{ xconnect_gateway_agent_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  when: xconnect_gateway_agent_binary_source | string | trim | length > 0
  notify: Restart xconnect gateway agent

- name: Install XConnect gateway contract validator
  ansible.builtin.copy:
    src: xconnect-gateway-validate.py
    dest: /usr/local/libexec/xconnect-gateway-validate
    owner: root
    group: root
    mode: "0755"

- name: Install XConnect gateway contract schemas
  ansible.builtin.copy:
    src: "contracts/{{ item }}"
    dest: "{{ xconnect_gateway_config_root }}/{{ item }}"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  loop:
    - gateway-provider-manifest.schema.json
    - gateway-snapshot.schema.json

- name: Provision optional control-plane credential file
  ansible.builtin.copy:
    content: "XCONNECT_GATEWAY_TOKEN={{ xconnect_gateway_control_plane_token }}\n"
    dest: "{{ xconnect_gateway_credentials_path }}"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  no_log: true
  when: xconnect_gateway_manage_credentials | bool

- name: Provision snapshot signing public key
  ansible.builtin.copy:
    content: "{{ xconnect_gateway_snapshot_signing_public_key | trim }}\n"
    dest: "{{ xconnect_gateway_signing_public_key_path }}"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Render XConnect gateway provider manifest candidate
  ansible.builtin.template:
    src: gateway-provider.json.j2
    dest: "{{ xconnect_gateway_provider_manifest_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Render XConnect gateway configuration candidate
  ansible.builtin.template:
    src: gateway.json.j2
    dest: "{{ xconnect_gateway_config_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Validate XConnect gateway candidate contracts
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xconnect-gateway-validate
      - --config
      - "{{ xconnect_gateway_config_path }}.candidate"
      - --provider
      - "{{ xconnect_gateway_provider_manifest_path }}.candidate"
  changed_when: false
  when: not ansible_check_mode

- name: Promote validated XConnect gateway provider manifest
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_provider_manifest_path }}.candidate"
    dest: "{{ xconnect_gateway_provider_manifest_path }}"
    remote_src: true
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  when: not ansible_check_mode
  notify: Restart xconnect gateway agent

- name: Promote validated XConnect gateway configuration
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_config_path }}.candidate"
    dest: "{{ xconnect_gateway_config_path }}"
    remote_src: true
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  when: not ansible_check_mode
  notify: Restart xconnect gateway agent

- name: Deploy XConnect gateway systemd unit
  ansible.builtin.template:
    src: xconnect-gateway-agent.service.j2
    dest: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart xconnect gateway agent

- name: Inspect required XConnect gateway binaries
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ xconnect_gateway_agent_binary_path }}"
    - "{{ xconnect_gateway_xray_binary_path }}"
  register: xconnect_gateway_required_binaries
  when: xconnect_gateway_enabled | bool

- name: Assert enabled gateway binaries exist
  ansible.builtin.assert:
    that:
      - xconnect_gateway_required_binaries.results[0].stat.exists
      - xconnect_gateway_required_binaries.results[0].stat.executable
      - xconnect_gateway_required_binaries.results[1].stat.exists
      - xconnect_gateway_required_binaries.results[1].stat.executable
    fail_msg: >-
      Enabling XConnect gateway requires executable xconnect-gateway-agent and
      Xray-core binaries at the configured paths.
  when: xconnect_gateway_enabled | bool

- name: Read installed Xray-core version
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_xray_binary_path }}"
      - version
  register: xconnect_gateway_xray_version
  changed_when: false
  when:
    - xconnect_gateway_enabled | bool
    - not ansible_check_mode
- name: Assert installed Xray-core release is pinned
  ansible.builtin.assert:
    that:
      - xconnect_gateway_xray_required_version in xconnect_gateway_xray_version.stdout
    fail_msg: >-
      Installed Xray-core does not match the XConnect-One pinned release
      {{ xconnect_gateway_xray_required_version }}.
  when:
    - xconnect_gateway_enabled | bool
    - not ansible_check_mode

- name: Enable and start XConnect gateway shadow service
  ansible.builtin.systemd:
    name: "{{ xconnect_gateway_agent_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - xconnect_gateway_enabled | bool
    - not ansible_check_mode
