---
- name: Validate enabled XConnect gateway shadow contract
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - ansible_service_mgr == "systemd"
      - xconnect_gateway_shadow_mode | bool
      - xconnect_gateway_proxy_core == "xray"
      - xconnect_gateway_node_id | string | trim | length > 0
      - xconnect_gateway_control_plane_url is match('^https://')
      - xconnect_gateway_snapshot_signing_public_key | string | trim | length > 0
      - xconnect_gateway_agent_install_method in ["preinstalled", "local", "url"]
      - xconnect_gateway_health_listen_host in ["127.0.0.1", "::1"]
      - xconnect_gateway_health_listen_port | int >= 1
      - xconnect_gateway_health_listen_port | int <= 65535
      - xconnect_gateway_health_path is match('^/')
    fail_msg: >-
      An enabled Gateway requires Linux/systemd, shadow mode, Xray-core, an
      HTTPS Controller, node identity, signing key, and loopback health endpoint.

- name: Validate managed Agent release inputs
  ansible.builtin.assert:
    that:
      - xconnect_gateway_agent_binary_checksum is match('^sha256:[a-f0-9]{64}$')
      - >-
        xconnect_gateway_agent_install_method != "local"
        or xconnect_gateway_agent_binary_source | string | trim | length > 0
      - >-
        xconnect_gateway_agent_install_method != "url"
        or xconnect_gateway_agent_binary_url is match('^https://')
    fail_msg: >-
      Local and URL Agent releases require an immutable sha256 checksum; local
      installs require a controller-side source and URL installs require HTTPS.
  when: xconnect_gateway_agent_install_method in ["local", "url"]

- name: Validate managed short-lived credential source
  ansible.builtin.assert:
    that:
      - xconnect_gateway_credentials_source | string | trim | length > 0
    fail_msg: >-
      Set xconnect_gateway_credentials_source to a protected controller-side
      short-lived node credential file when credential management is enabled.
  when: xconnect_gateway_manage_credentials | bool
  no_log: true

- name: Install XConnect gateway bootstrap dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3
      - wireguard-tools
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Create XConnect gateway system group
  ansible.builtin.group:
    name: "{{ xconnect_gateway_group }}"
    system: true
    state: present

- name: Create XConnect gateway system user
  ansible.builtin.user:
    name: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    home: "{{ xconnect_gateway_state_root }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    state: present

- name: Create XConnect gateway configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ xconnect_gateway_config_root }}"
      mode: "0750"
    - path: "{{ xconnect_gateway_provider_dir }}"
      mode: "0750"

- name: Create XConnect gateway state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    mode: "0750"
  loop:
    - "{{ xconnect_gateway_state_root }}"
    - "{{ xconnect_gateway_candidate_dir }}"
    - "{{ xconnect_gateway_last_known_good_dir }}"
    - "{{ xconnect_gateway_evidence_dir }}"
    - "{{ xconnect_gateway_runtime_root }}"
    - "{{ xconnect_gateway_log_root }}"

- name: Create immutable Agent release directory
  ansible.builtin.file:
    path: "{{ xconnect_gateway_agent_release_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xconnect_gateway_agent_install_method in ["local", "url"]

- name: Stage local XConnect gateway Agent release
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_agent_binary_source }}"
    dest: "{{ xconnect_gateway_agent_release_path }}"
    owner: root
    group: root
    mode: "0755"
  register: xconnect_gateway_local_release
  when: xconnect_gateway_agent_install_method == "local"

- name: Download XConnect gateway Agent release
  ansible.builtin.get_url:
    url: "{{ xconnect_gateway_agent_binary_url }}"
    dest: "{{ xconnect_gateway_agent_release_path }}"
    checksum: "{{ xconnect_gateway_agent_binary_checksum }}"
    owner: root
    group: root
    mode: "0755"
    timeout: 120
  register: xconnect_gateway_url_release
  when: xconnect_gateway_agent_install_method == "url"
  no_log: true

- name: Resolve selected XConnect gateway Agent binary
  ansible.builtin.set_fact:
    xconnect_gateway_selected_agent_binary: >-
      {{ xconnect_gateway_agent_release_path
         if xconnect_gateway_agent_install_method in ["local", "url"]
         else xconnect_gateway_agent_binary_path }}

- name: Inspect selected XConnect gateway Agent binary
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_selected_agent_binary }}"
    checksum_algorithm: sha256
  register: xconnect_gateway_agent_binary_stat

- name: Validate selected XConnect gateway Agent binary
  ansible.builtin.assert:
    that:
      - xconnect_gateway_agent_binary_stat.stat.exists
      - xconnect_gateway_agent_binary_stat.stat.isreg
      - xconnect_gateway_agent_binary_stat.stat.executable
      - >-
        xconnect_gateway_agent_install_method == "preinstalled"
        or xconnect_gateway_agent_binary_stat.stat.checksum
           == xconnect_gateway_agent_binary_checksum.split(':', 1)[1]
    fail_msg: >-
      The selected Agent must be an executable regular file and managed release
      checksum must match before the stable binary path is changed.
  when:
    - not ansible_check_mode or xconnect_gateway_agent_install_method == "preinstalled"

- name: Read selected XConnect gateway Agent version
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_selected_agent_binary }}"
      - --version
  register: xconnect_gateway_agent_version_output
  changed_when: false
  when: not ansible_check_mode

- name: Validate selected XConnect gateway Agent version
  ansible.builtin.assert:
    that:
      - >-
        xconnect_gateway_agent_version_output.stdout_lines | default([]) | first | default('')
        is match(xconnect_gateway_agent_version_pattern)
    fail_msg: >-
      Agent version output does not match the configured release
      {{ xconnect_gateway_agent_version }}.
  when: not ansible_check_mode

- name: Install XConnect gateway contract validator
  ansible.builtin.copy:
    src: xconnect-gateway-validate.py
    dest: /usr/local/libexec/xconnect-gateway-validate
    owner: root
    group: root
    mode: "0755"

- name: Install XConnect gateway contract schemas
  ansible.builtin.copy:
    src: "contracts/{{ item }}"
    dest: "{{ xconnect_gateway_config_root }}/{{ item }}"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  loop:
    - gateway-provider-manifest.schema.json
    - gateway-snapshot.schema.json

- name: Stage managed short-lived node credential candidate
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_credentials_source }}"
    dest: "{{ xconnect_gateway_credentials_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  when: xconnect_gateway_manage_credentials | bool
  no_log: true

- name: Resolve selected short-lived node credential file
  ansible.builtin.set_fact:
    xconnect_gateway_selected_credentials_path: >-
      {{ xconnect_gateway_credentials_path ~ '.candidate'
         if xconnect_gateway_manage_credentials | bool
         else xconnect_gateway_credentials_path }}
  no_log: true

- name: Inspect short-lived node credential file
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_selected_credentials_path }}"
  register: xconnect_gateway_credentials_stat
  no_log: true

- name: Validate short-lived node credential file permissions
  ansible.builtin.assert:
    that:
      - xconnect_gateway_credentials_stat.stat.exists
      - xconnect_gateway_credentials_stat.stat.isreg
      - xconnect_gateway_credentials_stat.stat.pw_name == "root"
      - xconnect_gateway_credentials_stat.stat.gr_name == xconnect_gateway_group
      - xconnect_gateway_credentials_stat.stat.mode in ["0440", "0640"]
    fail_msg: >-
      The short-lived node credential file must be a root-owned regular file,
      readable only by root and the dedicated Gateway group.
  when: not ansible_check_mode
  no_log: true

- name: Stage snapshot signing public key candidate
  ansible.builtin.copy:
    content: "{{ xconnect_gateway_snapshot_signing_public_key | trim }}\n"
    dest: "{{ xconnect_gateway_signing_public_key_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Render XConnect gateway provider manifest candidate
  ansible.builtin.template:
    src: gateway-provider.json.j2
    dest: "{{ xconnect_gateway_provider_manifest_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Render XConnect gateway configuration candidate
  ansible.builtin.template:
    src: gateway.json.j2
    dest: "{{ xconnect_gateway_config_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Render XConnect gateway systemd unit candidate
  ansible.builtin.template:
    src: xconnect-gateway-agent.service.j2
    dest: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service.candidate"
    owner: root
    group: root
    mode: "0644"

- name: Validate XConnect gateway candidate contracts
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xconnect-gateway-validate
      - --config
      - "{{ xconnect_gateway_config_path }}.candidate"
      - --provider
      - "{{ xconnect_gateway_provider_manifest_path }}.candidate"
  changed_when: false
  when: not ansible_check_mode

- name: Inspect currently promoted Gateway bootstrap files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ xconnect_gateway_config_path }}"
    - "{{ xconnect_gateway_provider_manifest_path }}"
    - "{{ xconnect_gateway_agent_binary_path }}"
    - "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
    - "{{ xconnect_gateway_credentials_path }}"
    - "{{ xconnect_gateway_signing_public_key_path }}"
  register: xconnect_gateway_previous_bootstrap

- name: Back up current Gateway configuration for transaction rollback
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  loop:
    - src: "{{ xconnect_gateway_config_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-gateway.previous.json"
      exists: "{{ xconnect_gateway_previous_bootstrap.results[0].stat.exists }}"
    - src: "{{ xconnect_gateway_provider_manifest_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-provider.previous.json"
      exists: "{{ xconnect_gateway_previous_bootstrap.results[1].stat.exists }}"
    - src: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-systemd.previous.service"
      exists: "{{ xconnect_gateway_previous_bootstrap.results[3].stat.exists }}"
    - src: "{{ xconnect_gateway_credentials_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-credential.previous.token"
      exists: >-
        {{ xconnect_gateway_manage_credentials | bool
           and xconnect_gateway_previous_bootstrap.results[4].stat.exists }}
    - src: "{{ xconnect_gateway_signing_public_key_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-signing-key.previous.pub"
      exists: "{{ xconnect_gateway_previous_bootstrap.results[5].stat.exists }}"
  when:
    - item.exists | bool
    - not ansible_check_mode
  no_log: true

- name: Validate managed release will not replace an unmanaged binary
  ansible.builtin.assert:
    that:
      - >-
        not xconnect_gateway_previous_bootstrap.results[2].stat.exists
        or xconnect_gateway_previous_bootstrap.results[2].stat.islnk | default(false)
    fail_msg: >-
      Managed release mode refuses to replace an unmanaged regular file at
      xconnect_gateway_agent_binary_path; select preinstalled or move it first.
  when: xconnect_gateway_agent_install_method in ["local", "url"]

- name: Inspect installed Xray-core binary
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_xray_binary_path }}"
  register: xconnect_gateway_xray_binary_stat

- name: Assert installed Xray-core binary exists
  ansible.builtin.assert:
    that:
      - xconnect_gateway_xray_binary_stat.stat.exists
      - xconnect_gateway_xray_binary_stat.stat.executable
    fail_msg: "Enabled XConnect gateway requires the pinned executable Xray-core binary."

- name: Read installed Xray-core version
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_xray_binary_path }}"
      - version
  register: xconnect_gateway_xray_version
  changed_when: false
  when: not ansible_check_mode

- name: Assert installed Xray-core release is pinned
  ansible.builtin.assert:
    that:
      - >-
        xconnect_gateway_xray_version.stdout_lines | default([]) | first | default('')
        is match('^Xray\\s+' ~ (xconnect_gateway_xray_required_version | regex_escape) ~ '(?:\\s|$)')
    fail_msg: >-
      Installed Xray-core does not match the XConnect-One pinned release
      {{ xconnect_gateway_xray_required_version }}.
  when: not ansible_check_mode

- name: Read previous XConnect gateway service active state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ xconnect_gateway_agent_service_name }}"
  register: xconnect_gateway_previous_service_active
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_previous_bootstrap.results[3].stat.exists
    - not ansible_check_mode

- name: Read previous XConnect gateway service enablement
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ xconnect_gateway_agent_service_name }}"
  register: xconnect_gateway_previous_service_enabled
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_previous_bootstrap.results[3].stat.exists
    - not ansible_check_mode

- name: Apply and verify XConnect gateway shadow transaction
  when: not ansible_check_mode
  block:
    - name: Promote validated XConnect gateway provider manifest
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_provider_manifest_path }}.candidate"
        dest: "{{ xconnect_gateway_provider_manifest_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      register: xconnect_gateway_promoted_provider

    - name: Promote validated XConnect gateway configuration
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_config_path }}.candidate"
        dest: "{{ xconnect_gateway_config_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      register: xconnect_gateway_promoted_config

    - name: Promote managed short-lived node credential
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_credentials_path }}.candidate"
        dest: "{{ xconnect_gateway_credentials_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      register: xconnect_gateway_promoted_credential
      when: xconnect_gateway_manage_credentials | bool
      no_log: true

    - name: Promote snapshot signing public key
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_signing_public_key_path }}.candidate"
        dest: "{{ xconnect_gateway_signing_public_key_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      register: xconnect_gateway_promoted_signing_key

    - name: Promote verified XConnect gateway Agent release symlink
      ansible.builtin.file:
        src: "{{ xconnect_gateway_agent_release_path }}"
        dest: "{{ xconnect_gateway_agent_binary_path }}"
        state: link
        owner: root
        group: root
        force: true
      register: xconnect_gateway_promoted_agent_link
      when: xconnect_gateway_agent_install_method in ["local", "url"]

    - name: Promote XConnect gateway systemd unit
      ansible.builtin.copy:
        src: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service.candidate"
        dest: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      register: xconnect_gateway_promoted_systemd_unit

    - name: Resolve whether XConnect gateway Agent restart is required
      ansible.builtin.set_fact:
        xconnect_gateway_restart_required: >-
          {{ xconnect_gateway_promoted_provider.changed
             or xconnect_gateway_promoted_config.changed
             or (xconnect_gateway_promoted_credential.changed | default(false))
             or xconnect_gateway_promoted_signing_key.changed
             or (xconnect_gateway_promoted_agent_link.changed | default(false))
             or xconnect_gateway_promoted_systemd_unit.changed
             or (xconnect_gateway_local_release.changed | default(false))
             or (xconnect_gateway_url_release.changed | default(false)) }}

    - name: Ensure XConnect gateway shadow service is running
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_agent_service_name }}"
        enabled: true
        state: "{{ 'restarted' if xconnect_gateway_restart_required | bool else 'started' }}"
        daemon_reload: "{{ xconnect_gateway_promoted_systemd_unit.changed }}"

    - name: Wait for loopback XConnect gateway health endpoint
      ansible.builtin.uri:
        url: >-
          http://{{ '[' ~ xconnect_gateway_health_listen_host ~ ']'
                    if ':' in xconnect_gateway_health_listen_host
                    else xconnect_gateway_health_listen_host }}:{{ xconnect_gateway_health_listen_port }}{{ xconnect_gateway_health_path }}
        return_content: true
        status_code: 200
      register: xconnect_gateway_health
      until: xconnect_gateway_health.status | default(0) == 200
      retries: "{{ xconnect_gateway_health_retries | int }}"
      delay: "{{ xconnect_gateway_health_delay | int }}"
      no_log: true

    - name: Assert XConnect gateway reports safe shadow health
      ansible.builtin.assert:
        that:
          - xconnect_gateway_health.json.status in ["ok", "ready"]
          - xconnect_gateway_health.json.mode == "shadow"
          - xconnect_gateway_health.json.proxy_core == "xray"
          - not (xconnect_gateway_health.json.runtime_apply_enabled | bool)
        fail_msg: "Gateway health response does not prove shadow-only Xray operation."
      no_log: true

    - name: Record healthy bootstrap config as last-known-good
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      loop:
        - src: "{{ xconnect_gateway_config_path }}"
          dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-gateway.json"
        - src: "{{ xconnect_gateway_provider_manifest_path }}"
          dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-provider.json"

  rescue:
    - name: Stop failed XConnect gateway shadow service
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_agent_service_name }}"
        enabled: false
        state: stopped
        daemon_reload: true
      failed_when: false

    - name: Restore previous Gateway configuration after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-gateway.previous.json"
        dest: "{{ xconnect_gateway_config_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when: xconnect_gateway_previous_bootstrap.results[0].stat.exists

    - name: Remove first-install Gateway configuration after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_config_path }}"
        state: absent
      when: not xconnect_gateway_previous_bootstrap.results[0].stat.exists

    - name: Restore previous Gateway provider after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-provider.previous.json"
        dest: "{{ xconnect_gateway_provider_manifest_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when: xconnect_gateway_previous_bootstrap.results[1].stat.exists

    - name: Remove first-install Gateway provider after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_provider_manifest_path }}"
        state: absent
      when: not xconnect_gateway_previous_bootstrap.results[1].stat.exists

    - name: Restore previous managed node credential after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-credential.previous.token"
        dest: "{{ xconnect_gateway_credentials_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when:
        - xconnect_gateway_manage_credentials | bool
        - xconnect_gateway_previous_bootstrap.results[4].stat.exists
      no_log: true

    - name: Remove first managed node credential after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_credentials_path }}"
        state: absent
      when:
        - xconnect_gateway_manage_credentials | bool
        - not xconnect_gateway_previous_bootstrap.results[4].stat.exists
      no_log: true

    - name: Restore previous snapshot signing key after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-signing-key.previous.pub"
        dest: "{{ xconnect_gateway_signing_public_key_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when: xconnect_gateway_previous_bootstrap.results[5].stat.exists

    - name: Remove first snapshot signing key after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_signing_public_key_path }}"
        state: absent
      when: not xconnect_gateway_previous_bootstrap.results[5].stat.exists

    - name: Restore previous managed Agent symlink after failed health
      ansible.builtin.file:
        src: "{{ xconnect_gateway_previous_bootstrap.results[2].stat.lnk_source }}"
        dest: "{{ xconnect_gateway_agent_binary_path }}"
        state: link
        owner: root
        group: root
        force: true
      when:
        - xconnect_gateway_agent_install_method in ["local", "url"]
        - xconnect_gateway_previous_bootstrap.results[2].stat.islnk | default(false)

    - name: Remove first managed Agent symlink after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_agent_binary_path }}"
        state: absent
      when:
        - xconnect_gateway_agent_install_method in ["local", "url"]
        - not (xconnect_gateway_previous_bootstrap.results[2].stat.islnk | default(false))

    - name: Restore previous systemd unit after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-systemd.previous.service"
        dest: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: xconnect_gateway_previous_bootstrap.results[3].stat.exists

    - name: Remove first-install systemd unit after failed health
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
        state: absent
      when: not xconnect_gateway_previous_bootstrap.results[3].stat.exists

    - name: Restore previous XConnect gateway service state
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_agent_service_name }}"
        enabled: "{{ (xconnect_gateway_previous_service_enabled.rc | default(1)) == 0 }}"
        state: >-
          {{ 'started'
             if (xconnect_gateway_previous_service_active.rc | default(1)) == 0
             else 'stopped' }}
        daemon_reload: true
      when: xconnect_gateway_previous_bootstrap.results[3].stat.exists

    - name: Fail deployment after restoring previous Gateway bootstrap
      ansible.builtin.fail:
        msg: >-
          XConnect gateway shadow health verification failed; previous config
          systemd unit, managed Agent symlink, and prior service state were restored.
