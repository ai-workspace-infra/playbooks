---
- name: Validate enabled XConnect gateway runtime contract
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - ansible_service_mgr == "systemd"
      - (xconnect_gateway_shadow_mode | bool) != (xconnect_gateway_runtime_apply_enabled | bool)
      - xconnect_gateway_proxy_core == "xray"
      - xconnect_gateway_node_id is match('^[a-zA-Z0-9][a-zA-Z0-9_.:-]{2,127}$')
      - xconnect_gateway_control_plane_url is match('^https://')
      - xconnect_gateway_snapshot_signing_public_key | string | trim | length > 0
      - xconnect_gateway_snapshot_signing_key_id is match('^[a-zA-Z0-9][a-zA-Z0-9_.:-]{2,127}$')
      - xconnect_gateway_agent_install_method in ["preinstalled", "local", "url"]
      - xconnect_gateway_health_listen_host in ["127.0.0.1", "::1"]
      - xconnect_gateway_health_listen_port | int >= 1
      - xconnect_gateway_health_listen_port | int <= 65535
      - xconnect_gateway_health_path is match('^/')
      - xconnect_gateway_wireguard_config_path == '/etc/wireguard/' ~ xconnect_gateway_wireguard_interface ~ '.conf'
      - xconnect_gateway_wireguard_service_name == 'wg-quick@' ~ xconnect_gateway_wireguard_interface
      - xconnect_gateway_wireguard_addresses | length > 0
      - xconnect_gateway_wireguard_addresses == (xconnect_gateway_wireguard_addresses | unique | sort)
      - not (xconnect_gateway_accounts_only_enabled | bool) or xconnect_gateway_runtime_apply_enabled | bool
      - not (xconnect_gateway_accounts_only_enabled | bool) or xconnect_gateway_accounts_only_readiness_binary is match('^/')
      - not (xconnect_gateway_accounts_only_enabled | bool) or xconnect_gateway_accounts_only_readiness_bundle is match('^/')
      - not (xconnect_gateway_accounts_only_enabled | bool) or xconnect_gateway_accounts_only_evidence_path is match('^/')
      - not (xconnect_gateway_accounts_only_enabled | bool) or xconnect_gateway_accounts_only_authorization_public_key_path is match('^/')
      - >-
        not (xconnect_gateway_accounts_only_enabled | bool)
        or xconnect_gateway_accounts_only_authorization_key_id
           is match('^[a-zA-Z0-9][a-zA-Z0-9_.:-]{2,127}$')
      - >-
        not (xconnect_gateway_accounts_only_enabled | bool)
        or xconnect_gateway_accounts_only_authorization_public_key_path
           != xconnect_gateway_signing_public_key_path
      - xconnect_gateway_accounts_only_minimum_health_samples | int >= 2
      - xconnect_gateway_accounts_only_minimum_health_samples | int <= 100
      - xconnect_gateway_xray_wireguard_target_host == '127.0.0.1'
      - not (xconnect_gateway_runtime_apply_enabled | bool) or xconnect_gateway_xray_apply_service_name != xconnect_gateway_xray_service_name
      - not (xconnect_gateway_runtime_apply_enabled | bool) or xconnect_gateway_xray_api_endpoint is match('^(127\\.0\\.0\\.1|\\[::1\\]):[0-9]+$')
      - not (xconnect_gateway_runtime_apply_enabled | bool) or xconnect_gateway_xray_runtime_baseline_source | string | trim | length > 0
      - not (xconnect_gateway_runtime_apply_enabled | bool) or xconnect_gateway_relay_credential_ref == 'relay_credential_' ~ xconnect_gateway_node_id
      - not (xconnect_gateway_runtime_apply_enabled | bool) or xconnect_gateway_relay_credential_source | string | trim | length > 0
      - not (xconnect_gateway_runtime_apply_enabled | bool) or xconnect_gateway_relay_tls_certificate_source | string | trim | length > 0
      - not (xconnect_gateway_runtime_apply_enabled | bool) or xconnect_gateway_relay_tls_private_key_source | string | trim | length > 0
      - not (xconnect_gateway_runtime_apply_enabled | bool) or xconnect_gateway_legacy_wireguard_service_name != xconnect_gateway_wireguard_service_name
      - >-
        not (xconnect_gateway_runtime_apply_enabled | bool)
        or xconnect_gateway_legacy_wireguard_service_name
           == 'wg-quick@' ~ xconnect_gateway_legacy_wireguard_interface
    fail_msg: >-
      An enabled Gateway requires Linux/systemd, one explicit mode, Xray-core, an
      HTTPS Controller, node identity, signing key, and loopback health endpoint.

- name: Inspect accounts-only readiness inputs before any deployment mutation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ xconnect_gateway_accounts_only_readiness_binary }}"
    - "{{ xconnect_gateway_accounts_only_readiness_bundle }}"
    - "{{ xconnect_gateway_accounts_only_authorization_public_key_path }}"
    - "{{ xconnect_gateway_signing_public_key_path }}"
  register: xconnect_gateway_accounts_only_readiness_inputs
  when: xconnect_gateway_accounts_only_enabled | bool
  no_log: true

- name: Validate protected accounts-only readiness inputs
  ansible.builtin.assert:
    that:
      - xconnect_gateway_accounts_only_readiness_inputs.results[0].stat.exists
      - xconnect_gateway_accounts_only_readiness_inputs.results[0].stat.isreg
      - not (xconnect_gateway_accounts_only_readiness_inputs.results[0].stat.islnk | default(false))
      - xconnect_gateway_accounts_only_readiness_inputs.results[0].stat.executable
      - xconnect_gateway_accounts_only_readiness_inputs.results[0].stat.pw_name == "root"
      - xconnect_gateway_accounts_only_readiness_inputs.results[0].stat.mode in ["0500", "0550", "0555", "0700", "0750", "0755"]
      - xconnect_gateway_accounts_only_readiness_inputs.results[1].stat.exists
      - xconnect_gateway_accounts_only_readiness_inputs.results[1].stat.isreg
      - not (xconnect_gateway_accounts_only_readiness_inputs.results[1].stat.islnk | default(false))
      - xconnect_gateway_accounts_only_readiness_inputs.results[1].stat.pw_name == "root"
      - xconnect_gateway_accounts_only_readiness_inputs.results[1].stat.mode in ["0400", "0440", "0600", "0640"]
      - xconnect_gateway_accounts_only_readiness_inputs.results[2].stat.exists
      - xconnect_gateway_accounts_only_readiness_inputs.results[2].stat.isreg
      - not (xconnect_gateway_accounts_only_readiness_inputs.results[2].stat.islnk | default(false))
      - xconnect_gateway_accounts_only_readiness_inputs.results[2].stat.pw_name == "root"
      - xconnect_gateway_accounts_only_readiness_inputs.results[2].stat.mode in ["0400", "0440", "0600", "0640"]
      - xconnect_gateway_accounts_only_readiness_inputs.results[3].stat.exists
      - xconnect_gateway_accounts_only_readiness_inputs.results[3].stat.isreg
      - not (xconnect_gateway_accounts_only_readiness_inputs.results[3].stat.islnk | default(false))
      - xconnect_gateway_accounts_only_readiness_inputs.results[3].stat.pw_name == "root"
      - xconnect_gateway_accounts_only_readiness_inputs.results[3].stat.mode in ["0400", "0440", "0600", "0640"]
    fail_msg: >-
      Accounts-only cutover requires an executable readiness verifier and
      protected regular evidence/signing-key inputs before any host mutation.
  when: xconnect_gateway_accounts_only_enabled | bool
  no_log: true

- name: Require executable accounts-only readiness decision
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_accounts_only_readiness_binary }}"
      - --accounts-only
      - --bundle
      - "{{ xconnect_gateway_accounts_only_readiness_bundle }}"
      - --signing-public-key
      - "{{ xconnect_gateway_signing_public_key_path }}"
      - --authorization-public-key
      - "{{ xconnect_gateway_accounts_only_authorization_public_key_path }}"
      - --authorization-key-id
      - "{{ xconnect_gateway_accounts_only_authorization_key_id }}"
      - --minimum-health-samples
      - "{{ xconnect_gateway_accounts_only_minimum_health_samples | string }}"
      - --evidence
      - "{{ xconnect_gateway_accounts_only_evidence_path }}"
  register: xconnect_gateway_accounts_only_readiness
  changed_when: true
  when:
    - xconnect_gateway_accounts_only_enabled | bool
    - not ansible_check_mode
  no_log: true

- name: Inspect accepted accounts-only readiness evidence
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_accounts_only_evidence_path }}"
    follow: false
  register: xconnect_gateway_accounts_only_evidence
  when:
    - xconnect_gateway_accounts_only_enabled | bool
    - not ansible_check_mode
  no_log: true

- name: Validate accepted accounts-only readiness evidence protection
  ansible.builtin.assert:
    that:
      - xconnect_gateway_accounts_only_evidence.stat.exists
      - xconnect_gateway_accounts_only_evidence.stat.isreg
      - not (xconnect_gateway_accounts_only_evidence.stat.islnk | default(false))
      - xconnect_gateway_accounts_only_evidence.stat.pw_name == "root"
      - xconnect_gateway_accounts_only_evidence.stat.mode == "0600"
    fail_msg: "Accepted accounts-only readiness evidence must be root-owned 0600."
  when:
    - xconnect_gateway_accounts_only_enabled | bool
    - not ansible_check_mode
  no_log: true

- name: Validate managed Agent release inputs
  ansible.builtin.assert:
    that:
      - xconnect_gateway_agent_binary_checksum is match('^sha256:[a-f0-9]{64}$')
      - >-
        xconnect_gateway_agent_install_method != "local"
        or xconnect_gateway_agent_binary_source | string | trim | length > 0
      - >-
        xconnect_gateway_agent_install_method != "url"
        or xconnect_gateway_agent_binary_url is match('^https://')
    fail_msg: >-
      Local and URL Agent releases require an immutable sha256 checksum; local
      installs require a controller-side source and URL installs require HTTPS.
  when: xconnect_gateway_agent_install_method in ["local", "url"]

- name: Validate managed short-lived credential source
  ansible.builtin.assert:
    that:
      - xconnect_gateway_credentials_source | string | trim | length > 0
    fail_msg: >-
      Set xconnect_gateway_credentials_source to a protected controller-side
      short-lived node credential file when credential management is enabled.
  when: xconnect_gateway_manage_credentials | bool
  no_log: true

- name: Install XConnect gateway bootstrap dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3
      - wireguard-tools
      - iproute2
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install nftables runtime apply dependency
  ansible.builtin.apt:
    name: nftables
    state: present
  when:
    - ansible_os_family == "Debian"
    - xconnect_gateway_runtime_apply_enabled | bool

- name: Create XConnect gateway system group
  ansible.builtin.group:
    name: "{{ xconnect_gateway_group }}"
    system: true
    state: present

- name: Create XConnect gateway system user
  ansible.builtin.user:
    name: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    home: "{{ xconnect_gateway_state_root }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    state: present

- name: Create XConnect gateway configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ xconnect_gateway_config_root }}"
      mode: "0750"
    - path: "{{ xconnect_gateway_provider_dir }}"
      mode: "0750"

- name: Create XConnect gateway state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    mode: "0750"
  loop:
    - "{{ xconnect_gateway_state_root }}"
    - "{{ xconnect_gateway_candidate_dir }}"
    - "{{ xconnect_gateway_last_known_good_dir }}"
    - "{{ xconnect_gateway_evidence_dir }}"
    - "{{ xconnect_gateway_runtime_root }}"
    - "{{ xconnect_gateway_log_root }}"

- name: Create protected runtime apply directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    mode: "0700"
  loop:
    - "{{ xconnect_gateway_transaction_dir }}"
    - "{{ xconnect_gateway_runtime_lkg_dir }}"
    - "{{ xconnect_gateway_runtime_secret_lkg_dir }}"
    - "{{ xconnect_gateway_relay_credential_dir }}"
    - "{{ xconnect_gateway_relay_tls_dir }}"
  when: xconnect_gateway_runtime_apply_enabled | bool

- name: Inspect explicit Xray runtime migration baseline
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_xray_runtime_baseline_source }}"
    follow: false
  register: xconnect_gateway_xray_baseline_stat
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Validate protected Xray runtime migration baseline
  ansible.builtin.assert:
    that:
      - xconnect_gateway_xray_baseline_stat.stat.exists
      - xconnect_gateway_xray_baseline_stat.stat.isreg
      - not (xconnect_gateway_xray_baseline_stat.stat.islnk | default(false))
      - xconnect_gateway_xray_baseline_stat.stat.mode in ["0400", "0440", "0600", "0640"]
    fail_msg: >-
      Apply mode refuses first activation until a protected, existing dedicated
      Xray AddInbound baseline is supplied for transactional rollback.
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Inspect previous protected Xray runtime baseline
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_runtime_secret_lkg_dir }}/xray-runtime.json"
    follow: false
  register: xconnect_gateway_previous_xray_runtime_baseline
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Seed protected Xray runtime last-known-good baseline
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_xray_runtime_baseline_source }}"
    dest: "{{ xconnect_gateway_runtime_secret_lkg_dir }}/xray-runtime.json"
    remote_src: true
    owner: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    mode: "0600"
    force: false
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Inspect protected relay bootstrap sources
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - name: credential
      path: "{{ xconnect_gateway_relay_credential_source }}"
      modes: ["0400", "0600"]
    - name: certificate
      path: "{{ xconnect_gateway_relay_tls_certificate_source }}"
      modes: ["0400", "0440", "0600", "0640", "0644"]
    - name: private key
      path: "{{ xconnect_gateway_relay_tls_private_key_source }}"
      modes: ["0400", "0600"]
  register: xconnect_gateway_relay_bootstrap_sources
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Validate protected relay bootstrap sources
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == "root"
      - item.stat.mode in item.item.modes
    fail_msg: >-
      Apply mode requires root-controlled regular relay credential, certificate,
      and private-key bootstrap sources; secret sources must not be group/world readable.
  loop: "{{ xconnect_gateway_relay_bootstrap_sources.results }}"
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Inspect existing protected relay runtime files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ xconnect_gateway_relay_credential_dir }}/{{ xconnect_gateway_relay_credential_ref }}.json"
    - "{{ xconnect_gateway_relay_tls_certificate_path }}"
    - "{{ xconnect_gateway_relay_tls_private_key_path }}"
  register: xconnect_gateway_previous_relay_runtime_files
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Seed protected relay runtime files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: "{{ xconnect_gateway_user }}"
    group: "{{ xconnect_gateway_group }}"
    mode: "0600"
    force: false
  loop:
    - src: "{{ xconnect_gateway_relay_credential_source }}"
      dest: "{{ xconnect_gateway_relay_credential_dir }}/{{ xconnect_gateway_relay_credential_ref }}.json"
    - src: "{{ xconnect_gateway_relay_tls_certificate_source }}"
      dest: "{{ xconnect_gateway_relay_tls_certificate_path }}"
    - src: "{{ xconnect_gateway_relay_tls_private_key_source }}"
      dest: "{{ xconnect_gateway_relay_tls_private_key_path }}"
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Inspect seeded protected relay runtime files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ xconnect_gateway_relay_credential_dir }}/{{ xconnect_gateway_relay_credential_ref }}.json"
    - "{{ xconnect_gateway_relay_tls_certificate_path }}"
    - "{{ xconnect_gateway_relay_tls_private_key_path }}"
  register: xconnect_gateway_seeded_relay_runtime_files
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Validate seeded relay files are readable only by the dedicated runtime
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == xconnect_gateway_user
      - item.stat.gr_name == xconnect_gateway_group
      - item.stat.mode == "0600"
    fail_msg: >-
      Relay runtime credential and TLS files must be dedicated-user-owned 0600
      regular files before apply can start.
  loop: "{{ xconnect_gateway_seeded_relay_runtime_files.results }}"
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Inspect target WireGuard config before optional bootstrap seed
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_wireguard_config_path }}"
    follow: false
  register: xconnect_gateway_previous_wireguard_config
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Inspect protected target WireGuard config source
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_wireguard_target_config_source }}"
    follow: false
  register: xconnect_gateway_wireguard_config_source_stat
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - xconnect_gateway_wireguard_target_config_source | string | trim | length > 0
  no_log: true

- name: Validate protected target WireGuard config source
  ansible.builtin.assert:
    that:
      - xconnect_gateway_wireguard_config_source_stat.stat.exists
      - xconnect_gateway_wireguard_config_source_stat.stat.isreg
      - not (xconnect_gateway_wireguard_config_source_stat.stat.islnk | default(false))
      - xconnect_gateway_wireguard_config_source_stat.stat.pw_name == "root"
      - xconnect_gateway_wireguard_config_source_stat.stat.mode in ["0400", "0600"]
    fail_msg: >-
      Optional target WireGuard seed must be a root-owned 0400/0600 regular file.
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - xconnect_gateway_wireguard_target_config_source | string | trim | length > 0
  no_log: true

- name: Seed protected target WireGuard configuration
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_wireguard_target_config_source }}"
    dest: "{{ xconnect_gateway_wireguard_config_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
    force: false
  register: xconnect_gateway_seeded_wireguard_config
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - xconnect_gateway_wireguard_target_config_source | string | trim | length > 0
  no_log: true

- name: Inspect target WireGuard configuration
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_wireguard_config_path }}"
    follow: false
  register: xconnect_gateway_wireguard_config_stat
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Validate protected target WireGuard configuration
  ansible.builtin.assert:
    that:
      - xconnect_gateway_wireguard_config_stat.stat.exists
      - xconnect_gateway_wireguard_config_stat.stat.isreg
      - not (xconnect_gateway_wireguard_config_stat.stat.islnk | default(false))
      - xconnect_gateway_wireguard_config_stat.stat.pw_name == "root"
      - xconnect_gateway_wireguard_config_stat.stat.mode in ["0400", "0600"]
    fail_msg: >-
      Apply takeover requires an explicitly pre-provisioned or protected-source
      target WireGuard config bound to the configured wg-xco interface.
  when: xconnect_gateway_runtime_apply_enabled | bool
  no_log: true

- name: Create immutable Agent release directory
  ansible.builtin.file:
    path: "{{ xconnect_gateway_agent_release_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xconnect_gateway_agent_install_method in ["local", "url"]

- name: Stage local XConnect gateway Agent release
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_agent_binary_source }}"
    dest: "{{ xconnect_gateway_agent_release_path }}"
    owner: root
    group: root
    mode: "0755"
  register: xconnect_gateway_local_release
  when: xconnect_gateway_agent_install_method == "local"

- name: Download XConnect gateway Agent release
  ansible.builtin.get_url:
    url: "{{ xconnect_gateway_agent_binary_url }}"
    dest: "{{ xconnect_gateway_agent_release_path }}"
    checksum: "{{ xconnect_gateway_agent_binary_checksum }}"
    owner: root
    group: root
    mode: "0755"
    timeout: 120
  register: xconnect_gateway_url_release
  when: xconnect_gateway_agent_install_method == "url"
  no_log: true

- name: Resolve selected XConnect gateway Agent binary
  ansible.builtin.set_fact:
    xconnect_gateway_selected_agent_binary: >-
      {{ xconnect_gateway_agent_release_path
         if xconnect_gateway_agent_install_method in ["local", "url"]
         else xconnect_gateway_agent_binary_path }}

- name: Inspect selected XConnect gateway Agent binary
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_selected_agent_binary }}"
    checksum_algorithm: sha256
  register: xconnect_gateway_agent_binary_stat

- name: Validate selected XConnect gateway Agent binary
  ansible.builtin.assert:
    that:
      - xconnect_gateway_agent_binary_stat.stat.exists
      - xconnect_gateway_agent_binary_stat.stat.isreg
      - xconnect_gateway_agent_binary_stat.stat.executable
      - >-
        xconnect_gateway_agent_install_method == "preinstalled"
        or xconnect_gateway_agent_binary_stat.stat.checksum
           == xconnect_gateway_agent_binary_checksum.split(':', 1)[1]
    fail_msg: >-
      The selected Agent must be an executable regular file and managed release
      checksum must match before the stable binary path is changed.
  when:
    - not ansible_check_mode or xconnect_gateway_agent_install_method == "preinstalled"

- name: Read selected XConnect gateway Agent version
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_selected_agent_binary }}"
      - --version
  register: xconnect_gateway_agent_version_output
  changed_when: false
  when: not ansible_check_mode

- name: Validate selected XConnect gateway Agent version
  ansible.builtin.assert:
    that:
      - >-
        xconnect_gateway_agent_version_output.stdout_lines | default([]) | first | default('')
        is match(xconnect_gateway_agent_version_pattern)
    fail_msg: >-
      Agent version output does not match the configured release
      {{ xconnect_gateway_agent_version }}.
  when: not ansible_check_mode

- name: Install XConnect gateway contract validator
  ansible.builtin.copy:
    src: xconnect-gateway-validate.py
    dest: /usr/local/libexec/xconnect-gateway-validate
    owner: root
    group: root
    mode: "0755"

- name: Install XConnect gateway contract schemas
  ansible.builtin.copy:
    src: "contracts/{{ item }}"
    dest: "{{ xconnect_gateway_config_root }}/{{ item }}"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  loop:
    - gateway-provider-manifest.schema.json
    - gateway-snapshot.schema.json
    - accounts-only-readiness-evidence.schema.json

- name: Stage managed short-lived node credential candidate
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_credentials_source }}"
    dest: "{{ xconnect_gateway_credentials_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  when: xconnect_gateway_manage_credentials | bool
  no_log: true

- name: Resolve selected short-lived node credential file
  ansible.builtin.set_fact:
    xconnect_gateway_selected_credentials_path: >-
      {{ xconnect_gateway_credentials_path ~ '.candidate'
         if xconnect_gateway_manage_credentials | bool
         else xconnect_gateway_credentials_path }}
  no_log: true

- name: Inspect short-lived node credential file
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_selected_credentials_path }}"
  register: xconnect_gateway_credentials_stat
  no_log: true

- name: Validate short-lived node credential file permissions
  ansible.builtin.assert:
    that:
      - xconnect_gateway_credentials_stat.stat.exists
      - xconnect_gateway_credentials_stat.stat.isreg
      - xconnect_gateway_credentials_stat.stat.pw_name == "root"
      - xconnect_gateway_credentials_stat.stat.gr_name == xconnect_gateway_group
      - xconnect_gateway_credentials_stat.stat.mode in ["0440", "0640"]
    fail_msg: >-
      The short-lived node credential file must be a root-owned regular file,
      readable only by root and the dedicated Gateway group.
  when: not ansible_check_mode
  no_log: true

- name: Stage snapshot signing public key candidate
  ansible.builtin.copy:
    content: "{{ xconnect_gateway_snapshot_signing_public_key | trim }}\n"
    dest: "{{ xconnect_gateway_signing_public_key_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Render XConnect gateway provider manifest candidate
  ansible.builtin.template:
    src: gateway-provider.json.j2
    dest: "{{ xconnect_gateway_provider_manifest_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Render XConnect gateway configuration candidate
  ansible.builtin.template:
    src: gateway.json.j2
    dest: "{{ xconnect_gateway_config_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"

- name: Render XConnect gateway systemd unit candidate
  ansible.builtin.template:
    src: xconnect-gateway-agent.service.j2
    dest: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service.candidate"
    owner: root
    group: root
    mode: "0644"

- name: Validate XConnect gateway candidate contracts
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xconnect-gateway-validate
      - --config
      - "{{ xconnect_gateway_config_path }}.candidate"
      - --provider
      - "{{ xconnect_gateway_provider_manifest_path }}.candidate"
  changed_when: false
  when: not ansible_check_mode

- name: Inspect currently promoted Gateway bootstrap files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ xconnect_gateway_config_path }}"
    - "{{ xconnect_gateway_provider_manifest_path }}"
    - "{{ xconnect_gateway_agent_binary_path }}"
    - "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
    - "{{ xconnect_gateway_credentials_path }}"
    - "{{ xconnect_gateway_signing_public_key_path }}"
  register: xconnect_gateway_previous_bootstrap

- name: Back up current Gateway configuration for transaction rollback
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  loop:
    - src: "{{ xconnect_gateway_config_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-gateway.previous.json"
      exists: "{{ xconnect_gateway_previous_bootstrap.results[0].stat.exists }}"
    - src: "{{ xconnect_gateway_provider_manifest_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-provider.previous.json"
      exists: "{{ xconnect_gateway_previous_bootstrap.results[1].stat.exists }}"
    - src: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-systemd.previous.service"
      exists: "{{ xconnect_gateway_previous_bootstrap.results[3].stat.exists }}"
    - src: "{{ xconnect_gateway_credentials_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-credential.previous.token"
      exists: >-
        {{ xconnect_gateway_manage_credentials | bool
           and xconnect_gateway_previous_bootstrap.results[4].stat.exists }}
    - src: "{{ xconnect_gateway_signing_public_key_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-signing-key.previous.pub"
      exists: "{{ xconnect_gateway_previous_bootstrap.results[5].stat.exists }}"
  when:
    - item.exists | bool
    - not ansible_check_mode
  no_log: true

- name: Validate managed release will not replace an unmanaged binary
  ansible.builtin.assert:
    that:
      - >-
        not xconnect_gateway_previous_bootstrap.results[2].stat.exists
        or xconnect_gateway_previous_bootstrap.results[2].stat.islnk | default(false)
    fail_msg: >-
      Managed release mode refuses to replace an unmanaged regular file at
      xconnect_gateway_agent_binary_path; select preinstalled or move it first.
  when: xconnect_gateway_agent_install_method in ["local", "url"]

- name: Inspect installed Xray-core binary
  ansible.builtin.stat:
    path: "{{ xconnect_gateway_xray_binary_path }}"
  register: xconnect_gateway_xray_binary_stat

- name: Assert installed Xray-core binary exists
  ansible.builtin.assert:
    that:
      - xconnect_gateway_xray_binary_stat.stat.exists
      - xconnect_gateway_xray_binary_stat.stat.executable
    fail_msg: "Enabled XConnect gateway requires the pinned executable Xray-core binary."

- name: Read installed Xray-core version
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_xray_binary_path }}"
      - version
  register: xconnect_gateway_xray_version
  changed_when: false
  when: not ansible_check_mode

- name: Assert installed Xray-core release is pinned
  ansible.builtin.assert:
    that:
      - >-
        xconnect_gateway_xray_version.stdout_lines | default([]) | first | default('')
        is match('^Xray\\s+' ~ (xconnect_gateway_xray_required_version | regex_escape) ~ '(?:\\s|$)')
    fail_msg: >-
      Installed Xray-core does not match the XConnect-One pinned release
      {{ xconnect_gateway_xray_required_version }}.
  when: not ansible_check_mode

- name: Inspect previous dedicated Xray bootstrap files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ xconnect_gateway_xray_base_config_path }}"
    - "/etc/systemd/system/{{ xconnect_gateway_xray_apply_service_name }}.service"
  register: xconnect_gateway_previous_xray_bootstrap
  when: xconnect_gateway_runtime_apply_enabled | bool

- name: Back up previous dedicated Xray bootstrap files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop:
    - src: "{{ xconnect_gateway_xray_base_config_path }}"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/xray-base.previous.json"
      exists: "{{ xconnect_gateway_previous_xray_bootstrap.results[0].stat.exists | default(false) }}"
    - src: "/etc/systemd/system/{{ xconnect_gateway_xray_apply_service_name }}.service"
      dest: "{{ xconnect_gateway_last_known_good_dir }}/xray-service.previous.service"
      exists: "{{ xconnect_gateway_previous_xray_bootstrap.results[1].stat.exists | default(false) }}"
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - item.exists | bool
    - not ansible_check_mode

- name: Read previous dedicated Xray service state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ xconnect_gateway_xray_apply_service_name }}"
  register: xconnect_gateway_previous_xray_active
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Read previous dedicated Xray service enablement
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ xconnect_gateway_xray_apply_service_name }}"
  register: xconnect_gateway_previous_xray_enabled
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Read target WireGuard service active state before takeover
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ xconnect_gateway_wireguard_service_name }}"
  register: xconnect_gateway_previous_target_wireguard_active
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Read target WireGuard service enablement before takeover
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ xconnect_gateway_wireguard_service_name }}"
  register: xconnect_gateway_previous_target_wireguard_enabled
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Read legacy WireGuard service active state before takeover
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ xconnect_gateway_legacy_wireguard_service_name }}"
  register: xconnect_gateway_previous_legacy_wireguard_active
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Read legacy WireGuard service enablement before takeover
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ xconnect_gateway_legacy_wireguard_service_name }}"
  register: xconnect_gateway_previous_legacy_wireguard_enabled
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Read legacy Xray service active state before takeover
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ xconnect_gateway_xray_service_name }}"
  register: xconnect_gateway_previous_legacy_xray_active
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Read legacy Xray service enablement before takeover
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ xconnect_gateway_xray_service_name }}"
  register: xconnect_gateway_previous_legacy_xray_enabled
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Render restricted dedicated Xray base config candidate
  ansible.builtin.template:
    src: xray-base.json.j2
    dest: "{{ xconnect_gateway_xray_base_config_path }}.candidate"
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  when: xconnect_gateway_runtime_apply_enabled | bool

- name: Validate dedicated Xray bootstrap routing contract
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xconnect-gateway-validate
      - --config
      - "{{ xconnect_gateway_config_path }}.candidate"
      - --provider
      - "{{ xconnect_gateway_provider_manifest_path }}.candidate"
      - --xray-base
      - "{{ xconnect_gateway_xray_base_config_path }}.candidate"
      - --xray-baseline
      - "{{ xconnect_gateway_runtime_secret_lkg_dir }}/xray-runtime.json"
      - --relay-credential
      - "{{ xconnect_gateway_relay_credential_dir }}/{{ xconnect_gateway_relay_credential_ref }}.json"
  become: true
  become_user: "{{ xconnect_gateway_user }}"
  changed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Validate restricted dedicated Xray base config
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_xray_binary_path }}"
      - run
      - -test
      - -config
      - "{{ xconnect_gateway_xray_base_config_path }}.candidate"
  become: true
  become_user: "{{ xconnect_gateway_user }}"
  changed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Validate protected Xray AddInbound migration baseline
  ansible.builtin.command:
    argv:
      - "{{ xconnect_gateway_xray_binary_path }}"
      - run
      - -test
      - -config
      - "{{ xconnect_gateway_runtime_secret_lkg_dir }}/xray-runtime.json"
  become: true
  become_user: "{{ xconnect_gateway_user }}"
  changed_when: false
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode
  no_log: true

- name: Promote restricted dedicated Xray base config
  ansible.builtin.copy:
    src: "{{ xconnect_gateway_xray_base_config_path }}.candidate"
    dest: "{{ xconnect_gateway_xray_base_config_path }}"
    remote_src: true
    owner: root
    group: "{{ xconnect_gateway_group }}"
    mode: "0640"
  register: xconnect_gateway_promoted_xray_base
  when:
    - xconnect_gateway_runtime_apply_enabled | bool
    - not ansible_check_mode

- name: Install dedicated XConnect-One Xray service
  ansible.builtin.template:
    src: xconnect-one-xray.service.j2
    dest: "/etc/systemd/system/{{ xconnect_gateway_xray_apply_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: xconnect_gateway_promoted_xray_unit
  when: xconnect_gateway_runtime_apply_enabled | bool

- name: Resolve whether a runtime handoff is required
  ansible.builtin.set_fact:
    xconnect_gateway_runtime_handoff_required: >-
      {{ (xconnect_gateway_previous_legacy_wireguard_active.rc | default(3)) == 0
         or (xconnect_gateway_previous_target_wireguard_active.rc | default(3)) != 0
         or (xconnect_gateway_previous_legacy_xray_active.rc | default(3)) == 0
         or (xconnect_gateway_previous_xray_active.rc | default(3)) != 0
         or (xconnect_gateway_seeded_wireguard_config.changed | default(false))
         or (xconnect_gateway_promoted_xray_base.changed | default(false))
         or (xconnect_gateway_promoted_xray_unit.changed | default(false)) }}
  when: xconnect_gateway_runtime_apply_enabled | bool

- name: Read previous XConnect gateway service active state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ xconnect_gateway_agent_service_name }}"
  register: xconnect_gateway_previous_service_active
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_previous_bootstrap.results[3].stat.exists
    - not ansible_check_mode

- name: Read previous XConnect gateway service enablement
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ xconnect_gateway_agent_service_name }}"
  register: xconnect_gateway_previous_service_enabled
  changed_when: false
  failed_when: false
  when:
    - xconnect_gateway_previous_bootstrap.results[3].stat.exists
    - not ansible_check_mode

- name: Apply and verify XConnect gateway bootstrap transaction
  when: not ansible_check_mode
  block:
    - name: Stop the Agent before an apply runtime handoff
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_agent_service_name }}"
        state: stopped
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - xconnect_gateway_runtime_handoff_required | bool
        - (xconnect_gateway_previous_service_active.rc | default(3)) == 0

    - name: Stop legacy WireGuard before binding the target listener
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_legacy_wireguard_service_name }}"
        state: stopped
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - xconnect_gateway_runtime_handoff_required | bool
        - (xconnect_gateway_previous_legacy_wireguard_active.rc | default(3)) == 0

    - name: Start target WireGuard for the apply runtime
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_wireguard_service_name }}"
        enabled: true
        state: started
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - xconnect_gateway_runtime_handoff_required | bool

    - name: Read target WireGuard listen port after handoff
      ansible.builtin.command:
        argv:
          - "{{ xconnect_gateway_wireguard_binary_path }}"
          - show
          - "{{ xconnect_gateway_wireguard_interface }}"
          - listen-port
      register: xconnect_gateway_target_wireguard_listen_port
      changed_when: false
      when: xconnect_gateway_runtime_apply_enabled | bool

    - name: Read target WireGuard addresses after handoff
      ansible.builtin.command:
        argv:
          - "{{ xconnect_gateway_ip_binary_path }}"
          - -json
          - addr
          - show
          - dev
          - "{{ xconnect_gateway_wireguard_interface }}"
      register: xconnect_gateway_target_wireguard_addresses_output
      changed_when: false
      when: xconnect_gateway_runtime_apply_enabled | bool

    - name: Reset observed target WireGuard address list
      ansible.builtin.set_fact:
        xconnect_gateway_observed_wireguard_addresses: []
      when: xconnect_gateway_runtime_apply_enabled | bool

    - name: Build canonical target WireGuard address list
      ansible.builtin.set_fact:
        xconnect_gateway_observed_wireguard_addresses: >-
          {{ xconnect_gateway_observed_wireguard_addresses
             + [item.local ~ '/' ~ (item.prefixlen | string)] }}
      loop: >-
        {{ ((xconnect_gateway_target_wireguard_addresses_output.stdout | from_json)
             | first).addr_info | default([]) }}
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - item.family == "inet"

    - name: Assert target WireGuard binding is exact
      ansible.builtin.assert:
        that:
          - (xconnect_gateway_target_wireguard_listen_port.stdout | trim | int) == (xconnect_gateway_wireguard_listen_port | int)
          - (xconnect_gateway_observed_wireguard_addresses | sort) == xconnect_gateway_wireguard_addresses
        fail_msg: >-
          Target WireGuard interface does not match the configured canonical
          address/listen-port binding; legacy takeover was rolled back.
      when: xconnect_gateway_runtime_apply_enabled | bool

    - name: Stop legacy Xray before binding the dedicated relay listener
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_xray_service_name }}"
        state: stopped
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - xconnect_gateway_runtime_handoff_required | bool
        - (xconnect_gateway_previous_legacy_xray_active.rc | default(3)) == 0

    - name: Ensure dedicated restricted Xray runtime is healthy
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_xray_apply_service_name }}"
        enabled: true
        state: >-
          {{ 'restarted'
             if (xconnect_gateway_promoted_xray_base.changed | default(false)
                 or xconnect_gateway_promoted_xray_unit.changed | default(false))
             else 'started' }}
        daemon_reload: "{{ xconnect_gateway_promoted_xray_unit.changed | default(false) }}"
      when: xconnect_gateway_runtime_apply_enabled | bool

    - name: Promote validated XConnect gateway provider manifest
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_provider_manifest_path }}.candidate"
        dest: "{{ xconnect_gateway_provider_manifest_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      register: xconnect_gateway_promoted_provider

    - name: Promote validated XConnect gateway configuration
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_config_path }}.candidate"
        dest: "{{ xconnect_gateway_config_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      register: xconnect_gateway_promoted_config

    - name: Promote managed short-lived node credential
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_credentials_path }}.candidate"
        dest: "{{ xconnect_gateway_credentials_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      register: xconnect_gateway_promoted_credential
      when: xconnect_gateway_manage_credentials | bool
      no_log: true

    - name: Promote snapshot signing public key
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_signing_public_key_path }}.candidate"
        dest: "{{ xconnect_gateway_signing_public_key_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      register: xconnect_gateway_promoted_signing_key

    - name: Promote verified XConnect gateway Agent release symlink
      ansible.builtin.file:
        src: "{{ xconnect_gateway_agent_release_path }}"
        dest: "{{ xconnect_gateway_agent_binary_path }}"
        state: link
        owner: root
        group: root
        force: true
      register: xconnect_gateway_promoted_agent_link
      when: xconnect_gateway_agent_install_method in ["local", "url"]

    - name: Promote XConnect gateway systemd unit
      ansible.builtin.copy:
        src: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service.candidate"
        dest: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      register: xconnect_gateway_promoted_systemd_unit

    - name: Resolve whether XConnect gateway Agent restart is required
      ansible.builtin.set_fact:
        xconnect_gateway_restart_required: >-
          {{ xconnect_gateway_promoted_provider.changed
             or xconnect_gateway_promoted_config.changed
             or (xconnect_gateway_promoted_credential.changed | default(false))
             or xconnect_gateway_promoted_signing_key.changed
             or (xconnect_gateway_promoted_agent_link.changed | default(false))
             or xconnect_gateway_promoted_systemd_unit.changed
             or (xconnect_gateway_local_release.changed | default(false))
             or (xconnect_gateway_url_release.changed | default(false)) }}

    - name: Ensure XConnect gateway service is running
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_agent_service_name }}"
        enabled: true
        state: "{{ 'restarted' if xconnect_gateway_restart_required | bool else 'started' }}"
        daemon_reload: "{{ xconnect_gateway_promoted_systemd_unit.changed }}"

    - name: Wait for loopback XConnect gateway health endpoint
      ansible.builtin.uri:
        url: >-
          http://{{ '[' ~ xconnect_gateway_health_listen_host ~ ']'
                    if ':' in xconnect_gateway_health_listen_host
                    else xconnect_gateway_health_listen_host }}:{{ xconnect_gateway_health_listen_port }}{{ xconnect_gateway_health_path }}
        return_content: true
        status_code: 200
      register: xconnect_gateway_health
      until: xconnect_gateway_health.status | default(0) == 200
      retries: "{{ xconnect_gateway_health_retries | int }}"
      delay: "{{ xconnect_gateway_health_delay | int }}"
      no_log: true

    - name: Assert XConnect gateway reports the selected safe runtime mode
      ansible.builtin.assert:
        that:
          - xconnect_gateway_health.json.status in ["ok", "ready"]
          - xconnect_gateway_health.json.mode == ('apply' if xconnect_gateway_runtime_apply_enabled | bool else 'shadow')
          - xconnect_gateway_health.json.proxy_core == "xray"
          - (xconnect_gateway_health.json.runtime_apply_enabled | bool) == (xconnect_gateway_runtime_apply_enabled | bool)
          - >-
            xconnect_gateway_health.json.projection_source
            == ('accounts-only' if xconnect_gateway_accounts_only_enabled | bool else 'static-shadow')
        fail_msg: "Gateway health response does not prove the selected Xray runtime mode."
      no_log: true

    - name: Disable legacy WireGuard after healthy target takeover
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_legacy_wireguard_service_name }}"
        enabled: false
        state: stopped
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - >-
          (xconnect_gateway_previous_legacy_wireguard_active.rc | default(3)) == 0
          or (xconnect_gateway_previous_legacy_wireguard_enabled.rc | default(3)) == 0

    - name: Disable legacy Xray after healthy dedicated takeover
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_xray_service_name }}"
        enabled: false
        state: stopped
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - >-
          (xconnect_gateway_previous_legacy_xray_active.rc | default(3)) == 0
          or (xconnect_gateway_previous_legacy_xray_enabled.rc | default(3)) == 0

    - name: Record healthy bootstrap config as last-known-good
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      loop:
        - src: "{{ xconnect_gateway_config_path }}"
          dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-gateway.json"
        - src: "{{ xconnect_gateway_provider_manifest_path }}"
          dest: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-provider.json"

  rescue:
    - name: Stop failed XConnect gateway service
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_agent_service_name }}"
        enabled: false
        state: stopped
        daemon_reload: true
      failed_when: false

    - name: Stop failed dedicated Xray runtime before rollback
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_xray_apply_service_name }}"
        enabled: false
        state: stopped
      when: xconnect_gateway_runtime_apply_enabled | bool
      failed_when: false

    - name: Stop target WireGuard before restoring legacy binding
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_wireguard_service_name }}"
        enabled: false
        state: stopped
      when: xconnect_gateway_runtime_apply_enabled | bool
      failed_when: false

    - name: Remove first seeded target WireGuard config after failed takeover
      ansible.builtin.file:
        path: "{{ xconnect_gateway_wireguard_config_path }}"
        state: absent
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - not (xconnect_gateway_previous_wireguard_config.stat.exists | default(false))
        - xconnect_gateway_wireguard_target_config_source | string | trim | length > 0
      no_log: true

    - name: Restore previous target WireGuard service state
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_wireguard_service_name }}"
        enabled: "{{ (xconnect_gateway_previous_target_wireguard_enabled.rc | default(1)) == 0 }}"
        state: >-
          {{ 'started'
             if (xconnect_gateway_previous_target_wireguard_active.rc | default(1)) == 0
             else 'stopped' }}
      when: xconnect_gateway_runtime_apply_enabled | bool
      failed_when: false

    - name: Restore previous legacy WireGuard service state
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_legacy_wireguard_service_name }}"
        enabled: "{{ (xconnect_gateway_previous_legacy_wireguard_enabled.rc | default(1)) == 0 }}"
        state: >-
          {{ 'started'
             if (xconnect_gateway_previous_legacy_wireguard_active.rc | default(1)) == 0
             else 'stopped' }}
      when: xconnect_gateway_runtime_apply_enabled | bool
      failed_when: false

    - name: Restore previous dedicated Xray base config after failed bootstrap
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/xray-base.previous.json"
        dest: "{{ xconnect_gateway_xray_base_config_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - xconnect_gateway_previous_xray_bootstrap.results[0].stat.exists | default(false)

    - name: Remove first dedicated Xray base config after failed bootstrap
      ansible.builtin.file:
        path: "{{ xconnect_gateway_xray_base_config_path }}"
        state: absent
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - not (xconnect_gateway_previous_xray_bootstrap.results[0].stat.exists | default(false))

    - name: Restore previous dedicated Xray unit after failed bootstrap
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/xray-service.previous.service"
        dest: "/etc/systemd/system/{{ xconnect_gateway_xray_apply_service_name }}.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - xconnect_gateway_previous_xray_bootstrap.results[1].stat.exists | default(false)

    - name: Remove first dedicated Xray unit after failed bootstrap
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ xconnect_gateway_xray_apply_service_name }}.service"
        state: absent
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - not (xconnect_gateway_previous_xray_bootstrap.results[1].stat.exists | default(false))

    - name: Restore previous dedicated Xray service state
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_xray_apply_service_name }}"
        enabled: "{{ (xconnect_gateway_previous_xray_enabled.rc | default(3)) == 0 }}"
        state: "{{ 'restarted' if xconnect_gateway_previous_xray_active.rc | default(3) == 0 else 'stopped' }}"
        daemon_reload: true
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - xconnect_gateway_previous_xray_bootstrap.results[1].stat.exists | default(false)
      failed_when: false

    - name: Restore previous legacy Xray service state
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_xray_service_name }}"
        enabled: "{{ (xconnect_gateway_previous_legacy_xray_enabled.rc | default(1)) == 0 }}"
        state: >-
          {{ 'started'
             if (xconnect_gateway_previous_legacy_xray_active.rc | default(1)) == 0
             else 'stopped' }}
        daemon_reload: true
      when: xconnect_gateway_runtime_apply_enabled | bool
      failed_when: false

    - name: Remove first protected Xray runtime baseline after failed bootstrap
      ansible.builtin.file:
        path: "{{ xconnect_gateway_runtime_secret_lkg_dir }}/xray-runtime.json"
        state: absent
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - not (xconnect_gateway_previous_xray_runtime_baseline.stat.exists | default(false))
      no_log: true

    - name: Remove first protected relay runtime files after failed bootstrap
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ xconnect_gateway_previous_relay_runtime_files.results }}"
      when:
        - xconnect_gateway_runtime_apply_enabled | bool
        - not (item.stat.exists | default(false))
      no_log: true

    - name: Restore previous Gateway configuration after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-gateway.previous.json"
        dest: "{{ xconnect_gateway_config_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when: xconnect_gateway_previous_bootstrap.results[0].stat.exists

    - name: Remove first-install Gateway configuration after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_config_path }}"
        state: absent
      when: not xconnect_gateway_previous_bootstrap.results[0].stat.exists

    - name: Restore previous Gateway provider after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-provider.previous.json"
        dest: "{{ xconnect_gateway_provider_manifest_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when: xconnect_gateway_previous_bootstrap.results[1].stat.exists

    - name: Remove first-install Gateway provider after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_provider_manifest_path }}"
        state: absent
      when: not xconnect_gateway_previous_bootstrap.results[1].stat.exists

    - name: Restore previous managed node credential after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-credential.previous.token"
        dest: "{{ xconnect_gateway_credentials_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when:
        - xconnect_gateway_manage_credentials | bool
        - xconnect_gateway_previous_bootstrap.results[4].stat.exists
      no_log: true

    - name: Remove first managed node credential after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_credentials_path }}"
        state: absent
      when:
        - xconnect_gateway_manage_credentials | bool
        - not xconnect_gateway_previous_bootstrap.results[4].stat.exists
      no_log: true

    - name: Restore previous snapshot signing key after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-signing-key.previous.pub"
        dest: "{{ xconnect_gateway_signing_public_key_path }}"
        remote_src: true
        owner: root
        group: "{{ xconnect_gateway_group }}"
        mode: "0640"
      when: xconnect_gateway_previous_bootstrap.results[5].stat.exists

    - name: Remove first snapshot signing key after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_signing_public_key_path }}"
        state: absent
      when: not xconnect_gateway_previous_bootstrap.results[5].stat.exists

    - name: Restore previous managed Agent symlink after failed health
      ansible.builtin.file:
        src: "{{ xconnect_gateway_previous_bootstrap.results[2].stat.lnk_source }}"
        dest: "{{ xconnect_gateway_agent_binary_path }}"
        state: link
        owner: root
        group: root
        force: true
      when:
        - xconnect_gateway_agent_install_method in ["local", "url"]
        - xconnect_gateway_previous_bootstrap.results[2].stat.islnk | default(false)

    - name: Remove first managed Agent symlink after failed health
      ansible.builtin.file:
        path: "{{ xconnect_gateway_agent_binary_path }}"
        state: absent
      when:
        - xconnect_gateway_agent_install_method in ["local", "url"]
        - not (xconnect_gateway_previous_bootstrap.results[2].stat.islnk | default(false))

    - name: Restore previous systemd unit after failed health
      ansible.builtin.copy:
        src: "{{ xconnect_gateway_last_known_good_dir }}/bootstrap-systemd.previous.service"
        dest: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: xconnect_gateway_previous_bootstrap.results[3].stat.exists

    - name: Remove first-install systemd unit after failed health
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ xconnect_gateway_agent_service_name }}.service"
        state: absent
      when: not xconnect_gateway_previous_bootstrap.results[3].stat.exists

    - name: Restore previous XConnect gateway service state
      ansible.builtin.systemd:
        name: "{{ xconnect_gateway_agent_service_name }}"
        enabled: "{{ (xconnect_gateway_previous_service_enabled.rc | default(1)) == 0 }}"
        state: >-
          {{ 'started'
             if (xconnect_gateway_previous_service_active.rc | default(1)) == 0
             else 'stopped' }}
        daemon_reload: true
      when: xconnect_gateway_previous_bootstrap.results[3].stat.exists

    - name: Fail deployment after restoring previous Gateway bootstrap
      ansible.builtin.fail:
        msg: >-
          XConnect gateway health verification failed; prior Agent, dedicated
          runtime, target/legacy WireGuard, and legacy Xray states were restored.
