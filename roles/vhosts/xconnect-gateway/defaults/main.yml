---
xconnect_gateway_enabled: false
xconnect_gateway_shadow_mode: true
xconnect_gateway_runtime_apply_enabled: false
xconnect_gateway_accounts_only_enabled: false
xconnect_gateway_accounts_only_readiness_binary: /usr/local/bin/xconnect-cutover-readiness
xconnect_gateway_accounts_only_readiness_bundle: ""
xconnect_gateway_accounts_only_evidence_path: "{{ xconnect_gateway_evidence_dir }}/accounts-only-readiness.json"
xconnect_gateway_accounts_only_minimum_health_samples: 3
xconnect_gateway_accounts_only_authorization_public_key_path: "{{ xconnect_gateway_config_root }}/cutover-authorization-signing.pub"
xconnect_gateway_accounts_only_authorization_key_id: ""
xconnect_gateway_node_id: "{{ inventory_hostname }}"
xconnect_gateway_control_plane_url: ""
xconnect_gateway_control_plane_poll_interval: 30

xconnect_gateway_user: xconnect-gateway
xconnect_gateway_group: xconnect-gateway
xconnect_gateway_config_root: /etc/xconnect/gateway
xconnect_gateway_state_root: /var/lib/xconnect/gateway
xconnect_gateway_runtime_root: /run/xconnect/gateway
xconnect_gateway_apply_lock_path: "{{ xconnect_gateway_runtime_root }}/apply.lock"
xconnect_gateway_transaction_dir: "{{ xconnect_gateway_runtime_root }}/transactions"
xconnect_gateway_runtime_lkg_dir: "{{ xconnect_gateway_state_root }}/runtime-last-known-good"
xconnect_gateway_runtime_secret_lkg_dir: "{{ xconnect_gateway_state_root }}/runtime-secret-last-known-good"
xconnect_gateway_relay_credential_dir: "{{ xconnect_gateway_config_root }}/relay-credentials"
xconnect_gateway_relay_credential_ref: "relay_credential_{{ xconnect_gateway_node_id }}"
xconnect_gateway_relay_credential_source: ""
xconnect_gateway_relay_tls_certificate_source: ""
xconnect_gateway_relay_tls_private_key_source: ""
xconnect_gateway_relay_tls_dir: "{{ xconnect_gateway_config_root }}/relay-tls"
xconnect_gateway_relay_tls_certificate_path: "{{ xconnect_gateway_relay_tls_dir }}/relay.crt"
xconnect_gateway_relay_tls_private_key_path: "{{ xconnect_gateway_relay_tls_dir }}/relay.key"
xconnect_gateway_log_root: /var/log/xconnect/gateway
xconnect_gateway_provider_dir: "{{ xconnect_gateway_config_root }}/providers.d"
xconnect_gateway_candidate_dir: "{{ xconnect_gateway_state_root }}/candidates"
xconnect_gateway_last_known_good_dir: "{{ xconnect_gateway_state_root }}/last-known-good"
xconnect_gateway_evidence_dir: "{{ xconnect_gateway_state_root }}/evidence"
xconnect_gateway_config_path: "{{ xconnect_gateway_config_root }}/gateway.json"
xconnect_gateway_provider_manifest_path: "{{ xconnect_gateway_provider_dir }}/xconnect-one.json"
xconnect_gateway_credentials_path: "{{ xconnect_gateway_config_root }}/node-credential.token"
xconnect_gateway_signing_public_key_path: "{{ xconnect_gateway_config_root }}/snapshot-signing.pub"

xconnect_gateway_agent_install_method: preinstalled
xconnect_gateway_agent_binary_source: ""
xconnect_gateway_agent_binary_url: ""
xconnect_gateway_agent_binary_checksum: ""
xconnect_gateway_agent_binary_path: /usr/local/bin/xconnect-gateway-agent
xconnect_gateway_agent_release_root: /opt/xconnect/gateway-agent/releases
xconnect_gateway_agent_release_path: "{{ xconnect_gateway_agent_release_root }}/{{ xconnect_gateway_agent_version }}/xconnect-gateway-agent"
xconnect_gateway_agent_service_name: xconnect-gateway-agent
xconnect_gateway_agent_version: "0.1.0"
xconnect_gateway_agent_version_pattern: "^xconnect-gateway-agent\\s+v?{{ xconnect_gateway_agent_version | regex_escape }}(?:\\s|$)"
xconnect_gateway_provider_version: "0.1.0"

# XConnect-One v1 has exactly one proxy core. Enabling the service also checks
# the installed binary reports this pinned release.
xconnect_gateway_proxy_core: xray
xconnect_gateway_xray_binary_path: /usr/local/bin/xray
xconnect_gateway_xray_required_version: "26.3.27"
xconnect_gateway_xray_service_name: xray-wg-tproxy
xconnect_gateway_xray_config_path: /usr/local/etc/xray/wireguard-over-vless.json
xconnect_gateway_xray_apply_service_name: xconnect-one-xray
xconnect_gateway_xray_base_config_path: "{{ xconnect_gateway_config_root }}/xray-base.json"
xconnect_gateway_xray_api_endpoint: 127.0.0.1:10085
xconnect_gateway_xray_inbound_tag: xconnect-one-relay
xconnect_gateway_xray_wireguard_target_host: 127.0.0.1
# Required for apply migration. This remote 0600 file is an Xray AddInbound
# config for the currently active dedicated XConnect-One inbound.
xconnect_gateway_xray_runtime_baseline_source: ""
xconnect_gateway_wireguard_binary_path: /usr/bin/wg
xconnect_gateway_nftables_binary_path: /usr/sbin/nft
xconnect_gateway_ip_binary_path: /usr/sbin/ip
xconnect_gateway_wireguard_listen_port: 51820
xconnect_gateway_wireguard_addresses:
  - 10.77.0.1/32
xconnect_gateway_relay_listen_host: 0.0.0.0
xconnect_gateway_relay_listen_port: 443
xconnect_gateway_apply_readback_retries: 3
xconnect_gateway_wireguard_interface: wg-xco
xconnect_gateway_wireguard_config_path: /etc/wireguard/wg-xco.conf
xconnect_gateway_wireguard_service_name: wg-quick@wg-xco
xconnect_gateway_legacy_wireguard_interface: wg-xwm
xconnect_gateway_legacy_wireguard_service_name: wg-quick@wg-xwm
xconnect_gateway_wireguard_target_config_source: ""

xconnect_gateway_snapshot_schema_min: 1
xconnect_gateway_snapshot_schema_max: 1
xconnect_gateway_empty_peer_snapshot_policy: require-explicit-override
xconnect_gateway_snapshot_signing_public_key: ""
xconnect_gateway_snapshot_signing_key_id: ""
xconnect_gateway_manage_credentials: false
xconnect_gateway_credentials_source: ""
xconnect_gateway_health_listen_host: 127.0.0.1
xconnect_gateway_health_listen_port: 9789
xconnect_gateway_health_path: /healthz
xconnect_gateway_health_retries: 12
xconnect_gateway_health_delay: 2
