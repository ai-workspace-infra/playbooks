---
cmdb_monitoring_state: present
cmdb_monitoring_environment: ""
cmdb_monitoring_provider: ""
cmdb_monitoring_project_id: ""
cmdb_monitoring_logical_project: ""
cmdb_monitoring_region: "{{ region | default(cmdb_region | default('unknown', true), true) }}"
cmdb_monitoring_instance: "{{ inventory_hostname }}"
cmdb_monitoring_resource_id: "{{ resource_id | default(cmdb_resource_id | default(cmdb_monitoring_instance, true), true) }}"
cmdb_monitoring_runtime_form: "{{ runtime_form | default(cmdb_runtime_form | default('systemd', true), true) }}"
cmdb_monitoring_resource_key: "{{ resource_key | default(cmdb_resource_key | default(cmdb_monitoring_provider ~ ':' ~ (cmdb_monitoring_project_id | default(cmdb_monitoring_provider, true)) ~ ':' ~ cmdb_monitoring_region ~ ':' ~ cmdb_monitoring_resource_id, true), true) }}"
cmdb_monitoring_endpoint: https://observability.svc.plus/ingest/metrics/api/v1/write
cmdb_monitoring_auth_user: "{{ lookup('ansible.builtin.env', 'VECTOR_AUTH_USER') }}"
cmdb_monitoring_auth_password: "{{ lookup('ansible.builtin.env', 'VECTOR_AUTH_PASSWORD') }}"
cmdb_monitoring_tls_verify_certificate: true
cmdb_monitoring_tls_verify_hostname: true
cmdb_monitoring_vector_version: "0.41.1"
cmdb_monitoring_node_version: "1.8.2"
