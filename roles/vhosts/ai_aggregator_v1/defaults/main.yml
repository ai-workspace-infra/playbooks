---
# The GitOps manifest supplies all topology values. These defaults keep an
# accidental direct run in plan mode and make the missing manifest explicit.
ai_aggregator_manifest_file: ""
ai_aggregator_operation: plan # plan | stage | activate
ai_aggregator_gateway_adapter: apisix
ai_aggregator_root: /opt/ai-aggregator
ai_aggregator_runtime_root: /run/ai-aggregator
ai_aggregator_service_group: ai-aggregator
ai_aggregator_vault_tls_runtime_enabled: false
ai_aggregator_vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default('https://vault.svc.plus', true) }}"
ai_aggregator_vault_token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true) }}"
ai_aggregator_new_api_binary: /opt/ai-aggregator/new-api/new-api
ai_aggregator_litellm_binary: /opt/ai-aggregator/litellm/.venv/bin/litellm
ai_aggregator_litellm_python: /opt/ai-aggregator/litellm/.venv/bin/python
ai_aggregator_cliproxyapi_binary: /opt/ai-aggregator/cliproxyapi/cliproxyapi
caddy_config_dir: /etc/caddy
ai_aggregator_apisix_bundle_dir: ""
ai_aggregator_apisix_binary: /usr/bin/apisix
ai_aggregator_apisix_home: /usr/local/apisix
ai_aggregator_apisix_service: ai-aggregator-apisix.service
ai_aggregator_apisix_metrics_port: 9091
ai_aggregator_apisix_metrics_global_rule_id: 900001
