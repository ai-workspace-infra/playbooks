---
- name: Load GitOps declaration to select the gateway adapter
  ansible.builtin.include_vars:
    file: "{{ ai_aggregator_manifest_file }}"
    name: ai_aggregator_manifest

- name: Select the gateway adapter
  ansible.builtin.set_fact:
    ai_aggregator_spec: "{{ ai_aggregator_manifest.spec }}"
    ai_aggregator_adapter: "{{ ai_aggregator_manifest.spec.gateway.adapter | default(ai_aggregator_gateway_adapter) }}"

- name: Require a supported gateway adapter
  ansible.builtin.assert:
    that: ai_aggregator_adapter in ['apisix', 'kong']

- name: Deploy APISIX Standalone from GitOps files
  ansible.builtin.include_tasks: apisix.yml
  when: ai_aggregator_adapter == 'apisix'

- name: Deploy the legacy Kong adapter
  ansible.builtin.include_tasks: legacy-kong.yml
  when: ai_aggregator_adapter == 'kong'
