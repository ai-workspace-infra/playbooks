---
- name: Read the immutable candidate identity
  ansible.builtin.command:
    argv: [git, -C, '{{ generation_fresh_gitops_checkout }}', rev-parse, HEAD]
  delegate_to: localhost
  become: false
  register: generation_fresh_gitops_head
  changed_when: false

- name: Require the exact candidate revision
  ansible.builtin.assert:
    that:
      - generation_fresh_gitops_sha is match('^[0-9a-f]{40}$')
      - generation_fresh_gitops_head.stdout == generation_fresh_gitops_sha
      - inventory_hostname == 'web-saas-' ~ generation_fresh_spec.target_generation
      - generation_fresh_spec.runtime_mode | default('candidate') in ['candidate', 'primary']

- name: Stage and validate declared primary credentials before writer checks
  ansible.builtin.include_tasks: primary-configuration.yml
  when: generation_fresh_spec.runtime_mode | default('candidate') == 'primary'

- name: Verify the existing single-writer boundary before primary preparation
  ansible.builtin.include_tasks: primary-gate.yml
  when: generation_fresh_spec.runtime_mode | default('candidate') == 'primary'

- name: Reuse the canonical shared service token owner
  ansible.builtin.include_role:
    name: web_saas_generation_recovery
    tasks_from: service-token.yml
  vars:
    web_saas_recovery_gitops_checkout: '{{ generation_fresh_gitops_checkout }}'
    web_saas_recovery_phase: prepare

- name: Reuse the canonical Vault backed business database owner
  ansible.builtin.include_role:
    name: web_saas_business_database
  vars:
    web_saas_business_database_target: '{{ inventory_hostname }}'
    web_saas_business_database_gitops_checkout: '{{ generation_fresh_gitops_checkout }}'
    web_saas_business_database_gitops_sha: '{{ generation_fresh_gitops_sha }}'
    web_saas_business_database_backup_manifest: '{{ generation_fresh_spec.business_backup_manifest }}'
    web_saas_business_database_confirm: '{{ generation_fresh_database_confirm | default(false) }}'

- name: Render the native candidate Accounts config
  ansible.builtin.template:
    src: account.yaml.j2
    dest: /etc/xcontrol/web-saas-recovery/account.yaml
    mode: '0600'
  when: generation_fresh_spec.runtime_mode | default('candidate') == 'candidate'

- name: Restore trusted certificates and stage every public and generation SNI
  ansible.builtin.include_role:
    name: web_saas_public_ingress
  vars:
    web_saas_public_ingress_target: '{{ inventory_hostname }}'
    web_saas_public_ingress_generation: '{{ generation_fresh_spec.target_generation }}'
    web_saas_public_ingress_manifest_file: '{{ generation_fresh_gitops_checkout }}/compose/web-saas/ingress/prod.yaml'
    web_saas_public_ingress_image: "{{ lookup('ansible.builtin.file', generation_fresh_gitops_checkout ~ '/compose/web-saas/.env.' ~ generation_fresh_spec.target_generation) | regex_search('(?m)^CADDY_IMAGE=(.+)$', '\\1') | first }}"
    web_saas_public_ingress_activate: false
