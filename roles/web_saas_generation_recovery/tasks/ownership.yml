---
- name: Verify the immutable checkpoint before ownership metadata repair
  ansible.builtin.include_tasks: verify.yml

- name: Install the reviewed ownership-aware executor
  ansible.builtin.copy:
    src: restore_new_generation.py
    dest: /usr/local/libexec/web-saas-generation-recovery/restore.py
    owner: root
    group: root
    mode: '0700'

- name: Map only restored RLS table ownership without disabling RLS or granting bypass
  ansible.builtin.command:
    argv:
      - python3
      - /usr/local/libexec/web-saas-generation-recovery/restore.py
      - align_rls_ownership
      - "{{ recovery.target.generation }}"
      - "{{ recovery.source.generation }}"
      - "{{ recovery.source.archive_sha256 }}"
      - "{{ recovery.source.schema_version | string }}"
      - "{{ recovery.source.counts | to_json }}"
  register: recovery_ownership
  no_log: true

- name: Preserve nonsecret ownership and unchanged-data evidence
  ansible.builtin.copy:
    content: "{{ recovery_ownership.stdout | from_json | to_nice_json }}"
    dest: "{{ recovery_root }}/rls-ownership.json"
    owner: root
    group: root
    mode: '0600'

- name: Return nonsecret ownership evidence
  ansible.builtin.debug:
    msg: "{{ recovery_ownership.stdout | from_json }}"
