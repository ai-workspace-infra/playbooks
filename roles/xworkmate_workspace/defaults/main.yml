---
# defaults file for xworkmate_workspace
xworkmate_workspace_base_dir: "{{ ansible_env.HOME | default('/root') }}/.xworkmate-workspace"
xworkmate_workspace_data_dir: "{{ xworkmate_workspace_base_dir }}/data"

xworkmate_workspace_mode: "all-in-one" # all-in-one, intranet, https
xworkmate_workspace_domain: ""
xworkmate_workspace_acme_email: "ops@example.com"

xworkmate_workspace_listen_ip: "127.0.0.1"
xworkmate_workspace_bridge_port: 8787
xworkmate_workspace_qmd_port: 8181
xworkmate_workspace_pg_port: 15432
xworkmate_workspace_ds_bot_port: 13080

xworkmate_workspace_bridge_image: "ghcr.io/ai-workspace-lab/xworkmate-bridge:v1.0-beta2"
xworkmate_workspace_qmd_image: "ghcr.io/ai-workspace-lab/qmd:v2.8.3"
xworkmate_workspace_postgres_image: "postgres-extensions:17"
xworkmate_workspace_dsh_image: "ghcr.io/deepseek-ai/deepseek-harness:latest"
xworkmate_workspace_ds_bot_image: "ghcr.io/fei2411/deepseek-bot:latest"

xworkmate_workspace_postgres_db: "postgres"
xworkmate_workspace_postgres_user: "postgres"

# AI Gateway 联动部署 (All-in-One 模式默认启用)
xworkmate_workspace_enable_ai_gateway: true
xworkmate_workspace_new_api_port: 3000
xworkmate_workspace_litellm_port: 4000
xworkmate_workspace_new_api_image: "calciumion/new-api:v0.4.10"
xworkmate_workspace_litellm_image: "ghcr.io/berriai/litellm:v1.51.0"

# GitOps Compose 声明权威源
xworkmate_workspace_gitops_compose_url: "https://raw.githubusercontent.com/ai-workspace-infra/gitops/main/compose/xworkmate-workspace/docker-compose.yml"

# Vault 凭据检索路径 (若存在)
xworkmate_workspace_vault_mount: "secret"
xworkmate_workspace_vault_path: "secret/data/ai-workspace/bridge"
