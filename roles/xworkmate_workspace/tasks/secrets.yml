---
- name: 读取由 Vault/OIDC 注入的运行时机密
  ansible.builtin.set_fact:
    xworkmate_workspace_auth_token: "{{ lookup('ansible.builtin.env', 'XWORKMATE_WORKSPACE_AUTH_TOKEN') | default('', true) }}"
    xworkmate_workspace_pg_password: "{{ lookup('ansible.builtin.env', 'XWORKMATE_WORKSPACE_POSTGRES_PASSWORD') | default('', true) }}"
    xworkmate_workspace_qmd_ingest_token: "{{ lookup('ansible.builtin.env', 'XWORKMATE_WORKSPACE_QMD_INGEST_TOKEN') | default('', true) }}"
    xworkmate_workspace_qmd_mcp_token: "{{ lookup('ansible.builtin.env', 'XWORKMATE_WORKSPACE_QMD_MCP_TOKEN') | default('', true) }}"
  no_log: true

- name: Require stable externally managed secrets before deploying
  ansible.builtin.assert:
    that:
      - xworkmate_workspace_auth_token | length >= 32
      - xworkmate_workspace_pg_password | length >= 24
      - xworkmate_workspace_qmd_ingest_token | length >= 32
      - xworkmate_workspace_qmd_mcp_token | length >= 32
    fail_msg: >-
      Missing or invalid XWorkmate Workspace secrets. Inject stable values from
      Vault through the caller environment; this role never invents replacements.
  no_log: true
