---
- name: Execute explicitly requested legacy installer under its service owner
  when: xworkmate_workspace_legacy_setup_enabled | bool
  block:
    - name: Validate the selected compatibility installer
      ansible.builtin.assert:
        that:
          - xworkmate_workspace_legacy_setup_script in ['setup-xworkmate-workspace.sh', 'setup-agent-context.sh']
          - xworkmate_workspace_legacy_setup_arguments is sequence and xworkmate_workspace_legacy_setup_arguments is not string
    - name: Run the owner installer on the selected inventory host
      ansible.builtin.script:
        cmd: "{{ role_path }}/files/{{ xworkmate_workspace_legacy_setup_script }} {{ xworkmate_workspace_legacy_setup_arguments | map('quote') | join(' ') }}"
        executable: /bin/bash
      environment: '{{ xworkmate_workspace_legacy_setup_environment }}'
      no_log: true
      when: not ansible_check_mode
