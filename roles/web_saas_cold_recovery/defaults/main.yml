---
# This role deliberately separates backup transport from restore. A restore
# target is always isolated verification unless an operator uses the separate
# documented primary-restore procedure.
web_saas_cold_recovery_mode: backup
web_saas_cold_recovery_root: /data/backups/web-saas
web_saas_cold_recovery_environment: ''
web_saas_cold_recovery_service_variant: ''
web_saas_cold_recovery_release_tag: ''
web_saas_cold_recovery_run_id: ''
web_saas_cold_recovery_database: account
web_saas_cold_recovery_postgres_container: web-saas-postgresql
web_saas_cold_recovery_expected_version: ''
web_saas_cold_recovery_source_database_id: ''
web_saas_cold_recovery_baseline_id: ''
web_saas_cold_recovery_authorized_subscription_sample_id: ''
web_saas_cold_recovery_passphrase: ''
web_saas_cold_recovery_controller_archive_dir: ''
web_saas_cold_recovery_receipt_file: ''
web_saas_cold_recovery_migration_table: schema_migrations
web_saas_cold_recovery_migration_version_column: version
web_saas_cold_recovery_migration_dirty_column: dirty
web_saas_cold_recovery_migration_order_column: version
web_saas_cold_recovery_expected_migration_rows: 1
web_saas_cold_recovery_users_table: users
web_saas_cold_recovery_subscription_table: subscriptions
web_saas_cold_recovery_retain_restore: false
web_saas_cold_recovery_evidence: {}
