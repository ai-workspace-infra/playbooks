---
- name: Read the source receipt for isolated restore verification
  ansible.builtin.set_fact:
    web_saas_cold_recovery_source_evidence: '{{ lookup("ansible.builtin.file", web_saas_cold_recovery_receipt_file) | from_json }}'
  delegate_to: localhost
  become: false
  no_log: true

- name: Require an explicit service-variant match when one is supplied
  ansible.builtin.assert:
    that:
      - web_saas_cold_recovery_service_variant == '' or web_saas_cold_recovery_source_evidence.service_variant | default('') == web_saas_cold_recovery_service_variant
    fail_msg: Source receipt belongs to a different web-saas service variant

- name: Restore the archive into a run-owned temporary database only
  ansible.builtin.include_role:
    name: web_saas_data_restore_verify
  vars:
    web_saas_data_restore_verify_database: '{{ web_saas_cold_recovery_database }}'
    web_saas_data_restore_verify_restore_database_prefix: release_verify_
    web_saas_data_restore_verify_source_database_id: '{{ web_saas_cold_recovery_source_evidence.source_database_id }}'
    web_saas_data_restore_verify_baseline_id: '{{ web_saas_cold_recovery_source_evidence.baseline_id }}'
    web_saas_data_restore_verify_authorized_subscription_sample_id: '{{ web_saas_cold_recovery_source_evidence.authorized_subscription_sample_id }}'
    web_saas_data_restore_verify_expected_version: '{{ web_saas_cold_recovery_source_evidence.schema_version }}'
    web_saas_data_restore_verify_source_schema_sha256: '{{ web_saas_cold_recovery_source_evidence.schema_sha256 }}'
    web_saas_data_restore_verify_source_data_sha256: '{{ web_saas_cold_recovery_source_evidence.data_sha256 }}'
    web_saas_data_restore_verify_database_system_identifier: '{{ web_saas_cold_recovery_source_evidence.database_system_identifier }}'
    web_saas_data_restore_verify_expected_users: '{{ web_saas_cold_recovery_source_evidence.existing_users }}'
    web_saas_data_restore_verify_expected_subscriptions: '{{ web_saas_cold_recovery_source_evidence.subscriptions }}'
    web_saas_data_restore_verify_archive_path: '{{ web_saas_cold_recovery_root }}/{{ web_saas_cold_recovery_environment }}/{{ web_saas_cold_recovery_release_tag }}/{{ web_saas_cold_recovery_run_id }}/account.dump.enc'
    web_saas_data_restore_verify_archive_sha256: '{{ web_saas_cold_recovery_source_evidence.archive_sha256 }}'
    web_saas_data_restore_verify_environment: '{{ web_saas_cold_recovery_environment }}'
    web_saas_data_restore_verify_run_id: '{{ web_saas_cold_recovery_run_id }}'
    web_saas_data_restore_verify_postgres_container: '{{ web_saas_cold_recovery_postgres_container }}'
    web_saas_data_restore_verify_passphrase: '{{ web_saas_cold_recovery_passphrase }}'
    web_saas_data_restore_verify_migration_table: '{{ web_saas_cold_recovery_source_evidence.migration_table | default(web_saas_cold_recovery_migration_table) }}'
    web_saas_data_restore_verify_migration_version_column: '{{ web_saas_cold_recovery_migration_version_column }}'
    web_saas_data_restore_verify_migration_dirty_column: '{{ web_saas_cold_recovery_migration_dirty_column }}'
    web_saas_data_restore_verify_migration_order_column: '{{ web_saas_cold_recovery_migration_order_column }}'
    web_saas_data_restore_verify_expected_migration_rows: '{{ web_saas_cold_recovery_source_evidence.migration_rows | default(web_saas_cold_recovery_expected_migration_rows) }}'
    web_saas_data_restore_verify_expected_migration_dirty: '{{ web_saas_cold_recovery_source_evidence.migration_dirty | default("false") }}'
    web_saas_data_restore_verify_users_table: '{{ web_saas_cold_recovery_source_evidence.users_table | default(web_saas_cold_recovery_users_table) }}'
    web_saas_data_restore_verify_subscription_table: '{{ web_saas_cold_recovery_source_evidence.subscription_table | default(web_saas_cold_recovery_subscription_table) }}'
    web_saas_data_restore_verify_cross_machine: true
  no_log: true

- name: Return the isolated restore evidence
  ansible.builtin.set_fact:
    web_saas_cold_recovery_evidence: '{{ web_saas_data_restore_verify_evidence }}'
