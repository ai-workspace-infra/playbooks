# Non-sensitive values come from GitOps. Secret values are supplied by Vault
# to gateway_secret_env_file on the edge node.
gateway_manifest_path: ''
gateway_source_path: ''
gateway_environment: uat
gateway_region: jp
gateway_id: xconnect-gateway-uat
gateway_node_id: xconnect-gateway-uat
gateway_config_root: /etc/xcontrol/apisix/{{ gateway_environment }}/config
gateway_runtime_root: /etc/xcontrol/apisix/{{ gateway_environment }}/runtime
gateway_state_root: /var/lib/xconnect-gateway-{{ gateway_environment }}
gateway_install_root: /opt/apisix-pg-standalone
gateway_secret_env_file: /etc/xcontrol/apisix/{{ gateway_environment }}/secrets.env
gateway_environment_file: /etc/xcontrol/apisix/{{ gateway_environment }}/environment.env
gateway_runtime_mount_unit: etc-xcontrol-apisix-{{ gateway_environment }}-runtime.mount
gateway_apisix_home: /usr/local/apisix
gateway_apisix_binary: /usr/bin/apisix
gateway_python: python3
gateway_config_api_port: 19089
gateway_probe_url: http://127.0.0.1:19080/api/ping
