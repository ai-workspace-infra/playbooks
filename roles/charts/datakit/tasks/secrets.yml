---
- name: 校验是否显式启用 DataWay Secret 管理
  ansible.builtin.assert:
    that:
      - datakit_manage_dataway_secret is boolean
    fail_msg: "datakit_manage_dataway_secret 必须为布尔值。"

- name: 从 HashiCorp Vault KV 读取 DataWay 接入凭据
  community.hashi_vault.vault_kv2_get:
    url: "{{ datakit_vault_addr }}"
    auth_method: "{{ 'jwt' if (datakit_vault_jwt_token | length > 0) else 'token' }}"
    jwt: "{{ datakit_vault_jwt_token if (datakit_vault_jwt_token | length > 0) else omit }}"
    token: "{{ datakit_vault_token if (datakit_vault_jwt_token | length == 0) else omit }}"
    path: "{{ datakit_vault_path }}"
    engine_mount_point: "kv"
  register: datakit_vault_secret
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  no_log: true
  failed_when: false
  when:
    - datakit_manage_dataway_secret | bool
    - (datakit_dataway_url | trim | length == 0)
    - (datakit_vault_jwt_token | trim | length > 0) or (datakit_vault_token | trim | length > 0)

- name: 解析 DataWay URL (优先级: 环境变量 > Vault > Playbook变量)
  ansible.builtin.set_fact:
    datakit_dataway_url: >-
      {{ lookup('ansible.builtin.env', 'DATAKIT_DATAWAY_URL')
         | default(lookup('ansible.builtin.env', 'DATAWAY_URL'), true)
         | default(datakit_vault_secret.secret.DATAWAY_URL | default(datakit_dataway_url | default(''), true), true) }}
  no_log: true
  when: datakit_manage_dataway_secret | bool

- name: 校验显式 DataWay Secret 管理所需的接入 URL
  ansible.builtin.assert:
    that:
      - datakit_dataway_url | trim | length > 0
    fail_msg: "显式管理 DataWay Secret 时，必须提供 DATAWAY_URL 或 Vault 凭据。"
  when: datakit_manage_dataway_secret | bool

- name: 在命名空间中创建或更新 DataWay Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ datakit_dataway_secret_name }}"
        namespace: "{{ datakit_namespace }}"
      type: Opaque
      stringData:
        ENV_DATAWAY: "{{ datakit_dataway_url }}"
  no_log: true
  when: datakit_manage_dataway_secret | bool

- name: 读取现有 DataWay Secret 元数据
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ datakit_dataway_secret_name }}"
    namespace: "{{ datakit_namespace }}"
  register: datakit_existing_dataway_secret
  no_log: true
  when: not (datakit_manage_dataway_secret | bool)

- name: 确认存在可复用的 DataWay Secret
  ansible.builtin.assert:
    that:
      - datakit_existing_dataway_secret.resources | length == 1
    fail_msg: "未找到现有 DataWay Secret；首次安装需显式启用 Secret 管理并提供 Vault 凭据。"
  when: not (datakit_manage_dataway_secret | bool)
