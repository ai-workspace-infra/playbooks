---
- name: 从 HashiCorp Vault KV 读取 DataWay 接入凭据
  community.hashi_vault.vault_kv2_get:
    url: "{{ datakit_vault_addr }}"
    auth_method: "{{ 'jwt' if (datakit_vault_jwt_token | length > 0) else 'token' }}"
    jwt: "{{ datakit_vault_jwt_token if (datakit_vault_jwt_token | length > 0) else omit }}"
    token: "{{ datakit_vault_token if (datakit_vault_jwt_token | length == 0) else omit }}"
    path: "{{ datakit_vault_path }}"
    engine_mount_point: "kv"
  register: datakit_vault_secret
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  no_log: true
  failed_when: false
  when:
    - (datakit_dataway_url | trim | length == 0)
    - (datakit_vault_jwt_token | trim | length > 0) or (datakit_vault_token | trim | length > 0)

- name: 解析 DataWay URL (优先级: 环境变量 > Vault > Playbook变量)
  ansible.builtin.set_fact:
    datakit_dataway_url: >-
      {{ lookup('ansible.builtin.env', 'DATAKIT_DATAWAY_URL')
         | default(lookup('ansible.builtin.env', 'DATAWAY_URL'), true)
         | default(datakit_vault_secret.secret.DATAWAY_URL | default(datakit_dataway_url | default(''), true), true) }}
  no_log: true

- name: 校验 DataWay URL 完整性
  ansible.builtin.assert:
    that:
      - datakit_dataway_url | trim | length > 0
    fail_msg: "DATAWAY_URL 必须通过环境变量、Vault 或 Playbook 参数提供！"

- name: 在命名空间中创建或更新 datakit-dataway-secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "datakit-dataway-secret"
        namespace: "{{ datakit_namespace }}"
      type: Opaque
      stringData:
        ENV_DATAWAY: "{{ datakit_dataway_url }}"
  no_log: true
