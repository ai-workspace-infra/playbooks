---
- name: Reject a symlink or non-directory mountpoint before inspecting it
  ansible.builtin.stat:
    path: "{{ web_saas_data_mount_path }}"
    follow: false
  register: web_saas_data_mount_directory

- name: Require an absent or real directory mountpoint
  ansible.builtin.assert:
    that:
      - not web_saas_data_mount_directory.stat.exists or web_saas_data_mount_directory.stat.isdir | default(false)

- name: Check whether /data is already its own mountpoint
  ansible.builtin.command:
    argv: [findmnt, -nro, TARGET, --mountpoint, "{{ web_saas_data_mount_path }}"]
  register: web_saas_data_mount_target
  changed_when: false
  failed_when: web_saas_data_mount_target.rc not in [0, 1]

- name: Read the declared disk and mounted source as real device paths
  ansible.builtin.command:
    argv: [readlink, -f, "{{ item }}"]
  loop:
    - "{{ web_saas_data_device_path }}"
    - "{{ (web_saas_data_mount.stdout.split() | first) | default('/', true) }}"
  register: web_saas_data_real_devices
  changed_when: false
  when: web_saas_data_mount_target.stdout | trim == web_saas_data_mount_path

- name: Verify an existing mount uses this exact filesystem
  ansible.builtin.assert:
    that:
      - web_saas_data_real_devices.results[0].stdout == web_saas_data_real_devices.results[1].stdout
      - web_saas_data_blkid.stdout.split() | length == 2
      - web_saas_data_mount.stdout.split() | length == 2
      - web_saas_data_blkid.stdout.split()[0] == web_saas_data_mount.stdout.split()[1]
    fail_msg: /data is mounted from a different device; refusing to replace it
  when: web_saas_data_mount_target.stdout | trim == web_saas_data_mount_path

- name: Prepare the unmounted disk without hiding existing files
  ansible.builtin.include_tasks: prepare_unmounted.yml
  when: web_saas_data_mount_target.stdout | trim != web_saas_data_mount_path

- name: Confirm the retained mount is recorded for reboot
  ansible.posix.mount:
    path: "{{ web_saas_data_mount_path }}"
    src: "UUID={{ web_saas_data_blkid.stdout.split()[0] }}"
    fstype: "{{ web_saas_data_fstype }}"
    opts: defaults,nosuid,nodev
    state: mounted
  when: web_saas_data_mount_target.stdout | trim == web_saas_data_mount_path

- name: Verify final mount target, UUID and filesystem
  ansible.builtin.command:
    argv: [findmnt, -nro, TARGET,UUID,FSTYPE, --target, "{{ web_saas_data_mount_path }}"]
  register: web_saas_data_final_mount
  changed_when: false

- name: Require the exact independent filesystem after preparation
  ansible.builtin.assert:
    that:
      - web_saas_data_final_mount.stdout.split() | length == 3
      - web_saas_data_final_mount.stdout.split()[0] == web_saas_data_mount_path
      - web_saas_data_final_mount.stdout.split()[1] == (web_saas_data_uuid.stdout | trim if web_saas_data_mount_target.stdout | trim != web_saas_data_mount_path else web_saas_data_blkid.stdout.split()[0])
      - web_saas_data_final_mount.stdout.split()[2] == web_saas_data_fstype

- name: Record mount component evidence
  ansible.builtin.set_fact:
    web_saas_data_evidence:
      action: prepare_empty
      environment: "{{ web_saas_data_environment }}"
      mounted: true
      mount_path: "{{ web_saas_data_mount_path }}"
      filesystem_uuid: "{{ web_saas_data_final_mount.stdout.split()[1] }}"
