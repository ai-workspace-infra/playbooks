---
# datakit Helm role defaults

datakit_helm_repo_url: "https://pubrepo.guance.com/chartrepo/datakit"
datakit_helm_repo_name: "datakit"
datakit_chart_name: "datakit/datakit"
datakit_chart_version: "2.16.1"

datakit_release_name: "datakit"
datakit_namespace: "datakit"
datakit_dataway_secret_name: "datakit-dataway-secret"
datakit_manage_dataway_secret: false

# Vault 凭据配置
datakit_vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default('', true) }}"
datakit_vault_jwt_token: "{{ lookup('ansible.builtin.env', 'VAULT_JWT_TOKEN') | default('', true) }}"
datakit_vault_token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true) }}"
# 观测云版本选择与 Vault 凭据分流: 'bj-free' (北京免费体验版) | 'hk-commercial' (香港商业生产版)
# 领域类别标志：固定归属可观测性 (observability) 大类
datakit_vault_category: "observability"
# 统一使用香港商业版 (cn6-openway.guance.com)
datakit_edition: "hk-commercial"
datakit_vault_path: "{{ datakit_vault_category }}/datakit/{{ datakit_edition }}"

# DataWay 回退配置 (如果从 Vault 读取)
datakit_dataway_url: "{{ lookup('ansible.builtin.env', 'DATAKIT_DATAWAY_URL') | default('', true) }}"

# DataKit 默认配置
datakit_global_tags: "cluster={{ k8s_cluster_name | default('default') }},env={{ target_env | default('') }}"
datakit_default_inputs: "statsd,dk,cpu,disk,diskio,mem,swap,system,hostobject,net,host_processes,container,kubernetesprometheus,opentelemetry,prom,ddtrace"
datakit_log_level: "info"

# DDTrace 链路采集配置
datakit_enable_ddtrace: true
datakit_ddtrace_endpoints:
  - "/v0.3/traces"
  - "/v0.4/traces"
  - "/v0.5/traces"

# Host Processes 分钟级低频采集配置（控量防免费配额耗尽）
datakit_enable_host_processes: true
datakit_host_processes_metric_interval: "60s"
datakit_host_processes_object_interval: "5m"
datakit_host_processes_min_run_time: "10m"

# 渐进发布 API 探活与 Flagger 指标独立采集配置（方案 A：解耦 vmagent）
datakit_enable_progressive_release_probes: true
datakit_blackbox_exporter_namespace: "observability-sit"
datakit_blackbox_exporter_service: "observability-agent-blackbox"
datakit_blackbox_exporter_port: 9115
datakit_blackbox_exporter_url: "http://{{ datakit_blackbox_exporter_service }}.{{ datakit_blackbox_exporter_namespace }}:{{ datakit_blackbox_exporter_port }}/probe"
datakit_progressive_release_targets:
  - { target: "http://web-saas-console.web-saas-sit.svc/healthz", service: "console", route: "/healthz", probe_module: "release_http_ok", expected_status: "200" }
  - { target: "http://web-saas-console.web-saas-sit.svc/login", service: "console", route: "/login", probe_module: "release_http_ok", expected_status: "200" }
  - { target: "http://web-saas-console.web-saas-sit.svc/panel/agent", service: "console", route: "/panel/agent", probe_module: "release_login_redirect", expected_status: "307" }
  - { target: "http://web-saas-accounts.web-saas-sit.svc/healthz", service: "accounts", route: "/healthz", probe_module: "release_http_ok", expected_status: "200" }
  - { target: "http://web-saas-accounts.web-saas-sit.svc/readyz", service: "accounts", route: "/readyz", probe_module: "release_http_ok", expected_status: "200" }
  - { target: "http://web-saas-accounts.web-saas-sit.svc/api/ping", service: "accounts", route: "/api/ping", probe_module: "release_http_ok", expected_status: "200" }
  - { target: "http://web-saas-accounts.web-saas-sit.svc/api/billing/plans", service: "accounts", route: "/api/billing/plans", probe_module: "release_http_ok", expected_status: "200" }
  - { target: "http://web-saas-billing.web-saas-sit.svc/healthz", service: "billing", route: "/healthz", probe_module: "release_http_ok", expected_status: "200" }
  - { target: "http://web-saas-billing.web-saas-sit.svc/readyz", service: "billing", route: "/readyz", probe_module: "release_http_ok", expected_status: "200" }
  - { target: "http://web-saas-billing.web-saas-sit.svc/api/ping", service: "billing", route: "/api/ping", probe_module: "release_http_ok", expected_status: "200" }

datakit_flagger_metrics_namespace: "web-saas-sit"
datakit_flagger_metrics_service: "web-saas-flagger-metrics"
datakit_flagger_metrics_port: 8080
datakit_flagger_metrics_url: "http://{{ datakit_flagger_metrics_service }}.{{ datakit_flagger_metrics_namespace }}:{{ datakit_flagger_metrics_port }}/metrics"

# Restrict stdout/stderr collection to DEV/SIT business namespaces. Adjust only
# through an explicit non-production inventory variable when the lane changes.
datakit_business_log_namespace_selector: "namespace:feature-*"
datakit_caddy_metrics_namespace: "ingress-sit"
datakit_caddy_metrics_service: "caddy-ingress-caddy"
datakit_caddy_metrics_port: 80
datakit_caddy_metrics_url: "http://{{ datakit_caddy_metrics_service }}.{{ datakit_caddy_metrics_namespace }}:{{ datakit_caddy_metrics_port }}/metrics"

# Existing DEV/SIT PostgreSQL exporter scrape is retained alongside Caddy.
datakit_postgresql_metrics_namespace: "postgresql-sit"
datakit_postgresql_metrics_service: "postgresql-postgresql-exporter"
datakit_postgresql_metrics_port: 9187
datakit_postgresql_metrics_url: "http://{{ datakit_postgresql_metrics_service }}.{{ datakit_postgresql_metrics_namespace }}:{{ datakit_postgresql_metrics_port }}/metrics"

# Kube-State-Metrics scrape
datakit_kube_state_metrics_namespace: "observability-sit"
datakit_kube_state_metrics_service: "observability-agent-state"
datakit_kube_state_metrics_port: 8080
datakit_kube_state_metrics_url: "http://{{ datakit_kube_state_metrics_service }}.{{ datakit_kube_state_metrics_namespace }}:{{ datakit_kube_state_metrics_port }}/metrics"

# Node-Exporter scrape
datakit_node_exporter_namespace: "observability-sit"
datakit_node_exporter_service: "observability-agent"
datakit_node_exporter_port: 9100
datakit_node_exporter_url: "http://{{ datakit_node_exporter_service }}.{{ datakit_node_exporter_namespace }}:{{ datakit_node_exporter_port }}/metrics"

# OpenTelemetry 采集模块配置
datakit_enable_opentelemetry: true
datakit_otel_grpc_addr: "0.0.0.0:4317"
datakit_otel_http_enable: true

# 资源预算限制 (严控在 4GB Linode 节点预算内)
datakit_requests_cpu: "100m"
datakit_requests_memory: "128Mi"
datakit_limits_cpu: "500m"
datakit_limits_memory: "512Mi"
