---
# Default settings for Grafana Docker deployment
grafana_workspace: /opt/grafana
grafana_image: grafana/grafana:10.4.6
grafana_domain: grafana.svc.plus
grafana_protocol: http
grafana_host_port: 3000
grafana_admin_user: admin
grafana_admin_password: admin

# Optional OIDC login. Keep disabled until the matching client is created in
# ZITADEL and its metadata has been written by the Vault bootstrap helper.
grafana_oidc_enabled: false
grafana_oidc_name: ZITADEL
grafana_oidc_issuer: ""
grafana_oidc_client_id: ""
grafana_oidc_client_secret: ""
grafana_oidc_scopes: "openid profile email"
grafana_oidc_role_attribute_path: ""
grafana_oidc_role_attribute_strict: true
grafana_oidc_use_pkce: true
grafana_env_file: "{{ grafana_workspace }}/grafana.env"
