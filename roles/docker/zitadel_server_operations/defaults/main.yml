---
# Selected by the caller: verify_host (on the IAM host, after a deploy) or
# verify_public (from the controller only, no host access).
zitadel_operation: ""
# The declared public IAM domain; required, never defaulted.
zitadel_operations_domain: ""
# Must match roles/docker/zitadel (zitadel_deploy_dir, zitadel_api_port).
zitadel_operations_workspace: /opt/zitadel
zitadel_operations_api_port: 19080
zitadel_operations_caddy_conf_dir: /etc/caddy/conf.d
zitadel_operations_ready_timeout_seconds: 180
zitadel_operations_ready_poll_seconds: 5
