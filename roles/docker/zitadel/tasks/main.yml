---
- name: Validate ZITADEL deployment owner
  ansible.builtin.assert:
    that: zitadel_deployment_mode in ['compose', 'doco-cd']

- name: Configure GitOps-managed ZITADEL
  ansible.builtin.include_tasks: doco-cd.yml
  when: zitadel_deployment_mode == 'doco-cd'

- name: Explicit legacy Compose compatibility
  ansible.builtin.include_tasks: compose.yml
  when: zitadel_deployment_mode == 'compose'
