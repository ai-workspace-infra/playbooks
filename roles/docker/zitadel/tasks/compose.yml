    zitadel_db_password_fact: "{{ lookup('env', 'ZITADEL_PG_PASSWORD') | default(zitadel_existing_vault_db_secrets.secret.zitadel_pg_password | default('CHANGE_ME', true), true) }}"
# 4. 启动正式 Zitadel stack（start-only）
# -------------------------------------------------------------------

- name: Try to read databases secrets from Vault for Zitadel
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    auth_method: token
    token: "{{ vault_token }}"
    path: "{{ lookup('env', 'VAULT_ENV_PATH') | default('uat', true) }}/databases"
    engine_mount_point: "kv"
  register: zitadel_existing_vault_db_secrets
  failed_when: false
  when: vault_token | length > 0
  delegate_to: localhost
  become: false

- name: Set Zitadel DB password fact
  ansible.builtin.set_fact:
    zitadel_db_password_fact: "{{ lookup('env', 'ZITADEL_PG_PASSWORD') | default(zitadel_existing_vault_db_secrets.secret.zitadel_pg_password | default('CHANGE_ME', true), true) }}"
- name: Bring up Zitadel stack
  become: true
  block:
    - name: Start Zitadel stack
      ansible.builtin.command:
        cmd: docker compose -f {{ zitadel_workspace }}/docker-compose.yaml up -d --remove-orphans
        chdir: "{{ zitadel_workspace }}"
  rescue:
    - name: Capture filtered Zitadel startup diagnostics
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        docker compose -f {{ zitadel_workspace }}/docker-compose.yaml logs --no-color --tail=120 zitadel 2>&1 \
          | sed -E 's#(postgres(ql)?://[^:]+:)[^@]+(@)#\1REDACTED\3#g' \
          | tail -80
      args:
        chdir: "{{ zitadel_workspace }}"
        executable: /bin/bash
      register: zitadel_startup_diagnostics
      changed_when: false
      failed_when: false

    - name: Print filtered Zitadel startup diagnostics
      ansible.builtin.debug:
        msg: "{{ zitadel_startup_diagnostics.stdout_lines | default([]) }}"

    - name: Fail with actionable Zitadel startup error
      ansible.builtin.fail:
        msg: "Zitadel exited during startup; filtered container diagnostics were collected above."
