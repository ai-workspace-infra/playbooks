  delegate_to: localhost
  become: false

- name: Set Zitadel DB password fact
  ansible.builtin.set_fact:
    zitadel_db_password_fact: "{{ lookup('env', 'ZITADEL_PG_PASSWORD') | default(zitadel_existing_vault_db_secrets.secret.zitadel_pg_password | default('CHANGE_ME', true), true) }}"
- name: Run Zitadel init (one-time)
  become: true
  shell: |
    docker compose -f {{ zitadel_workspace }}/docker-compose.yaml run --rm zitadel-init || true
  args:
    chdir: "{{ zitadel_workspace }}"
  when: not zitadel_initialized.stat.exists

