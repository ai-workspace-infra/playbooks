---
- name: 渲染安全环境配置文件 (.env)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ obs_agent_deploy_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: 渲染 docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ obs_agent_deploy_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: 拉取 obs-agent 容器镜像
  community.docker.docker_image:
    name: "{{ obs_agent_image }}"
    source: pull

- name: 启动 / 重新加载 obs-agent 容器
  community.docker.docker_compose_v2:
    project_src: "{{ obs_agent_deploy_dir }}"
    state: present
    pull: missing
