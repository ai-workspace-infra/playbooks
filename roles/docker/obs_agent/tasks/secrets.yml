---
- name: 从 HashiCorp Vault KV 读取 obs-agent 机密凭证
  community.hashi_vault.vault_kv2_get:
    url: "{{ obs_agent_vault_addr }}"
    auth_method: "{{ 'jwt' if (obs_agent_vault_jwt_token | length > 0) else 'token' }}"
    jwt: "{{ obs_agent_vault_jwt_token if (obs_agent_vault_jwt_token | length > 0) else omit }}"
    token: "{{ obs_agent_vault_token if (obs_agent_vault_jwt_token | length == 0) else omit }}"
    path: "{{ obs_agent_vault_path }}"
    engine_mount_point: "kv"
  register: obs_agent_vault_secret
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  no_log: true
  failed_when: false
  when:
    - (obs_agent_id | trim | length == 0) or (obs_agent_api_key | trim | length == 0)
    - (obs_agent_vault_jwt_token | trim | length > 0) or (obs_agent_vault_token | trim | length > 0)

- name: 解析运行时机密与连接参数 (优雅降级: 环境变量 > Vault > Playbook变量)
  ansible.builtin.set_fact:
    obs_agent_id: >-
      {{ lookup('ansible.builtin.env', 'OBS_AGENT_ID')
         | default(lookup('ansible.builtin.env', 'AGENT_ID'), true)
         | default(obs_agent_vault_secret.secret.AGENT_ID | default(obs_agent_id | default(''), true), true) }}
    obs_agent_api_key: >-
      {{ lookup('ansible.builtin.env', 'OBS_AGENT_API_KEY')
         | default(lookup('ansible.builtin.env', 'AGENT_API_KEY'), true)
         | default(obs_agent_vault_secret.secret.AGENT_API_KEY | default(obs_agent_api_key | default(''), true), true) }}
    obs_agent_beak_ws_url: >-
      {{ lookup('ansible.builtin.env', 'OBS_BEAK_WS_URL')
         | default(lookup('ansible.builtin.env', 'BEAK_WS_URL'), true)
         | default(obs_agent_vault_secret.secret.BEAK_WS_URL | default(obs_agent_beak_ws_url | default('https://agent-api.guance.com'), true), true) }}
    obs_agent_llm_base_url: >-
      {{ lookup('ansible.builtin.env', 'LLM_BASE_URL')
         | default(obs_agent_vault_secret.secret.LLM_BASE_URL | default(obs_agent_llm_base_url | default(''), true), true) }}
    obs_agent_llm_api_key: >-
      {{ lookup('ansible.builtin.env', 'LLM_API_KEY')
         | default(obs_agent_vault_secret.secret.LLM_API_KEY | default(obs_agent_llm_api_key | default(''), true), true) }}
    obs_agent_llm_model: >-
      {{ lookup('ansible.builtin.env', 'LLM_MODEL')
         | default(obs_agent_vault_secret.secret.LLM_MODEL | default(obs_agent_llm_model | default(''), true), true) }}
  no_log: true

- name: 校验核心凭据完整性
  ansible.builtin.assert:
    that:
      - obs_agent_id | trim | length > 0
      - obs_agent_api_key | trim | length > 0
      - obs_agent_beak_ws_url | trim | length > 0
    fail_msg: "AGENT_ID, AGENT_API_KEY 及 BEAK_WS_URL 必须通过环境变量、Vault 或 Playbook 参数提供！"
