---
observability_dir: "/opt/observability-server"
observability_prometheus_port: "9090"
observability_grafana_port: "3030"
observability_blackbox_host_port: "9115"
observability_scrape_interval: "15s"
observability_retention_time: "30d"
observability_xhttp_alerting_enabled: false

# XConnect's identity-aware trace search is opt-in until the scoped Accounts
# credential and an immutable plugin release checksum are provisioned.
observability_xconnect_diagnostics_enabled: false
observability_xconnect_diagnostics_plugin_version: "0.1.0"
observability_xconnect_diagnostics_plugin_sha256: "e7486697858edf02929f57e068b2971ab23c2f183727d1c28004bfba4c42c2eb"
# Reuse the agent/server monitoring credential source, not the agent's password.
# Only the server receives the scoped identity token; agents still get user/password.
observability_xconnect_diagnostics_vault_path: "kv/data/CICD/observability"
observability_xconnect_diagnostics_accounts_url: "https://accounts.svc.plus"

# CMDB is an optional, read-only Grafana integration. Keep it disabled until
# the dedicated database, TLS route, and cmdb_reader credential are provisioned.
observability_cmdb_enabled: false
observability_cmdb_postgres_host: ""
observability_cmdb_postgres_port: 5432
observability_cmdb_postgres_database: "cmdb"
observability_cmdb_postgres_user: "cmdb_reader"
observability_cmdb_postgres_sslmode: "verify-full"
observability_cmdb_reader_vault_path: "kv/data/observability/cmdb-grafana"
observability_cmdb_reader_password: ""

# Vault integration configuration. Keep the lookup order aligned with the
# production roles: the dedicated server-root token is preferred, while the
# regular VAULT_TOKEN remains a compatible fallback for local runs.
vault_addr: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default(lookup('ansible.builtin.env', 'VAULT_SERVER_URL') | default('https://vault.svc.plus', true), true) }}"
vault_token: "{{ lookup('ansible.builtin.env', 'VAULT_SERVER_ROOT_ACCESS_TOKEN') | default(lookup('ansible.builtin.env', 'VAULT_TOKEN') | default('', true), true) }}"

# Exporters to scrape
observability_exporters:
  - "install.svc.plus:8081"
  - "tky-proxy.svc.plus:8081"

# Caddy
observability_caddy_conf_dir: "/etc/caddy/conf.d"
observability_grafana_domain: "grafana.svc.plus"
observability_prometheus_domain: "prometheus.svc.plus"

# ---------------------------------------------------------------------------
# 告警:默认使用 Grafana 内置统一告警 (Unified Alerting)
# 规则由 templates/grafana-provisioning-alerting.yml.j2 配置化下发,
# Grafana 自带 Alertmanager,因此 vmalert / alertmanager 两个容器默认不部署。
# ---------------------------------------------------------------------------
observability_alerting_enabled: true
observability_alerting_folder: "Observability Alerts"
observability_alerting_interval: "1m"
# 指标数据源 uid,需与 grafana-provisioning-datasources.yml.j2 中的 VictoriaMetrics 保持一致
observability_alerting_metrics_ds_uid: "victoriametrics"
observability_alerting_contact_point: "obs-default"
# 留空则不下发 contactPoints / policies,仅评估并在 Grafana 内展示告警状态,不外发通知
observability_alerting_webhook_url: ""
# 告警阈值
observability_alerting_cpu_threshold: 85
observability_alerting_mem_threshold: 90
observability_alerting_disk_threshold: 85
observability_alerting_stale_seconds: 300
observability_alerting_ssl_days: 14

# 旧告警链路 (vmalert + Alertmanager):默认关闭,改由 Grafana 内置告警承担。
# 如需回退到独立的 vmalert/Alertmanager,置为 true 并自行提供 vmalert/alerts.yml
# 与 alertmanager/alertmanager.yml —— 注意本 role 目前不生成这两个配置文件。
observability_vmalert_enabled: false

# Telemetry Snapshot Export & Traffic Control
observability_snapshot_rate_limit_events: 10
observability_snapshot_rate_limit_window: "1m"
observability_console_backend_port: 8080
# 服务器上安装的 caddy v2.11.4 是官方原版二进制,没有编译 caddy-ratelimit 插件,
# `rate_limit {}` 指令会导致 `caddy reload` 直接失败(而失败会被 ignore_errors 吞掉,
# 表现为"部署显示成功但配置其实没生效")。默认关闭限流子句,只保留转发本身,
# 待改用 xcaddy 构建带插件的二进制、或换用 Caddy 原生 `rate_limit` app(2.11 起内置的
# 那个不同语法版本)后再打开。
observability_snapshot_rate_limit_enabled: false
