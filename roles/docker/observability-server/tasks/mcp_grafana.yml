---
- name: Template Grafana MCP Server environment file
  ansible.builtin.template:
    src: mcp-grafana.env.j2
    dest: "{{ observability_dir }}/mcp-grafana.env"
    mode: '0600'
  no_log: true
  notify: Restart observability stack
  tags:
    - observability
    - observability_mcp
    - mcp
    - mcp_grafana

- name: Check Grafana MCP readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ observability_mcp_grafana_port }}/health/readiness"
    method: GET
    status_code: [200, 404] # Accept 200 or default status check if health route varies
  register: grafana_mcp_health
  retries: 5
  delay: 3
  until: grafana_mcp_health.status in [200, 404]
  ignore_errors: true
  tags:
    - observability
    - observability_mcp
    - mcp
    - mcp_grafana
