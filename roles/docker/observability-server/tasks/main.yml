---
- name: Ensure XStream monitoring directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ observability_dir }}"
    - "{{ observability_dir }}/blackbox"
    - "{{ observability_dir }}/prometheus"
    - "{{ observability_dir }}/grafana/provisioning/datasources"
    - "{{ observability_dir }}/grafana/provisioning/dashboards"
    - "{{ observability_dir }}/grafana/dashboards"
    - "{{ observability_dir }}/grafana/provisioning/alerting"
    - "{{ observability_dir }}/k6"
  tags:
    - observability
    - observability_alerting
    - observability_mcp
    - mcp

- name: Load Blackbox probe defaults
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/vhosts/blackbox_exporter/defaults/main.yml"
    name: blackbox_exporter_role_defaults

- name: Read FinOps S3 secrets from Vault
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/kv/data/observability/finops"
    headers:
      X-Vault-Token: "{{ vault_token }}"
    method: GET
  register: finops_vault_secret
  run_once: true
  check_mode: false
  no_log: true
  ignore_errors: true
  when: vault_token | trim | length > 0

- name: Read MCP ingress credentials from Vault
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/{{ observability_mcp_auth_vault_path }}"
    headers:
      X-Vault-Token: "{{ vault_token }}"
    method: GET
  register: observability_mcp_vault_secret
  run_once: true
  check_mode: false
  no_log: true
  failed_when: false
  when:
    - observability_mcp_enabled | default(true) | bool
    - observability_mcp_auth_enabled | default(true) | bool
    - vault_token | trim | length > 0

- name: Resolve MCP ingress credentials from Vault
  ansible.builtin.set_fact:
    observability_mcp_basic_auth_user: >-
      {{ (observability_mcp_vault_secret.json | default({})).get('data', {}).get('data', {}).get(
         'MCP_BASIC_AUTH_USER', observability_mcp_basic_auth_user) }}
    observability_mcp_basic_auth_password_hash: >-
      {{ (observability_mcp_vault_secret.json | default({})).get('data', {}).get('data', {}).get(
         'MCP_BASIC_AUTH_PASSWORD_HASH', observability_mcp_basic_auth_password_hash) }}
  no_log: true
  when:
    - observability_mcp_enabled | default(true) | bool
    - observability_mcp_auth_enabled | default(true) | bool

- name: Refuse to expose unauthenticated MCP ingress
  ansible.builtin.assert:
    that:
      - observability_mcp_basic_auth_user | trim | length > 0
      - observability_mcp_basic_auth_password_hash | trim | length > 0
    fail_msg: >-
      MCP authentication is enabled but Vault did not provide credentials at
      {{ observability_mcp_auth_vault_path }}.
  no_log: true
  when:
    - observability_mcp_enabled | default(true) | bool
    - observability_mcp_auth_enabled | default(true) | bool

- name: Template Docker Compose and configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ observability_dir }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'docker-compose.yml.j2', dest: 'docker-compose.yml' }
    - { src: '.env.j2', dest: '.env' }
    - { src: 'prometheus.yml.j2', dest: 'prometheus/prometheus.yml' }
    - { src: "{{ playbook_dir }}/roles/vhosts/blackbox_exporter/templates/blackbox.yml.j2", dest: 'blackbox/config.yml' }
    - { src: 'grafana-provisioning-datasources.yml.j2', dest: 'grafana/provisioning/datasources/datasources.yml' }
    - { src: 'grafana-provisioning-dashboards.yml.j2', dest: 'grafana/provisioning/dashboards/dashboards.yml' }
  notify: Restart observability stack
  tags:
    - observability
    - observability_mcp
    - mcp

- name: Provision Grafana built-in alerting rules
  ansible.builtin.template:
    src: grafana-provisioning-alerting.yml.j2
    dest: "{{ observability_dir }}/grafana/provisioning/alerting/rules.yml"
    mode: '0644'
  when: observability_alerting_enabled | default(true) | bool
  notify:
    - Restart observability stack
    - Restart grafana
  tags:
    - observability
    - observability_alerting

- name: Remove Grafana alerting provisioning when disabled
  ansible.builtin.file:
    path: "{{ observability_dir }}/grafana/provisioning/alerting/rules.yml"
    state: absent
  when: not (observability_alerting_enabled | default(true) | bool)
  notify:
    - Restart observability stack
    - Restart grafana
  tags:
    - observability
    - observability_alerting

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ observability_dir }}/grafana/dashboards/{{ item }}"
    mode: '0644'
  loop:
    - dashboard.json
    - Node-Exporter-Dashboard.json
    - process-exporter-dashboard-with-treemap.json
    - homepage-navigation.json
    - postgres-exporter-dashboard.json
    - k6-performance-capacity-dashboard.json
    - victoria-traces-dashboard.json
    - blackbox-exporter-dashboard.json
    - victoria-logs-overview.json
  # Grafana provisions dashboards only during startup. A bind-mounted JSON
  # update alone leaves the running process on the prior revision.
  notify: Restart observability stack
  tags:
    - observability

- name: Copy k6 end-to-end load test script
  ansible.builtin.copy:
    src: k6-load-test.js
    dest: "{{ observability_dir }}/k6/k6-load-test.js"
    mode: '0644'
  tags:
    - observability

- name: Include MCP Server tasks
  ansible.builtin.include_tasks: mcp.yml
  when: observability_mcp_enabled | default(true) | bool
  tags:
    - observability
    - observability_mcp
    - mcp

- name: Launch XStream monitoring with Docker Compose
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ observability_dir }}"
  tags:
    - observability
    - observability_mcp
    - mcp

- name: Template Caddy configuration for observability
  ansible.builtin.template:
    src: observability.caddy.j2
    dest: "{{ observability_caddy_conf_dir }}/observability.caddy"
    mode: '0644'
    backup: yes
  notify: Reload caddy
  tags:
    - observability
    - observability_mcp
    - mcp

# ---------------------------------------------------------------------------
# 部署后健康校验。
# 背景:Grafana 的 alerting provisioning 只在启动时加载,一条非法规则会让
# Grafana 直接启动失败;而此前所有任务都会照常报成功,部署结果呈现"假绿"。
# 这里强制 flush handlers 让重启先发生,再确认 Grafana 真的活着。
# ---------------------------------------------------------------------------
- name: Flush handlers before verifying Grafana
  ansible.builtin.meta: flush_handlers

- name: Verify Grafana is healthy after provisioning
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ observability_grafana_port | default('3030') }}/api/health"
    method: GET
    return_content: true
    status_code: 200
  register: observability_grafana_health
  retries: 12
  delay: 5
  until:
    - observability_grafana_health.status == 200
    - (observability_grafana_health.json.database | default('')) == 'ok'
  failed_when: >-
    observability_grafana_health.status != 200
    or (observability_grafana_health.json.database | default('')) != 'ok'
  tags:
    - observability
    - observability_alerting
