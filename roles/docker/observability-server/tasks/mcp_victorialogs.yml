---
- name: Template VictoriaLogs MCP Server environment file
  ansible.builtin.template:
    src: mcp-victorialogs.env.j2
    dest: "{{ observability_dir }}/mcp-victorialogs.env"
    mode: '0600'
  no_log: true
  notify: Restart observability stack
  tags:
    - observability
    - observability_mcp
    - mcp
    - mcp_victorialogs

- name: Check VictoriaLogs MCP readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ observability_mcp_victorialogs_port }}/health/readiness"
    method: GET
    status_code: [200, 404]
  register: victorialogs_mcp_health
  retries: 5
  delay: 3
  until: victorialogs_mcp_health.status in [200, 404]
  ignore_errors: true
  tags:
    - observability
    - observability_mcp
    - mcp
    - mcp_victorialogs
