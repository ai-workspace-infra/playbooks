- name: Read XConnect diagnostics resolver credential from Vault
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/{{ observability_xconnect_diagnostics_vault_path }}"
    headers:
      X-Vault-Token: "{{ vault_token }}"
    method: GET
  register: observability_xconnect_diagnostics_vault_secret
  run_once: true
  check_mode: false
  no_log: true
  failed_when: false
  when:
    - observability_xconnect_diagnostics_enabled | bool
    - vault_token | trim | length > 0
  tags: [observability, observability_xconnect_diagnostics]

- name: Require the existing monitoring credential record
  ansible.builtin.assert:
    that:
      - observability_xconnect_diagnostics_vault_secret.status | default(0) == 200
      - observability_xconnect_diagnostics_vault_secret.json.data.data.user | length > 0
      - observability_xconnect_diagnostics_vault_secret.json.data.data.password | length > 0
  no_log: true
  when: observability_xconnect_diagnostics_provision_credentials | default(false) | bool

- name: Generate only the missing server-side identity resolver credential
  ansible.builtin.set_fact:
    observability_new_identity_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
  no_log: true
  when:
    - observability_xconnect_diagnostics_provision_credentials | default(false) | bool
    - observability_xconnect_diagnostics_vault_secret.json.data.data.IDENTITY_LOOKUP_TOKEN | default('') | length == 0
    - not ansible_check_mode

- name: Preserve monitoring credentials while provisioning the scoped server field
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/{{ observability_xconnect_diagnostics_vault_path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_token }}"
    body_format: json
    body:
      options:
        cas: "{{ observability_xconnect_diagnostics_vault_secret.json.data.metadata.version | int }}"
      data: "{{ observability_xconnect_diagnostics_vault_secret.json.data.data | combine({'IDENTITY_LOOKUP_TOKEN': observability_new_identity_token}) }}"
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: true
  when: observability_new_identity_token is defined

- name: Resolve XConnect diagnostics resolver credential
  ansible.builtin.set_fact:
    observability_xconnect_diagnostics_identity_token: >-
      {{ observability_new_identity_token | default((observability_xconnect_diagnostics_vault_secret.json | default({})).get('data', {}).get('data', {}).get('IDENTITY_LOOKUP_TOKEN', '')) }}
  no_log: true
  when: observability_xconnect_diagnostics_enabled | bool
  tags: [observability, observability_xconnect_diagnostics]

- name: Require XConnect diagnostics resolver credential
  ansible.builtin.assert:
    that:
      - observability_xconnect_diagnostics_identity_token | default('') is match('^[A-Za-z0-9_-]{32,}$')
    fail_msg: >-
      XConnect diagnostics is enabled but IDENTITY_LOOKUP_TOKEN is unavailable
      in {{ observability_xconnect_diagnostics_vault_path }}.
  no_log: true
  when:
    - observability_xconnect_diagnostics_enabled | bool
    - not (ansible_check_mode | bool)
  tags: [observability, observability_xconnect_diagnostics]

