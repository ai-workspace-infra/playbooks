---
- name: Confirm the expected PostgreSQL container is running
  ansible.builtin.command:
    argv: [docker, inspect, --format, '{{ '{{' }}.State.Status{{ '}}' }}', '{{ web_saas_release_postgres_container }}']
  register: web_saas_release_pg_state
  changed_when: false

- name: Refuse absent primary PostgreSQL
  ansible.builtin.assert:
    that:
      - web_saas_release_pg_state.stdout | trim == 'running'

- name: Read migration state and nonempty old-user/subscription samples
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - '{{ web_saas_release_postgres_container }}'
      - psql
      - -U
      - postgres
      - -d
      - '{{ web_saas_release_database }}'
      - -XAtq
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        SELECT (SELECT version::text || ':' || dirty::text FROM public.schema_migrations LIMIT 1)
        || ',' || (SELECT count(*) FROM public.users)::text
        || ',' || (SELECT count(*) FROM public.subscriptions)::text
  register: web_saas_release_db_state
  changed_when: false
  no_log: true

- name: Parse and validate expected clean baseline
  ansible.builtin.set_fact:
    web_saas_release_db_parts: "{{ (web_saas_release_db_state.stdout | default('')) | trim | split(',') }}"

- name: Refuse missing or mismatched migration and empty business samples
  ansible.builtin.assert:
    that:
      - web_saas_release_db_parts | length == 3
      - web_saas_release_db_parts[0] == (web_saas_release_expected_version | string) ~ ':false'
      - web_saas_release_db_parts[1] is match('^[1-9][0-9]*$')
      - web_saas_release_db_parts[2] is match('^[1-9][0-9]*$')
    fail_msg: Database migration baseline or original user/subscription samples are not acceptable

- name: Record database-only preflight evidence
  ansible.builtin.set_fact:
    web_saas_release_evidence:
      schema: 1
      phase: database_preflight_component
      status: passed
      candidate_sha256: "{{ web_saas_release_candidate_sha256 }}"
      environment: "{{ web_saas_release_environment }}"
      schema_version: "{{ web_saas_release_expected_version | int }}"
      existing_users: "{{ web_saas_release_db_parts[1] | int }}"
      subscriptions: "{{ web_saas_release_db_parts[2] | int }}"
      clean: true
  when: web_saas_release_phase == 'preflight'
