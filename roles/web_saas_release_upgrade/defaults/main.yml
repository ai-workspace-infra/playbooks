---
# The caller selects the environment, host and immutable release. Never
# silently route an unset environment or release to a default target.
web_saas_release_phase: preflight
web_saas_release_backup_root: /data/backups/web-saas
web_saas_release_postgres_container: web-saas-postgresql
web_saas_release_database: account
web_saas_release_restore_database_prefix: release_verify_
web_saas_release_receipt_file: ''
web_saas_release_backup_passphrase: ''

