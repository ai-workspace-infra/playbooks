---
- name: Validate exact source, archive, and isolated restore contract
  ansible.builtin.assert:
    that:
      - web_saas_data_restore_verify_database == 'account'
      - web_saas_data_restore_verify_postgres_container == 'web-saas-postgresql'
      - web_saas_data_restore_verify_restore_database_prefix == 'release_verify_'
      - web_saas_data_restore_verify_environment in ['uat', 'prod']
      - web_saas_data_restore_verify_run_id is match('^[1-9][0-9]*$')
      - web_saas_data_restore_verify_expected_version | string is match('^[1-9][0-9]*$')
      - web_saas_data_restore_verify_source_database_id is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{2,127}$')
      - web_saas_data_restore_verify_baseline_id is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{2,127}$')
      - web_saas_data_restore_verify_authorized_subscription_sample_id is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{2,127}$')
      - web_saas_data_restore_verify_source_schema_sha256 is match('^[0-9a-f]{64}$')
      - web_saas_data_restore_verify_source_data_sha256 is match('^[0-9a-f]{64}$')
      - web_saas_data_restore_verify_database_system_identifier is match('^[0-9]+$')
      - web_saas_data_restore_verify_expected_users | string is match('^[1-9][0-9]*$')
      - web_saas_data_restore_verify_expected_subscriptions | string is match('^[1-9][0-9]*$')
      - web_saas_data_restore_verify_archive_path is match('^/data/backups/web-saas/(uat|prod)/[A-Za-z0-9._-]+/[1-9][0-9]*/account\.dump\.enc$')
      - web_saas_data_restore_verify_archive_sha256 is match('^[0-9a-f]{64}$')
      - web_saas_data_restore_verify_passphrase | length >= 32
    fail_msg: Restore verification provenance, nonempty sample, source schema, archive, or isolated target is missing or unsafe
  no_log: true

- name: Verify only the exact immutable archive exists with private permissions
  ansible.builtin.stat:
    path: '{{ web_saas_data_restore_verify_archive_path }}'
    follow: false
    checksum_algorithm: sha256
    get_checksum: true
  register: web_saas_data_restore_verify_archive

- name: Refuse missing, linked, altered, or nonprivate archive
  ansible.builtin.assert:
    that:
      - web_saas_data_restore_verify_archive.stat.isreg | default(false)
      - web_saas_data_restore_verify_archive.stat.mode == '0600'
      - web_saas_data_restore_verify_archive.stat.checksum == web_saas_data_restore_verify_archive_sha256
    fail_msg: Encrypted archive identity or checksum does not match this run

- name: Restore archive into one run-specific temporary database and compare source identity/schema
  ansible.builtin.script:
    cmd: '{{ role_path }}/files/restore_verify.sh'
    executable: /bin/bash
  environment:
    WEB_SAAS_ARCHIVE_PATH: '{{ web_saas_data_restore_verify_archive_path }}'
    WEB_SAAS_DATABASE: '{{ web_saas_data_restore_verify_database }}'
    WEB_SAAS_POSTGRES_CONTAINER: '{{ web_saas_data_restore_verify_postgres_container }}'
    WEB_SAAS_ENVIRONMENT: '{{ web_saas_data_restore_verify_environment }}'
    WEB_SAAS_RUN_ID: '{{ web_saas_data_restore_verify_run_id }}'
    WEB_SAAS_EXPECTED_VERSION: '{{ web_saas_data_restore_verify_expected_version }}'
    WEB_SAAS_SOURCE_DATABASE_ID: '{{ web_saas_data_restore_verify_source_database_id }}'
    WEB_SAAS_BASELINE_ID: '{{ web_saas_data_restore_verify_baseline_id }}'
    WEB_SAAS_AUTHORIZED_SUBSCRIPTION_SAMPLE_ID: '{{ web_saas_data_restore_verify_authorized_subscription_sample_id }}'
    WEB_SAAS_EXPECTED_USERS: '{{ web_saas_data_restore_verify_expected_users }}'
    WEB_SAAS_EXPECTED_SUBSCRIPTIONS: '{{ web_saas_data_restore_verify_expected_subscriptions }}'
    WEB_SAAS_EXPECTED_SCHEMA_SHA256: '{{ web_saas_data_restore_verify_source_schema_sha256 }}'
    WEB_SAAS_EXPECTED_DATA_SHA256: '{{ web_saas_data_restore_verify_source_data_sha256 }}'
    WEB_SAAS_DATABASE_SYSTEM_IDENTIFIER: '{{ web_saas_data_restore_verify_database_system_identifier }}'
    WEB_SAAS_ARCHIVE_SHA256: '{{ web_saas_data_restore_verify_archive_sha256 }}'
    WEB_SAAS_BACKUP_PASSPHRASE: '{{ web_saas_data_restore_verify_passphrase }}'
  register: web_saas_data_restore_verify_command
  changed_when: web_saas_data_restore_verify_command.rc == 0
  no_log: true

- name: Record independently restored database component evidence
  ansible.builtin.set_fact:
    web_saas_data_restore_verify_evidence: '{{ web_saas_data_restore_verify_command.stdout | from_json }}'
