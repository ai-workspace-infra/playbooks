---
- name: Validate exact source, archive, and isolated restore contract
  ansible.builtin.assert:
    that:
      - web_saas_data_restore_verify_database == 'account'
      - web_saas_data_restore_verify_postgres_container == 'web-saas-postgresql'
      - web_saas_data_restore_verify_restore_database_prefix == 'release_verify_'
      - web_saas_data_restore_verify_environment in ['sit', 'uat', 'prod'] or web_saas_data_restore_verify_environment is match('^prod-v[1-9][0-9]*$')
      - web_saas_data_restore_verify_run_id is match('^[1-9][0-9]*$')
      - web_saas_data_restore_verify_expected_version | string is match('^[1-9][0-9]*$')
      - web_saas_data_restore_verify_source_database_id is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{2,127}$')
      - web_saas_data_restore_verify_baseline_id is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{2,127}$')
      - web_saas_data_restore_verify_authorized_subscription_sample_id is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{2,127}$')
      - web_saas_data_restore_verify_source_schema_sha256 is match('^[0-9a-f]{64}$')
      - web_saas_data_restore_verify_source_data_sha256 is match('^[0-9a-f]{64}$')
      - web_saas_data_restore_verify_database_system_identifier is match('^[0-9]+$')
      - web_saas_data_restore_verify_expected_users | string is match('^[1-9][0-9]*$') or (web_saas_data_restore_verify_allow_empty_users | bool and web_saas_data_restore_verify_expected_users | int == 0)
      - web_saas_data_restore_verify_expected_subscriptions | string is match('^[0-9]+$')
      - web_saas_data_restore_verify_archive_path is match('^/data/backups/web-saas/(sit|uat|prod|prod-v[1-9][0-9]*)/[A-Za-z0-9._-]+/[1-9][0-9]*/account\.dump\.enc$')
      - web_saas_data_restore_verify_archive_sha256 is match('^[0-9a-f]{64}$')
      - web_saas_data_restore_verify_passphrase | length >= 32
      - web_saas_data_restore_verify_migration_table is match('^[a-z_][a-z0-9_]*$')
      - web_saas_data_restore_verify_migration_version_column is match('^[a-z_][a-z0-9_]*$')
      - web_saas_data_restore_verify_migration_dirty_column == '' or web_saas_data_restore_verify_migration_dirty_column is match('^[a-z_][a-z0-9_]*$')
      - web_saas_data_restore_verify_migration_order_column is match('^[a-z_][a-z0-9_]*$')
      - web_saas_data_restore_verify_expected_migration_rows | string is match('^[1-9][0-9]*$')
      - web_saas_data_restore_verify_expected_migration_dirty in ['false', 'not-applicable']
      - web_saas_data_restore_verify_retain_restore | string in ['True', 'False', 'true', 'false']
      - web_saas_data_restore_verify_users_table is match('^[a-z_][a-z0-9_]*$')
      - web_saas_data_restore_verify_subscription_table is match('^[a-z_][a-z0-9_]*$')
    fail_msg: Restore verification provenance, source schema, archive, or isolated target is missing or unsafe
  no_log: true

- name: Verify only the exact immutable archive exists with private permissions
  ansible.builtin.stat:
    path: '{{ web_saas_data_restore_verify_archive_path }}'
    follow: false
    checksum_algorithm: sha256
    get_checksum: true
  register: web_saas_data_restore_verify_archive

- name: Refuse missing, linked, altered, or nonprivate archive
  ansible.builtin.assert:
    that:
      - web_saas_data_restore_verify_archive.stat.isreg | default(false)
      - web_saas_data_restore_verify_archive.stat.mode == '0600'
      - web_saas_data_restore_verify_archive.stat.checksum == web_saas_data_restore_verify_archive_sha256
    fail_msg: Encrypted archive identity or checksum does not match this run

- name: Restore and compare through stdin key transport without secret process arguments
  ansible.builtin.command:
    argv: [/bin/bash, -c, '{{ lookup("ansible.builtin.file", role_path ~ "/files/restore_verify.sh") }}']
    stdin: '{{ web_saas_data_restore_verify_passphrase }}'
    stdin_add_newline: true
  environment:
    WEB_SAAS_ARCHIVE_PATH: '{{ web_saas_data_restore_verify_archive_path }}'
    WEB_SAAS_DATABASE: '{{ web_saas_data_restore_verify_database }}'
    WEB_SAAS_POSTGRES_CONTAINER: '{{ web_saas_data_restore_verify_postgres_container }}'
    WEB_SAAS_ENVIRONMENT: '{{ web_saas_data_restore_verify_environment }}'
    WEB_SAAS_RUN_ID: '{{ web_saas_data_restore_verify_run_id }}'
    WEB_SAAS_EXPECTED_VERSION: '{{ web_saas_data_restore_verify_expected_version }}'
    WEB_SAAS_SOURCE_DATABASE_ID: '{{ web_saas_data_restore_verify_source_database_id }}'
    WEB_SAAS_BASELINE_ID: '{{ web_saas_data_restore_verify_baseline_id }}'
    WEB_SAAS_AUTHORIZED_SUBSCRIPTION_SAMPLE_ID: '{{ web_saas_data_restore_verify_authorized_subscription_sample_id }}'
    WEB_SAAS_EXPECTED_USERS: '{{ web_saas_data_restore_verify_expected_users }}'
    WEB_SAAS_EXPECTED_SUBSCRIPTIONS: '{{ web_saas_data_restore_verify_expected_subscriptions }}'
    WEB_SAAS_EXPECTED_SCHEMA_SHA256: '{{ web_saas_data_restore_verify_source_schema_sha256 }}'
    WEB_SAAS_EXPECTED_DATA_SHA256: '{{ web_saas_data_restore_verify_source_data_sha256 }}'
    WEB_SAAS_DATABASE_SYSTEM_IDENTIFIER: '{{ web_saas_data_restore_verify_database_system_identifier }}'
    WEB_SAAS_ARCHIVE_SHA256: '{{ web_saas_data_restore_verify_archive_sha256 }}'
    WEB_SAAS_BACKUP_KEY_STDIN: 'true'
    WEB_SAAS_FULL_DATABASE: '{{ web_saas_data_restore_verify_full_database | bool | ternary("true", "false") }}'
    WEB_SAAS_ALLOW_EMPTY_USERS: '{{ web_saas_data_restore_verify_allow_empty_users | bool | ternary("true", "false") }}'
    WEB_SAAS_MIGRATION_TABLE: '{{ web_saas_data_restore_verify_migration_table }}'
    WEB_SAAS_MIGRATION_VERSION_COLUMN: '{{ web_saas_data_restore_verify_migration_version_column }}'
    WEB_SAAS_MIGRATION_DIRTY_COLUMN: '{{ web_saas_data_restore_verify_migration_dirty_column }}'
    WEB_SAAS_MIGRATION_ORDER_COLUMN: '{{ web_saas_data_restore_verify_migration_order_column }}'
    WEB_SAAS_EXPECTED_MIGRATION_ROWS: '{{ web_saas_data_restore_verify_expected_migration_rows }}'
    WEB_SAAS_EXPECTED_MIGRATION_DIRTY: '{{ web_saas_data_restore_verify_expected_migration_dirty }}'
    WEB_SAAS_USERS_TABLE: '{{ web_saas_data_restore_verify_users_table }}'
    WEB_SAAS_SUBSCRIPTION_TABLE: '{{ web_saas_data_restore_verify_subscription_table }}'
    WEB_SAAS_CROSS_MACHINE: '{{ web_saas_data_restore_verify_cross_machine | bool | ternary("true", "false") }}'
    WEB_SAAS_RETAIN_RESTORE: '{{ web_saas_data_restore_verify_retain_restore | bool | ternary("true", "false") }}'
    WEB_SAAS_DIAGNOSTIC_PATH: '{{ web_saas_data_restore_verify_archive_path | dirname }}/restore-verify-diagnostic.txt'
  register: web_saas_data_restore_verify_command
  changed_when: web_saas_data_restore_verify_command.rc == 0
  no_log: true

- name: Record independently restored database component evidence
  ansible.builtin.set_fact:
    web_saas_data_restore_verify_evidence: '{{ web_saas_data_restore_verify_command.stdout | from_json }}'
