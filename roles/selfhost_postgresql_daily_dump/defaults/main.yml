---
selfhost_pg_daily_dump_enabled: false
selfhost_pg_daily_dump_container: web-saas-postgresql
selfhost_pg_daily_dump_root: /data/backups/web-saas/manual
selfhost_pg_daily_dump_expected_mountpoint: /data
selfhost_pg_daily_dump_prefix: web-saas-prod-pg_dumpall-
selfhost_pg_daily_dump_script_path: /usr/local/sbin/web-saas-pg-dumpall-backup
selfhost_pg_daily_dump_cron_path: /etc/cron.d/web-saas-pg-dumpall-backup
selfhost_pg_daily_dump_schedule: '0 2 * * *'
selfhost_pg_daily_dump_timezone: Asia/Shanghai
selfhost_pg_daily_dump_retention_days: 7
