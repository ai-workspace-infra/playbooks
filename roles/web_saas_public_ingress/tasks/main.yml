---
- name: Require one explicit generation and its host
  ansible.builtin.assert:
    that:
      - web_saas_public_ingress_generation is match('^prod-v[1-9][0-9]*$')
      - ansible_play_hosts_all == [web_saas_public_ingress_target]
      - web_saas_public_ingress_config == '/etc/xcontrol/web-saas-recovery/Caddyfile'
      - web_saas_public_ingress_image is match('^ghcr.io/[A-Za-z0-9_./:-]+@sha256:[0-9a-f]{64}$')

- name: Read authoritative GitOps ingress declarations
  ansible.builtin.set_fact:
    public_ingress: '{{ lookup("ansible.builtin.file", web_saas_public_ingress_manifest_file) | from_yaml }}'
    public_ingress_certificates_changed: false

- name: Require public domain and canonical Vault certificate contracts
  ansible.builtin.assert:
    that:
      - public_ingress.kind == 'WebSaasPublicIngress'
      - public_ingress.domains == {'console':'console.svc.plus','accounts':'accounts.svc.plus','billing':'billing.svc.plus'}
      - public_ingress.brand_domains == {'root':'xworktech.com','www':'www.xworktech.com'}
      - public_ingress.tls.vault_ref == 'kv/CICD/domains/svc.plus'
      - public_ingress.tls.directory == '/etc/xcontrol/tls/svc.plus'
      - public_ingress.brand_tls.vault_ref == 'kv/CICD/domains/xworktech.com'
      - public_ingress.brand_tls.directory == '/etc/xcontrol/tls/xworktech.com'

- name: Verify actual host before certificate and config writes
  ansible.builtin.command: hostname -s
  register: public_ingress_hostname
  changed_when: false

- ansible.builtin.assert:
    that: public_ingress_hostname.stdout == 'web-saas-' ~ web_saas_public_ingress_generation

- name: Restore both certificate sets through the shared certificate owner
  ansible.builtin.include_tasks: certificate.yml
  loop:
    - vault_ref: '{{ public_ingress.tls.vault_ref }}'
      directory: '{{ public_ingress.tls.directory }}'
      hosts: ['console.svc.plus', 'accounts.svc.plus', 'billing.svc.plus', 'console-selfhost-{{ web_saas_public_ingress_generation }}.svc.plus', 'accounts-selfhost-{{ web_saas_public_ingress_generation }}.svc.plus', 'billing-selfhost-{{ web_saas_public_ingress_generation }}.svc.plus']
    - vault_ref: '{{ public_ingress.brand_tls.vault_ref }}'
      directory: '{{ public_ingress.brand_tls.directory }}'
      hosts: [xworktech.com, www.xworktech.com]
  loop_control:
    loop_var: public_certificate

- name: Stage the sole generation Caddy configuration
  ansible.builtin.template:
    src: public-sites.caddy.j2
    dest: '{{ web_saas_public_ingress_config }}.public-candidate'
    mode: '0600'

- name: Ensure the pinned validation image is available
  ansible.builtin.command:
    argv: [docker, pull, '{{ web_saas_public_ingress_image }}']
  register: ingress_pull
  changed_when: "'Downloaded newer image' in ingress_pull.stdout"

- name: Validate candidate with mounted Vault certificates and no network
  ansible.builtin.command:
    argv: [docker, run, --rm, '--network=none', --mount, 'type=bind,src=/etc/xcontrol/tls,dst=/etc/xcontrol/tls,readonly', --mount, 'type=bind,src={{ web_saas_public_ingress_config }}.public-candidate,dst=/etc/caddy/Caddyfile,readonly', '--entrypoint=caddy', '{{ web_saas_public_ingress_image }}', adapt, '--config=/etc/caddy/Caddyfile', '--adapter=caddyfile', --validate]
  changed_when: false
  no_log: true

- name: Publish validated configuration with a recoverable prior copy
  ansible.builtin.copy:
    src: '{{ web_saas_public_ingress_config }}.public-candidate'
    dest: '{{ web_saas_public_ingress_config }}'
    remote_src: true
    backup: true
    mode: '0600'
  register: public_ingress_published

- name: Activate only changed configuration on the selected Caddy
  ansible.builtin.command:
    argv: [docker, restart, web-saas-caddy]
  when:
    - web_saas_public_ingress_activate | bool
    - public_ingress_published.changed or public_ingress_certificates_changed | bool
  changed_when: true
