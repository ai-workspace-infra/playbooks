---
client_mirrors_stack: "{{ lookup('env', 'CLIENT_MIRRORS_STACK') | default('mirrors', true) }}"
client_mirrors_manifest_path: "{{ playbook_dir }}/../gitops/resources/svc.plus/prod/client-mirrors/{{ client_mirrors_stack }}.yaml"
client_mirrors_mode: "{{ lookup('env', 'CLIENT_MIRRORS_MODE') | default('plan', true) }}"
client_mirrors_apply: "{{ (lookup('env', 'CLIENT_MIRRORS_APPLY') | default('false', true) | bool) or (client_mirrors_mode == 'apply') }}"
client_mirrors_verify: "{{ client_mirrors_mode in ['apply', 'verify'] }}"
client_mirrors_rotate_credentials: "{{ lookup('env', 'CLIENT_MIRRORS_ROTATE_CREDENTIALS') | default('false', true) | bool }}"
client_mirrors_run_cdn_verify_txt: "{{ lookup('env', 'CLIENT_MIRRORS_RUN_CDN_VERIFY_TXT') | default('true', true) | bool }}"
client_mirrors_vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('https://vault.svc.plus', true) }}"
client_mirrors_vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('', true) }}"
client_mirrors_vault_mount: "kv"
client_mirrors_cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') | default('', true) }}"
client_mirrors_cloudflare_account_id: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_ID') | default('', true) }}"
client_mirrors_alicloud_access_key: "{{ lookup('env', 'ALICLOUD_ACCESS_KEY') | default('', true) }}"
client_mirrors_alicloud_secret_key: "{{ lookup('env', 'ALICLOUD_SECRET_KEY') | default('', true) }}"
client_mirrors_probe_path: "releases/_health/probe.json"
client_mirrors_probe_origin: "https://console.svc.plus"
