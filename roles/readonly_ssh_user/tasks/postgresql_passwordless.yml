---
- name: Require the dedicated local migration reader contract
  ansible.builtin.assert:
    that:
      - readonly_postgresql_topology == 'compose'
      - readonly_ssh_user_postgresql_role == 'readonly_release'
      - readonly_ssh_user_postgresql_password | length == 0
    fail_msg: Local passwordless access requires the dedicated readonly_release role in an existing PostgreSQL container.

- name: Provision and verify only the dedicated database reader
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - --user
      - postgres
      - '{{ readonly_ssh_user_postgresql_container_name }}'
      - psql
      - -XAtq
      - -v
      - ON_ERROR_STOP=1
      - -U
      - '{{ readonly_ssh_user_postgresql_admin_user }}'
      - -d
      - '{{ readonly_database_name }}'
    stdin: '{{ lookup("template", "postgresql-passwordless.sql.j2") }}'
  loop: '{{ readonly_ssh_user_postgresql_databases }}'
  loop_control:
    loop_var: readonly_database_name
  register: readonly_local_grants
  changed_when: "'changed' in readonly_local_grants.stdout_lines"
  no_log: true
