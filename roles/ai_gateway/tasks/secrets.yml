---
- name: 动态生成内存临时凭据 (若未显式注入)
  set_fact:
    resolved_new_api_root_token: "{{ ai_gateway_new_api_root_token | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32'), true) }}"
    resolved_litellm_master_key: "{{ ai_gateway_litellm_master_key | default('sk-litellm-' ~ lookup('password', '/dev/null chars=ascii_letters,digits length=32'), true) }}"
  no_log: true

- name: 渲染 LiteLLM 路由与模型配置文件
  copy:
    dest: "{{ ai_gateway_config_dir }}/litellm_config.yaml"
    mode: '0600'
    content: |
      model_list:
        - model_name: default-mock
          litellm_params:
            model: mock_response/default-mock
            mock_response: "Hello! AI Gateway is operational."
        - model_name: gpt-4o
          litellm_params:
            model: mock_response/gpt-4o
            mock_response: "Mock response for gpt-4o from AI Gateway."
        - model_name: claude-3-5-sonnet
          litellm_params:
            model: mock_response/claude-3-5-sonnet
            mock_response: "Mock response for claude-3-5-sonnet from AI Gateway."

      general_settings:
        master_key: "{{ resolved_litellm_master_key }}"

      litellm_settings:
        json_logs: true
        drop_params: false
  no_log: true
