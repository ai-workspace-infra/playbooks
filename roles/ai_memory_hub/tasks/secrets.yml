---
- name: 解析运行时机密 (Vault / 环境变量 / 内存生成)
  ansible.builtin.set_fact:
    ai_memory_hub_pg_password: "{{ lookup('env', 'POSTGRES_PASSWORD') | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24'), true) }}"
    ai_memory_hub_qmd_ingest_token: "{{ lookup('env', 'QMD_INGEST_TOKEN') | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32'), true) }}"
    ai_memory_hub_qmd_mcp_token: "{{ lookup('env', 'QMD_MCP_TOKEN') | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32'), true) }}"
  no_log: true
