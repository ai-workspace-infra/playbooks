---
- name: 读取由 Vault/OIDC 注入的运行时机密
  ansible.builtin.set_fact:
    ai_memory_hub_pg_password: "{{ lookup('ansible.builtin.env', 'AI_MEMORY_HUB_POSTGRES_PASSWORD') | default('', true) }}"
    ai_memory_hub_qmd_ingest_token: "{{ lookup('ansible.builtin.env', 'AI_MEMORY_HUB_QMD_INGEST_TOKEN') | default('', true) }}"
    ai_memory_hub_qmd_mcp_token: "{{ lookup('ansible.builtin.env', 'AI_MEMORY_HUB_QMD_MCP_TOKEN') | default('', true) }}"
  no_log: true

- name: Require stable externally managed secrets before deploying
  ansible.builtin.assert:
    that:
      - ai_memory_hub_pg_password | length >= 24
      - ai_memory_hub_qmd_ingest_token | length >= 32
      - ai_memory_hub_qmd_mcp_token | length >= 32
    fail_msg: >-
      Missing or invalid AI Memory Hub secrets. Inject stable values from Vault
      through the caller environment; this role never invents replacement secrets.
  no_log: true
