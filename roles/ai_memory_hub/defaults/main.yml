---
# defaults file for ai_memory_hub
ai_memory_hub_base_dir: "{{ ansible_env.HOME | default('/root') }}/.ai-memory-hub"
ai_memory_hub_data_dir: "{{ ai_memory_hub_base_dir }}/data"

ai_memory_hub_listen_ip: "127.0.0.1"
ai_memory_hub_pg_port: 15432
ai_memory_hub_qmd_port: 8181

ai_memory_hub_postgres_image: "postgres-extensions:17"
ai_memory_hub_qmd_image: "ghcr.io/ai-workspace-lab/qmd:v2.8.3"

ai_memory_hub_postgres_db: "postgres"
ai_memory_hub_postgres_user: "postgres"

# Explicit compatibility entry; normal role tasks remain authoritative.
ai_memory_hub_legacy_setup_enabled: false
ai_memory_hub_legacy_setup_script: setup-ai-memory-hub.sh
ai_memory_hub_legacy_setup_arguments: []
ai_memory_hub_legacy_setup_environment: {}
