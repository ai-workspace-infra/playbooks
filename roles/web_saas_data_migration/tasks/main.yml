---
- name: Bind a private per-operation temporary path token
  ansible.builtin.set_fact:
    web_saas_data_migration_run_token: "{{ web_saas_data_migration_request.run_id | default('compat') }}"
  no_log: true

- name: Validate exact target request and paired backup/restore evidence shapes
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/validate_contract.py"
      - migration
    stdin: "{{ {'environment': web_saas_data_migration_environment, 'request': web_saas_data_migration_request, 'baseline_manifest': web_saas_data_migration_baseline_manifest, 'backup_evidence': web_saas_data_migration_backup_evidence, 'restore_evidence': web_saas_data_migration_restore_evidence} | to_json }}"
  register: web_saas_data_migration_validation
  changed_when: false
  delegate_to: localhost
  become: false

- name: Require a validated migration contract before touching the Accounts container
  ansible.builtin.assert:
    that:
      - (web_saas_data_migration_validation.stdout | from_json).status == 'ready'
      - web_saas_data_migration_binary_path | length > 0
      - web_saas_data_migration_migrations_path | length > 0
      - web_saas_data_migration_receipt_file | length > 0
    fail_msg: Migration request or reviewed Accounts migrator artifact is not ready

- name: Execute one exact bounded migration twice inside the validated Accounts container
  block:
    - name: Select the embedded receipt-writing migrator for versioned generations
      ansible.builtin.set_fact:
        web_saas_data_migration_command:
          - docker
          - exec
          - '{{ web_saas_data_migration_request.container }}'
          - sh
          - -c
          - 'ACCOUNTS_MIGRATION_DSN="$DATABASE_URL" exec "$@"'
          - sh
          - '/tmp/{{ web_saas_data_migration_environment | replace("-", "_") }}-{{ web_saas_data_migration_run_token }}-migratectl'
          - controlled-migrate
          - --expected-version
          - '{{ web_saas_data_migration_request.expected_version | string }}'
          - --target-version
          - '{{ web_saas_data_migration_request.target_version | string }}'
          - --sha256
          - '{{ web_saas_data_migration_request.migration_checksum }}'
          - --lock-timeout
          - '{{ web_saas_data_migration_request.lock_timeout_seconds }}s'
          - --statement-timeout
          - '{{ web_saas_data_migration_request.statement_timeout_seconds }}s'
      when: web_saas_data_migration_environment is match('^prod-v[1-9][0-9]*$')

    - name: Preserve the UAT filesystem-migrator contract
      ansible.builtin.set_fact:
        web_saas_data_migration_command:
          - docker
          - exec
          - '{{ web_saas_data_migration_request.container }}'
          - '/tmp/{{ web_saas_data_migration_environment | replace("-", "_") }}-{{ web_saas_data_migration_run_token }}-migratectl'
          - migrate
          - --dir
          - '/tmp/{{ web_saas_data_migration_environment | replace("-", "_") }}-{{ web_saas_data_migration_run_token }}-account-migrations'
          - --dsn-env
          - DATABASE_URL
          - --expected-version
          - '{{ web_saas_data_migration_request.expected_version | string }}'
          - --target-version
          - '{{ web_saas_data_migration_request.target_version | string }}'
          - --migration-sha256
          - '{{ web_saas_data_migration_request.migration_checksum }}'
          - --lock-timeout
          - '{{ web_saas_data_migration_request.lock_timeout_seconds }}s'
          - --statement-timeout
          - '{{ web_saas_data_migration_request.statement_timeout_seconds }}s'
      when: web_saas_data_migration_environment == 'uat'

    - name: Stage the reviewed Accounts migrator on the exact selected host
      ansible.builtin.copy:
        src: "{{ web_saas_data_migration_binary_path }}"
        dest: "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-migratectl"
        mode: '0755'
      no_log: true

    - name: Stage the reviewed migration directory on the exact selected host
      ansible.builtin.copy:
        src: "{{ web_saas_data_migration_migrations_path }}/"
        dest: "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-account-migrations/"
        mode: '0700'
        directory_mode: '0700'
      no_log: true
      when: web_saas_data_migration_environment == 'uat'

    - name: Copy the reviewed migrator into the validated Accounts container
      ansible.builtin.command:
        argv: [docker, cp, "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-migratectl", "{{ web_saas_data_migration_request.container }}:/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-migratectl"]
      changed_when: true
      no_log: true

    - name: Copy the reviewed migration files into the validated Accounts container
      ansible.builtin.command:
        argv: [docker, cp, "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-account-migrations", "{{ web_saas_data_migration_request.container }}:/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-account-migrations"]
      changed_when: true
      no_log: true
      when: web_saas_data_migration_environment == 'uat'

    - name: Make the reviewed migrator executable in the validated Accounts container
      ansible.builtin.command:
        argv: [docker, exec, "{{ web_saas_data_migration_request.container }}", chmod, '0755', "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-migratectl"]
      changed_when: false
      no_log: true

    - name: Run the bounded Accounts migration using only the container DSN environment
      ansible.builtin.command:
        argv: '{{ web_saas_data_migration_command }}'
        expand_argument_vars: false
      register: web_saas_data_migration_first
      changed_when: true
      no_log: true

    - name: Prove the same bounded request is idempotent
      ansible.builtin.command:
        argv: '{{ web_saas_data_migration_command }}'
        expand_argument_vars: false
      register: web_saas_data_migration_second
      changed_when: false
      no_log: true

    - name: Build a sanitized migration component receipt bound to backup and candidate
      ansible.builtin.set_fact:
        web_saas_data_migration_evidence:
          schema: 1
          phase: migration
          environment: "{{ web_saas_data_migration_environment }}"
          status: passed
          business_acceptance: false
          candidate_sha256: "{{ web_saas_data_migration_request.candidate_sha256 }}"
          accounts_source_revision: "{{ web_saas_data_migration_request.accounts_source_revision }}"
          target_db_id: "{{ web_saas_data_migration_request.target_db_id }}"
          baseline_id: "{{ web_saas_data_migration_request.baseline_id }}"
          checkpoint_id: "{{ web_saas_data_migration_backup_evidence.checkpoint_id }}"
          before_version: "{{ web_saas_data_migration_request.expected_version | int }}"
          after_version: "{{ web_saas_data_migration_request.target_version | int }}"
          migration_sha256: "{{ web_saas_data_migration_request.migration_checksum }}"
          dirty_false: true
          database_lock_held: true
          bounded_lock_wait: true
          bounded_execution: true
          reviewed_additive_sql: true
          idempotent: "{{ (web_saas_data_migration_first.rc == 0 and web_saas_data_migration_second.rc == 0) | bool }}"
          data_preserved: false
          old_application_compatible: false
      no_log: true

    - name: Publish only the sanitized migration component receipt
      ansible.builtin.copy:
        dest: "{{ web_saas_data_migration_receipt_file }}"
        mode: '0600'
        content: "{{ web_saas_data_migration_evidence | to_json }}\n"
      delegate_to: localhost
      become: false

  always:
    - name: Remove the staged migrator from the selected host
      ansible.builtin.file:
        path: "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-migratectl"
        state: absent
      no_log: true
    - name: Remove the staged migration files from the selected host
      ansible.builtin.file:
        path: "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-account-migrations"
        state: absent
      no_log: true
    - name: Remove this run's migrator from the validated Accounts container
      ansible.builtin.command:
        argv: [docker, exec, "{{ web_saas_data_migration_request.container }}", rm, -f, "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-migratectl"]
      changed_when: false
      failed_when: false
      no_log: true
    - name: Remove this run's migration files from the validated Accounts container
      ansible.builtin.command:
        argv: [docker, exec, "{{ web_saas_data_migration_request.container }}", rm, -r, -f, --, "/tmp/{{ web_saas_data_migration_environment | replace('-', '_') }}-{{ web_saas_data_migration_run_token }}-account-migrations"]
      changed_when: false
      failed_when: false
      no_log: true
