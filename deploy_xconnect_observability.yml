---
# Collection-side entrypoint for independently deployed Gateway and One nodes.
# It is deliberately self-contained: monitoring must not apply platform
# firewall, hostname, SSH-hardening or Blackbox defaults to a persistent relay.
- name: Deploy XConnect Gateway and One observability
  hosts: "{{ xconnect_observability_hosts | default('xconnect') }}"
  become: true
  gather_facts: true
  vars:
    xconnect_observability_auth_user: "{{ lookup('ansible.builtin.env', 'VECTOR_AUTH_USER') | default('', true) }}"
    xconnect_observability_auth_password: "{{ lookup('ansible.builtin.env', 'VECTOR_AUTH_PASSWORD') | default('', true) }}"
    xconnect_observability_endpoint: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENDPOINT') | default('https://observability.svc.plus', true) }}"
  roles:
    - role: vhosts/vpn-overlay/observability
