---
- name: Repair only existing Exporter snapshot credentials
  hosts: '{{ xray_snapshot_repair_hosts | default("never-matches") }}'
  gather_facts: false
  become: true
  serial: 1
  pre_tasks:
    - name: Require explicit repair authorization and fixed GitOps inputs
      ansible.builtin.assert:
        that:
          - xray_snapshot_repair_authorized | default(false) | bool
          - xray_snapshot_gitops_sha is match('^[0-9a-f]{40}$')
          - xray_snapshot_gitops_checkout | length > 0
    - name: Check the fixed declaration revision
      ansible.builtin.command:
        argv: [git, -C, '{{ xray_snapshot_gitops_checkout }}', rev-parse, HEAD]
      delegate_to: localhost
      become: false
      register: snapshot_gitops_head
      changed_when: false
      check_mode: false
      failed_when: snapshot_gitops_head.stdout != xray_snapshot_gitops_sha
    - name: Reject locally modified declaration inputs
      ansible.builtin.command:
        argv: [git, -C, '{{ xray_snapshot_gitops_checkout }}', status, --porcelain, --untracked-files=all]
      delegate_to: localhost
      become: false
      register: snapshot_gitops_status
      changed_when: false
      check_mode: false
      failed_when: snapshot_gitops_status.stdout | trim | length > 0
    - name: Read the generation-independent credential contract
      ansible.builtin.set_fact:
        snapshot_credential_contract: '{{ (lookup("ansible.builtin.file", xray_snapshot_gitops_checkout ~ "/compose/web-saas/runtime/prod.yaml") | from_yaml).internal_service_token }}'
    - name: Require the existing canonical credential owner
      ansible.builtin.assert:
        that:
          - snapshot_credential_contract.vault_path == 'kv/prod/accounts/runtime'
          - snapshot_credential_contract.key == 'INTERNAL_SERVICE_TOKEN'
    - ansible.builtin.include_tasks: tasks/resolve-canonical-service-token.yml
  tasks:
    - ansible.builtin.include_role:
        name: roles/vhosts/xray-exporter
        tasks_from: repair-snapshot-credentials
