---
# =============================================================================
# web-saas 业务库的 baseline schema 初始化 (幂等)
#
# create_databases_and_users.yml 只建库和建角色, 不建表。accounts 服务启动时
# 只会自动建 7 张表(tenants / tenant_domains / tenant_memberships /
# admin_settings / sandbox_bindings / homepage_video_settings /
# xworkmate_profiles), 但 users / sessions / identities / rbac_* /
# subscriptions / overlay_* 这套 baseline 要靠外部灌入。缺了它, accounts 起来
# 就是 `relation "users" does not exist (SQLSTATE 42P01)` 无限重启, Caddy 对外
# 表现成 502 —— 2026-07-28 每一台新主机都栽在这里。
#
# 这段逻辑本来就存在, 在 roles/vhosts/accounts_service/templates/postsetup.sh.j2
# 里, 但那个 role 不在 setup-web-saas-domain.yml 的 roles 列表里(web-saas 域只
# 装 web_saas_host_config + Doco-CD), 所以从来没在这条链路上跑过; 而且它写死
# 了容器名 postgresql(实际是 web-saas-postgresql)。这里把它接回 web-saas 链路
# 并修正容器名。
#
# 幂等判据不能只看 users: 旧逻辑会把只灌了一部分的 schema 当成完整
# baseline, 让 accounts 在运行时才撞上 `relation "subscriptions" does not exist`。
# 空库才允许灌完整 baseline；已有表的主机只走显式、增量、不可破坏的修复。
# =============================================================================
- name: Initialize web-saas baseline schemas
  hosts: all
  become: true
  gather_facts: false
  vars:
    # schema 要跟部署的镜像同版本。deploy_tag 为空时才退回 main ——
    # 用 main 配一个旧 tag 的镜像, 是"表结构比代码新"的经典事故。
    accounts_schema_ref: "{{ lookup('ansible.builtin.env', 'ACCOUNTS_SCHEMA_REF') | default('', true) or 'main' }}"
    accounts_schema_url: >-
      https://raw.githubusercontent.com/ai-workspace-services/accounts/{{ accounts_schema_ref }}/sql/schema.sql
    billing_catalog_seed_url: >-
      https://raw.githubusercontent.com/ai-workspace-services/accounts/{{ accounts_schema_ref }}/scripts/seed-billing-plans.sql
    pg_container_default: web-saas-postgresql
    # 与 create_databases_and_users.yml 和 web_saas_host_config 用的是同一个
    # 角色名。accounts 和 billing 都经这个角色连库。
    account_pg_user: "{{ lookup('ansible.builtin.env', 'ACCOUNT_PG_USER') | default('account_user', true) }}"

  tasks:
    # 与 create_databases_and_users.yml 同样的探测方式: 探不到就显式失败,
    # 不静默跳过。跳过等于把"没初始化"伪装成"初始化过了"。
    - name: Detect running Postgres container
      ansible.builtin.shell: "docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -E '^web-saas-postgresql$'"
      register: detected_pg
      changed_when: false
      failed_when: false

    - name: Fail when the web-saas Postgres container is not running
      ansible.builtin.fail:
        msg: >-
          web-saas-postgresql container not found on {{ inventory_hostname }}.
          Refusing to report schema initialization as done when no database
          was reachable.
      when: (detected_pg.stdout | default('') | trim) == ''

    - name: Resolve Postgres container name
      ansible.builtin.set_fact:
        pg_container: "{{ (detected_pg.stdout | default('') | trim) or pg_container_default }}"

    - name: Check whether the account users table is present
      ansible.builtin.command: >-
        docker exec -i {{ pg_container }} psql -U postgres -d account -tAc
        "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='users'"
      register: users_table_check
      changed_when: false
      failed_when: false

    - name: Check whether the account subscriptions table is present
      ansible.builtin.command: >-
        docker exec -i {{ pg_container }} psql -U postgres -d account -tAc
        "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='subscriptions'"
      register: subscriptions_table_check
      changed_when: false
      failed_when: false

    - name: Check whether the account database is empty
      ansible.builtin.command: >-
        docker exec -i {{ pg_container }} psql -U postgres -d account -tAc
        "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'"
      register: public_table_count_check
      changed_when: false
      failed_when: false

    - name: Classify the account schema state
      ansible.builtin.set_fact:
        account_schema_is_empty: "{{ (public_table_count_check.stdout | default('0') | trim | int) == 0 }}"
        account_schema_is_complete: "{{ (users_table_check.stdout | default('') | trim) == '1' and (subscriptions_table_check.stdout | default('') | trim) == '1' }}"
        account_schema_is_partial: "{{ (public_table_count_check.stdout | default('0') | trim | int) > 0 and not ((users_table_check.stdout | default('') | trim) == '1' and (subscriptions_table_check.stdout | default('') | trim) == '1') }}"

    - name: Fetch the account baseline schema matching the deployed ref
      ansible.builtin.get_url:
        url: "{{ accounts_schema_url }}"
        dest: /tmp/accounts-schema.sql
        mode: "0600"
        force: true
      when: account_schema_is_empty

    # ON_ERROR_STOP=1 很关键: 没有它 psql 会带着报错跑完并 exit 0,
    # 半截 schema 照样报成功。
    - name: Apply the account baseline schema
      ansible.builtin.shell: >-
        set -o pipefail &&
        docker exec -i {{ pg_container }} psql -U postgres -d account
        -v ON_ERROR_STOP=1 -f - < /tmp/accounts-schema.sql
      args:
        executable: /bin/bash
      when: account_schema_is_empty
      register: schema_apply

    - name: Remove the downloaded schema file
      ansible.builtin.file:
        path: /tmp/accounts-schema.sql
        state: absent
      when: account_schema_is_empty

    # Never re-run sql/schema.sql against a non-empty database: that file starts
    # with DROP TABLE ... CASCADE. A partially initialized host therefore gets
    # only this additive repair path. It is deliberately limited to the missing
    # subscriptions relation that is required by the deployed Accounts service.
    - name: Repair the missing subscriptions table without touching existing data
      ansible.builtin.shell: |
        set -eo pipefail
        docker exec -i {{ pg_container }} psql -U postgres -d account \
          -v ON_ERROR_STOP=1 -f - <<'SQL'
        CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;
        CREATE OR REPLACE FUNCTION public.set_updated_at() RETURNS trigger
        LANGUAGE plpgsql AS $$
        BEGIN
          NEW.updated_at := now();
          RETURN NEW;
        END;
        $$;
        CREATE TABLE IF NOT EXISTS public.subscriptions (
          uuid UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          user_uuid UUID NOT NULL REFERENCES public.users(uuid) ON DELETE CASCADE,
          provider TEXT NOT NULL,
          payment_method TEXT NOT NULL DEFAULT 'paypal',
          kind TEXT NOT NULL DEFAULT 'subscription',
          plan_id TEXT,
          external_id TEXT NOT NULL,
          status TEXT NOT NULL DEFAULT 'pending',
          payment_qr TEXT,
          meta JSONB NOT NULL DEFAULT '{}'::jsonb,
          created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
          updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
          cancelled_at TIMESTAMPTZ,
          CONSTRAINT subscriptions_user_external_uk UNIQUE (user_uuid, external_id)
        );
        CREATE INDEX IF NOT EXISTS idx_subscriptions_user_uuid
          ON public.subscriptions (user_uuid);
        CREATE INDEX IF NOT EXISTS idx_subscriptions_status
          ON public.subscriptions (status);
        DO $$
        BEGIN
          IF NOT EXISTS (
            SELECT 1
            FROM pg_trigger
            WHERE tgrelid = 'public.subscriptions'::regclass
              AND tgname = 'trg_subscriptions_set_updated_at'
              AND NOT tgisinternal
          ) THEN
            CREATE TRIGGER trg_subscriptions_set_updated_at
              BEFORE UPDATE ON public.subscriptions
              FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();
          END IF;
        END
        $$;
        SQL
      args:
        executable: /bin/bash
      when: >-
        (users_table_check.stdout | default('') | trim) == '1' and
        (subscriptions_table_check.stdout | default('') | trim) != '1'
      register: subscriptions_repair

    - name: Fail closed on an unsupported partial account schema
      ansible.builtin.fail:
        msg: >-
          account database has existing public tables but is missing the required
          users table. Refusing to run the destructive baseline schema against a
          non-empty database; repair the schema through a reviewed additive change.
      when: >-
        account_schema_is_partial and
        (users_table_check.stdout | default('') | trim) != '1'

    # 灌完或增量修复后必须复验完整性；只验证 users 会再次把部分 schema 当成成功。
    - name: Verify the required account baseline tables are present
      ansible.builtin.command: >-
        docker exec -i {{ pg_container }} psql -U postgres -d account -tAc
        "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('users','subscriptions')"
      register: required_tables_verify
      changed_when: false

    - name: Fail when the required account baseline is still incomplete
      ansible.builtin.fail:
        msg: >-
          account baseline is incomplete after initialization/repair: expected
          users and subscriptions in public schema, got
          {{ required_tables_verify.stdout | default('0') | trim }} tables.
          Refusing to report success.
      when: (required_tables_verify.stdout | default('0') | trim | int) != 2

    # A fresh Accounts schema only contains the runtime fallback plans (Free
    # and Trial). Seed the purchasable catalog before the application starts
    # accepting Checkout requests. The SQL itself is idempotent and preserves
    # Stripe price IDs, but we skip the download and write once the primary
    # paid plan exists so ordinary deployments never overwrite operator edits.
    - name: Check whether the paid billing catalog is already present
      ansible.builtin.command: >-
        docker exec -i {{ pg_container }} psql -U postgres -d account -tAc
        "SELECT 1 FROM public.billing_plans WHERE plan_id = 'PRO-MONTHLY'"
      register: billing_catalog_check
      changed_when: false
      failed_when: false

    - name: Fetch the billing catalog seed matching the deployed ref
      ansible.builtin.get_url:
        url: "{{ billing_catalog_seed_url }}"
        dest: /tmp/accounts-billing-catalog.sql
        mode: "0600"
        force: true
      when: (billing_catalog_check.stdout | default('') | trim) != '1'

    - name: Seed the initial paid billing catalog
      ansible.builtin.shell: >-
        set -o pipefail &&
        docker exec -i {{ pg_container }} psql -U postgres -d account
        -v ON_ERROR_STOP=1 -f - < /tmp/accounts-billing-catalog.sql
      args:
        executable: /bin/bash
      when: (billing_catalog_check.stdout | default('') | trim) != '1'

    - name: Remove the downloaded billing catalog seed
      ansible.builtin.file:
        path: /tmp/accounts-billing-catalog.sql
        state: absent
      when: (billing_catalog_check.stdout | default('') | trim) != '1'

    - name: Verify the paid billing catalog is present
      ansible.builtin.command: >-
        docker exec -i {{ pg_container }} psql -U postgres -d account -tAc
        "SELECT 1 FROM public.billing_plans WHERE plan_id = 'PRO-MONTHLY'"
      register: billing_catalog_verify
      changed_when: false
      failed_when: false

    - name: Fail when the paid billing catalog is missing after initialization
      ansible.builtin.fail:
        msg: >-
          paid billing catalog is missing after applying
          {{ billing_catalog_seed_url }}.
      when: (billing_catalog_verify.stdout | default('') | trim) != '1'

    # schema 是以 -U postgres 灌的, 所以每张表的属主都是 postgres, 而
    # account_user 一张也访问不到。accounts 之前看不出问题, 是因为它自己也用
    # postgres 连库; billing 老老实实用 DATABASE_URL 里的 account_user, 于是
    # 第一次写入就是
    #   permission denied for table traffic_stat_checkpoints (SQLSTATE 42501)
    # —— 部署全绿, 用量却永远是 0。
    #
    # 不放在上面的 when 里: 这一步要对存量主机也生效, 而存量主机的 users 表早
    # 就在了, 灌 schema 那步会被跳过。下面两条都是幂等的 —— 属主已经对的对象
    # 会被跳过, GRANT 重复执行没有代价 —— 所以每次部署重跑一遍是安全的。
    #
    # 改属主而不是只 GRANT: 只给 SELECT/INSERT/UPDATE/DELETE 的话, accounts 与
    # billing 启动时的建表和迁移(ALTER TABLE / CREATE INDEX)照样会被拒 —— DDL
    # 只有属主能做。把 public 下的对象交给 account_user, 这两个服务才真正拥有
    # 自己的库; 同时以后由它们新建的表天然就归它们, 不需要再靠默认权限兜。
    - name: Hand the account schema to the account role
      ansible.builtin.shell: |
        set -eo pipefail
        docker exec -i {{ pg_container }} psql -U postgres -d account \
          -v ON_ERROR_STOP=1 -f - <<'SQL'
        GRANT USAGE, CREATE ON SCHEMA public TO {{ account_pg_user }};
        -- 表在前。serial / identity 的序列归属跟着所属表走, 表一改属主它们
        -- 就跟着改了, 所以这一轮结束后剩下的序列基本都已经是对的。
        DO $$
        DECLARE r record;
        BEGIN
          FOR r IN
            SELECT c.relkind, n.nspname, c.relname
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind IN ('r', 'p', 'v', 'm')
              AND pg_get_userbyid(c.relowner) <> '{{ account_pg_user }}'
          LOOP
            EXECUTE format('ALTER %s %I.%I OWNER TO %I',
              CASE r.relkind
                WHEN 'v' THEN 'VIEW'
                WHEN 'm' THEN 'MATERIALIZED VIEW'
                ELSE 'TABLE'
              END, r.nspname, r.relname, '{{ account_pg_user }}');
          END LOOP;
        END $$;
        -- 再收独立序列 —— 只收独立的。被列"拥有"的序列 Postgres 直接拒绝单独
        -- 改属主:
        --   cannot change owner of sequence "sandbox_bindings_id_seq"
        --   DETAIL: Sequence ... is linked to table "sandbox_bindings".
        -- 它们没有独立属主可言, 上一轮改表时已经带过去了。
        DO $$
        DECLARE r record;
        BEGIN
          FOR r IN
            SELECT n.nspname, c.relname
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind = 'S'
              AND pg_get_userbyid(c.relowner) <> '{{ account_pg_user }}'
              AND NOT EXISTS (
                SELECT 1 FROM pg_depend d
                WHERE d.classid = 'pg_class'::regclass
                  AND d.objid = c.oid
                  AND d.refclassid = 'pg_class'::regclass
                  AND d.deptype IN ('a', 'i'))
          LOOP
            EXECUTE format('ALTER SEQUENCE %I.%I OWNER TO %I',
              r.nspname, r.relname, '{{ account_pg_user }}');
          END LOOP;
        END $$;
        SQL
      args:
        executable: /bin/bash
      changed_when: false

    # 复验和灌 schema 那步同一个道理: GRANT 成功不等于应用真的连得上。
    #
    # 探针用 users 而不是某张 billing 表: billing 的表由 billing 容器自己建, 而
    # 容器要等本 playbook 之后的 compose 才起来 —— 拿它当探针会在全新主机上必然
    # 失败。users 由上一步刚验过存在, 且与 billing 表同属 public schema、同一批
    # GRANT, 它通就代表这批授权生效了。
    #
    # 走 -h 127.0.0.1 而不是本地 socket: socket 那条 pg_hba 规则是 peer, 容器里
    # 是 root, 会以"角色不匹配"失败, 与权限无关。127.0.0.1 是 trust, 正好只检
    # 验权限 —— 口令那一面由 create_databases_and_users.yml 经 scram 单独验过。
    - name: Verify the account role can read the account schema
      ansible.builtin.command: >-
        docker exec -i {{ pg_container }} psql -h 127.0.0.1 -U {{ account_pg_user }}
        -d account -tAc "SELECT count(*) FROM users"
      register: account_user_access
      changed_when: false
      failed_when: false

    - name: Fail when the account role still cannot read the account schema
      ansible.builtin.fail:
        msg: >-
          {{ account_pg_user }} still cannot read the users table after granting:
          {{ account_user_access.stderr | default('') | trim }}
          Both accounts and billing connect through this role, so leaving this
          broken means the stack deploys green and then writes nothing.
      when: account_user_access.rc != 0

    - name: Report schema state
      ansible.builtin.debug:
        msg: >-
          account baseline schema
          {{ 'already complete; skipped' if account_schema_is_complete
             else 'applied from ' ~ accounts_schema_url if account_schema_is_empty
             else 'repaired additively (subscriptions)' }}
