---
# This playbook is the canonical collection-side entrypoint. It now owns the
# Xray exporter and Vector collection previously embedded in
# deploy_observability.yml; the server stack lives in deploy_observability_server.yml.
- name: Deploy Xray Exporter collection source
  hosts: "{{ xray_exporter_hosts | default('xray_exporter') }}"
  become: true
  vars:
    vector_billing_ingest_enabled: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_ENABLED')
         | default(false, true) | bool }}
    xray_exporter_snapshot_features_enabled: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_SNAPSHOT_FEATURES_ENABLED')
         | default(vector_billing_ingest_enabled, true) | bool }}
    xray_exporter_accounts_base_url: >-
      {{ lookup('ansible.builtin.env', 'ACCOUNTS_BASE_URL')
         | default('https://accounts.svc.plus', true) }}
    xray_exporter_internal_service_token: >-
      {{ canonical_internal_service_token | default('') }}
    xray_exporter_vector_snapshot_url: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_SNAPSHOT_URL')
         | default('http://127.0.0.1:8686'
                  if xray_exporter_snapshot_features_enabled else '', true) }}
  pre_tasks:
    - name: Require Xray exporter targets to be in the reviewed exporter group
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length > 0
          - ansible_play_hosts_all | difference(groups.get('xray_exporter', [])) | length == 0
      when: vector_billing_ingest_enabled | bool

    - name: Resolve canonical credentials only when billing snapshots are enabled
      ansible.builtin.include_tasks: tasks/resolve-canonical-service-token.yml
      when: >-
        (xray_exporter_snapshot_features_enabled | bool) or
        (xray_exporter_vector_snapshot_url | trim | length > 0)

  roles:
    - vhosts/xray-exporter

- name: Setup observability agent
  # Keep the default broad for fleet collection, while allowing a focused
  # online check/deployment with -e observability_agent_hosts=observability_hosts.
  hosts: "{{ observability_agent_hosts | default('all') }}"
  # 兜底用的短等待窗口。首次启动的收敛由 deploy_base 的
  # common_wait_for_host_init.sh 统一负责(它在 bootstrap 前等 cloud-init 与
  # unattended-upgrades 退出), 所以到这里锁通常已经放开; 这里只覆盖那之后
  # 偶发的短暂占用, 不需要很长。单个任务仍可自行覆盖。
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"
  user: root
  become: yes
  gather_facts: yes
  tasks:
    - name: Include observability-agent role
      ansible.builtin.include_role:
        name: charts/observability-agent
      vars:
        group: all
        domain: "{{ observability_service_domain | default('svc.plus', true) }}"
        namespace: monitoring
        deepflowserverip: "{{ observability_deepflow_server_ip | default('', true) }}"
        deepflowk8sclusterid: "{{ observability_deepflow_cluster_id | default('', true) }}"
      when:
        - observability_k3s_chart_agent_enabled | default(false) | bool
        - observability_deepflow_server_ip is defined and observability_deepflow_server_ip != ''

- name: Deploy Base Probes and Vector Agent
  hosts: "{{ observability_agent_hosts | default('all') }}"
  # 兜底用的短等待窗口。首次启动的收敛由 deploy_base 的
  # common_wait_for_host_init.sh 统一负责(它在 bootstrap 前等 cloud-init 与
  # unattended-upgrades 退出), 所以到这里锁通常已经放开; 这里只覆盖那之后
  # 偶发的短暂占用, 不需要很长。单个任务仍可自行覆盖。
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"
  become: yes
  pre_tasks:
    - name: Load GitOps policy for XConnect regional nodes
      ansible.builtin.include_vars:
        file: "{{ xconnect_gitops_config }}"
        name: xconnect_policy
      when:
        - "'xconnect_regional_nodes' in group_names"
        - xconnect_node_maintenance is not defined

    - name: Set GitOps node maintenance policy
      ansible.builtin.set_fact:
        xconnect_node_maintenance: "{{ xconnect_policy.spec.node_maintenance | default({}, true) }}"
      when:
        - "'xconnect_regional_nodes' in group_names"
        - xconnect_node_maintenance is not defined

    - name: Resolve canonical snapshot service token before any role mutation
      ansible.builtin.include_tasks: tasks/resolve-canonical-service-token.yml
      when: vector_billing_ingest_enabled | bool
    - name: Bind the canonical token to Vector Billing ingestion
      ansible.builtin.set_fact:
        vector_billing_ingest_token: "{{ canonical_internal_service_token }}"
      no_log: true
      when: vector_billing_ingest_enabled | bool
  vars:
    group: all
    vector_observability_endpoint: >-
      {{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENDPOINT')
         | default('https://observability.svc.plus', true) }}
    vector_observability_environment: >-
      {{ environment
         | default(cmdb_environment
         | default(lookup('ansible.builtin.env', 'DEPLOY_ENV')
         | default('unknown', true), true), true) }}
    vector_observability_provider: >-
      {{ provider
         | default(cloud_provider
         | default(cmdb_cloud_provider
         | default('unknown', true), true), true) }}
    vector_observability_region: >-
      {{ region
         | default(cmdb_region
         | default(cloud_region
         | default(provider_region
         | default(logical_region
         | default('unknown', true), true), true), true), true) }}
    vector_observability_project_id: >-
      {{ project_id
         | default(cmdb_project_id
         | default(account
         | default('', true), true), true) }}
    vector_observability_resource_id: >-
      {{ resource_id
         | default(cmdb_resource_id
         | default(instance_id
         | default(cmdb_instance_id
         | default(inventory_hostname, true), true), true), true) }}
    vector_observability_runtime_form: >-
      {{ runtime_form
         | default(cmdb_runtime_form
         | default('', true), true) }}
    vector_auth_user: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_AUTH_USER')
         | default('', true) }}
    vector_auth_password: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_AUTH_PASSWORD')
         | default('', true) }}
    vector_local_observability_enabled: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_LOCAL_OBSERVABILITY_ENABLED')
         | default('false', true) | bool }}
    vector_billing_ingest_enabled: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_ENABLED')
         | default(false, true) | bool }}
    vector_billing_ingest_address: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_ADDRESS')
         | default('127.0.0.1:8686', true) }}
    vector_billing_ingest_url: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_URL')
         | default('', true) }}
    vector_ai_aggregator_enabled: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_AI_AGGREGATOR_ENABLED')
         | default('false', true) | bool }}
    vector_ai_aggregator_public_target: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_AI_AGGREGATOR_PUBLIC_TARGET')
         | default('', true) }}
    xray_exporter_vector_snapshot_url: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_SNAPSHOT_URL')
         | default(
             ('http://' ~ vector_billing_ingest_address)
             if (vector_billing_ingest_enabled | bool)
             else '',
             true
           ) }}
    xray_exporter_internal_service_token: >-
      {{ canonical_internal_service_token | default('') }}
    xconnect_gitops_config: >-
      {{ lookup('ansible.builtin.env', 'XCONNECT_GITOPS_CONFIG')
         | default(playbook_dir ~ '/../gitops/topology/prod/selfhost/xconnect-regional-pools.yaml', true) }}
  tasks:
    - name: Restrict Billing snapshot rollout to reviewed Proxy inventory hosts
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length > 0
          - ansible_play_hosts_all | difference(groups.get('agent_proxy', [])) | length == 0
      when: vector_billing_ingest_enabled | bool

    - name: Include node_exporter role
      ansible.builtin.import_role:
        name: vhosts/node_exporter

    - name: Include process_exporter role
      ansible.builtin.import_role:
        name: vhosts/process_exporter

    # vector.toml renders local Blackbox scrape sources on every observability
    # agent. Keep the producer and consumer in the same canonical deployment so
    # a newly provisioned node never loops on 127.0.0.1:9115 connection errors.
    - name: Include blackbox_exporter role
      ansible.builtin.import_role:
        name: vhosts/blackbox_exporter

    - name: Check if xray process exists
      ansible.builtin.command: pgrep -x xray
      register: xray_process_check
      ignore_errors: true
      changed_when: false

    - name: Resolve desired Xray exporter telemetry state
      ansible.builtin.set_fact:
        vector_xray_exporter_enabled: >-
          {{ 'agent_proxy' in group_names or xray_process_check.rc == 0 }}

    # PostgreSQL exporter owns its own affinity detection. It is included for
    # every host so PostgreSQL nodes get the exporter automatically, while
    # non-PostgreSQL nodes are left untouched and report a clean skip.
    - name: Include postgres-exporter role
      ansible.builtin.import_role:
        name: vhosts/postgres_exporter
      tags:
        - postgres_exporter
      when:
        - (observability_deployment_mode | default('ansible')) != 'fluxcd'

    - name: Include vector-agent role
      ansible.builtin.import_role:
        name: vhosts/vector-agent
      vars:
        vector_xhttp_monitoring_enabled: "{{ vector_xray_exporter_enabled | bool }}"
      tags:
        - vector_agent

    - name: Validate Vector Billing fan-out contract
      ansible.builtin.assert:
        that:
          - vector_billing_ingest_url | trim | length > 0
          - vector_billing_ingest_token | trim | length > 0
        fail_msg: >-
          VECTOR_BILLING_INGEST_URL and INTERNAL_SERVICE_TOKEN are required
          when VECTOR_BILLING_INGEST_ENABLED=true.
      when: vector_billing_ingest_enabled | bool
