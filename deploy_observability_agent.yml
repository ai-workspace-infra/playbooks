---
# This playbook is the canonical collection-side entrypoint. It now owns the
# Xray exporter and Vector collection previously embedded in
# deploy_observability.yml; the server stack lives in deploy_observability_server.yml.
- name: Deploy Xray Exporter collection source
  hosts: "{{ xray_exporter_hosts | default('xray_exporter') }}"
  become: true
  roles:
    - vhosts/xray-exporter

- name: Setup observability agent
  hosts: all
  # 兜底用的短等待窗口。首次启动的收敛由 deploy_base 的
  # common_wait_for_host_init.sh 统一负责(它在 bootstrap 前等 cloud-init 与
  # unattended-upgrades 退出), 所以到这里锁通常已经放开; 这里只覆盖那之后
  # 偶发的短暂占用, 不需要很长。单个任务仍可自行覆盖。
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"
  user: root
  become: yes
  gather_facts: yes
  tasks:
    - name: Include observability-agent role
      ansible.builtin.include_role:
        name: charts/observability-agent
      vars:
        group: all
        namespace: monitoring
        deepflowserverip: "{{ observability_deepflow_server_ip | default('10.146.0.8') }}"
        deepflowk8sclusterid: "{{ observability_deepflow_cluster_id | default('d-kqjofXyZbg') }}"
      when: observability_deepflow_server_ip is defined and observability_deepflow_server_ip != ''

- name: Deploy Base Probes and Vector Agent
  hosts: all
  # 兜底用的短等待窗口。首次启动的收敛由 deploy_base 的
  # common_wait_for_host_init.sh 统一负责(它在 bootstrap 前等 cloud-init 与
  # unattended-upgrades 退出), 所以到这里锁通常已经放开; 这里只覆盖那之后
  # 偶发的短暂占用, 不需要很长。单个任务仍可自行覆盖。
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"
  become: yes
  vars:
    group: all
    vector_auth_user: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_AUTH_USER')
         | default('', true) }}
    vector_auth_password: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_AUTH_PASSWORD')
         | default('', true) }}
    vector_local_observability_enabled: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_LOCAL_OBSERVABILITY_ENABLED')
         | default('false', true) | bool }}
    vector_billing_ingest_enabled: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_ENABLED')
         | default(false, true) | bool }}
    vector_billing_ingest_address: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_ADDRESS')
         | default('127.0.0.1:8686', true) }}
    vector_billing_ingest_url: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_BILLING_INGEST_URL')
         | default('', true) }}
    vector_billing_ingest_token: >-
      {{ lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN')
         | default('', true) }}
    xray_exporter_vector_snapshot_url: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_SNAPSHOT_URL')
         | default(
             ('http://' ~ vector_billing_ingest_address)
             if (vector_billing_ingest_enabled | bool)
             else '',
             true
           ) }}
    xray_exporter_internal_service_token: >-
      {{ lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN')
         | default('', true) }}
  tasks:
    - name: Include node_exporter role
      ansible.builtin.import_role:
        name: vhosts/node_exporter

    - name: Include process_exporter role
      ansible.builtin.import_role:
        name: vhosts/process_exporter

    - name: Check if xray process exists
      ansible.builtin.command: pgrep -x xray
      register: xray_process_check
      ignore_errors: true
      changed_when: false

    - name: Resolve desired Xray exporter telemetry state
      ansible.builtin.set_fact:
        vector_xray_exporter_enabled: >-
          {{ 'agent_proxy' in group_names or xray_process_check.rc == 0 }}

    # PostgreSQL exporter owns its own affinity detection. It is included for
    # every host so PostgreSQL nodes get the exporter automatically, while
    # non-PostgreSQL nodes are left untouched and report a clean skip.
    - name: Include postgres-exporter role
      ansible.builtin.import_role:
        name: vhosts/postgres_exporter
      tags:
        - postgres_exporter

    - name: Include vector-agent role
      ansible.builtin.import_role:
        name: vhosts/vector-agent
      tags:
        - vector_agent

    - name: Validate Vector Billing fan-out contract
      ansible.builtin.assert:
        that:
          - vector_billing_ingest_url | trim | length > 0
          - vector_billing_ingest_token | trim | length > 0
        fail_msg: >-
          VECTOR_BILLING_INGEST_URL and INTERNAL_SERVICE_TOKEN are required
          when VECTOR_BILLING_INGEST_ENABLED=true.
      when: vector_billing_ingest_enabled | bool
