---
- name: Bootstrap only the isolated PROD V2 control plane
  hosts: v2_control
  become: true
  gather_facts: true
  pre_tasks:
    - name: Refuse any existing production host
      ansible.builtin.assert:
        that:
          - inventory_hostname == (prod_v2_control_host | default('web-saas-prod-v2'))
          - ansible_host == prod_v2_control_ip
    - name: Inspect only the new dedicated disk
      ansible.builtin.command:
        argv: [lsblk, -dnro, FSTYPE, "{{ prod_v2_data_disk_device | default('/dev/disk/by-id/google-web-saas-prod-v2-data') }}"]
      register: v2_disk_type
      changed_when: false
    - name: Refuse an unexpected filesystem
      ansible.builtin.assert:
        that: v2_disk_type.stdout | trim in ['', 'ext4']
    - name: Initialize the explicitly authorized blank V2 disk
      ansible.builtin.command:
        argv: [mkfs.ext4, -L, ws-prod-v2-data, "{{ prod_v2_data_disk_device | default('/dev/disk/by-id/google-web-saas-prod-v2-data') }}"]
      when: v2_disk_type.stdout | trim == ''
    - name: Mount the isolated persistent data disk
      ansible.posix.mount:
        path: /data
        src: "{{ prod_v2_data_disk_device | default('/dev/disk/by-id/google-web-saas-prod-v2-data') }}"
        fstype: ext4
        state: mounted
    - name: Prepare the new PostgreSQL directory
      ansible.builtin.file:
        path: /data/postgresql
        state: directory
        mode: '0700'
        owner: '999'
        group: '999'
    - name: Prepare shared TLS directory
      ansible.builtin.file:
        path: /etc/xcontrol/tls/svc.plus/current
        state: directory
        mode: '0750'
    - name: Restore valid shared domain certificate without changing DNS
      ansible.builtin.copy:
        content: "{{ item.value | b64decode }}"
        dest: "/etc/xcontrol/tls/svc.plus/current/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - {name: fullchain.pem, value: "{{ prod_v2_public_tls_fullchain_b64 }}", mode: '0644'}
        - {name: key.pem, value: "{{ prod_v2_public_tls_key_b64 }}", mode: '0600'}
      no_log: true
  roles:
    - roles/vhosts/web_saas_host_config
  tasks:
    - name: Create bootstrap compose directory
      ansible.builtin.file:
        path: /opt/prod-v2-bootstrap
        state: directory
        mode: '0755'
    - name: Copy exact reviewed GitOps declarations for database bootstrap
      ansible.builtin.copy:
        src: "{{ prod_v2_gitops_dir }}/compose/web-saas/{{ item }}"
        dest: "/opt/prod-v2-bootstrap/{{ item }}"
        mode: '0644'
      loop: [docker-compose.yml, docker-compose.selfhost-content.yml, docker-compose.prod-v2.yml, .env.prod-v2]
    - name: Authenticate registry without emitting credentials
      ansible.builtin.command:
        argv: [docker, login, ghcr.io, -u, "{{ doco_cd_registry_username }}", --password-stdin]
        stdin: "{{ doco_cd_registry_password }}"
      no_log: true
    - name: Start only PostgreSQL before native initialization and user migration
      ansible.builtin.command:
        argv: [docker, compose, "{{ prod_v2_compose_project | default('web-saas-prod-v2') }}", --env-file, .env.prod-v2, -f, docker-compose.yml, -f, docker-compose.selfhost-content.yml, -f, docker-compose.prod-v2.yml, up, -d, postgres]
        chdir: /opt/prod-v2-bootstrap
