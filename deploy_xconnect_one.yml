---
# Deploy One only to explicitly selected existing VPS hosts. The play has no
# Terraform, VPC, firewall, hostname or SSH side effects.
- name: Join existing Linux VPS nodes to XConnect Zero as One
  hosts: "{{ xconnect_one_hosts | default('xconnect_one') }}"
  become: true
  gather_facts: true
  vars:
    xconnect_observability_auth_user: "{{ lookup('ansible.builtin.env', 'VECTOR_AUTH_USER') | default('', true) }}"
    xconnect_observability_auth_password: "{{ lookup('ansible.builtin.env', 'VECTOR_AUTH_PASSWORD') | default('', true) }}"
    xconnect_observability_endpoint: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_ENDPOINT') | default('https://observability.svc.plus', true) }}"
  roles:
    - role: vhosts/xconnect_one
  tags: [xconnect-one]

# Opt-in standalone play for private PostgreSQL TCP forwarding on prod-k3s-v6
# (10.67.0.2:5432 -> 10.55.35.251:5432). Disabled by default via
# xconnect_one_pg_forward_enabled: false and skipped unless explicitly tagged.
- name: Configure XConnect One private PostgreSQL TCP forwarding
  hosts: "{{ xconnect_one_hosts | default('xconnect_one') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Reconcile opt-in XConnect One private PostgreSQL TCP forwarding
      ansible.builtin.include_role:
        name: vhosts/xconnect_one
        tasks_from: pg_forward
      when: xconnect_one_pg_forward_enabled | default(false) | bool
  tags: [never, xconnect-one-pg-forward]
