---
- name: Validate ingress engine choice
  ansible.builtin.assert:
    that:
      - xconnect_edge_proxy_engine in ['fluxgate', 'caddy', 'haproxy']
    fail_msg: "xconnect_edge_proxy_engine must be one of: fluxgate, caddy, haproxy (got '{{ xconnect_edge_proxy_engine }}')"

- name: Determine competing ingress services to stop and disable
  ansible.builtin.set_fact:
    competing_ingress_services: >-
      {{ ['caddy', 'haproxy'] if xconnect_edge_proxy_engine == 'fluxgate'
         else (['fluxgate', 'haproxy'] if xconnect_edge_proxy_engine == 'caddy'
         else ['fluxgate', 'caddy']) }}

- name: Stop and disable competing ingress engines (strictly mutually exclusive)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ competing_ingress_services }}"
  failed_when: false
  become: true

- name: Provision Fluxgate reverse proxy engine
  ansible.builtin.include_role:
    name: roles/vhosts/fluxgate
  vars:
    fluxgate_replace_caddy: true
    fluxgate_source_cert_path: "{{ xconnect_edge_tls_cert_path }}"
    fluxgate_source_key_path: "{{ xconnect_edge_tls_key_path }}"
  when: xconnect_edge_proxy_engine == 'fluxgate'

- name: Provision Caddy reverse proxy engine
  ansible.builtin.include_role:
    name: roles/vhosts/caddy
  when: xconnect_edge_proxy_engine == 'caddy'

- name: Provision HAProxy reverse proxy engine
  ansible.builtin.include_role:
    name: roles/vhosts/haproxy
  vars:
    haproxy_replace_caddy: true
    haproxy_source_cert_path: "{{ xconnect_edge_tls_cert_path }}"
    haproxy_source_key_path: "{{ xconnect_edge_tls_key_path }}"
  when: xconnect_edge_proxy_engine == 'haproxy'
