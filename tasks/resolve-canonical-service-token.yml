- name: Load the canonical service credential supplied by the installer
  ansible.builtin.set_fact:
    canonical_internal_service_token: "{{ lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') }}"
  when: lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') | length > 0
  run_once: true
  no_log: true

- name: Read the canonical runtime service credential from Vault when not injected
  ansible.builtin.command:
    argv:
      - vault
      - kv
      - get
      - -field=INTERNAL_SERVICE_TOKEN
      - kv/prod/accounts/runtime
  environment:
    VAULT_ADDR: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') | default('https://vault.svc.plus', true) }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: canonical_service_token_read
  changed_when: false
  check_mode: false
  no_log: true
  when: lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') | length == 0

- name: Keep the Vault-resolved credential in memory for the selected hosts
  ansible.builtin.set_fact:
    canonical_internal_service_token: "{{ canonical_service_token_read.stdout }}"
  run_once: true
  no_log: true
  when: lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') | length == 0

- name: Validate the canonical runtime credential without revealing it
  ansible.builtin.assert:
    that:
      - canonical_internal_service_token is match('^[A-Za-z0-9._~+/=-]{32,}$')
    fail_msg: "No valid canonical INTERNAL_SERVICE_TOKEN was supplied or read from Vault."
  run_once: true
  no_log: true
