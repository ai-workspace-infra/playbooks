---
- name: Deploy HAProxy 3.0 reverse proxy vhosts with Vector metrics
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  vars:
    haproxy_enabled: true
    haproxy_replace_caddy: true
    vector_haproxy_metrics_enabled: true
    vector_caddy_metrics_enabled: false
  roles:
    - roles/vhosts/HAProxy
    - roles/vhosts/vector-agent
