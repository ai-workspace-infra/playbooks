---
# Doco-CD is a single-host Docker Compose tool; it is deployed only by this role
# (the former Helm chart in ai-workspace-infra/artifacts was removed).
# No default hosts: pass the target explicitly, e.g. -e doco_cd_hosts=<inventory host or group>.
- name: Setup Doco-CD
  hosts: "{{ doco_cd_hosts }}"
  become: true
  roles:
    - vhosts/Doco-CD
