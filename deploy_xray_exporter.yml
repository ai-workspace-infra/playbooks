- name: Deploy xray-exporter service
  hosts: "{{ xray_exporter_hosts | default('xray_exporter') }}"
  # 兜底用的短等待窗口。首次启动的收敛由 deploy_base 的
  # common_wait_for_host_init.sh 统一负责(它在 bootstrap 前等 cloud-init 与
  # unattended-upgrades 退出), 所以到这里锁通常已经放开; 这里只覆盖那之后
  # 偶发的短暂占用, 不需要很长。单个任务仍可自行覆盖。
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: "{{ ai_workspace_apt_lock_timeout | default(180) | int }}"
  gather_facts: true
  become: true
  vars:
    xray_exporter_source_dir: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_SOURCE_DIR')
         | default(playbook_dir ~ '/../xray-exporter', true) }}
    xray_exporter_node_id: >-
      {{ lookup('ansible.builtin.env', 'EXPORTER_NODE_ID')
         | default(xray_exporter_node_id_custom | default(inventory_hostname, true), true) }}
    xray_exporter_env_name: >-
      {{ lookup('ansible.builtin.env', 'EXPORTER_ENV')
         | default('prod', true) }}
    xray_exporter_release_repository: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_RELEASE_REPOSITORY')
         | default('ai-workspace-xstream/xray-exporter', true) }}
    # Production uses the maintained fork in metrics-only mode. UAT may opt
    # into the fork's snapshot flags when its billing contract is configured.
    xray_exporter_snapshot_features_enabled: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_SNAPSHOT_FEATURES_ENABLED')
         | default(
             (
               xray_exporter_release_repository == 'ai-workspace-xstream/xray-exporter'
               and xray_exporter_env_name == 'uat'
             ),
             true
           ) | bool }}
    xray_exporter_version: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_VERSION')
         | default('daily-build-2026.08.11', true) }}
    xray_exporter_stats_url: >-
      {{ lookup('ansible.builtin.env', 'XRAY_STATS_URL')
         | default('http://127.0.0.1:49227/debug/vars', true) }}
    xray_exporter_stats_token: >-
      {{ lookup('ansible.builtin.env', 'XRAY_STATS_TOKEN')
         | default('', true) }}
    xray_exporter_accounts_base_url: >-
      {{ lookup('ansible.builtin.env', 'ACCOUNTS_BASE_URL')
         | default('https://accounts.svc.plus', true) }}
    xray_exporter_internal_service_token: >-
      {{ lookup('ansible.builtin.vars', 'INTERNAL_SERVICE_TOKEN', default=lookup('ansible.builtin.env', 'INTERNAL_SERVICE_TOKEN') | default('', true)) }}
    xray_exporter_snapshot_store_path: >-
      {{ lookup('ansible.builtin.env', 'SNAPSHOT_STORE_PATH')
         | default('/var/lib/xray-exporter/snapshots.db', true) }}
    xray_exporter_snapshot_retention: >-
      {{ lookup('ansible.builtin.env', 'SNAPSHOT_RETENTION')
         | default('72h', true) }}
    xray_exporter_listen_addr: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_LISTEN_ADDR')
         | default('127.0.0.1:8080', true) }}
    xray_exporter_tcp_listen_addr: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_TCP_LISTEN_ADDR')
         | default('127.0.0.1:8081', true) }}
    # agent-proxy exposes the Xray Stats APIs on these loopback ports.
    # Keep both addresses explicitly overridable for legacy hosts whose
    # Xray API layout still differs.
    xray_exporter_xray_api_addr: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_XRAY_API_ADDR')
         | default(
             hostvars[inventory_hostname].xray_exporter_xray_api_addr
             | default('127.0.0.1:28080', true),
             true
           ) }}
    xray_exporter_tcp_xray_api_addr: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_TCP_XRAY_API_ADDR')
         | default(
             hostvars[inventory_hostname].xray_exporter_tcp_xray_api_addr
             | default('127.0.0.1:28181', true),
             true
           ) }}
    xray_exporter_env_file: >-
      {{ lookup('ansible.builtin.env', 'XRAY_EXPORTER_ENV_FILE')
         | default('/etc/xray-exporter.env', true) }}
    xray_exporter_scrape_interval: >-
      {{ lookup('ansible.builtin.env', 'SCRAPE_INTERVAL')
         | default('1m', true) }}
    xray_exporter_vector_snapshot_url: >-
      {{ lookup('ansible.builtin.env', 'VECTOR_SNAPSHOT_URL')
         | default('', true) }}
  pre_tasks:
    - name: Validate INTERNAL_SERVICE_TOKEN is present
      ansible.builtin.assert:
        that:
          - xray_exporter_internal_service_token | length > 0
        fail_msg: "INTERNAL_SERVICE_TOKEN must be exported before running this playbook."
        success_msg: "INTERNAL_SERVICE_TOKEN found"
      when: xray_exporter_snapshot_features_enabled | bool
  roles:
    - roles/vhosts/xray-exporter
