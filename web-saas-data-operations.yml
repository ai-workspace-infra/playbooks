---
# Owner playbook. Migration is still a component operation only: it requires
# validated encrypted backup/restore evidence and never claims application
# login, subscription, or release acceptance.
- name: Run exact-scope data operation roles without implicit data sync
  hosts: "{{ web_saas_release_target_host | default('never-matches') }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: Require explicit UAT phase and exact target
      ansible.builtin.assert:
        that:
          - web_saas_data_operation | default('') in ['baseline', 'preflight', 'backup', 'migration']
          - web_saas_release_environment | default('') == 'uat'
          - inventory_hostname == 'web-saas-uat'
        fail_msg: No implicit environment, host, initialization, or data synchronization is permitted
  tasks:
    - name: Validate and freeze manifest metadata without copying data
      ansible.builtin.include_role:
        name: web_saas_data_baseline
      when: web_saas_data_operation == 'baseline'
    - name: Run preflight, encrypted backup, and isolated restore components
      ansible.builtin.include_role:
        name: web_saas_release_upgrade
      when: web_saas_data_operation in ['preflight', 'backup']
    - name: Validate evidence then invoke the bounded Accounts migrator
      ansible.builtin.include_role:
        name: web_saas_release_upgrade
      vars:
        web_saas_release_phase: backup
        web_saas_release_mode: upgrade
      when: web_saas_data_operation == 'migration'
    - name: Invoke bounded Accounts migrator only after this run's restore proof
      ansible.builtin.include_role:
        name: web_saas_data_migration
      vars:
        web_saas_data_migration_backup_evidence: '{{ web_saas_data_backup_evidence }}'
        web_saas_data_migration_restore_evidence: '{{ web_saas_data_restore_verify_evidence }}'
      when: web_saas_data_operation == 'migration'
