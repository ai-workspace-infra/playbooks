---
- name: Deploy standalone Caddy XHTTP Edge relay site
  hosts: "{{ xray_edge_hosts | default('localhost') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require an explicit inventory host or group selector
      ansible.builtin.assert:
        that:
          - xray_edge_hosts is defined
          - xray_edge_hosts | string | length > 0
          - xray_edge_hosts | string != 'all'
          - xray_edge_hosts | string != '*'
        fail_msg: >-
          Set xray_edge_hosts to a specific host or group present in the
          inventory selected for this run; broad all-host deployment is disabled.
      tags: [always]
  roles:
    - role: roles/vhosts/xray-edge
      tags: [xray_edge]
