---
- name: Validate isolated standby renderer on controller with fictional inputs
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create disposable controller renderer directory
      ansible.builtin.tempfile:
        state: directory
        prefix: native-render-test-
      register: fixture
    - block:
        - name: Load shared tuning into a namespace so it cannot override task secrets
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../../roles/vhosts/web_saas_host_config/defaults/main.yml"
            name: native_host_defaults
        - name: Render the existing env template with only explicit fictional PostgreSQL credentials
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../../roles/vhosts/web_saas_host_config/templates/secrets.env.j2"
            dest: "{{ fixture.path }}/secrets.env"
            mode: '0600'
          vars:
            web_saas_host_config_secrets:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: "fictional-$-@-quote'"
        - name: Read only the fictional rendered file
          ansible.builtin.slurp:
            src: "{{ fixture.path }}/secrets.env"
          register: rendered
        - name: Assert exact two-key isolated renderer output and literal password bytes
          ansible.builtin.assert:
            that:
              - (rendered.content | b64decode).splitlines() | reject('match', '^#') | reject('equalto', '') | list | length == 2
              - "\"POSTGRES_PASSWORD=fictional-$-@-quote'\" in (rendered.content | b64decode).splitlines()"
              - "'POSTGRES_USER=postgres' in (rendered.content | b64decode).splitlines()"
    - name: Remove only this disposable renderer directory
      ansible.builtin.file:
        path: "{{ fixture.path }}"
        state: absent
