apiVersion: v1
kind: Namespace
metadata:
  annotations:
    security.svc.plus/exception: Exactly hostPort 80/443 on the Dev node; non-root/drop
      ALL/no privileged/no hostNetwork. Platform-owned, outside feature TTL.
  labels:
    app.kubernetes.io/part-of: dev-platform-ingress
    environment: dev
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
  name: platform-ingress
---
apiVersion: v1
data:
  values.yaml: |
    image:
      registry: docker.io
      repository: library/traefik
      digest: sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    versionOverride: v3.7.16
    deployment:
      replicas: 1
    updateStrategy:
      type: Recreate
    hostNetwork: false
    nodeSelector:
      kubernetes.io/hostname: dev-k3s-v5
    service:
      enabled: false
    ingressClass:
      enabled: false
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    api:
      dashboard: false
    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesGateway:
        enabled: false
      kubernetesIngress:
        enabled: true
        ingressClass: dev-web-saas
        namespaces:
        - feature-xconnect-referral-sit
        - web-saas-uat
        publishedService:
          enabled: false
        allowExternalNameServices: false
        allowEmptyServices: false
    rbac:
      enabled: true
      namespaced: true
    ports:
      web:
        port: 8000
        hostPort: 80
      websecure:
        port: 8443
        hostPort: 443
        http:
          tls:
            enabled: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    persistence:
      enabled: true
      path: /data
      size: 1Gi
      storageClass: local-path
    certificatesResolvers:
      dev-http01:
        acme:
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: dev-ingress-values
  namespace: platform-ingress
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dev-ingress
  namespace: platform-ingress
spec:
  chartRef:
    kind: OCIRepository
    name: traefik-chart
  install:
    crds: Skip
  interval: 5m
  releaseName: dev-ingress
  serviceAccountName: platform-ingress-reconciler
  upgrade:
    crds: Skip
  valuesFrom:
  - kind: ConfigMap
    name: dev-ingress-values
    valuesKey: values.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik-chart
  namespace: platform-ingress
spec:
  interval: 30m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:49458ccd9673cd828ee0b091030f5747f5d95f205bbd0cf0b6c3bf757398cae1
  url: oci://ghcr.io/traefik/helm/traefik
