---
# Backward-compatible combined entrypoint. New deployments should call the
# agent and server playbooks independently when only one side is changing.
# Extra vars are inherited by imported playbooks, so a focused run can use
# observability_agent_hosts/observability_server_hosts without touching the
# rest of the fleet.
- import_playbook: deploy_observability_agent.yml
- import_playbook: deploy_observability_server.yml
